  - id: CMI-P2-PROTECTED-ACCESS-001
    flow: FLOW-PROTECTED-ACCESS-EXECUTE
    sequence: [representative production entry, public bridge, starter internal issuance, target resolver, one-shot capability, gateway, guard, operation-or-denial]
    status: CANDIDATE
  - id: CMI-P2-AC007-REPRESENTATIVE-CONSUMERS
    flow: FLOW-PROTECTED-ACCESS-EXECUTE
    status: CANDIDATE_OPTION_B_ACTIVE
    sequence:
      RULE: [RuleProtectedAccessEntry, ProtectedExecutionBridge, Gateway, Guard, operation-or-denial]
      CHANGE: [ChangeProtectedAccessEntry, ProtectedExecutionBridge, Gateway, Guard, operation-or-denial]
      CUSTOM_ACTION: [CustomActionProtectedAccessEntry, ProtectedExecutionBridge, Gateway, Guard, operation-or-denial]
    evidenceRequired: real main-source public production reachability and allow/deny/parity/no-bypass execution
  - id: CMI-P2-DOWNSTREAM-PROTECTED-CONSUMERS
    status: ACTIVE_DOWNSTREAM_BOUNDARY
    P3: full Rule/Information semantics remain downstream and must reuse P2 authority seam
    P4: full change/custom-action/Action/Produce state machine remains downstream and must reuse P2 authority seam
    P6: QueryPlan full compile/execute remains downstream and must reuse P2 path/authorization semantics
    note: these downstream full semantics are not required to close P2 AC007 because Option B is satisfied at P2 by representative production consumers, but future stages may not introduce bypass authority
