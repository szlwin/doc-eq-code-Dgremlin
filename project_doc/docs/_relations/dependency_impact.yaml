  sourceAction: perform Guard-approved runtime mutation
  targetRefs:
  - MOD_MODEL
  policy: REJECT_OPERATION
  conditions:
  - mutation/transaction/commit failure
  - frozen mutation version stale
  consistency: ATOMIC
  transactionBoundary: one RuntimeObjectId+ModelPath write transaction
  idempotency: one-shot capability is not retried; same-version race commits at most once
  failureHandling: rollback/restore observable state; receipt absent; capability remains consumed
  compensation: model transaction rollback or isolated working-copy restore before publication
  historyHandling: no change to historical lifecycle
  traceIds:
  - TR-P2-004
