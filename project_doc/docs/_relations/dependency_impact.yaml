  consistency: ATOMIC
  transactionBoundary: one scoped runtime lookup
  idempotency: sealed session lookup is deterministic
  failureHandling: RUNTIME_OBJECT_NOT_FOUND/STALE before mutation
  compensation: none
  historyHandling: no global registry migration
