impactPolicies:
- id: IMP-P2-INVALID-POLICY
  sourceRef: FLOW-CONFIG-COMPILE
  sourceAction: construct or publish illegal policy classification
  targetRefs: [MOD_CONTEXT, MOD_COMPILER]
  policy: REJECT_OPERATION
  conditions: [tuple is not one of the two legal rows]
  consistency: ATOMIC
  transactionBoundary: CompiledModelSet publication
  idempotency: Repeated invalid input yields same stable error and no new Context.
  failureHandling: Reject publication and retain previous Context.
  compensation: No compensation; publication never occurs.
  historyHandling: Historical PASSED revisions are unchanged.
  traceIds: [TR-P2-006, TR-P2-008]
  testCaseIds: [CASE-P2-TD-POLICY-CLASSIFICATION-TRUTH-TABLE-001]
- id: IMP-P2-WRITE-INTENT
  sourceRef: FLOW-PROTECTED-ACCESS-EXECUTE
  sourceAction: resolve WRITE intent
  targetRefs: [MOD_STARTER, MOD_MODEL]
  policy: REJECT_OPERATION
  conditions: [candidate count is zero or greater than one]
  consistency: ATOMIC
  transactionBoundary: one protected WRITE attempt
  idempotency: Same immutable input tuple yields same selected intent or same denial.
  failureHandling: Deny before Guard/operation; no mutation/receipt.
  compensation: None; no effect occurred.
  traceIds: [TR-P2-006, TR-P2-009]
  testCaseIds: [CASE-P2-TD-WRITE-INTENT-NOT-FOUND-001, CASE-P2-TD-WRITE-INTENT-AMBIGUOUS-001]
- id: IMP-P2-PRODUCTION-OP
  sourceRef: FLOW-PROTECTED-ACCESS-EXECUTE
  sourceAction: execute Guard-approved READ or WRITE
  targetRefs: [MOD_STARTER, MOD_MODEL]
  policy: NO_ACTION
  conditions: [Guard ALLOW and capability consumed exactly once]
  consistency: ATOMIC
  transactionBoundary: one capability-bound operation
  idempotency: Capability is one-shot; replay is denied.
  failureHandling: Operation failure is surfaced as stable denial/error without selecting another target/path/intent.
  compensation: Runtime operation contract defines no silent retry or alternate mutation.
  traceIds: [TR-P2-004, TR-P2-007]
  testCaseIds: [CASE-P2-TD-PRODUCTION-MODEL-ADAPTER-REACHABILITY-001, CASE-P2-TD-REAL-READ-OPERATION-001, CASE-P2-TD-REAL-WRITE-OPERATION-001]
crossModuleImplementations:
- id: CMI-P2-COMPILE-001
  name: P2 compile and immutable policy publication
  trigger: FLOW-CONFIG-COMPILE begins
  participants:
  - id: CMPART-P2-COMPILE-COMPILER
    module: dec-core-compiler
    responsibility: Resolve P1-compatible source View identity, exact paths and classification.
  - id: CMPART-P2-COMPILE-CONTEXT
    module: dec-core-context
    responsibility: Own neutral keys/values and immutable PolicyIndex representation.
  steps:
  - id: CMSTEP-P2-COMPILE-001
    order: 1
    from: dec-core-compiler
    to: dec-core-context
    interactionType: SYNC_API
    action: Build exact TargetKey(ViewKey), ModelPath and ModelAccessRuleKey facts.
    preconditions: [shared source ViewKey resolved]
    postconditions: [authorization owner System remains separate from TargetKey]
    idempotency: Same source snapshot yields value-equal immutable facts.
    failureHandling: stable compile error; no publication
    compensation: none
    traceIds: [TR-P2-005]
  - id: CMSTEP-P2-COMPILE-002
    order: 2
    from: dec-core-compiler
    to: dec-core-context
    interactionType: DATA_WRITE
    action: Publish validated immutable PolicyIndex as part of one CompiledModelSet closure.
    preconditions: [all classification rows valid]
    postconditions: [new Context visible atomically]
    idempotency: same semantic inputs yield same digest/facts
    failureHandling: retain old Context
    compensation: none
    traceIds: [TR-P2-006, TR-P2-008]
  successCriteria: [P1 shared source View identity preserved., No malformed policy row published., No downstream revision used as upstream input.]
  failurePaths:
  - id: CMFAIL-P2-COMPILE-001
    atStep: CMSTEP-P2-COMPILE-001
    condition: sourceModel unresolved or malformed
    result: stable ERROR; publication=0
    compensationSteps: []
    manualRecovery: Correct source input and recompile.
    traceIds: [TR-P2-005]
  traceIds: [TR-P2-005, TR-P2-006, TR-P2-008]
  testCaseIds: [CASE-P2-TD-TARGETKEY-SOURCE-MAPPING-001, CASE-P2-TD-POLICY-CLASSIFICATION-TRUTH-TABLE-001]
  businessFlowRef: FLOW-CONFIG-COMPILE
  businessStepRefs: [STEP-P2-COMPILE-02, STEP-P2-COMPILE-03, STEP-P2-COMPILE-04, STEP-P2-COMPILE-06]
- id: CMI-P2-PROTECTED-ACCESS-001
  name: Production protected READ/WRITE execution
  trigger: FLOW-PROTECTED-ACCESS-EXECUTE begins
  participants:
  - id: CMPART-P2-ACCESS-CONTEXT
    module: dec-core-context
    responsibility: Neutral ProtectedAccessPort/value/ID/RuntimeModelOperationPort contracts and immutable policy facts.
  - id: CMPART-P2-ACCESS-STARTER
    module: dec-core-starter
    responsibility: Bridge, intent resolver, capability, Gateway, Guard, adapter and production assembly.
  - id: CMPART-P2-ACCESS-MODEL
    module: dec-core-model
    responsibility: Resolve RuntimeObjectId to actual runtime object and perform exact ModelPath read/frozen-intent mutation.
  steps:
  - id: CMSTEP-P2-ACCESS-001
    order: 1
    from: dec-core-starter
    to: dec-core-starter
    interactionType: COMMAND
    action: Resolve exact runtime target and zero-or-one frozen write intent before Guard.
    preconditions: [valid invocation]
    postconditions: [ResolvedProtectedAccess immutable]
    idempotency: same immutable tuple selects same intent or same denial
    failureHandling: zero/multiple candidates deny
    compensation: none
    traceIds: [TR-P2-006, TR-P2-009]
  - id: CMSTEP-P2-ACCESS-002
    order: 2
    from: dec-core-starter
    to: dec-core-context
    interactionType: QUERY
    action: Guard exact PolicyIndex/runtime proof using consumed one-shot capability.
    preconditions: [ResolvedProtectedAccess frozen]
    postconditions: [ALLOW or DENY without operation effect]
    idempotency: capability one-shot prevents duplicate effect
    failureHandling: DENY fail closed
    compensation: none
    traceIds: [TR-P2-006, TR-P2-007]
  - id: CMSTEP-P2-ACCESS-003
    order: 3
    from: dec-core-starter
    to: dec-core-model
    interactionType: SYNC_API
    action: Delegate Guard-approved exact READ/WRITE to production RuntimeModelOperationPort.
    preconditions: [Guard ALLOW]
    postconditions: [immutable read snapshot or exact write receipt]
    idempotency: one consumed capability permits at most one operation
    failureHandling: surface stable operation failure; never reselect target/path/intent
    compensation: no hidden alternate mutation
    traceIds: [TR-P2-004, TR-P2-007]
  successCriteria: [READ observes real runtime value and does not mutate., WRITE mutates real runtime state exactly once using frozen intent., No caller-supplied callback/operation implementation.]
  failurePaths:
  - id: CMFAIL-P2-ACCESS-001
    atStep: CMSTEP-P2-ACCESS-001
    condition: write-intent candidate count != 1
    result: deterministic denial before Guard/effect
    compensationSteps: []
    manualRecovery: Correct execution state so exactly one intended mutation is resolvable.
    traceIds: [TR-P2-006]
  - id: CMFAIL-P2-ACCESS-002
    atStep: CMSTEP-P2-ACCESS-002
    condition: policy/proof/Guard failure
    result: DENY; operation=0; value/receipt absent
    compensationSteps: []
    manualRecovery: Correct policy/proof/runtime availability and retry with a new capability.
    traceIds: [TR-P2-006, TR-P2-009]
  traceIds: [TR-P2-004, TR-P2-006, TR-P2-007, TR-P2-009]
  testCaseIds: [CASE-P2-TD-REAL-READ-OPERATION-001, CASE-P2-TD-REAL-WRITE-OPERATION-001, CASE-P2-TD-PRODUCTION-MODEL-ADAPTER-REACHABILITY-001]
  businessFlowRef: FLOW-PROTECTED-ACCESS-EXECUTE
  businessStepRefs: [STEP-P2-ACCESS-02, STEP-P2-ACCESS-04, STEP-P2-ACCESS-05]
