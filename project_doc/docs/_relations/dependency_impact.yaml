crossModuleImplementations:
- id: CMI-P2-PROTECTED-ACCESS-002
  name: Production protected access with scoped model session and transactional WRITE
  trigger: FLOW-PROTECTED-ACCESS-EXECUTE begins
  participants:
  - id: CMPART-P2-ACCESS-CONTEXT
    module: dec-core-context
    responsibility: Own self-contained neutral ModelAccessRuleKey, invocation, resolved access, result/value/typed
      ID contracts.
  - id: CMPART-P2-ACCESS-STARTER
    module: dec-core-starter
    responsibility: Resolve typed invocation/write intent, enforce one-shot Gateway/Guard and assemble
      production model session.
  - id: CMPART-P2-ACCESS-MODEL
    module: dec-core-model
    responsibility: Own composition-scoped RuntimeModelSession/RuntimeObjectLocator, path versions and
      transactionally perform actual ModelData operations.
  steps:
  - id: CMSTEP-P2-ACCESS-101
    order: 1
    from: dec-core-starter
    to: dec-core-model
    interactionType: SYNC_API
    action: Resolve RuntimeObjectId inside current sealed RuntimeModelSession and obtain current object/path
      mutation version.
    preconditions:
    - composition owns exactly one active model session
    postconditions:
    - exact runtime object handle and version or deterministic missing/stale failure
    idempotency: sealed lookup deterministic
    failureHandling: deny before Guard/effect
    compensation: none
    traceIds:
    - TR-P2-006
    - TR-P2-009
  - id: CMSTEP-P2-ACCESS-102
    order: 2
    from: dec-core-starter
    to: dec-core-context
    interactionType: QUERY
    action: Guard exact ModelAccessRuleKey/runtime proof carried by one-shot resolved access.
    preconditions:
    - write intent, when WRITE, is frozen with typed context and expected version
    postconditions:
    - ALLOW or DENY; no model effect yet
    idempotency: one-shot capability prevents repeated attempt
    failureHandling: DENY fail closed
    compensation: none
    traceIds:
    - TR-P2-006
    - TR-P2-007
  - id: CMSTEP-P2-ACCESS-103
    order: 3
    from: dec-core-starter
    to: dec-core-model
    interactionType: SYNC_API
    action: Call read(ResolvedProtectedReadAccess) or write(ResolvedProtectedWriteAccess); WRITE has no
      separate path argument.
    preconditions:
    - Guard ALLOW
    postconditions:
    - READ snapshot or exactly one committed WRITE receipt
    idempotency: one consumed capability and mutation-version check
    failureHandling: stale => no mutation; operation failure => rollback/restore and no receipt
    compensation: transaction rollback or isolated working-copy restore
    traceIds:
    - TR-P2-004
    - TR-P2-007
    - TR-P2-009
  successCriteria:
  - ModelAccessRuleKey is the only permission/write authority key.
  - No duplicated WRITE ModelPath exists.
  - Runtime object lookup is composition/session scoped.
  - WRITE failure leaves externally observable state unchanged.
  - Same-version concurrent capabilities commit at most once.
  failurePaths:
  - id: CMFAIL-P2-ACCESS-101
    atStep: CMSTEP-P2-ACCESS-101
    condition: missing/stale/cross-session RuntimeObjectId
    result: deterministic denial before Guard/effect
    compensationSteps: []
    manualRecovery: create a fresh composition/session and resolve a current runtime object
    traceIds:
    - TR-P2-006
  - id: CMFAIL-P2-ACCESS-103
    atStep: CMSTEP-P2-ACCESS-103
    condition: version mismatch or runtime write/commit failure
    result: zero committed mutation for stale loser, or transaction rollback/restore on operation failure;
      receipt absent
    compensationSteps:
    - rollback-or-restore-model-state
    manualRecovery: retry only as a new invocation/capability after current state is re-resolved
    traceIds:
    - TR-P2-007
    - TR-P2-009
  traceIds:
  - TR-P2-004
  - TR-P2-006
  - TR-P2-007
  - TR-P2-009
  testCaseIds:
  - CASE-P2-TD-WRITE-AUTHORITY-MODEL-ACCESS-RULEKEY-001
  - CASE-P2-TD-WRITE-SINGLE-PATH-AUTHORITY-001
  - CASE-P2-TD-RUNTIME-OBJECT-LOCATOR-SCOPE-001
  - CASE-P2-TD-RUNTIME-WRITE-ROLLBACK-001
  - CASE-P2-TD-DIFFERENT-CAPABILITY-CONCURRENCY-001
  businessFlowRef: FLOW-PROTECTED-ACCESS-EXECUTE
