impactPolicies:
  - id: IMP-P2-SYSTEM-RULEVIEW-PUBLICATION
    sourceRef: FEATURE-DESC-3361AD2E54FC
    sourceAction: compileSystemRuleViewAndPublish
    targetRefs: [DEC-CORE-COMPILER, DEC-CORE-CONTEXT]
    policy: REJECT_OPERATION
    conditions:
      - duplicate or unknown System
      - missing/duplicate/unknown RuleView composite identity
      - invalid ModelPath or access rule
      - policy-index construction failure
      - candidate publication conflict/failure
    consistency: ATOMIC
    transactionBoundary: System registry, RuleView registry, ModelAccessPolicyIndex, diagnostics and digest must be one immutable candidate publication closure.
    idempotency: Equivalent semantic inputs/order produce the same key registries and semantic digest.
    failureHandling: Return stable source-aware failure and preserve caller-held old EngineContext.
    compensation: None; failed candidate is never visible.
    historyHandling: Existing Context/revisions/evidence remain immutable.
    traceIds: [TR-P2-SYSTEM-RULEVIEW-001, TR-P2-SYSTEM-RULEVIEW-002, TR-P2-SYSTEM-RULEVIEW-003, TR-P2-SYSTEM-RULEVIEW-004, TR-P2-SYSTEM-RULEVIEW-005, TR-P2-SYSTEM-RULEVIEW-008, TR-P2-SYSTEM-RULEVIEW-009]
    testCaseIds: [CASE-P2-TD-SYSTEM-DETERMINISM-001, CASE-P2-TD-SYSTEM-DUPLICATE-001, CASE-P2-TD-RULEVIEW-SYSTEM-REQUIRED-001, CASE-P2-TD-RULEVIEW-SAME-SYSTEM-DUPLICATE-001, CASE-P2-TD-ATOMIC-PUBLICATION-001, CASE-P2-TD-DIAGNOSTIC-DETERMINISM-001]
  - id: IMP-P2-MODEL-ACCESS-AUTHORIZATION
    sourceRef: FEATURE-DESC-3361AD2E54FC
    sourceAction: compileAndAuthorizeModelAccess
    targetRefs: [DEC-CORE-COMPILER, DEC-CORE-CONTEXT, DEC-CORE-STARTER]
    policy: REJECT_OPERATION
    conditions:
      - exact rule/path/operation missing or invalid
      - runtime proof invalid/stale/mismatched
      - Guard/adapter unavailable
      - actual target/operation substitution
    consistency: ATOMIC
    transactionBoundary: Static error blocks publication; runtime DENY occurs before protected operation/effects. Guard selects one exact current-context policy rule and capability binds the actual target/operation.
    idempotency: Each direct bridge invocation is independent. Same capability is one-shot and terminal success is at most one.
    failureHandling: Stable DENY and no protected side effect.
    compensation: None because DENY precedes operation.
    historyHandling: Existing Context/Evidence remain immutable.
    traceIds: [TR-P2-SYSTEM-RULEVIEW-004, TR-P2-SYSTEM-RULEVIEW-005, TR-P2-SYSTEM-RULEVIEW-006, TR-P2-SYSTEM-RULEVIEW-007, TR-P2-SYSTEM-RULEVIEW-008]
    testCaseIds: [CASE-P2-TD-ACCESS-READ-MATRIX-001, CASE-P2-TD-ACCESS-WRITE-MATRIX-001, CASE-P2-TD-ACCESS-EXECUTE-MATRIX-001, CASE-P2-STATIC-ALLOW-GUARD-PATH-001-R15, CASE-P2-RUNTIME-BINDING-PROOF-001-R15, CASE-P2-OPERATION-BINDING-001-R15]
    decisionRefs:
      - version/V_1.0/doc/COMPILER/changes/p2-direct-bridge-authority-decision-r01.md#DEC-P2-DIRECT-BRIDGE-AUTHORITY-001
  - id: IMP-P2-DECLARATION-BOUNDARY
    sourceRef: FEATURE-DESC-3361AD2E54FC
    sourceAction: preserveReadOnlyDeclarationCompatibilityBoundary
    targetRefs: [LEGACY-DECLARATION-SYSTEM-COMPAT]
    policy: RETAIN_UNCHANGED
    conditions:
      - current phase is P2
      - compatibility surface remains read-only
    consistency: ATOMIC
    transactionBoundary: P2 does not restore retired module, write through legacy boundary or create a second Registry/EngineContext.
    idempotency: Repeated P2 compilation keeps the same read-only migration boundary.
    failureHandling: Any write/registration/second-runtime attempt blocks completion.
    compensation: Revert offending P2 change.
    historyHandling: Final retirement remains P7.
    traceIds: [TR-P2-SYSTEM-RULEVIEW-010]
    testCaseIds: [CASE-P2-TD-DECLARATION-BOUNDARY-001]
crossModuleImplementations:
  - id: CMI-P2-SYSTEM-RULEVIEW-001
    businessFlowRef: FLOW-CONFIG-COMPILE
    name: Consolidated P2 System/RuleView/policy compile and protected-runtime handoff
    trigger: Caller compiles System/RuleView/model-access configuration and later resolves RuleView or invokes protected model access.
    participants:
      - id: CMPART-P2-FRONTEND
        module: FRONTEND
        responsibility: Preserve explicit System/RuleView/model-access facts and SourceRef.
      - id: CMPART-P2-COMPILER
        module: COMPILER
        responsibility: Register Systems, resolve composite RuleViews, compile ModelPath/access, construct PolicyIndex and digest-bound candidate.
      - id: CMPART-P2-CONTEXT
        module: CONTEXT
        responsibility: Hold immutable System/RuleView/PolicyIndex facts and isolate EngineContexts.
      - id: CMPART-P2-STARTER
        module: STARTER
        responsibility: Provide direct protected bridge and mandatory Gateway/Guard enforcement.
      - id: CMPART-P2-DEMO-FUTURE
        module: DEMO/FUTURE
        responsibility: Use public composite RuleView lookup and direct protected bridge; concrete P3-P7 business executor semantics remain later-phase work.
    steps:
      - id: CMSTEP-P2-01
        order: 1
        from: CMPART-P2-FRONTEND
        to: CMPART-P2-COMPILER
        action: Deliver explicit System/RuleView/model-access facts with SourceRef
        failureHandling: Parse/missing required ownership becomes stable ERROR.
        traceIds: [TR-P2-SYSTEM-RULEVIEW-001, TR-P2-SYSTEM-RULEVIEW-002, TR-P2-SYSTEM-RULEVIEW-009]
      - id: CMSTEP-P2-02
        order: 2
        from: CMPART-P2-COMPILER
        to: CMPART-P2-COMPILER
        action: Register System and RuleView composite symbols, resolve references, compile exact paths/access and PolicyIndex
        failureHandling: Any semantic ERROR blocks publication.
        traceIds: [TR-P2-SYSTEM-RULEVIEW-001, TR-P2-SYSTEM-RULEVIEW-002, TR-P2-SYSTEM-RULEVIEW-003, TR-P2-SYSTEM-RULEVIEW-004, TR-P2-SYSTEM-RULEVIEW-005]
      - id: CMSTEP-P2-03
        order: 3
        from: CMPART-P2-COMPILER
        to: CMPART-P2-CONTEXT
        action: Publish System/RuleView/PolicyIndex/digest as one immutable CompiledModelSet candidate
        failureHandling: Publication failure preserves old Context.
        traceIds: [TR-P2-SYSTEM-RULEVIEW-008, TR-P2-SYSTEM-RULEVIEW-009]
      - id: CMSTEP-P2-04
        order: 4
        from: CMPART-P2-DEMO-FUTURE
        to: CMPART-P2-STARTER
        action: Invoke direct bridge with exact rule/op/frame/owner/cursor
        failureHandling: Invalid/missing policy/proof/context/adapter/Guard state DENY before operation.
        traceIds: [TR-P2-SYSTEM-RULEVIEW-004, TR-P2-SYSTEM-RULEVIEW-006, TR-P2-SYSTEM-RULEVIEW-007]
      - id: CMSTEP-P2-05
        order: 5
        from: CMPART-P2-STARTER
        to: CMPART-P2-DEMO-FUTURE
        action: Execute only Guard-allowed same capability-bound target/operation
        failureHandling: Target/operation substitution or stale binding DENY/effects=0.
        traceIds: [TR-P2-SYSTEM-RULEVIEW-006, TR-P2-SYSTEM-RULEVIEW-007]
    successCriteria:
      - System and RuleView identities are deterministic and composite.
      - PolicyIndex is the single compiler-published runtime authority.
      - Protected runtime always enters Gateway/Guard.
      - No partial Context publication or second registry/runtime authority exists.
    limitations:
      - AC-007 concrete Rule/change/custom-action/query executors remain contract-only until P3-P7 integration.
      - Current direct caller rule/op authority follows DEC-P2-DIRECT-BRIDGE-AUTHORITY-001.
    traceIds: [TR-P2-SYSTEM-RULEVIEW-001, TR-P2-SYSTEM-RULEVIEW-002, TR-P2-SYSTEM-RULEVIEW-003, TR-P2-SYSTEM-RULEVIEW-004, TR-P2-SYSTEM-RULEVIEW-005, TR-P2-SYSTEM-RULEVIEW-006, TR-P2-SYSTEM-RULEVIEW-007, TR-P2-SYSTEM-RULEVIEW-008, TR-P2-SYSTEM-RULEVIEW-009, TR-P2-SYSTEM-RULEVIEW-010]
