impacts:
  - id: IMP-P2-SYSTEM-OWNERSHIP
    sourceAction: compileSystemOwnership
    targets: [DEC-CORE-COMPILER, DEC-CORE-CONTEXT]
    strategy: DERIVE_IMMUTABLE_READ_INDEX
    authoritativeSources:
      ownedDataKeys: final owner-qualified typed Data registry
      ownedViewKeys: final owner-qualified typed View registry
      ownedRuleViewKeys: final owner-qualified typed RuleView registry
      ownedInformationKeys: final owner-qualified typed Information registry
      ownedRuleKeys: final CompiledRuleView rule closure
      ownedModelAccessRuleKeys: final ModelAccessPolicyIndex keys / compiled policy rules
    invariant: CompiledSystem snapshot is not an authority and cannot rebuild any source authority.
    failure: any two-way coherence mismatch rejects whole candidate and preserves old Context
    cases: [CASE-P2-TD-SYSTEM-OWNERSHIP-SNAPSHOT-001, CASE-P2-TD-SYSTEM-OWNERSHIP-REAL-FIXTURE-001]
  - id: IMP-P2-SYSTEM-VERSION
    sourceAction: bindSystemVersionIdentity
    targets: [DEC-CORE-COMPILER, DEC-CORE-CONTEXT]
    strategy: VALUE_BINDING
    invariant: declaredVersion optional; sourceSemanticDigest mandatory; schemaVersion/compilerVersion equal enclosing CompiledModelSet values; options identity remains enclosing compile fact
    cases: [CASE-P2-TD-SYSTEM-VERSION-IDENTITY-001]
  - id: IMP-P2-SHARED-MODEL-PATH
    sourceAction: compileCanonicalModelPath
    targets: [DEC-CORE-COMPILER]
    strategy: SINGLE_CANONICAL_COMPILER
    invariant: RULE CHANGE QUERY_CONTRACT MODEL_ACCESS equal path inputs produce value-equal P2 ModelPath
    cases: [CASE-P2-TD-MODEL-PATH-CROSS-CONSUMER-EQUIVALENCE-001, CASE-P2-TD-WILDCARD-FINITE-EXPANSION-001]
  - id: IMP-P2-P1-P2-PATH-OPERATION-MIGRATION
    sourceAction: convertLegacyModelAccessFacts
    targets: [DEC-CORE-COMPILER, DEC-CORE-CONTEXT, DEC-CORE-STARTER]
    strategy: ONE_WAY_COMPATIBILITY_CONVERSION
    mapping:
      SharedModelPathExact: P2 exact ModelPath
      SharedModelPathWildcard: finite deterministic exact P2 ModelPaths before policy publication
      AccessModeREAD: AccessOperation.READ
      AccessModeWRITE: AccessOperation.WRITE
      AccessModeToEXECUTE: FORBIDDEN
    invariant: SharedModelPath and AccessMode never remain PolicyIndex/Bridge/Guard runtime authorities after conversion
    cases: [CASE-P2-TD-P1-PATH-OPERATION-MIGRATION-001]
  - id: IMP-P2-MODEL-ACCESS-AUTHORIZATION
    sourceAction: compileAndAuthorizeModelAccess
    targets: [DEC-CORE-COMPILER, DEC-CORE-CONTEXT, DEC-CORE-STARTER]
    strategy: EXACT_OPERATION_QUALIFIED_POLICY
    invariant: READ WRITE EXECUTE do not imply each other; current compiler-published PolicyIndex is sole authorization authority
    failure: policy miss/mismatch/proof failure DENY before operation/effects
    cases: [CASE-P2-TD-ACCESS-NON-IMPLICATION-001, CASE-P2-TD-RUNTIME-BINDING-PROOF-001]
  - id: IMP-P2-ATOMIC-PUBLICATION
    sourceAction: publishP2Candidate
    targets: [DEC-CORE-COMPILER, DEC-CORE-CONTEXT]
    strategy: ATOMIC
    invariant: registries RuleView closure P2 canonical facts PolicyIndex derived ownership version identity digest are one closure
    failure: any ERROR -> no new candidate and old Context remains active
    cases: [CASE-P2-TD-ATOMIC-PUBLICATION-001, CASE-P2-TD-POLICY-INDEX-PUBLICATION-001]
  - id: IMP-P2-PROTECTED-SEAM
    sourceAction: executeProtectedAccess
    targets: [DEC-CORE-STARTER]
    strategy: SINGLE_PRODUCTION_SEAM_FOUNDATION
    invariant: existing P2 supported protected operations use Bridge->internal issuance->resolver->capability->Gateway->Guard->operation; no public mint/secondary authority
    ac007Status: PENDING_USER_DECISION
    note: Seam foundation is valid independent architecture, but whether it alone closes P2 AC007 depends on user Option A/B decision.
    cases: [CASE-P2-TD-PRODUCTION-SEAM-NO-LEGAL-BYPASS-001, CASE-P2-TD-GUARD-NO-BYPASS-001]
  - id: IMP-P2-RUNTIME-DENIAL
    sourceAction: denyProtectedAccess
    targets: [DEC-CORE-STARTER, DEC-CORE-CONTEXT]
    strategy: DETERMINISTIC_FAIL_CLOSED
    invariant: repeated equal denial retains stable code/System/optional RuleView/AccessOperation/P2 ModelPath/policy SourceRef and exposes no sensitive actual values
    cases: [CASE-P2-TD-RUNTIME-DENIAL-DIAGNOSTIC-DETERMINISM-001]
  - id: IMP-P2-DECLARATION-BOUNDARY
    sourceAction: preserveReadOnlyDeclarationCompatibilityBoundary
    targets: [LEGACY-DECLARATION-SYSTEM-COMPAT]
    strategy: RETAIN_UNCHANGED
    invariant: no write second registry or second runtime authority; deletion remains P7
    cases: [CASE-P2-TD-DECLARATION-BOUNDARY-001]
