impacts:
  - id: IMP-P2-SYSTEM-OWNERSHIP
    targets: [DEC-CORE-COMPILER, DEC-CORE-CONTEXT]
    strategy: DERIVE_IMMUTABLE_READ_INDEX
    authoritativeSources:
      Data: final owner-qualified typed Data registry
      View: final owner-qualified typed View registry
      RuleView: final owner-qualified typed RuleView registry
      Information: final owner-qualified typed Information registry
      Rule: owning CompiledRuleView immutable RuleKey closure
      ModelAccessRule: ModelAccessPolicyIndex keys / compiled policy rules
    invariant: snapshot never becomes authority
  - id: IMP-P2-RULEKEY-CLOSURE
    targets: [DEC-CORE-CONTEXT, DEC-CORE-COMPILER]
    strategy: OWNER_QUALIFIED_VALUE_IDENTITY
    identity: [ownerRuleViewKey, localRuleName]
    authoritativeStore: owning CompiledRuleView compiled rule closure
    globalRuleRegistryAdded: false
    cases: [CASE-P2-TD-RULEKEY-CONTRACT-001]
  - id: IMP-P2-SHARED-MODEL-PATH
    targets: [DEC-CORE-COMPILER]
    strategy: SINGLE_CANONICAL_COMPILER
    invariant: RULE CHANGE QUERY_CONTRACT MODEL_ACCESS equal inputs produce value-equal exact ModelPath; wildcard expanded before policy
  - id: IMP-P2-P1-P2-PATH-OPERATION-MIGRATION
    targets: [DEC-CORE-COMPILER, DEC-CORE-CONTEXT, DEC-CORE-STARTER]
    strategy: ONE_WAY_COMPATIBILITY_CONVERSION
    mapping:
      SharedModelPathExact: exact P2 ModelPath
      SharedModelPathWildcard: finite exact P2 ModelPaths before publication
      AccessModeREAD: AccessOperation.READ
      AccessModeWRITE: AccessOperation.WRITE
      AccessModeEXECUTE: NOT_APPLICABLE
    runtimeAuthority: [ModelPath, AccessOperation, ModelAccessPolicyIndex]
  - id: IMP-P2-READ-WRITE-AUTHORIZATION
    targets: [DEC-CORE-COMPILER, DEC-CORE-CONTEXT, DEC-CORE-STARTER]
    strategy: EXACT_OPERATION_QUALIFIED_POLICY
    operations: [READ, WRITE]
    executeSupported: false
    invariant: READ never implies WRITE and WRITE never implies READ; PolicyIndex is sole runtime authority
    cases: [CASE-P2-TD-ACCESS-READ-WRITE-MATRIX-001, CASE-P2-TD-NO-EXECUTE-CONTRACT-001]
  - id: IMP-P2-PROTECTED-SEAM
    targets: [DEC-CORE-STARTER]
    strategy: SINGLE_PRODUCTION_AUTHORITY_SEAM
    invariant: composition entry or direct Bridge -> internal issuance -> target -> capability -> atomic consume -> Gateway -> Guard -> bound READ/WRITE operation
  - id: IMP-P2-AC007-REPRESENTATIVE-CONSUMERS
    targets: [DEC-CORE-STARTER, DEC-DEMO]
    strategy: PRODUCTION_COMPOSITION_THREE_ENTRY_ACCEPTANCE
    factory: ProtectedAccessRuntimeFactory
    composition: ProtectedAccessComposition
    requiredEntries: [RuleProtectedAccessEntry, ChangeProtectedAccessEntry, CustomActionProtectedAccessEntry]
    invariant: all entries from one composition share same Bridge and EngineContext authority snapshot; manual test construction is not production reachability evidence
    forbiddenConsumerAuthorities: [ProtectedAccessGateway, ModelAccessGuard, targetResolver, rawOperationPort, mutableOrSecondaryPolicyIndex, issuedPairMint, capabilityMint]
    cases: [CASE-P2-TD-AC007-PRODUCTION-COMPOSITION-001, CASE-P2-TD-AC007-RULE-CONSUMER-INTEGRATION-001, CASE-P2-TD-AC007-CHANGE-CONSUMER-INTEGRATION-001, CASE-P2-TD-AC007-CUSTOM-ACTION-CONSUMER-INTEGRATION-001, CASE-P2-TD-AC007-CONSUMER-PARITY-001, CASE-P2-TD-AC007-REAL-PRODUCTION-REACHABILITY-001]
  - id: IMP-P2-CAPABILITY-CONCURRENCY
    targets: [DEC-CORE-STARTER]
    strategy: ATOMIC_ONE_SHOT
    stateTransition: ISSUED -> CONSUMED
    maxSuccessfulConsume: 1
    loserDenial: CAPABILITY_ALREADY_CONSUMED
    cases: [CASE-P2-TD-CAPABILITY-CONCURRENT-CONSUME-001, CASE-P2-TD-DIFFERENT-CAPABILITY-CONCURRENCY-001]
  - id: IMP-P2-ATOMIC-PUBLICATION
    targets: [DEC-CORE-COMPILER, DEC-CORE-CONTEXT]
    strategy: ATOMIC
    invariant: registries RuleView RuleKey closure exact paths READ-WRITE policy ownership version and digest are one closure
  - id: IMP-P2-RUNTIME-DENIAL
    targets: [DEC-CORE-STARTER, DEC-CORE-CONTEXT]
    strategy: DETERMINISTIC_FAIL_CLOSED
    invariant: stable non-sensitive denial provenance including capability-consumed race denial
  - id: IMP-P2-BARE-NAME-COMPAT
    targets: [DEC-CORE-CONTEXT, LEGACY-DECLARATION-SYSTEM-COMPAT]
    strategy: NO_NEW_P2_ADAPTER
    invariant: canonical P2 has no bare-name fallback; surviving historical read path is read-only and ambiguity rejects
