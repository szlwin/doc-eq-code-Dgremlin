impactPolicies:
  - id: IMP-P2-COMPILE-PUBLICATION
    sourceRef: FLOW-CONFIG-COMPILE
    sourceAction: construct candidate and coordinate atomic publication
    targetRefs: [MOD_COMPILER, MOD_CONTEXT]
    policy: REJECT_OPERATION
    conditions: [Context attempts publication itself, candidate incomplete/invalid, atomic swap fails]
    consistency: ATOMIC
    transactionBoundary: one immutable EngineContext candidate publication
    idempotency: same validated inputs yield same candidate identity/digest
    failureHandling: discard candidate and retain previous Context
    compensation: none; old Context already intact
    historyHandling: historical PASSED lifecycle unchanged
    traceIds: [TR-P2-005, TR-P2-006, TR-P2-008]
    testCaseIds: [CASE-P2-TD-ATOMIC-PUBLICATION-001, CASE-P2-TD-POLICY-INDEX-PUBLICATION-001]
  - id: IMP-P2-RUNTIME-TARGET-SELECTION
    sourceRef: FLOW-PROTECTED-ACCESS-EXECUTE
    sourceAction: resolve invocation to exact runtime target
    targetRefs: [MOD_CONTEXT, MOD_STARTER, MOD_MODEL, RUNTIME_TARGET_RESOLVER, RUNTIME_SESSION]
    policy: REJECT_OPERATION
    conditions: [invocation context differs from composition, target candidate count != 1, session scope proof mismatch]
    consistency: ATOMIC
    transactionBoundary: one protected invocation target-resolution attempt
    idempotency: sealed session + immutable plan/context produces same target or denial
    failureHandling: deny before capability/Guard/effect
    compensation: none; effect not started
    historyHandling: historical PASSED lifecycle unchanged
    traceIds: [TR-P2-006, TR-P2-009]
    testCaseIds: [CASE-P2-TD-COMPOSITION-RUNTIME-CONTEXT-MATCH-001, CASE-P2-TD-RUNTIME-TARGET-SELECTION-001, CASE-P2-TD-RUNTIME-OBJECT-NOT-FOUND-STALE-001]
  - id: IMP-P2-RUNTIME-OBJECT-OWNERSHIP
    sourceRef: FLOW-PROTECTED-ACCESS-EXECUTE
    sourceAction: register/use actual ModelData/runtime handle
    targetRefs: [MOD_MODEL, RUNTIME_SESSION]
    policy: REJECT_OPERATION
    conditions: [same handle registered twice in active session, same handle registered by another active session]
    consistency: ATOMIC
    transactionBoundary: one actual ModelData coordination-cell active-session lease
    idempotency: registration of same actual handle is identity-aware and deterministic
    failureHandling: reject duplicate/ownership conflict before protected execution
    compensation: close prior owner session to release active lease; version history remains with coordination cell
    historyHandling: historical PASSED lifecycle unchanged
    traceIds: [TR-P2-007, TR-P2-009]
    testCaseIds: [CASE-P2-TD-CROSS-SESSION-MODELDATA-OWNERSHIP-001, CASE-P2-TD-DIFFERENT-CAPABILITY-CONCURRENCY-001]
  - id: IMP-P2-WRITE-TRANSACTION
    sourceRef: FLOW-PROTECTED-ACCESS-EXECUTE
    sourceAction: perform Guard-approved actual-model mutation
    targetRefs: [MOD_STARTER, MOD_MODEL, RUNTIME_SESSION]
    policy: REJECT_OPERATION
    conditions: [mutation stamp does not match resolved target/key, actual-model/path version stale, mutation/transaction/commit failure]
    consistency: ATOMIC
    transactionBoundary: one actual ModelData + ModelPath write transaction under coordination cell
    idempotency: one-shot capability is never retried; same-version race commits at most once
    failureHandling: stale => zero mutation; operation failure => rollback/restore; receipt absent; capability remains consumed
    compensation: model transaction rollback or isolated working-copy restore
    historyHandling: historical PASSED lifecycle unchanged
    traceIds: [TR-P2-004, TR-P2-007, TR-P2-009]
    testCaseIds: [CASE-P2-TD-MUTATION-STAMP-OBJECT-BINDING-001, CASE-P2-TD-RUNTIME-WRITE-ROLLBACK-001, CASE-P2-TD-DIFFERENT-CAPABILITY-CONCURRENCY-001]
crossModuleImplementations:
  - id: CMI-P2-COMPILE-003
    name: Compiler-coordinated atomic P2 publication
    trigger: FLOW-CONFIG-COMPILE reaches validated candidate construction
    participants:
      - {id: CMPART-P2-COMPILE-COMPILER, module: dec-core-compiler, responsibility: Own symbol/path/policy validation and coordinate one atomic publication.}
      - {id: CMPART-P2-COMPILE-CONTEXT, module: dec-core-context, responsibility: Construct and hold immutable EngineContext/PolicyIndex candidate representation; never independently publish.}
    steps:
      - id: CMSTEP-P2-COMPILE-101
        order: 1
        from: dec-core-compiler
        to: dec-core-context
        interactionType: SYNC_API
        action: Request immutable EngineContext/PolicyIndex candidate construction from fully validated compiled facts.
        preconditions: [all compiler validations passed]
        postconditions: [one immutable candidate or construction error]
        idempotency: pure construction for identical validated facts
        failureHandling: discard failed candidate
        compensation: none
        traceIds: [TR-P2-005, TR-P2-006, TR-P2-008]
      - id: CMSTEP-P2-COMPILE-102
        order: 2
        from: dec-core-compiler
        to: dec-core-context
        interactionType: COMMAND
        action: Coordinate atomic publication of the exact candidate; Context exposes representation/publication primitive but does not initiate the swap.
        preconditions: [candidate immutable and complete]
        postconditions: [new Context visible atomically or old Context retained]
        idempotency: candidate publication identity/version prevents partial duplicate publication
        failureHandling: retain old Context on failure
        compensation: none
        traceIds: [TR-P2-008]
    successCriteria: [Compiler remains publication coordinator., Context remains immutable representation holder., No partial/global default Context state appears.]
    failurePaths:
      - {id: CMFAIL-P2-COMPILE-101, atStep: CMSTEP-P2-COMPILE-101, condition: candidate construction fails, result: candidate discarded; old Context retained, compensationSteps: [], manualRecovery: fix compiler input and rebuild a new candidate, traceIds: [TR-P2-006, TR-P2-008]}
      - {id: CMFAIL-P2-COMPILE-102, atStep: CMSTEP-P2-COMPILE-102, condition: atomic publication fails, result: old Context remains fully visible; partial publication=0, compensationSteps: [], manualRecovery: retry only with a fresh validated candidate/publication attempt, traceIds: [TR-P2-008]}
    traceIds: [TR-P2-001, TR-P2-005, TR-P2-006, TR-P2-008]
    testCaseIds: [CASE-P2-TD-ATOMIC-PUBLICATION-001, CASE-P2-TD-CONTEXT-ISOLATION-001, CASE-P2-TD-POLICY-INDEX-PUBLICATION-001]
    businessFlowRef: FLOW-CONFIG-COMPILE
    businessStepRefs: [STEP-P2-COMPILE-04, STEP-P2-COMPILE-05, STEP-P2-COMPILE-06]
  - id: CMI-P2-PROTECTED-ACCESS-003
    name: Production protected access with exact runtime-target/stamp binding
    trigger: FLOW-PROTECTED-ACCESS-EXECUTE begins
    participants:
      - {id: CMPART-P2-ACCESS-CONTEXT, module: dec-core-context, responsibility: Own complete neutral current P2 contracts and immutable EngineContext policy facts.}
      - {id: CMPART-P2-ACCESS-STARTER, module: dec-core-starter, responsibility: Bind explicit EngineContext/frame snapshot resolve exact runtime target/intent and enforce capability/Gateway/Guard.}
      - {id: CMPART-P2-ACCESS-MODEL, module: dec-core-model, responsibility: Own sealed model session actual ModelData coordination cell locator and transactional model operation.}
    steps:
      - id: CMSTEP-P2-ACCESS-101
        order: 1
        from: dec-core-starter
        to: dec-core-model
        interactionType: QUERY
        action: Resolve RuntimeBindingPlan + exact composition frame/owner/cursor against sealed RuntimeModelSession and freeze one ResolvedRuntimeTarget.
        preconditions: [factory has explicit EngineContext, invocation context equals composition, session sealed]
        postconditions: [one immutable target or deterministic context/0/N denial]
        idempotency: sealed selection deterministic for immutable inputs
        failureHandling: deny before capability/Guard/effect
        compensation: none
        traceIds: [TR-P2-006, TR-P2-009]
      - id: CMSTEP-P2-ACCESS-102
        order: 2
        from: dec-core-starter
        to: dec-core-context
        interactionType: QUERY
        action: Guard exact ModelAccessRuleKey plus same frozen ResolvedRuntimeTarget and RuntimeMutationStamp when WRITE.
        preconditions: [capability consumed once, target/intent immutable]
        postconditions: [ALLOW or DENY; model effect=0 before ALLOW]
        idempotency: one-shot capability prevents repeated Guard/operation attempt
        failureHandling: DENY fail closed
        compensation: none
        traceIds: [TR-P2-006, TR-P2-007]
      - id: CMSTEP-P2-ACCESS-103
        order: 3
        from: dec-core-starter
        to: dec-core-model
        interactionType: SYNC_API
        action: Call read(ResolvedProtectedReadAccess) or write(ResolvedProtectedWriteAccess); WRITE has no separate object/path/version arguments.
        preconditions: [Guard ALLOW]
        postconditions: [READ immutable snapshot or one committed WRITE receipt]
        idempotency: actual-model coordination/version plus one-shot capability
        failureHandling: stale => zero mutation; failure => rollback/restore; receipt absent
        compensation: transaction rollback/restore
        traceIds: [TR-P2-004, TR-P2-007, TR-P2-009]
    successCriteria: [Runtime target selection is unique and composition-bound., WRITE mutation stamp is atomically bound to same target/path., Actual ModelData ownership/coordination prevents cross-session alias bypass., No duplicated WRITE object/path/version authority exists.]
    failurePaths:
      - {id: CMFAIL-P2-ACCESS-101, atStep: CMSTEP-P2-ACCESS-101, condition: context mismatch target 0/N ownership/session-scope failure, result: deterministic denial before Guard/effect, compensationSteps: [], manualRecovery: create fresh composition/frame/session binding and resolve again, traceIds: [TR-P2-006, TR-P2-009]}
      - id: CMFAIL-P2-ACCESS-103
        atStep: CMSTEP-P2-ACCESS-103
        condition: stamp mismatch stale version or runtime write/commit failure
        result: zero committed mutation for stale/mismatch; rollback/restore for operation failure; receipt absent
        compensationSteps: [rollback-or-restore-model-state]
        manualRecovery: retry only as a brand-new invocation/capability after re-resolution
        traceIds: [TR-P2-007, TR-P2-009]
    traceIds: [TR-P2-004, TR-P2-006, TR-P2-007, TR-P2-009]
    testCaseIds: [CASE-P2-TD-COMPOSITION-RUNTIME-CONTEXT-MATCH-001, CASE-P2-TD-RUNTIME-TARGET-SELECTION-001, CASE-P2-TD-MUTATION-STAMP-OBJECT-BINDING-001, CASE-P2-TD-CROSS-SESSION-MODELDATA-OWNERSHIP-001, CASE-P2-TD-RUNTIME-WRITE-ROLLBACK-001, CASE-P2-TD-DIFFERENT-CAPABILITY-CONCURRENCY-001]
    businessFlowRef: FLOW-PROTECTED-ACCESS-EXECUTE
    businessStepRefs: [STEP-P2-ACCESS-01, STEP-P2-ACCESS-02, STEP-P2-ACCESS-03, STEP-P2-ACCESS-05, STEP-P2-ACCESS-06]
