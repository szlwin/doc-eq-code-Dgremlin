impactPolicies:
  - id: IMP-P1-COMPILER-PUBLICATION
    sourceRef: P1-COMPILER-F01
    sourceAction: compileAndPublish
    targetRefs:
      - DEC-CORE-CONTEXT
      - DEC-CORE-STARTER
    policy: REJECT_OPERATION
    conditions:
      - compilation contains ERROR
      - deadline or cancellation is observed
      - candidate construction or compare-and-set fails
    consistency: ATOMIC
    transactionBoundary: One CompilationSession constructs a complete candidate and performs at most one caller-injected compare-and-set before returning.
    idempotency: Equal semantic input and versions produce the same semanticDigest; publication conflict is not retried implicitly.
    failureHandling: Return FailedCompilationResult with a stable Diagnostic and leave the caller-held old EngineContext unchanged.
    compensation: No data compensation is required because an unpublished candidate is never visible.
    historyHandling: Previous revisions, reviews, evidence, and already held EngineContext instances remain immutable.
    traceIds:
      - TR-P1-COMPILER-005
    testCaseIds:
      - CASE-P1-CONTEXT-001
      - CASE-P1-PUBLISH-ATOMIC-001
    evidenceRefs:
      - version/V_1.0/doc/DEC_COMPILER/DEC_COMPILER_api_contract.md#api-publication
  - id: IMP-P1-DECLARATION-RETIREMENT
    sourceRef: P1-COMPILER-F01
    sourceAction: retireTemporaryDeclarationModule
    targetRefs:
      - DEC-EXPAND-DECLARATION
    policy: CASCADE_HARD_DELETE
    conditions:
      - unified compiler contract is the only implementation path
    consistency: ATOMIC
    transactionBoundary: Repository, Reactor, dependencies, services, reflection strings, and artifact inventory are verified as one release gate.
    idempotency: Repeated residue scans return the same empty result for an unchanged revision.
    failureHandling: Any residue blocks completion.
    compensation: Repository recovery uses Git revert; no runtime adapter is retained.
    historyHandling: Historical source remains available only through Git and immutable Evidence.
    traceIds:
      - TR-P1-COMPILER-007
    testCaseIds:
      - CASE-P1-RETIREMENT-001
    evidenceRefs:
      - version/V_1.0/doc/DEC_COMPILER/DEC_COMPILER_design.md#design-declaration-retirement
  - id: IMP-P2-MODEL-ACCESS-AUTHORIZATION
    sourceRef: FEATURE-DESC-3361AD2E54FC
    sourceAction: compileAndAuthorizeModelAccess
    targetRefs:
      - DEC-CORE-COMPILER
      - DEC-CORE-CONTEXT
      - DEC-CORE-STARTER
    policy: REJECT_OPERATION
    conditions:
      - static access is undeclared or invalid
      - Guard denies any protected READ/WRITE/EXECUTE request
    consistency: ATOMIC
    transactionBoundary: Static denial blocks complete candidate publication; runtime Guard denial occurs before protected read, mutation, execute or external side effect.
    idempotency: The same System/target/path/operation and authority facts yield the same decision; denial has no state mutation to replay.
    failureHandling: Emit stable source-aware denial and preserve the old EngineContext or current business state.
    compensation: No compensation is required for denied access because no protected operation is allowed before authorization.
    historyHandling: Previous compiled Context and Evidence remain immutable.
    traceIds:
      - TR-P2-SYSTEM-RULEVIEW-004
      - TR-P2-SYSTEM-RULEVIEW-005
      - TR-P2-SYSTEM-RULEVIEW-006
      - TR-P2-SYSTEM-RULEVIEW-007
      - TR-P2-SYSTEM-RULEVIEW-008
    testCaseIds:
      - CASE-P2-ACCESS-STATIC-001
      - CASE-P2-ACCESS-RUNTIME-001
      - CASE-P2-ACCESS-NO-BYPASS-001
    evidenceRefs:
      - version/V_1.0/doc/COMPILER/COMPILER_business_model.yaml#POL-MODEL-ACCESS-AUTHORIZATION
      - version/V_1.0/doc/COMPILER/changes/p2-independent-review-remediation-r08.yaml
  - id: IMP-P2-DECLARATION-BOUNDARY
    sourceRef: FEATURE-DESC-3361AD2E54FC
    sourceAction: preserveReadOnlyDeclarationCompatibilityBoundary
    targetRefs:
      - LEGACY-DECLARATION-SYSTEM-COMPAT
    policy: RETAIN_UNCHANGED
    conditions:
      - current phase is P2
      - only ConfigInfo.getRuleViewInfo(String) / DataUtil.getRuleViewInfo(String) compatible read surface is retained
    consistency: ATOMIC
    transactionBoundary: P2 may retain the surviving read-only compatibility surface but must not restore DEC-EXPAND-DECLARATION, register new runtime authority through it, or create a second Registry/EngineContext.
    idempotency: Repeated P2 compilation keeps the same read-only compatibility boundary and never recreates the retired module.
    failureHandling: Any attempt to restore DEC-EXPAND-DECLARATION, write through the compatibility boundary, or create a second runtime authority blocks P2 completion.
    compensation: Revert the P2 change that crosses the declared phase boundary.
    historyHandling: The retired module remains historical Git/Evidence only; the surviving read adapter remains until the P7 retirement gate.
    traceIds:
      - TR-P2-SYSTEM-RULEVIEW-010
    testCaseIds:
      - CASE-P2-DECLARATION-BOUNDARY-001
    evidenceRefs:
      - version/V_1.0/doc/COMPILER/COMPILER_business_model.yaml#INV-COMPILER-022
      - version/V_1.0/doc/COMPILER/changes/p2-independent-review-remediation-r08.yaml
crossModuleImplementations:
  - id: CMI-P1-COMPILER-001
    businessFlowRef: FLOW-CONFIG-COMPILE
    businessStepRefs:
      - STEP-CONFIG-COMPILE-01
      - STEP-CONFIG-COMPILE-02
      - STEP-CONFIG-COMPILE-03
      - STEP-CONFIG-COMPILE-04
      - STEP-CONFIG-COMPILE-05
      - STEP-CONFIG-COMPILE-06
      - STEP-CONFIG-COMPILE-07
    name: Deterministic configuration compilation and publication
    trigger: Starter or a test caller submits a root SourceReference and explicit publication request.
    participants:
      - id: CMPART-STARTER
        module: STARTER
        responsibility: Assemble explicit provider, frontend registry, expectedCurrent, and ContextPublisher; receive the final result without republishing.
        contractRefs:
          - DEC_COMPILER_api_contract.md#api-compiler
      - id: CMPART-COMPILER
        module: COMPILER
        responsibility: Own CompilationSession, deterministic passes, digest, candidate construction, and atomic publication coordination.
        contractRefs:
          - DEC_COMPILER_api_contract.md#api-compiler
          - DEC_COMPILER_api_contract.md#api-publication
      - id: CMPART-FRONTEND
        module: XML-YAML
        responsibility: Securely convert DocumentSource into CanonicalDocumentNode without global mutation.
        contractRefs:
          - DEC_COMPILER_api_contract.md#api-source-frontend
      - id: CMPART-CONTEXT
        module: CONTEXT
        responsibility: Provide compiler-neutral immutable keys, registries, CompiledModelSet, EngineContext, and read-only projection.
        contractRefs:
          - DEC_COMPILER_design.md#design-compiled-model-set
      - id: CMPART-PUBLISHER
        module: CALLER-CONTEXT
        responsibility: Implement the caller-scoped compare-and-set holder supplied through PublicationRequest.
        contractRefs:
          - DEC_COMPILER_api_contract.md#api-publication
    steps:
      - id: CMSTEP-P1-COMPILER-01
        order: 1
        from: CMPART-STARTER
        to: CMPART-COMPILER
        interactionType: COMMAND
        action: Invoke compileAndPublish with explicit requests
        contractRef: DEC_COMPILER_api_contract.md#api-compiler
        preconditions:
          - request values have passed constructor null checks
        postconditions:
          - a new isolated CompilationSession exists
        idempotency: A retry always creates a new Session and never reuses mutable builders.
        timeout: Caller-supplied monotonic Deadline
        failureHandling: Invalid business input becomes FailedCompilationResult; constructor null remains a caller programming error.
        compensation: ''
        traceIds:
          - TR-P1-COMPILER-001
          - TR-P1-COMPILER-005
      - id: CMSTEP-P1-COMPILER-02
        order: 2
        from: CMPART-COMPILER
        to: CMPART-FRONTEND
        interactionType: SYNC_API
        action: Resolve sources and parse canonical nodes
        contractRef: DEC_COMPILER_api_contract.md#api-source-frontend
        preconditions:
          - source policy and format registry are available
        postconditions:
          - all discovered sources have canonical nodes or stable Diagnostics
        idempotency: Equal source bytes and frontend versions produce equal canonical semantics.
        timeout: Checked at source and parse boundaries
        failureHandling: Security, policy, IO, and syntax ERROR stop publication.
        compensation: Discard Session-local nodes.
        traceIds:
          - TR-P1-COMPILER-001
          - TR-P1-COMPILER-002
      - id: CMSTEP-P1-COMPILER-03
        order: 3
        from: CMPART-COMPILER
        to: CMPART-COMPILER
        interactionType: DATA_WRITE
        action: Build Raw definitions, register symbols, resolve references, classify Deferred, and compute digest input
        contractRef: DEC_COMPILER_design.md#design-compiler-pipeline
        preconditions:
          - canonical nodes are available without ERROR
        postconditions:
          - SemanticDigestInput and stable Diagnostics are complete
        idempotency: Stable canonical inputs and options produce equal ordered builders.
        timeout: Checked at every Pass boundary
        failureHandling: Aggregate ERROR and transition the Session to FAILED.
        compensation: Discard Session-local builders.
        traceIds:
          - TR-P1-COMPILER-003
          - TR-P1-COMPILER-004
          - TR-P1-COMPILER-008
          - TR-P1-COMPILER-009
      - id: CMSTEP-P1-COMPILER-04
        order: 4
        from: CMPART-COMPILER
        to: CMPART-CONTEXT
        interactionType: DATA_WRITE
        action: Construct immutable CompiledModelSet and candidate EngineContext
        contractRef: DEC_COMPILER_design.md#design-compiled-model-set
        preconditions:
          - semantic validation completed without ERROR
        postconditions:
          - a complete unpublished candidate exists
        idempotency: Equal semantic input produces equal digest and immutable model content.
        timeout: Checked before candidate construction
        failureHandling: Construction failure returns MIX-CONTEXT-CONSTRUCTION-FAILED.
        compensation: Unpublished candidate is discarded.
        traceIds:
          - TR-P1-COMPILER-004
          - TR-P1-COMPILER-005
          - TR-P1-COMPILER-006
      - id: CMSTEP-P1-COMPILER-05
        order: 5
        from: CMPART-COMPILER
        to: CMPART-PUBLISHER
        interactionType: SYNC_API
        action: Invoke the caller-injected ContextPublisher exactly once
        contractRef: DEC_COMPILER_api_contract.md#api-publication
        preconditions:
          - complete candidate and expectedCurrent are available
        postconditions:
          - Session is PUBLISHED only when PublicationResult is PUBLISHED
        idempotency: No implicit CAS retry; a conflict requires a new explicit compilation request.
        timeout: No hidden retry or wait
        failureHandling: Conflict, null, or exception returns FAILED and leaves old Context unchanged.
        compensation: No compensation because failed publication exposes no candidate.
        traceIds:
          - TR-P1-COMPILER-005
      - id: CMSTEP-P1-COMPILER-06
        order: 6
        from: CMPART-COMPILER
        to: CMPART-STARTER
        interactionType: CALLBACK
        action: Return PublishedCompilationResult or FailedCompilationResult
        contractRef: DEC_COMPILER_api_contract.md#api-result
        preconditions:
          - Session reached PUBLISHED or FAILED
        postconditions:
          - Starter returns the same result and performs no second publication
        idempotency: Result values are immutable.
        timeout: Synchronous return
        failureHandling: No partial result is returned.
        compensation: ''
        traceIds:
          - TR-P1-COMPILER-005
    successCriteria:
      - The immutable candidate becomes visible exactly once and the returned status is PUBLISHED.
      - Context never depends on compiler and Starter never republishes after return.
      - Equal semantic inputs and versions produce equal semanticDigest.
    failurePaths:
      - id: CMFAIL-P1-COMPILER-PARSE
        atStep: CMSTEP-P1-COMPILER-02
        condition: Source policy, secure parsing, or syntax failure
        result: Session reaches FAILED and no publisher call occurs.
        compensationSteps:
          - Discard Session-local source and canonical builders.
        manualRecovery: Fix configuration using Diagnostic SourceRef and submit a new request.
        traceIds:
          - TR-P1-COMPILER-001
          - TR-P1-COMPILER-002
      - id: CMFAIL-P1-COMPILER-SEMANTIC
        atStep: CMSTEP-P1-COMPILER-03
        condition: Structural, symbol, reference, ownership, selector, or Deferred ERROR
        result: Session reaches FAILED and no CompiledModelSet is published.
        compensationSteps:
          - Discard Session-local semantic builders.
        manualRecovery: Fix the referenced definition and submit a new request.
        traceIds:
          - TR-P1-COMPILER-003
          - TR-P1-COMPILER-004
          - TR-P1-COMPILER-008
          - TR-P1-COMPILER-009
      - id: CMFAIL-P1-COMPILER-PUBLISH
        atStep: CMSTEP-P1-COMPILER-05
        condition: ContextPublisher reports conflict, returns null, or throws
        result: Session reaches FAILED and the old EngineContext remains visible.
        compensationSteps:
          - Discard the unpublished candidate.
        manualRecovery: Re-read expectedCurrent and explicitly submit a new compilation request if retry is desired.
        traceIds:
          - TR-P1-COMPILER-005
    traceIds:
      - TR-P1-COMPILER-001
      - TR-P1-COMPILER-002
      - TR-P1-COMPILER-003
      - TR-P1-COMPILER-004
      - TR-P1-COMPILER-005
      - TR-P1-COMPILER-006
      - TR-P1-COMPILER-008
      - TR-P1-COMPILER-009
    testCaseIds:
      - CASE-P1-MIX-DISCOVERY-001
      - CASE-P1-MIX-RAW-001
      - CASE-P1-SYMBOL-001
