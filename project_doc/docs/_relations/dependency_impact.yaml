  - id: CMI-P2-SYSTEM-RULEVIEW-001
    businessFlowRef: FLOW-CONFIG-COMPILE
    businessStepRefs:
      - STEP-CONFIG-COMPILE-01
      - STEP-CONFIG-COMPILE-03
      - STEP-CONFIG-COMPILE-04
      - STEP-CONFIG-COMPILE-05
      - STEP-CONFIG-COMPILE-06
      - STEP-CONFIG-COMPILE-07
    name: System-scoped RuleView and fail-closed model access compilation/runtime handoff
    trigger: A caller compiles configuration containing System, RuleView and model-access facts, then resolves or executes a System-owned RuleView.
    participants:
      - id: CMPART-P2-FRONTEND
        module: FRONTEND
        responsibility: Preserve explicit System ownership, RuleView system/name and model-access SourceRef facts without global mutation.
        contractRefs:
          - FLOW-CONFIG-COMPILE
      - id: CMPART-P2-COMPILER
        module: COMPILER
        responsibility: Register System identities, resolve RuleView composite keys, compile ModelPath, make static access decisions and build a complete immutable candidate.
        contractRefs:
          - version/V_1.0/doc/COMPILER/COMPILER_business_model.yaml#AGG-SYSTEM-COMPILED-CONFIG
      - id: CMPART-P2-CONTEXT
        module: CONTEXT
        responsibility: Hold immutable owner-qualified System/RuleView/access facts and keep Context instances isolated.
        contractRefs:
          - version/V_1.0/doc/COMPILER/COMPILER_business_model.yaml#ENT-COMPILED-SYSTEM
      - id: CMPART-P2-STARTER
        module: STARTER
        responsibility: Use system-ref + rule-ref for runtime lookup and route every protected READ/WRITE/EXECUTE through the common Guard before the target operation.
        contractRefs:
          - version/V_1.0/doc/FEATURE-DESC-3361AD2E54FC/requirement.md#AC-P2-SYSTEM-RULEVIEW-003
          - version/V_1.0/doc/COMPILER/changes/p2-independent-review-remediation-r08.yaml
    steps:
      - id: CMSTEP-P2-SYSTEM-RULEVIEW-01
        order: 1
        from: CMPART-P2-FRONTEND
        to: CMPART-P2-COMPILER
        interactionType: COMMAND
        action: Submit explicit System/RuleView/model-access canonical facts
        preconditions:
          - sources passed structural parsing
        postconditions:
          - owner/source facts remain explicit
        idempotency: Equivalent source ordering produces equivalent canonical facts.
        failureHandling: Malformed or unknown facts become Diagnostic; no runtime state is changed.
        compensation: No compensation; fix source and recompile.
        traceIds:
          - TR-P2-SYSTEM-RULEVIEW-001
          - TR-P2-SYSTEM-RULEVIEW-009
      - id: CMSTEP-P2-SYSTEM-RULEVIEW-02
        order: 2
        from: CMPART-P2-COMPILER
        to: CMPART-P2-CONTEXT
        interactionType: DATA_WRITE
        action: Publish complete owner-qualified System, RuleView and access candidate
        preconditions:
          - all duplicate/reference/path/static-access checks passed
        postconditions:
          - one immutable Context becomes visible atomically
        idempotency: Same semantic input produces equivalent semanticDigest.
        failureHandling: Any ERROR leaves the old Context unchanged.
        compensation: Discard unpublished candidate.
        traceIds:
          - TR-P2-SYSTEM-RULEVIEW-002
          - TR-P2-SYSTEM-RULEVIEW-004
          - TR-P2-SYSTEM-RULEVIEW-005
          - TR-P2-SYSTEM-RULEVIEW-008
      - id: CMSTEP-P2-SYSTEM-RULEVIEW-03
        order: 3
        from: CMPART-P2-STARTER
        to: CMPART-P2-CONTEXT
        interactionType: QUERY
        action: Resolve RuleView by system-ref + rule-ref
        preconditions:
          - SystemKey and RuleView name are explicit
        postconditions:
          - exact RuleViewKey is returned or lookup fails explicitly
        idempotency: Repeated lookup in the same immutable Context returns the same result.
        failureHandling: Unknown composite key or bare-name request fails; no fallback lookup.
        compensation: None.
        traceIds:
          - TR-P2-SYSTEM-RULEVIEW-002
          - TR-P2-SYSTEM-RULEVIEW-003
      - id: CMSTEP-P2-SYSTEM-RULEVIEW-04
        order: 4
        from: CMPART-P2-STARTER
        to: CMPART-P2-CONTEXT
        interactionType: COMMAND
        action: Request ModelAccessGuard authorization for every protected READ/WRITE/EXECUTE before the target operation; STATIC_ALLOW is resolved only inside Guard and RUNTIME_GUARD_REQUIRED alone submits RuntimeFactEvaluator work.
        preconditions:
          - static compilation accepted the structural rule boundary or produced a publish-blocking ERROR
        postconditions:
          - only Guard ALLOW permits the protected operation; every DENY returns before target read/mutation/execute or external side effect
        idempotency: Repeated decision over unchanged authority/resource facts is stable; no implicit retry follows timeout/rejection/exception.
        failureHandling: Guard unavailable, policy missing, Context mismatch, evaluator failure/timeout/unavailable or other undecidable authorization fails closed and preserves current state.
        compensation: No compensation because the protected operation has not started.
        traceIds:
          - TR-P2-SYSTEM-RULEVIEW-004
          - TR-P2-SYSTEM-RULEVIEW-006
          - TR-P2-SYSTEM-RULEVIEW-007
    successCriteria:
      - System and RuleView identities are deterministic and owner-qualified
      - static illegal access blocks publication
      - every protected runtime access reaches Guard; STATIC_ALLOW cannot bypass it
      - Guard denial occurs before protected target operation or external side effect
      - declaration compatibility points only to the surviving read-only boundary while DEC-EXPAND-DECLARATION stays retired
    failurePaths:
      - id: CMFAIL-P2-SYSTEM-RULEVIEW-01
        atStep: CMSTEP-P2-SYSTEM-RULEVIEW-02
        condition: duplicate/unknown/path/static permission error
        result: candidate is not published and old Context remains active
        compensationSteps: []
        manualRecovery: Correct configuration and recompile.
        traceIds:
          - TR-P2-SYSTEM-RULEVIEW-001
          - TR-P2-SYSTEM-RULEVIEW-004
          - TR-P2-SYSTEM-RULEVIEW-005
          - TR-P2-SYSTEM-RULEVIEW-008
      - id: CMFAIL-P2-SYSTEM-RULEVIEW-02
        atStep: CMSTEP-P2-SYSTEM-RULEVIEW-03
        condition: bare RuleView name or unknown composite key
        result: lookup fails explicitly without cross-System fallback
        compensationSteps: []
        manualRecovery: Supply explicit valid system-ref + rule-ref.
        traceIds:
          - TR-P2-SYSTEM-RULEVIEW-003
      - id: CMFAIL-P2-SYSTEM-RULEVIEW-03
        atStep: CMSTEP-P2-SYSTEM-RULEVIEW-04
        condition: ModelAccessGuard denies any protected READ/WRITE/EXECUTE
        result: operation fails before protected target operation or external side effect
        compensationSteps: []
        manualRecovery: Correct authority/resource/composition state before retry.
        traceIds:
          - TR-P2-SYSTEM-RULEVIEW-004
          - TR-P2-SYSTEM-RULEVIEW-006
          - TR-P2-SYSTEM-RULEVIEW-007
    traceIds:
      - TR-P2-SYSTEM-RULEVIEW-001
      - TR-P2-SYSTEM-RULEVIEW-002
      - TR-P2-SYSTEM-RULEVIEW-003
      - TR-P2-SYSTEM-RULEVIEW-004
      - TR-P2-SYSTEM-RULEVIEW-005
      - TR-P2-SYSTEM-RULEVIEW-006
      - TR-P2-SYSTEM-RULEVIEW-007
      - TR-P2-SYSTEM-RULEVIEW-008
      - TR-P2-SYSTEM-RULEVIEW-009
      - TR-P2-SYSTEM-RULEVIEW-010
    testCaseIds:
