impactPolicies:
  - id: IMP-P1-COMPILER-PUBLICATION
    sourceRef: P1-COMPILER-F01
    sourceAction: compileAndPublish
    targetRefs: [DEC-CORE-CONTEXT, DEC-CORE-STARTER]
    policy: REJECT_OPERATION
    conditions: [compilation contains ERROR, candidate construction or compare-and-set fails]
    consistency: ATOMIC
    transactionBoundary: inherited P1 one-candidate atomic publication
    idempotency: equal semantic input and versions produce equal semanticDigest
    failureHandling: old EngineContext remains unchanged
    compensation: none
    historyHandling: previous revisions remain immutable
    traceIds: [TR-P1-COMPILER-005]
    testCaseIds: [CASE-P1-PUBLISH-ATOMIC-001]
    evidenceRefs: [version/V_1.0/doc/DEC_COMPILER/DEC_COMPILER_api_contract.md#api-publication]
  - id: IMP-P2-SYSTEM-OWNERSHIP
    sourceRef: FEATURE-DESC-3361AD2E54FC
    sourceAction: compileSystemOwnershipSnapshot
    targetRefs: [DEC-CORE-COMPILER, DEC-CORE-CONTEXT]
    policy: REJECT_OPERATION
    conditions: [orphan owned fact, missing owned fact, ownership mismatch, invalid version identity]
    consistency: ATOMIC
    transactionBoundary: ownership/version snapshots are frozen with the same digest-bound candidate
    idempotency: equal semantic source produces equal ownership/version identity independent of discovery order
    failureHandling: stable ERROR and no candidate publication
    compensation: discard candidate
    historyHandling: old Context remains immutable
    traceIds: [TR-P2-SYSTEM-RULEVIEW-001, TR-P2-SYSTEM-RULEVIEW-008]
    testCaseIds: [CASE-P2-TD-SYSTEM-OWNERSHIP-SNAPSHOT-001, CASE-P2-TD-SYSTEM-VERSION-IDENTITY-001]
    evidenceRefs: [version/V_1.0/doc/COMPILER/COMPILER_business_model.yaml#INV-COMPILER-016A]
  - id: IMP-P2-SHARED-MODEL-PATH
    sourceRef: FEATURE-DESC-3361AD2E54FC
    sourceAction: canonicalizeModelPath
    targetRefs: [DEC-CORE-COMPILER, DOWNSTREAM-P6-PROTECTED-CONSUMER]
    policy: REJECT_OPERATION
    conditions: [consumer-specific path interpretation, invalid segment, fuzzy fallback]
    consistency: DETERMINISTIC
    transactionBoundary: compile-time path IR construction
    idempotency: equal System target raw path yields value-equal ModelPath for all consumer kinds
    failureHandling: stable source-aware ERROR
    compensation: none
    historyHandling: none
    traceIds: [TR-P2-SYSTEM-RULEVIEW-005]
    testCaseIds: [CASE-P2-TD-MODEL-PATH-CROSS-CONSUMER-EQUIVALENCE-001]
    evidenceRefs: [version/V_1.0/doc/COMPILER/COMPILER_business_model.yaml#INV-COMPILER-018]
  - id: IMP-P2-MODEL-ACCESS-AUTHORIZATION
    sourceRef: FEATURE-DESC-3361AD2E54FC
    sourceAction: compileAndAuthorizeModelAccess
    targetRefs: [DEC-CORE-COMPILER, DEC-CORE-CONTEXT, DEC-CORE-STARTER]
    policy: REJECT_OPERATION
    conditions: [static access invalid, exact policy missing, runtime proof invalid, Guard denies]
    consistency: ATOMIC
    transactionBoundary: static denial blocks publication; runtime denial occurs before protected operation/effect
    idempotency: same immutable facts produce same decision classification
    failureHandling: fail closed and preserve state
    compensation: none
    historyHandling: previous Context/Evidence immutable
    traceIds: [TR-P2-SYSTEM-RULEVIEW-004, TR-P2-SYSTEM-RULEVIEW-006]
    testCaseIds: [CASE-P2-TD-ACCESS-NON-IMPLICATION-001, CASE-P2-TD-RUNTIME-BINDING-PROOF-001]
    evidenceRefs: [version/V_1.0/doc/COMPILER/COMPILER_business_model.yaml#POL-MODEL-ACCESS-AUTHORIZATION]
  - id: IMP-P2-PROTECTED-SEAM
    sourceRef: FEATURE-DESC-3361AD2E54FC
    sourceAction: executeProtectedAccess
    targetRefs: [DEC-CORE-STARTER, DOWNSTREAM-P3-PROTECTED-CONSUMER, DOWNSTREAM-P4-PROTECTED-CONSUMER, DOWNSTREAM-P6-PROTECTED-CONSUMER]
    policy: REQUIRE_SINGLE_ENTRY
    conditions: [protected READ WRITE EXECUTE]
    consistency: FAIL_CLOSED
    transactionBoundary: Bridge to Gateway to Guard must complete before protected operation
    idempotency: direct bridge invocations are independent; same one-shot capability terminal success <= 1
    failureHandling: unsupported/bypass path blocks P2 or downstream integration
    compensation: none before side effect
    historyHandling: downstream obligations remain open until their stage
    traceIds: [TR-P2-SYSTEM-RULEVIEW-007]
    testCaseIds: [CASE-P2-TD-PRODUCTION-SEAM-NO-LEGAL-BYPASS-001, CASE-P2-TD-GUARD-NO-BYPASS-001]
    evidenceRefs: [version/V_1.0/task/FEATURE-DESC-3361AD2E54FC/decision_log.md]
  - id: IMP-P2-DIAGNOSTIC-DENIAL
    sourceRef: FEATURE-DESC-3361AD2E54FC
    sourceAction: emitDiagnosticOrDenial
    targetRefs: [DEC-CORE-COMPILER, DEC-CORE-STARTER]
    policy: REQUIRE_DETERMINISTIC_RESULT
    conditions: [compile ERROR, runtime DENY]
    consistency: DETERMINISTIC
    transactionBoundary: result emitted before publication/operation as applicable
    idempotency: same immutable facts repeat same code/provenance
    failureHandling: unstable/missing provenance blocks completion
    compensation: none
    historyHandling: no sensitive runtime values persisted
    traceIds: [TR-P2-SYSTEM-RULEVIEW-009]
    testCaseIds: [CASE-P2-TD-DIAGNOSTIC-DETERMINISM-001, CASE-P2-TD-RUNTIME-DENIAL-DIAGNOSTIC-DETERMINISM-001]
    evidenceRefs: [version/V_1.0/doc/COMPILER/COMPILER_business_model.yaml#INV-COMPILER-021]
  - id: IMP-P2-ATOMIC-PUBLICATION
    sourceRef: FEATURE-DESC-3361AD2E54FC
    sourceAction: publishP2Candidate
    targetRefs: [DEC-CORE-COMPILER, DEC-CORE-CONTEXT]
    policy: REJECT_OPERATION
    conditions: [any System RuleView ownership path policy ERROR]
    consistency: ATOMIC
    transactionBoundary: one immutable digest-bound candidate
    idempotency: equal facts yield equal digest
    failureHandling: old Context retained
    compensation: discard candidate
    historyHandling: previous Context immutable
    traceIds: [TR-P2-SYSTEM-RULEVIEW-008]
    testCaseIds: [CASE-P2-TD-ATOMIC-PUBLICATION-001]
    evidenceRefs: [version/V_1.0/doc/COMPILER/COMPILER_architecture.md#2-发布闭包]
  - id: IMP-P2-DECLARATION-BOUNDARY
    sourceRef: FEATURE-DESC-3361AD2E54FC
    sourceAction: preserveReadOnlyDeclarationCompatibilityBoundary
    targetRefs: [LEGACY-DECLARATION-SYSTEM-COMPAT]
    policy: RETAIN_UNCHANGED
    conditions: [current phase is P2, compatibility is read-only]
    consistency: ATOMIC
    transactionBoundary: P2 never restores retired declaration runtime
    idempotency: repeated compile keeps same boundary
    failureHandling: write/second authority blocks completion
    compensation: revert offending P2 change
    historyHandling: final deletion belongs P7
    traceIds: [TR-P2-SYSTEM-RULEVIEW-010]
    testCaseIds: [CASE-P2-TD-DECLARATION-BOUNDARY-001]
    evidenceRefs: [version/V_1.0/doc/COMPILER/COMPILER_business_model.yaml#INV-COMPILER-022]
crossModuleImplementations:
  - id: CMI-P2-SYSTEM-RULEVIEW-001
    businessFlowRef: FLOW-CONFIG-COMPILE
    name: P2 owner-qualified compilation, publication and protected runtime seam
    trigger: caller compiles System/RuleView/model-access facts and then uses a P2 protected access
    participants:
      - id: CMPART-P2-FRONTEND
        module: FRONTEND
        responsibility: preserve explicit ownership/path/source facts
      - id: CMPART-P2-COMPILER
        module: COMPILER
        responsibility: construct ownership RuleView ModelPath policy digest candidate
      - id: CMPART-P2-CONTEXT
        module: CONTEXT
        responsibility: expose immutable current snapshots and one PolicyIndex authority
      - id: CMPART-P2-STARTER
        module: STARTER
        responsibility: expose Bridge and enforce resolver capability Gateway Guard operation seam
    steps:
      - id: CMSTEP-P2-01
        order: 1
        from: CMPART-P2-FRONTEND
        to: CMPART-P2-COMPILER
        interactionType: DATA_WRITE
        action: provide explicit System RuleView view/rule model-access path SourceRef facts
      - id: CMSTEP-P2-02
        order: 2
        from: CMPART-P2-COMPILER
        to: CMPART-P2-CONTEXT
        interactionType: DATA_WRITE
        action: atomically publish ownership RuleView PolicyIndex digest candidate
      - id: CMSTEP-P2-03
        order: 3
        from: CMPART-P2-STARTER
        to: CMPART-P2-CONTEXT
        interactionType: SYNC_API
        action: execute exact protected request through Bridge Gateway Guard using current Context
    successCriteria:
      - ownership/version and RuleView resolved relations are complete
      - shared ModelPath is canonical across consumer contracts
      - operation permissions do not imply each other
      - all P2 protected production operations use the one seam
      - denial occurs before effect
    failurePaths:
      - id: CMFAIL-P2-COMPILE
        atStep: CMSTEP-P2-02
        condition: ownership RuleView path policy or digest error
        result: no candidate publication; old Context retained
      - id: CMFAIL-P2-RUNTIME
        atStep: CMSTEP-P2-03
        condition: policy/proof/plan/target/Guard invalid
        result: deterministic DENY; operation/effect zero
    traceIds:
      - TR-P2-SYSTEM-RULEVIEW-001
      - TR-P2-SYSTEM-RULEVIEW-002
      - TR-P2-SYSTEM-RULEVIEW-004
      - TR-P2-SYSTEM-RULEVIEW-005
      - TR-P2-SYSTEM-RULEVIEW-006
      - TR-P2-SYSTEM-RULEVIEW-007
      - TR-P2-SYSTEM-RULEVIEW-008
      - TR-P2-SYSTEM-RULEVIEW-009
  - id: CMI-P2-DOWNSTREAM-PROTECTED-CONSUMERS
    businessFlowRef: FLOW-CONFIG-COMPILE
    name: Downstream consumer obligations created by P2 seam decision
    trigger: P3/P4/P6 begins concrete executor implementation
    participants:
      - id: CMPART-DOWNSTREAM-P3
        module: P3
        responsibility: integrate Rule/Information access through P2 seam
      - id: CMPART-DOWNSTREAM-P4
        module: P4
        responsibility: integrate change/custom-action/produce access through P2 seam
      - id: CMPART-DOWNSTREAM-P6
        module: P6
        responsibility: integrate QueryPlan shared ModelPath/protected read through P2 seam
    successCriteria:
      - no downstream module introduces a bypass or second permission authority
    failurePaths: []
    traceIds: [TR-P2-SYSTEM-RULEVIEW-005, TR-P2-SYSTEM-RULEVIEW-007]
