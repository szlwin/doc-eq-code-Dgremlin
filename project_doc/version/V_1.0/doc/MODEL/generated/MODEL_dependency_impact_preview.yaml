impactPolicies:
  -
    id: "IMP-P2-CONTEXT-PUBLICATION-R29"
    sourceRef: "FLOW-CONFIG-COMPILE"
    sourceAction: "publish exact policy/binding/materialization aggregate"
    targetRefs:
      - "COMP"
      - "CTX"
    policy: "REJECT_OPERATION"
    conditions:
      - "dynamic target lacks exactly one materialization descriptor"
      - "candidate aggregate/digest incomplete"
    consistency: "ATOMIC"
    transactionBoundary: "one CompiledModelSet / EngineContext candidate"
    idempotency: "same semantic inputs produce equal aggregate/digest"
    failureHandling: "compile/publication ERROR; previous Context remains visible"
    compensation: "discard unpublished candidate"
    traceIds:
      - "TR-P2-005"
      - "TR-P2-008"
    testCaseIds:
      - "CASE-P2-TD-CONTEXT-MATERIALIZATION-INDEX-AGGREGATE-001"
      - "CASE-P2-TD-MATERIALIZATION-PUBLICATION-CLOSURE-001"
      - "CASE-P2-TD-ATOMIC-PUBLICATION-001"
  -
    id: "IMP-P2-DIRECT-LOAD-R29"
    sourceRef: "FLOW-PROTECTED-ACCESS-EXECUTE"
    sourceAction: "MODEL production lifecycle establishes trusted frame from RuntimeModelLoadRequest before FLOW STEP-01"
    targetRefs:
      - "MODEL"
      - "CTX"
      - "LOAD_REQ"
    policy: "REJECT_OPERATION"
    conditions:
      - "root closed"
      - "plan absent from captured Context"
      - "materialization descriptor missing"
      - "origin not materializable"
      - "production Container load rejected"
    consistency: "ATOMIC"
    transactionBoundary: "one RuntimeModelExecutionRoot.load(request)"
    idempotency: "each successful load freezes exactly the same created/loaded ModelData into one trusted handle"
    failureHandling: "stable RuntimeModelLoadFailure; no handle/scope reaches STARTER"
    compensation: "discard unexposed association"
    traceIds:
      - "TR-P2-006"
      - "TR-P2-009"
    testCaseIds:
      - "CASE-P2-TD-PRODUCTION-LOAD-REQUEST-001"
      - "CASE-P2-TD-PRODUCTION-LOAD-PLAN-MISMATCH-001"
      - "CASE-P2-TD-PRODUCTION-MODELDATA-IDENTITY-001"
      - "CASE-P2-TD-PRODUCTION-CONTAINER-TRUST-BOUNDARY-001"
  -
    id: "IMP-P2-EFFECT-BINDING-R29"
    sourceRef: "FLOW-PROTECTED-ACCESS-EXECUTE"
    sourceAction: "bind MODEL effect port to same sealed scope/session then execute only after Guard ALLOW"
    targetRefs:
      - "STARTER"
      - "MODEL"
      - "EFFECT"
    policy: "REJECT_OPERATION"
    conditions:
      - "scope/session mismatch"
      - "session unsealed/closed"
      - "resolved object not registered in bound session"
      - "Guard DENY"
      - "MODEL operation failure"
    consistency: "ATOMIC"
    transactionBoundary: "one protected invocation/capability"
    idempotency: "one-shot capability; one bound operation attempt after ALLOW"
    failureHandling: "stable composition/operation denial; no unauthorized effect or success receipt"
    compensation: "close failed partial composition/session; no fallback provider"
    traceIds:
      - "TR-P2-007"
      - "TR-P2-009"
    testCaseIds:
      - "CASE-P2-TD-MODEL-EFFECT-PROVIDER-BINDING-001"
      - "CASE-P2-TD-MODEL-EFFECT-SAME-HANDLE-001"
      - "CASE-P2-TD-OPERATION-PORT-NOT-CALLER-INJECTABLE-001"
      - "CASE-P2-TD-RUNTIME-TARGET-SUBSTITUTION-001"
  -
    id: "IMP-P3-INFORMATION-001"
    sourceRef: "FLOW-P3-INFORMATION-EVALUATION"
    sourceAction: "Compile Information and target facts; hand ordered Action.refRule values to the existing execution chain."
    targetRefs:
      - "XML"
      - "COMP"
      - "CTX"
      - "MODEL"
      - "P2-BINDING"
      - "P4-ACTION"
      - "P5-DIRECTORY"
      - "DIRECTORY"
      - "DEMO"
    policy: "REJECT_OPERATION"
    conditions:
      - "Invalid Information or target facts"
      - "Invalid Directory mapping or rule reference"
      - "Loader or execution failure"
    consistency: "ATOMIC"
    transactionBoundary: "Compilation publishes one candidate atomically; runtime reuses ModelContainer and does not promise distributed atomicity across physical connections."
    idempotency: "No new idempotency contract; compile each mapping once and reuse the registered rule."
    failureHandling: "Reject invalid configuration before publication; on execution failure stop later loaders and preserve the original error through rollback/close/clear."
    compensation: "Discard invalid candidates; reuse existing connection rollback. No external compensation is introduced."
    traceIds:
      - "TR-P3-INFORMATION-ENGINE-001"
    testCaseIds:
      - "CASE-P3-MIX-001"
      - "CASE-P3-ERROR-001"
      - "CASE-P3-CHANGE-INFO-001"
      - "CASE-P3-DIRECTORY-001"
    status: "ACTIVE"
crossModuleImplementations:
  -
    id: "CMI-P2-COMPILE-005"
    name: "CompiledModelSet aggregate publication with typed materialization index"
    trigger: "FLOW-CONFIG-COMPILE"
    participants:
      -
        id: "CMPART-P2-COMPILE-R29-1"
        module: "dec-core-compiler"
        responsibility: "resolve exact target/materialization and coordinate atomic publication"
      -
        id: "CMPART-P2-COMPILE-R29-2"
        module: "dec-core-context"
        responsibility: "own immutable CompiledModelSet aggregate and EngineContext projection"
    steps:
      -
        id: "CMSTEP-P2-COMPILE-R29-01"
        order: 1
        from: "CMPART-P2-COMPILE-R29-1"
        to: "CMPART-P2-COMPILE-R29-2"
        interactionType: "SYNC_API"
        action: "construct complete CompiledViewMaterializationIndex and validate every dynamic target"
        preconditions:
          - "FLOW-R11 compile target resolved"
        postconditions:
          - "complete typed index or compile ERROR"
        idempotency: "deterministic"
        failureHandling: "publication=0"
        compensation: "none"
        traceIds:
          - "TR-P2-005"
          - "TR-P2-006"
      -
        id: "CMSTEP-P2-COMPILE-R29-02"
        order: 2
        from: "CMPART-P2-COMPILE-R29-1"
        to: "CMPART-P2-COMPILE-R29-2"
        interactionType: "COMMAND"
        action: "construct/publish one CompiledModelSet including index in equality/hash/digest"
        preconditions:
          - "candidate complete"
        postconditions:
          - "new complete Context or old unchanged"
        idempotency: "deterministic"
        failureHandling: "retain old Context"
        compensation: "none"
        traceIds:
          - "TR-P2-008"
    successCriteria:
      - "typed index aggregate-owned"
      - "no runtime materialization repair"
      - "atomic Context publication"
    failurePaths:
      -
        id: "CMFAIL-P2-COMPILE-R29-01"
        atStep: "CMSTEP-P2-COMPILE-R29-01"
        condition: "required descriptor absent/duplicate"
        result: "compile ERROR; publication=0"
        compensationSteps: []
        manualRecovery: "fix configuration and submit fresh candidate"
        traceIds:
          - "TR-P2-005"
    traceIds:
      - "TR-P2-005"
      - "TR-P2-006"
      - "TR-P2-008"
    testCaseIds:
      - "CASE-P2-TD-CONTEXT-MATERIALIZATION-INDEX-AGGREGATE-001"
      - "CASE-P2-TD-MATERIALIZATION-PUBLICATION-CLOSURE-001"
    businessFlowRef: "FLOW-CONFIG-COMPILE"
    businessStepRefs:
      - "STEP-P2-COMPILE-02"
      - "STEP-P2-COMPILE-03"
      - "STEP-P2-COMPILE-04"
  -
    id: "CMI-P2-PROTECTED-ACCESS-009"
    name: "Direct MODEL load request plus bound same-target effect under FLOW-R11"
    trigger: "FLOW-PROTECTED-ACCESS-EXECUTE"
    participants:
      -
        id: "CMPART-P2-ACCESS-R29-1"
        module: "dec-core-model"
        responsibility: "trusted production lifecycle forms request, validates captured Context, creates production Container/ModelData/Handle/Scope/Session/EffectProvider and owns actual effect"
      -
        id: "CMPART-P2-ACCESS-R29-2"
        module: "dec-core-starter"
        responsibility: "consume trusted scope, register/seal, bind effect provider, resolve/capability/Guard and invoke bound effect only after ALLOW"
      -
        id: "CMPART-P2-ACCESS-R29-3"
        module: "dec-core-context"
        responsibility: "provide immutable binding/policy/materialization/result contracts"
    steps:
      -
        id: "CMSTEP-P2-ACCESS-R29-00"
        order: 1
        from: "CMPART-P2-ACCESS-R29-1"
        to: "CMPART-P2-ACCESS-R29-1"
        interactionType: "COMMAND"
        action: "MODEL production lifecycle constructs RuntimeModelLoadRequest from exact selected plan + real origin + explicit routing; root validates captured Context, selects exact materialization, creates ModelData, uses existing 3-arg ModelLoader and MODEL-owned production Container, then freezes the same ModelData into trusted handle"
        preconditions:
          - "active root"
          - "captured Context"
          - "MODEL production lifecycle"
        postconditions:
          - "trusted frame precondition available or stable load failure"
        idempotency: "deterministic validation per request; no permission is granted by request possession"
        failureHandling: "load failure; handle/scope/STARTER/Guard/effect=0"
        compensation: "discard unexposed association"
        traceIds:
          - "TR-P2-006"
          - "TR-P2-009"
      -
        id: "CMSTEP-P2-ACCESS-R29-01"
        order: 2
        from: "CMPART-P2-ACCESS-R29-1"
        to: "CMPART-P2-ACCESS-R29-2"
        interactionType: "SYNC_API"
        action: "provide active MODEL-minted scope/frame; STARTER validates every handle plan/provenance against captured Context"
        preconditions:
          - "FLOW trusted-frame precondition established"
        postconditions:
          - "FLOW STEP-01 success or stable composition failure"
        idempotency: "same active scope facts"
        failureHandling: "fail closed"
        compensation: "none"
        traceIds:
          - "TR-P2-006"
      -
        id: "CMSTEP-P2-ACCESS-R29-02"
        order: 3
        from: "CMPART-P2-ACCESS-R29-2"
        to: "CMPART-P2-ACCESS-R29-1"
        interactionType: "SYNC_API"
        action: "begin session, register exact frame handles, seal once, bind scope.effectProvider to that same sealed session, retain operation port privately"
        preconditions:
          - "STEP-01 success"
        postconditions:
          - "sealed session + same-scope effect port or no composition"
        idempotency: "duplicate registration/binding never widens authority"
        failureHandling: "stable session/effect code; capability/Guard/effect=0"
        compensation: "close partial session"
        traceIds:
          - "TR-P2-006"
          - "TR-P2-009"
      -
        id: "CMSTEP-P2-ACCESS-R29-03"
        order: 4
        from: "CMPART-P2-ACCESS-R29-2"
        to: "CMPART-P2-ACCESS-R29-1"
        interactionType: "QUERY"
        action: "resolve exact plan to exactly one object registered in that sealed session"
        preconditions:
          - "composition/effect binding complete"
        postconditions:
          - "one target or 0/N denial"
        idempotency: "deterministic"
        failureHandling: "NOT_FOUND/AMBIGUOUS/PROVENANCE_MISMATCH"
        compensation: "none"
        traceIds:
          - "TR-P2-006"
      -
        id: "CMSTEP-P2-ACCESS-R29-04"
        order: 5
        from: "CMPART-P2-ACCESS-R29-2"
        to: "CMPART-P2-ACCESS-R29-2"
        interactionType: "COMMAND"
        action: "freeze READ access or WRITE intent+stamp and one-shot capability for exact target/path/version"
        preconditions:
          - "one target"
        postconditions:
          - "immutable access/capability"
        idempotency: "one capability identity"
        failureHandling: "intent 0/N fails closed"
        compensation: "none"
        traceIds:
          - "TR-P2-007"
      -
        id: "CMSTEP-P2-ACCESS-R29-05"
        order: 6
        from: "CMPART-P2-ACCESS-R29-2"
        to: "CMPART-P2-ACCESS-R29-3"
        interactionType: "QUERY"
        action: "Guard exact ModelAccessRuleKey for frozen target/proof"
        preconditions:
