schemaVersion: 1
artifact: "business_flow"
flowGroup:
  code: "COMPILER"
  name: "Configuration compilation, model execution and information evaluation"
  description: ""
revision: "FLOW-R06@p3-information-evaluation"
baseRevision: "FLOW-R04@p2-simple-runtime-model"
flows:
  -
    id: "FLOW-CONFIG-COMPILE"
    name: "Configuration candidate compilation and publication"
    level: "L0"
    type: "MAIN"
    ownerModule: "COMPILER"
    participantModules:
      - "CONTEXT"
      - "COMPILER"
      - "XML"
      - "YAML"
      - "STARTER"
    goal: "Parse XML or YAML into an isolated ConfigInfo, compile an immutable EngineContext and install both as one current object; failures keep the previous installed configuration."
    trigger: "starter receives a configuration source to load."
    requirementRefs:
      -
        id: "P1-COMPILER"
        documentRef: "version/V_1.0/doc/P1-COMPILER-F01/requirement.md"
      -
        id: "P2-SYSTEM-RULEVIEW"
        documentRef: "version/V_1.0/doc/FEATURE-DESC-3361AD2E54FC/requirement.md"
    featureRefs:
      -
        id: "P1-COMPILER-F01"
        module: "COMPILER"
      -
        id: "P2-SYSTEM-RULEVIEW-F01"
        module: "COMPILER"
    ruleRefs:
      - "BR-P1-004"
      - "BR-P1-006"
      - "BR-P1-011"
      - "BR-P2-SYSTEM-RULEVIEW-001"
      - "BR-P2-SYSTEM-RULEVIEW-002"
      - "BR-P2-SYSTEM-RULEVIEW-003"
      - "BR-P2-SYSTEM-RULEVIEW-004"
      - "BR-P2-SYSTEM-RULEVIEW-005"
    acceptanceRefs:
      - "AC-P1-COMPILER-001"
      - "AC-P1-COMPILER-002"
      - "AC-P1-COMPILER-003"
      - "AC-P1-COMPILER-004"
      - "AC-P2-SYSTEM-RULEVIEW-001"
      - "AC-P2-SYSTEM-RULEVIEW-002"
      - "AC-P2-SYSTEM-RULEVIEW-003"
      - "AC-P2-SYSTEM-RULEVIEW-004"
    traceIds:
      - "TR-P1-COMPILER-001"
      - "TR-P1-COMPILER-002"
      - "TR-P1-COMPILER-003"
      - "TR-P1-COMPILER-004"
      - "TR-P2-001"
      - "TR-P2-002"
      - "TR-P2-003"
      - "TR-P2-004"
      - "TR-P2-009"
    preconditions:
      - "parser, compiler and publisher are assembled"
      - "the configuration source has a stable location"
    steps:
      -
        id: "STEP-CONFIG-COMPILE-01"
        order: 1
        name: "Create isolated ConfigInfo candidate"
        ownerModule: "COMPILER"
        featureRef: "P2-SYSTEM-RULEVIEW-F01"
        preconditions:
          - "no candidate is active on the current thread"
        postconditions:
          - "an empty per-load ConfigInfo is available"
        notes: "由 COMPILER 的 MixSourceResolver 执行发现；STARTER 只注入 SourceProvider 与根引用。"
      -
        id: "STEP-CONFIG-COMPILE-02"
        order: 2
        name: "Parse XML or YAML into candidate"
        ownerModule: "COMPILER"
        featureRef: "P2-SYSTEM-RULEVIEW-F01"
        preconditions:
          - "candidate and source are available"
        postconditions:
          - "View, Rule, Connection and other definitions belong to the candidate"
          - "the installed ConfigInfo has not changed"
        notes: "由 XML/YAML 前端实现，详细技术 owner 见 CMI-P1-COMPILER-001。"
      -
        id: "STEP-CONFIG-COMPILE-03"
        order: 3
        name: "Compile and publish EngineContext"
        ownerModule: "COMPILER"
        featureRef: "P2-SYSTEM-RULEVIEW-F01"
        preconditions:
          - "candidate parsing completed"
        postconditions:
          - "a valid candidate has the exact published EngineContext"
          - "an invalid candidate has diagnostics and is not installed"
      -
        id: "STEP-CONFIG-COMPILE-04"
        order: 4
        name: "Install whole configuration"
        ownerModule: "COMPILER"
        featureRef: "P2-SYSTEM-RULEVIEW-F01"
        preconditions:
          - "compile and publication succeeded"
        postconditions:
          - "ConfigManager current reference exposes ConfigInfo plus the same EngineContext"
      -
        id: "STEP-CONFIG-COMPILE-05"
        order: 5
        name: "Resolve candidate references"
        ownerModule: "COMPILER"
        featureRef: "P2-SYSTEM-RULEVIEW-F01"
        preconditions:
          - "candidate definitions are registered"
        postconditions:
          - "valid references are ready for immutable compilation"
          - "invalid references produce diagnostics"
      -
        id: "STEP-CONFIG-COMPILE-06"
        order: 6
        name: "Build immutable EngineContext"
        ownerModule: "COMPILER"
        featureRef: "P2-SYSTEM-RULEVIEW-F01"
        preconditions:
          - "candidate validation has no error"
        postconditions:
          - "the exact candidate EngineContext is ready to publish"
      -
        id: "STEP-CONFIG-COMPILE-07"
        order: 7
        name: "Install ConfigInfo and EngineContext"
        ownerModule: "COMPILER"
        featureRef: "P2-SYSTEM-RULEVIEW-F01"
        preconditions:
          - "EngineContext publication succeeded"
        postconditions:
          - "ConfigManager exposes the complete new ConfigInfo"
          - "publication failure leaves the old ConfigInfo unchanged"
        notes: "COMPILER 在 compileAndPublish 内调用 Publisher 一次；STARTER 只返回结果，不二次发布。"
    variants:
      -
        id: "FVAR-CONFIG-FORMAT-XML"
        name: "XML candidate"
        condition: "configuration format is XML"
        differences:
          - "ConfigFileParser.parseInto populates the candidate"
        ruleRefs:
          - "BR-P2-SYSTEM-RULEVIEW-005"
      -
        id: "FVAR-CONFIG-FORMAT-YAML"
        name: "YAML candidate"
        condition: "configuration format is YAML"
        differences:
          - "YamlConfigFileParser.parseInto populates the candidate"
        ruleRefs:
          - "BR-P2-SYSTEM-RULEVIEW-005"
    failurePaths:
      -
        id: "FAIL-CONFIG-COMPILE-001"
        atStep: "STEP-CONFIG-COMPILE-02"
        condition: "文档格式错误、XXE 或不受控 YAML 类型"
        result: "生成 ERROR 并拒绝发布。"
        compensation: "无数据补偿；调用方继续使用原 Context。"
        blocking: true
        acceptanceRefs:
          - "AC-P1-COMPILER-001"
          - "AC-P1-COMPILER-002"
      -
        id: "FAIL-CONFIG-COMPILE-002"
        atStep: "STEP-CONFIG-COMPILE-04"
        condition: "重复强类型 Key"
        result: "记录首次和重复位置，拒绝 Registry 发布。"
        compensation: "丢弃本次 Session 的 Builder。"
        blocking: true
        acceptanceRefs:
          - "AC-P1-COMPILER-002"
          - "AC-P1-COMPILER-003"
      -
        id: "FAIL-CONFIG-COMPILE-003"
        atStep: "STEP-CONFIG-COMPILE-05"
        condition: "未知引用或引用类型错误"
        result: "聚合 Diagnostic，拒绝 Context 发布。"
        compensation: "不修改旧 Context。"
        blocking: true
        acceptanceRefs:
          - "AC-P1-COMPILER-002"
      -
        id: "FAIL-P2-CONFIG-PARSE"
        atStep: "STEP-CONFIG-COMPILE-02"
        condition: "source is missing or malformed"
        result: "candidate is rejected and installed ConfigInfo is unchanged"
        compensation: "discard the candidate"
        blocking: true
        acceptanceRefs:
          - "AC-P2-SYSTEM-RULEVIEW-002"
      -
        id: "FAIL-P2-CONFIG-COMPILE"
        atStep: "STEP-CONFIG-COMPILE-03"
        condition: "candidate contains an invalid definition or reference"
        result: "diagnostics are returned and installed ConfigInfo plus EngineContext remain unchanged"
        compensation: "discard the candidate"
        blocking: true
        acceptanceRefs:
          - "AC-P2-SYSTEM-RULEVIEW-004"
    successCriteria:
      - "XML and YAML obey the same candidate isolation semantics"
      - "ConfigInfo and its exact EngineContext become current together"
      - "failed candidates never partially replace the installed configuration"
    businessModelRefs:
      - "AGG-COMPILATION-SESSION"
    dependencyImpactRefs:
      - "docs/_relations/dependency_impact.yaml#CMI-P1-COMPILER-001"
    designRefs: []
    testCaseIds:
      - "CASE-P1-CANONICAL-001"
      - "CASE-P1-DIAGNOSTIC-001"
      - "CASE-P1-SYMBOL-001"
      - "CASE-P1-CONTEXT-001"
    status: "PROPOSED"
    createdVersion: "V_1.0"
    lastChangedVersion: "FLOW-R04"
    supersedes: []
  -
    id: "FLOW-SIMPLE-MODEL-EXECUTE"
    name: "Simple model rule execution"
    level: "L1"
    type: "MAIN"
    ownerModule: "MODEL"
    participantModules:
      - "COMPILER"
      - "CONTEXT"
      - "MODEL"
      - "DEMO"
    goal: "Create business ModelData, load a named rule and execute it with clear definition failures and reliable connection cleanup."
    trigger: "business code calls DataUtil, ModelLoader and ModelContainer."
    requirementRefs:
      -
        id: "P2-SYSTEM-RULEVIEW"
        documentRef: "version/V_1.0/doc/FEATURE-DESC-3361AD2E54FC/requirement.md"
    featureRefs:
      -
        id: "P2-SYSTEM-RULEVIEW-F03"
        module: "MODEL"
    ruleRefs:
      - "BR-P2-SYSTEM-RULEVIEW-006"
      - "BR-P2-SYSTEM-RULEVIEW-007"
      - "BR-P2-SYSTEM-RULEVIEW-008"
      - "BR-P2-SYSTEM-RULEVIEW-009"
      - "BR-P2-SYSTEM-RULEVIEW-010"
    acceptanceRefs:
      - "AC-P2-SYSTEM-RULEVIEW-005"
      - "AC-P2-SYSTEM-RULEVIEW-006"
      - "AC-P2-SYSTEM-RULEVIEW-007"
      - "AC-P2-SYSTEM-RULEVIEW-008"
    traceIds:
      - "TR-P2-005"
      - "TR-P2-006"
      - "TR-P2-007"
      - "TR-P2-008"
      - "TR-P2-010"
    preconditions:
      - "a compiled ConfigInfo is installed"
      - "requested View, Rule and Connection definitions exist"
    steps:
      -
        id: "STEP-P2-EXECUTE-01"
        order: 1
        name: "Create complete ModelData"
        ownerModule: "MODEL"
        featureRef: "P2-SYSTEM-RULEVIEW-F03"
        preconditions:
          - "requested View exists"
        postconditions:
          - "DataUtil returns mutable business ViewData"
      -
        id: "STEP-P2-EXECUTE-02"
        order: 2
        name: "Load named rule task"
        ownerModule: "MODEL"
        featureRef: "P2-SYSTEM-RULEVIEW-F03"
        preconditions:
          - "requested Rule and Connection exist"
        postconditions:
          - "ModelLoader contains one executable task"
      -
        id: "STEP-P2-EXECUTE-03"
        order: 3
        name: "Execute and finish connections"
        ownerModule: "MODEL"
        featureRef: "P2-SYSTEM-RULEVIEW-F03"
        preconditions:
          - "ModelContainer has loaded tasks"
        postconditions:
          - "success commits participating connections"
          - "failure rolls back participating connections"
          - "all opened connections close"
    variants: []
    failurePaths:
      -
        id: "FAIL-P2-EXECUTE-DEFINITION"
        atStep: "STEP-P2-EXECUTE-01"
        condition: "View, Rule or Connection is absent"
        result: "failure identifies the missing type and name before database side effects"
        compensation: "no database compensation is required"
        blocking: true
        acceptanceRefs:
          - "AC-P2-SYSTEM-RULEVIEW-006"
      -
        id: "FAIL-P2-EXECUTE-RULE"
        atStep: "STEP-P2-EXECUTE-03"
        condition: "rule or database execution fails"
        result: "participating connections roll back and all opened connections close"
        compensation: "ModelContainer performs rollback and close"
        blocking: true
        acceptanceRefs:
          - "AC-P2-SYSTEM-RULEVIEW-007"
    successCriteria:
      - "business callers pass no runtime scope, session, handle, owner identity or capability"
      - "rule names such as save-Order remain valid"
      - "connection commit, rollback and close behavior remains visible"
    status: "PROPOSED"
    createdVersion: "V_1.0"
    lastChangedVersion: "FLOW-R04"
  -
    id: "FLOW-P3-INFORMATION-EVALUATION"
    name: "P3 Information compilation, evaluation and materialization"
    level: "L1"
    type: "MAIN"
    ownerModule: "MODEL"
    participantModules:
      - "COMPILER"
      - "CONTEXT"
      - "MODEL"
      - "XML"
      - "DEMO"
    goal: "Compile and publish immutable Information facts, evaluate them without writes, and optionally materialize one declared change-data value atomically."
    trigger: "A configuration load publishes P3 Information facts, or a caller requests evaluate or materialize for a published InformationKey."
    requirementRefs:
      -
        id: "P3-INFORMATION-ENGINE"
        documentRef: "version/V_1.0/doc/FEATURE-DESC-4AB41AC241A1/requirement.md"
    featureRefs:
      -
        id: "P3-INFORMATION-ENGINE-F01"
        module: "MODEL"
    ruleRefs:
      - "BR-P3-INFORMATION-ENGINE-001"
      - "BR-P3-INFORMATION-ENGINE-002"
      - "BR-P3-INFORMATION-ENGINE-003"
      - "CR-P3-INFORMATION-ENGINE-001"
    acceptanceRefs:
      - "AC-P3-INFORMATION-ENGINE-001"
    traceIds:
      - "TR-P3-INFORMATION-ENGINE-001"
    preconditions:
      - "P1 and P2 published exact System, View, RuleView and model-access binding facts"
      - "mix Information definitions have stable source locations"
    steps:
      -
        id: "STEP-P3-INFORMATION-EVALUATION-COMPILE"
        order: 1
        name: "Compile and publish Information facts"
        ownerModule: "MODEL"
        featureRef: "P3-INFORMATION-ENGINE-F01"
        preconditions:
          - "all P3 Information definitions and P2 exact bindings belong to one Compilation Session"
        postconditions:
          - "the three exclusive Information kinds and their read or write bindings are frozen in CompiledInformationSet"
          - "a cycle, missing reference, invalid path, illegal expression or permission error rejects the complete candidate"
          - "a valid CompiledInformationSet is published atomically with the same EngineContext"
        notes: "MODEL owns the end-to-end P3 feature; COMPILER performs the compilation and publication work mapped by Design."
      -
        id: "STEP-P3-INFORMATION-EVALUATION-IDENTIFY"
        order: 2
        name: "Evaluate Information without writes"
        ownerModule: "MODEL"
        featureRef: "P3-INFORMATION-ENGINE-F01"
        preconditions:
          - "the requested InformationKey and exact read-only binding are published"
        postconditions:
          - "a satisfied condition returns TRUE with read evidence"
          - "a normally unsatisfied condition returns FALSE with read evidence"
          - "evaluate performs no model write and consumes no MutationSet or runtime path resolver"
      -
        id: "STEP-P3-INFORMATION-EVALUATION-MATERIALIZE"
        order: 3
        name: "Optionally materialize declared change-data"
        ownerModule: "MODEL"
        featureRef: "P3-INFORMATION-ENGINE-F01"
        preconditions:
          - "the caller explicitly requested materialize for a model-expression atomic Information"
          - "change-data and exact write permission are present"
        postconditions:
          - "one generated RuleView executes grammer before update"
          - "grammer and update share the same ModelLoader.value"
          - "success commits once, returns MaterializationResult and ends the flow"
          - "success does not invoke evaluate or identify target or downstream Information"
    variants:
      -
        id: "FVAR-P3-INFORMATION-EVALUATION-TRUE"
        name: "Satisfied evaluation"
        condition: "all required read-only conditions are satisfied"
        differences:
          - "STEP-P3-INFORMATION-EVALUATION-IDENTIFY returns TRUE"
          - "materialize is not implied by a TRUE result"
        ruleRefs:
          - "BR-P3-INFORMATION-ENGINE-003"
      -
        id: "FVAR-P3-INFORMATION-EVALUATION-FALSE"
        name: "Normally unsatisfied evaluation"
        condition: "a business condition is not satisfied and no evaluation error occurs"
        differences:
          - "STEP-P3-INFORMATION-EVALUATION-IDENTIFY returns FALSE"
          - "FALSE is never used to represent an invalid path, ordinary null, permission error, expression error or RuleView error"
        ruleRefs:
          - "BR-P3-INFORMATION-ENGINE-002"
      -
        id: "FVAR-P3-INFORMATION-EVALUATION-MATERIALIZE"
        name: "Explicit optional materialization"
        condition: "the caller explicitly invokes materialize for an eligible model-expression atomic Information"
        differences:
          - "STEP-P3-INFORMATION-EVALUATION-MATERIALIZE executes grammer then update in one existing ModelContainer transaction"
          - "the success boundary is commit plus MaterializationResult with no post-commit reevaluation"
        ruleRefs:
          - "BR-P3-INFORMATION-ENGINE-001"
    failurePaths:
      -
        id: "FAIL-P3-INFORMATION-COMPILE"
        atStep: "STEP-P3-INFORMATION-EVALUATION-COMPILE"
        condition: "Information kind, reference, DAG, path, expression or permission validation fails"
        result: "the candidate reports a located ERROR and is not published"
        compensation: "discard the candidate and keep the previously published EngineContext unchanged"
        blocking: true
        acceptanceRefs:
          - "AC-P3-INFORMATION-ENGINE-001"
      -
        id: "FAIL-P3-INFORMATION-EVALUATE"
        atStep: "STEP-P3-INFORMATION-EVALUATION-IDENTIFY"
        condition: "an invalid path, ordinary null, permission failure, expression failure or read-only RuleView failure occurs"
        result: "record ERROR and throw InformationEvaluationException instead of returning FALSE"
        compensation: "no write occurred; do not materialize or continue downstream"
        blocking: true
        acceptanceRefs:
          - "AC-P3-INFORMATION-ENGINE-001"
      -
        id: "FAIL-P3-INFORMATION-MATERIALIZE"
        atStep: "STEP-P3-INFORMATION-EVALUATION-MATERIALIZE"
        condition: "grammer, update, persistence or commit fails"
        result: "ModelContainer rolls back, InformationMaterializationException is thrown and no downstream step runs"
        compensation: "restore the pre-materialization model state through the existing rollback and cleanup lifecycle"
        blocking: true
        acceptanceRefs:
          - "AC-P3-INFORMATION-ENGINE-001"
    successCriteria:
      - "CompiledInformationSet is published atomically with its exact P2 bindings and EngineContext"
      - "read-only evaluate distinguishes TRUE and FALSE from ERROR plus exception"
      - "optional materialize preserves grammer to update order and shared ModelLoader.value"
      - "successful materialization commits and returns MaterializationResult without post-commit reevaluation"
      - "failed materialization rolls back, throws and does not continue downstream"
    businessModelRefs:
      - "AGG-INFORMATION-MODEL"
      - "AGG-INFORMATION-EVALUATION"
      - "INV-P3-REALTIME-READ"
      - "INV-P3-MATERIALIZE"
      - "SM-P3-IDENTIFICATION"
      - "SM-P3-MATERIALIZATION"
    dependencyImpactRefs: []
    designRefs:
      - "DESIGN-P3-R06"
    testCaseIds:
      - "CASE-P3-MIX-001"
      - "CASE-P3-ERROR-001"
      - "CASE-P3-MATERIALIZE-001"
    status: "PROPOSED"
    createdVersion: "V_1.0"
    lastChangedVersion: "FLOW-R06"
