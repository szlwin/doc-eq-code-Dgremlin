schemaVersion: 1
artifact: "business_flow"
flowGroup:
  code: "COMPILER"
  name: "配置编译与上下文发布"
  description: "描述配置源从发现、前端解析、编译校验到不可变 EngineContext 发布的端到端技术平台流程。"
revision: "FLOW-R01@p1-analysis"
baseRevision: ""
flows:
  -
    id: "FLOW-CONFIG-COMPILE"
    name: "配置编译与上下文发布"
    level: "L0"
    type: "MAIN"
    ownerModule: "COMPILER"
    participantModules:
      - "CONTEXT"
      - "COMPILER"
      - "XML"
      - "YAML"
      - "STARTER"
      - "DEMO"
    goal: "把 XML/YAML 文档集合确定性编译为可发布的不可变 EngineContext，失败时保持既有 Context 不变。"
    trigger: "starter 或测试调用者提交 DocumentSource 集合。"
    requirementRefs:
      -
        id: "P1-COMPILER"
        documentRef: "version/V_1.0/doc/P1-COMPILER-F01/requirement.md"
    featureRefs:
      -
        id: "P1-COMPILER-F01"
        module: "COMPILER"
    ruleRefs:
      - "BR-P1-004"
      - "BR-P1-006"
      - "BR-P1-011"
    acceptanceRefs:
      - "AC-P1-COMPILER-001"
      - "AC-P1-COMPILER-002"
      - "AC-P1-COMPILER-003"
      - "AC-P1-COMPILER-004"
    traceIds:
      - "TR-P1-COMPILER-001"
      - "TR-P1-COMPILER-002"
      - "TR-P1-COMPILER-003"
      - "TR-P1-COMPILER-004"
    preconditions:
      - "DocumentFrontend 与编译选项已装配；输入源具有稳定 sourceId。"
    steps:
      -
        id: "STEP-CONFIG-COMPILE-01"
        order: 1
        name: "发现并排序文档源"
        ownerModule: "COMPILER"
        featureRef: "P1-COMPILER-F01"
        preconditions:
          - "调用方提供显式根路径或资源集合。"
        postconditions:
          - "得到按 sourceId 稳定排序的 DocumentSource 集合。"
        notes: "由 STARTER 模块实现发现和装配，业务流程 owner 仍为 COMPILER。"
      -
        id: "STEP-CONFIG-COMPILE-02"
        order: 2
        name: "前端解析为 Canonical 节点"
        ownerModule: "COMPILER"
        featureRef: "P1-COMPILER-F01"
        preconditions:
          - "每个源的格式可识别。"
        postconditions:
          - "得到有序 CanonicalDocumentNode 或格式 Diagnostic。"
        notes: "由 XML/YAML 前端实现，详细技术 owner 见 CMI-P1-COMPILER-001。"
      -
        id: "STEP-CONFIG-COMPILE-03"
        order: 3
        name: "构建 Raw AST 并结构校验"
        ownerModule: "COMPILER"
        featureRef: "P1-COMPILER-F01"
        preconditions:
          - "Canonical 节点可用。"
        postconditions:
          - "Raw 声明保留来源、顺序和未解析引用。"
      -
        id: "STEP-CONFIG-COMPILE-04"
        order: 4
        name: "注册强类型符号"
        ownerModule: "COMPILER"
        featureRef: "P1-COMPILER-F01"
        preconditions:
          - "结构满足最小声明约束。"
        postconditions:
          - "重复定义被诊断，合法符号进入构建期 SymbolTable。"
      -
        id: "STEP-CONFIG-COMPILE-05"
        order: 5
        name: "解析引用并准备图"
        ownerModule: "COMPILER"
        featureRef: "P1-COMPILER-F01"
        preconditions:
          - "全部符号完成注册。"
        postconditions:
          - "合法引用解析为强类型对象，未知/类型错形成 Diagnostic。"
      -
        id: "STEP-CONFIG-COMPILE-06"
        order: 6
        name: "执行语义校验并生成摘要"
        ownerModule: "COMPILER"
        featureRef: "P1-COMPILER-F01"
        preconditions:
          - "可解析引用已完成。"
        postconditions:
          - "Diagnostics 稳定排序，计算 source/semantic digest。"
      -
        id: "STEP-CONFIG-COMPILE-07"
        order: 7
        name: "发布或拒绝 EngineContext"
        ownerModule: "COMPILER"
        featureRef: "P1-COMPILER-F01"
        preconditions:
          - "编译结果已形成。"
        postconditions:
          - "无 ERROR 时返回不可变 Context；有 ERROR 时保持现有 Context 不变。"
        notes: "由 STARTER 返回结果，发布决策属于 COMPILER 契约。"
    variants:
      -
        id: "FVAR-CONFIG-FORMAT-XML"
        name: "XML 前端"
        condition: "DocumentFormat=XML"
        differences:
          - "使用安全 XML 解析并捕获行列位置。"
        ruleRefs:
          - "BR-P1-001"
      -
        id: "FVAR-CONFIG-FORMAT-YAML"
        name: "YAML 前端"
        condition: "DocumentFormat=YAML"
        differences:
          - "使用受控 YAML Node 并捕获 Mark；P1 仅最小等价路径。"
        ruleRefs:
          - "BR-P1-001"
    failurePaths:
      -
        id: "FAIL-CONFIG-COMPILE-001"
        atStep: "STEP-CONFIG-COMPILE-02"
        condition: "文档格式错误、XXE 或不受控 YAML 类型"
        result: "生成 ERROR 并拒绝发布。"
        compensation: "无数据补偿；调用方继续使用原 Context。"
        blocking: true
        acceptanceRefs:
          - "AC-P1-COMPILER-001"
          - "AC-P1-COMPILER-002"
      -
        id: "FAIL-CONFIG-COMPILE-002"
        atStep: "STEP-CONFIG-COMPILE-04"
        condition: "重复强类型 Key"
        result: "记录首次和重复位置，拒绝 Registry 发布。"
        compensation: "丢弃本次 Session 的 Builder。"
        blocking: true
        acceptanceRefs:
          - "AC-P1-COMPILER-002"
          - "AC-P1-COMPILER-003"
      -
        id: "FAIL-CONFIG-COMPILE-003"
        atStep: "STEP-CONFIG-COMPILE-05"
        condition: "未知引用或引用类型错误"
        result: "聚合 Diagnostic，拒绝 Context 发布。"
        compensation: "不修改旧 Context。"
        blocking: true
        acceptanceRefs:
          - "AC-P1-COMPILER-002"
    successCriteria:
      - "Data/View/Rule 进入不可变 Registry。"
      - "两个 Context 可同时存在且无污染。"
      - "语义 digest 与诊断顺序可重复。"
    businessModelRefs:
      - "AGG-COMPILATION-SESSION"
    dependencyImpactRefs:
      - "docs/_relations/dependency_impact.yaml#CMI-P1-COMPILER-001"
    designRefs: []
    testCaseIds:
      - "CASE-P1-CANONICAL-001"
      - "CASE-P1-DIAGNOSTIC-001"
      - "CASE-P1-SYMBOL-001"
      - "CASE-P1-CONTEXT-001"
    status: "ACTIVE"
    createdVersion: "V_1.0"
    lastChangedVersion: "V_1.0"
    supersedes: []
