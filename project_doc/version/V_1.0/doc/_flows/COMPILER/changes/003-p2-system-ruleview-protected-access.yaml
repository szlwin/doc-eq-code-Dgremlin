      downstreamTestTraceRefs: [CASE-P2-TD-REVISION-DAG-001, CASE-P2-TD-TARGETKEY-SOURCE-MAPPING-001, CASE-P2-TD-POLICY-CLASSIFICATION-TRUTH-TABLE-001]
  - op: upsert
    flow:
      id: FLOW-PROTECTED-ACCESS-EXECUTE
      name: Production representative protected READ WRITE through one runtime authority seam
      kind: RUNTIME_PROTECTED_ACCESS
      acceptanceCriteria: [AC-P2-SYSTEM-RULEVIEW-004:READ_WRITE_RUNTIME, AC-P2-SYSTEM-RULEVIEW-006, AC-P2-SYSTEM-RULEVIEW-007:OPTION_B_ACTIVE, AC-P2-SYSTEM-RULEVIEW-009:runtime]
      steps:
        - id: CMSTEP-P2-ACCESS-00
          action: starter production root binds current immutable EngineContext and creates one ProtectedAccessComposition
        - id: CMSTEP-P2-ACCESS-01
          action: composition exposes same Bridge plus Rule Change CustomAction entries; Bridge implements neutral dec-core-context ProtectedAccessPort
        - id: CMSTEP-P2-ACCESS-02
          action: entry/direct caller submits exact ruleKey READ-or-WRITE frame owner cursor through neutral port/Bridge
        - id: CMSTEP-P2-ACCESS-03
          action: starter resolves exact actual target and current execution operation state; caller cannot inject operation callback
        - id: CMSTEP-P2-ACCESS-04
          action: starter mints one-shot capability bound to invocation TargetKey RuntimeObjectId ModelPath READ-or-WRITE and internal write intent when WRITE
        - id: CMSTEP-P2-ACCESS-05
          action: Gateway atomically consumes capability ISSUED-to-CONSUMED
        - id: CMSTEP-P2-ACCESS-06
          action: Guard performs exact current PolicyIndex lookup and, only for runtime-required truth-table row, validates exact RuntimeBindingPlan proof
        - id: CMSTEP-P2-ACCESS-07
          action: ALLOW dispatches capability-bound internal operation port; READ returns real immutable value snapshot without mutation; WRITE applies exactly one resolved mutation and returns write receipt
        - id: CMSTEP-P2-ACCESS-08
          action: DENY stops before operation port/effect and returns deterministic non-sensitive denial
      downstreamDependencyBoundary:
        neutralModule: dec-core-context
        neutralContract: ProtectedAccessPort
        starterImplementation: ProtectedExecutionBridge
        futureCoreModules: [P3, P4, P6]
        forbidden: core-to-dec-core-starter dependency
      failureSemantics:
        - policy_not_found: DENY before operation/effects
        - invalid_policy_classification: never published; fail closed if encountered
        - runtime_binding_stale_or_mismatch: DENY before operation/effects
        - target_or_operation_substitution: DENY before operation/effects
        - guard_unavailable: DENY before operation/effects
        - capability_already_consumed: deterministic DENY; operation=0; effects=0
      downstreamDesignTraceRefs: [COMPILER_design.md#p2-neutral-runtime-port, COMPILER_design.md#p2-production-composition, COMPILER_design.md#p2-operation-binding, COMPILER_design.md#p2-concurrency]
