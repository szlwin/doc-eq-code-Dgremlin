  - op: upsert
    flow:
      id: FLOW-PROTECTED-ACCESS-EXECUTE
      name: Production representative protected access through one runtime authority seam
      kind: RUNTIME_PROTECTED_ACCESS
      acceptanceCriteria:
        - AC-P2-SYSTEM-RULEVIEW-004:READ_WRITE_RUNTIME
        - AC-P2-SYSTEM-RULEVIEW-006
        - AC-P2-SYSTEM-RULEVIEW-007:OPTION_B_ACTIVE
        - AC-P2-SYSTEM-RULEVIEW-009:runtime
      steps:
        - id: CMSTEP-P2-ACCESS-00
          action: starter production composition root owns ProtectedAccessRuntimeFactory and binds one current immutable EngineContext
        - id: CMSTEP-P2-ACCESS-01
          action: factory produces ProtectedAccessComposition exposing one bridge plus Rule Change CustomAction entries all bound to the same bridge and context
        - id: CMSTEP-P2-ACCESS-02
          action: representative entry or direct caller invokes ProtectedExecutionBridge with exact ruleKey READ-or-WRITE and current frame owner cursor
        - id: CMSTEP-P2-ACCESS-03
          action: starter creates internal unique invocation identity and resolves exact actual target
        - id: CMSTEP-P2-ACCESS-04
          action: starter mints internal one-shot capability bound to invocation actual target and READ-or-WRITE operation
        - id: CMSTEP-P2-ACCESS-05
          action: Gateway atomically consumes capability ISSUED-to-CONSUMED; only the winning consume can continue
        - id: CMSTEP-P2-ACCESS-06
          action: Guard performs exact current-context PolicyIndex lookup and required runtime proof
        - id: CMSTEP-P2-ACCESS-07
          action: ALLOW executes only capability-bound target operation; DENY including CAPABILITY_ALREADY_CONSUMED occurs before effects
      failureSemantics:
        - policy_not_found: DENY before operation/effects
        - operation_mismatch: DENY before operation/effects
        - runtime_binding_stale: DENY before operation/effects
        - target_substitution: DENY before operation/effects
        - guard_unavailable: DENY before operation/effects
        - capability_already_consumed: deterministic DENY; operation=0; effects=0
      representativeConsumers:
        acquisition: ProtectedAccessRuntimeFactory -> ProtectedAccessComposition
        requiredEntries: [RuleProtectedAccessEntry, ChangeProtectedAccessEntry, CustomActionProtectedAccessEntry]
        sameBridgeRequired: true
        manualTestConstructionNotClosureEvidence: true
        forbiddenConsumerAuthorities: [Gateway, Guard, targetResolver, rawOperationPort, mutableOrSecondaryPolicyIndex, issuedPairMint, capabilityMint]
      businessModelRefs: [POL-MODEL-ACCESS-AUTHORIZATION, ENT-PROTECTED-ACCESS-COMPOSITION, INV-COMPILER-020, INV-COMPILER-020A, INV-COMPILER-021]
