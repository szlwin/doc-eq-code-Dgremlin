      entryCategories:
        - RULE
        - CHANGE
        - CUSTOM_ACTION
      steps:
        - id: CMSTEP-P2-ACCESS-00
          action: one real main-source RuleProtectedAccessEntry, ChangeProtectedAccessEntry or CustomActionProtectedAccessEntry receives an immutable ProtectedAccessInvocation; consumer category is provenance only
        - id: CMSTEP-P2-ACCESS-01
          action: representative entry forwards exact compiler-published ruleKey/operation and current frame/owner/cursor to its bound public ProtectedExecutionBridge
        - id: CMSTEP-P2-ACCESS-02
          action: starter creates internal issued invocation; no public issued-pair/capability mint
        - id: CMSTEP-P2-ACCESS-03
          action: resolver binds exact actual target and operation into a one-shot capability
        - id: CMSTEP-P2-ACCESS-04
          action: ProtectedAccessGateway invokes ModelAccessGuard
        - id: CMSTEP-P2-ACCESS-05
          action: Guard performs exactly one current-context ModelAccessPolicyIndex lookup and required runtime proof
        - id: CMSTEP-P2-ACCESS-06
          action: ALLOW executes only capability-bound target/operation; DENY returns stable provenance before side effects
      consumerDependencyInvariant:
        allowedProtectedAuthorityDependency: ProtectedExecutionBridge
        forbiddenDependencies: [ProtectedAccessGateway, ModelAccessGuard, targetResolver, rawOperationPort, mutableOrSecondaryPolicyIndex, issuedPairMint, capabilityMint]
      parityInvariant: same Context plus exact ProtectedAccessInvocation plus same runtime facts produces the same authorization classification across RULE CHANGE CUSTOM_ACTION; consumer category cannot alter policy key or Guard semantics
      failureSemantics:
        - policy_not_found: DENY before operation/effects
        - operation_mismatch: DENY before operation/effects
        - runtime_binding_stale: DENY before operation/effects
        - runtime_plan_mismatch: DENY before operation/effects
        - target_substitution: DENY before operation/effects
        - guard_unavailable: DENY before operation/effects
