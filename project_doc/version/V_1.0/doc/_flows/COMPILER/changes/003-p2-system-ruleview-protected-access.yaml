  - op: upsert
    flow:
      id: FLOW-PROTECTED-ACCESS-EXECUTE
      name: Representative production consumers execute protected model access through the single runtime authority path
      kind: RUNTIME_PROTECTED_ACCESS
      acceptanceCriteria:
        - AC-P2-SYSTEM-RULEVIEW-004:runtime
        - AC-P2-SYSTEM-RULEVIEW-006
        - AC-P2-SYSTEM-RULEVIEW-007:OPTION_B_ACTIVE
