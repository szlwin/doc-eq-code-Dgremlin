schemaVersion: 1
artifact: business_flow_changeset
changeSet:
  id: FLOW-CHG-P2-R08
  version: V_1.0
  module: COMPILER
  flowGroup: COMPILER
  flowGroupName: P2 System RuleView protected access
  reason: 'PR36 independent Review remediation: restore common-develop 2.44 changeset
    structure, preserve P1 shared source View identity, freeze write-intent selection
    and real production model operation path.'
  baseRevision: FLOW-R07@p2-system-ruleview-protected-access
  resultRevision: FLOW-R08@p2-system-ruleview-protected-access
  affectedTraceIds:
  - TR-P2-004
  - TR-P2-005
  - TR-P2-006
  - TR-P2-007
  - TR-P2-008
  - TR-P2-009
operations:
- operation: update
  targetId: FLOW-CONFIG-COMPILE
  reason: Make source identity P1-compatible and schema-native.
  after:
    id: FLOW-CONFIG-COMPILE
    name: P2 deterministic System/RuleView/model-access compilation and atomic publication
    level: L1
    type: MAIN
    ownerModule: COMPILER
    participantModules:
    - COMPILER
    - CONTEXT
    - STARTER
    goal: Compile P1-compatible shared source View identity, exact ModelPath and READ/WRITE
      policy facts into one immutable EngineContext publication.
    trigger: P2 configuration compilation starts for the current source set.
    requirementRefs:
    - id: REQAN-P2-R01@d08612768131
      documentRef: version/V_1.0/doc/FEATURE-DESC-3361AD2E54FC/requirement.md
    featureRefs:
    - id: FEATURE-DESC-3361AD2E54FC
      module: COMPILER
    ruleRefs:
    - INV-COMPILER-025
    - INV-COMPILER-026
    - INV-COMPILER-029
    acceptanceRefs:
    - AC-P2-SYSTEM-RULEVIEW-001
    - AC-P2-SYSTEM-RULEVIEW-002
    - AC-P2-SYSTEM-RULEVIEW-003
    - AC-P2-SYSTEM-RULEVIEW-004
    - AC-P2-SYSTEM-RULEVIEW-005
    - AC-P2-SYSTEM-RULEVIEW-008
    - AC-P2-SYSTEM-RULEVIEW-009
    - AC-P2-SYSTEM-RULEVIEW-010
    traceIds:
    - TR-P2-001
    - TR-P2-002
    - TR-P2-003
    - TR-P2-004
    - TR-P2-005
    - TR-P2-006
    - TR-P2-008
    - TR-P2-009
    - TR-P2-010
    preconditions:
    - Overlay R04 decisions are active.
    - BM-R18 is the current upstream business model candidate.
    steps:
    - id: STEP-P2-COMPILE-01
      order: 1
      name: Register System and shared source View symbols
      ownerModule: COMPILER
      featureRef: FEATURE-DESC-3361AD2E54FC
      preconditions: []
      postconditions:
      - SystemKey symbols and existing shared ViewKey namespace are available.
    - id: STEP-P2-COMPILE-02
      order: 2
      name: Resolve RuleView ownership and sourceModel ViewKey
      ownerModule: COMPILER
      featureRef: FEATURE-DESC-3361AD2E54FC
      preconditions:
      - STEP-P2-COMPILE-01 complete
      postconditions:
      - sourceModel resolves through shared ViewKey namespace; local targetView membership
        is checked separately.
    - id: STEP-P2-COMPILE-03
      order: 3
      name: Compile independent TargetKey and ModelPath
      ownerModule: COMPILER
      featureRef: FEATURE-DESC-3361AD2E54FC
      preconditions:
      - source ViewKey exists
      postconditions:
      - TargetKey(ViewKey) and exact ModelPath are frozen independently.
    - id: STEP-P2-COMPILE-04
      order: 4
      name: Classify READ/WRITE policy
      ownerModule: COMPILER
      featureRef: FEATURE-DESC-3361AD2E54FC
      preconditions:
      - TargetKey and ModelPath exact
      postconditions:
      - Only legal two-row policy classification remains.
    - id: STEP-P2-COMPILE-05
      order: 5
      name: Build and revalidate immutable PolicyIndex
      ownerModule: CONTEXT
      featureRef: FEATURE-DESC-3361AD2E54FC
      preconditions:
      - All rules pass classification validation
      postconditions:
      - PolicyIndex contains exact authorization owner System + TargetKey + ModelPath
        + READ/WRITE facts.
    - id: STEP-P2-COMPILE-06
      order: 6
      name: Atomically publish EngineContext
      ownerModule: COMPILER
      featureRef: FEATURE-DESC-3361AD2E54FC
      preconditions:
      - PolicyIndex and ownership/version/digest closure valid
      postconditions:
      - New immutable Context published atomically or old Context retained.
    variants: []
    failurePaths:
    - id: FAIL-P2-COMPILE-SOURCE-001
      atStep: STEP-P2-COMPILE-02
      condition: sourceModel shared ViewKey is missing or ambiguous
      result: stable compile ERROR; publication=0
      blocking: true
      acceptanceRefs:
      - AC-P2-SYSTEM-RULEVIEW-005
    - id: FAIL-P2-COMPILE-POLICY-001
      atStep: STEP-P2-COMPILE-04
      condition: policy classification tuple is illegal
      result: stable compile ERROR; publication=0
      blocking: true
      acceptanceRefs:
      - AC-P2-SYSTEM-RULEVIEW-004
    successCriteria:
    - Source identity preserves P1 shared ViewKey semantics.
    - No EXECUTE fact is published.
    - PolicyIndex is immutable and sole runtime permission authority.
    - Publication is atomic.
    businessModelRefs:
    - BM-R18
    dependencyImpactRefs:
    - P2-IMPACT-R20
    designRefs:
    - DESIGN-P2-R20
    testCaseIds:
    - CASE-P2-TD-TARGETKEY-SOURCE-MAPPING-001
    - CASE-P2-TD-POLICY-CLASSIFICATION-TRUTH-TABLE-001
    status: PROPOSED
    createdVersion: V_1.0
    lastChangedVersion: FLOW-R08
    supersedes:
    - FLOW-R07
- operation: update
  targetId: FLOW-PROTECTED-ACCESS-EXECUTE
  reason: Freeze 0/1/N write intent and production dec-core-model operation path.
  after:
    id: FLOW-PROTECTED-ACCESS-EXECUTE
    name: Production protected READ/WRITE through one authority seam
    level: L1
    type: MAIN
    ownerModule: STARTER
    participantModules:
    - CONTEXT
    - STARTER
    - MODEL
    goal: Authorize and execute one real capability-bound runtime READ or WRITE with
      deterministic write-intent selection and no bypass.
    trigger: Rule/Change/CustomAction representative entry or direct neutral-port
      caller requests protected access.
    requirementRefs:
    - id: REQAN-P2-R01@d08612768131
      documentRef: version/V_1.0/doc/FEATURE-DESC-3361AD2E54FC/requirement.md
    featureRefs:
    - id: FEATURE-DESC-3361AD2E54FC
      module: COMPILER
    ruleRefs:
    - INV-COMPILER-027
    - INV-COMPILER-028
    - INV-COMPILER-030
    - INV-COMPILER-031
    acceptanceRefs:
    - AC-P2-SYSTEM-RULEVIEW-004
    - AC-P2-SYSTEM-RULEVIEW-006
    - AC-P2-SYSTEM-RULEVIEW-007
    - AC-P2-SYSTEM-RULEVIEW-009
    traceIds:
    - TR-P2-004
    - TR-P2-006
    - TR-P2-007
    - TR-P2-009
    preconditions:
    - Production ProtectedAccessComposition is bound to one immutable EngineContext.
    steps:
    - id: STEP-P2-ACCESS-01
      order: 1
      name: Submit neutral protected invocation
      ownerModule: STARTER
      featureRef: FEATURE-DESC-3361AD2E54FC
      preconditions: []
      postconditions:
      - Bridge receives exact rule/op/frame/owner/cursor facts without caller operation
        callback.
    - id: STEP-P2-ACCESS-02
      order: 2
      name: Resolve runtime target and WRITE intent
      ownerModule: STARTER
      featureRef: FEATURE-DESC-3361AD2E54FC
      preconditions:
      - Invocation is valid
      postconditions:
      - READ has exact target/path; WRITE has exactly one immutable frozen intent
        or deterministic denial.
    - id: STEP-P2-ACCESS-03
      order: 3
      name: Mint and atomically consume one-shot capability
      ownerModule: STARTER
      featureRef: FEATURE-DESC-3361AD2E54FC
      preconditions:
      - ResolvedProtectedAccess is immutable
      postconditions:
      - At most one execution attempt can proceed.
    - id: STEP-P2-ACCESS-04
      order: 4
      name: Guard exact current PolicyIndex facts
      ownerModule: STARTER
      featureRef: FEATURE-DESC-3361AD2E54FC
      preconditions:
      - Capability consumed once
      postconditions:
      - ALLOW or deterministic non-sensitive DENY; no operation yet.
    - id: STEP-P2-ACCESS-05
      order: 5
      name: Execute real runtime model operation
      ownerModule: MODEL
      featureRef: FEATURE-DESC-3361AD2E54FC
      preconditions:
      - Guard ALLOW
      postconditions:
      - READ returns deep immutable RuntimeFactValue snapshot or WRITE applies frozen
        intent exactly once and returns receipt.
    variants: []
    failurePaths:
    - id: FAIL-P2-ACCESS-INTENT-001
      atStep: STEP-P2-ACCESS-02
      condition: WRITE candidate count is zero
      result: WRITE_INTENT_NOT_FOUND; Guard=0; operation=0
      blocking: true
      acceptanceRefs:
      - AC-P2-SYSTEM-RULEVIEW-006
    - id: FAIL-P2-ACCESS-INTENT-002
      atStep: STEP-P2-ACCESS-02
      condition: WRITE candidate count is greater than one
      result: WRITE_INTENT_AMBIGUOUS; Guard=0; operation=0
      blocking: true
      acceptanceRefs:
      - AC-P2-SYSTEM-RULEVIEW-006
    - id: FAIL-P2-ACCESS-GUARD-001
      atStep: STEP-P2-ACCESS-04
      condition: policy/proof mismatch, stale binding or Guard unavailable
      result: DENY before operation; no value/receipt/effect
      blocking: true
      acceptanceRefs:
      - AC-P2-SYSTEM-RULEVIEW-004
      - AC-P2-SYSTEM-RULEVIEW-009
    successCriteria:
    - READ returns real immutable value without mutation.
    - WRITE performs one real dec-core-model mutation from the frozen intent.
    - Caller cannot inject operation implementation or change target/path/intent after
      Guard.
    businessModelRefs:
    - BM-R18
    dependencyImpactRefs:
    - P2-IMPACT-R20
    designRefs:
    - DESIGN-P2-R20
    testCaseIds:
    - CASE-P2-TD-REAL-READ-OPERATION-001
    - CASE-P2-TD-REAL-WRITE-OPERATION-001
    - CASE-P2-TD-PRODUCTION-MODEL-ADAPTER-REACHABILITY-001
    status: PROPOSED
    createdVersion: V_1.0
    lastChangedVersion: FLOW-R08
    supersedes:
    - FLOW-R07
