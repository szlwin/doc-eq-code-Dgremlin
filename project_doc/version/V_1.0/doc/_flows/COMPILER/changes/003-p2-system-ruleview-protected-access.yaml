    flow:
      id: FLOW-CONFIG-COMPILE
      name: Deterministic System RuleView Target ModelPath Policy compilation and atomic publication
      kind: COMPILE_PUBLICATION
      acceptanceCriteria: [AC-P2-SYSTEM-RULEVIEW-001, AC-P2-SYSTEM-RULEVIEW-002, AC-P2-SYSTEM-RULEVIEW-003, AC-P2-SYSTEM-RULEVIEW-004:READ_WRITE_ONLY, AC-P2-SYSTEM-RULEVIEW-005, AC-P2-SYSTEM-RULEVIEW-008, AC-P2-SYSTEM-RULEVIEW-009:compile, AC-P2-SYSTEM-RULEVIEW-010]
      steps:
        - id: CMSTEP-P2-COMPILE-01
          action: discover System sources and register canonical owner SystemKey symbols
        - id: CMSTEP-P2-COMPILE-02
          action: exact-resolve RuleView View Rule and other owner-qualified definitions
        - id: CMSTEP-P2-COMPILE-03
          action: exact-resolve each model-access sourceModel in its owner System and freeze one TargetKey(ownerSystemKey,canonicalSourceModelName)
        - id: CMSTEP-P2-COMPILE-04
          action: compile sourcePath independently through shared ModelPathCompiler; finite-expand legal wildcard before policy facts
        - id: CMSTEP-P2-COMPILE-05
          action: map AccessMode READ/WRITE one-way to AccessOperation READ/WRITE; no EXECUTE exists
        - id: CMSTEP-P2-COMPILE-06
          action: classify each exact rule into the frozen PolicyStatus x RuntimeAccessRequirement x RuntimeBindingPlan truth table
        - id: CMSTEP-P2-COMPILE-07
          action: for runtime-required rules freeze RuntimeBindingPlan(targetView,selector,resolved TargetKey,ModelPath,SourceRef); plan cannot reselect authority facts
        - id: CMSTEP-P2-COMPILE-08
          action: validate/build immutable ModelAccessPolicyIndex before collapse/publication
        - id: CMSTEP-P2-COMPILE-09
          action: derive System ownership/version and freeze same facts into SemanticDigestInput
        - id: CMSTEP-P2-COMPILE-10
          action: atomically publish CompiledModelSet EngineContext or preserve old Context on any ERROR
      failureSemantics:
        - unknown_or_ambiguous_source_model: stable ERROR; publication=0
        - cross_system_target_resolution: stable ERROR; publication=0
        - invalid_path_or_runtime_wildcard: stable ERROR; publication=0
        - invalid_read_write_operation: stable ERROR; publication=0
        - invalid_policy_truth_table_row: stable ERROR; publication=0
        - ownership_or_reference_mismatch: stable ERROR; publication=0
      businessModelRefs: [TERM-TARGET-KEY, VO-TARGET-KEY, VO-MODEL-PATH, VO-ACCESS-OPERATION, INV-COMPILER-024, INV-COMPILER-025, INV-COMPILER-026]
