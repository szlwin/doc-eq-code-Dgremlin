schemaVersion: 1
artifact: "business_model"
module:
  code: "COMPILER"
  name: "dec-core-compiler"
revision: "BM-R05@4ecb1f8c09f4"
baseRevision: "BM-R00@init"
terms:
  -
    id: "TERM-COMPILATION-SESSION"
    name: "CompilationSession"
    definition: "一次根 Source、编译选项、构建期 Registry、Diagnostic 与结果的隔离编译会话；只在构建期间可变。"
    forbiddenSynonyms:
      - "global current compiler"
      - "shared mutable compiler"
    sourceRefs:
      - "REQAN-R05@7de35e8dc15b"
  -
    id: "TERM-RAW-DEFINITION"
    name: "RawDefinition"
    definition: "从 CanonicalDocumentNode 构建、保留 SourceRef 且尚未执行后续阶段运行语义的格式中立定义。"
    forbiddenSynonyms:
      - "DOM definition"
      - "runtime object"
    sourceRefs:
      - "BR-P1-004"
      - "BR-P1-007"
  -
    id: "TERM-TYPED-KEY"
    name: "TypedKey"
    definition: "由定义类型及其命名空间组成的强类型身份；不同定义类型不得共用字符串命名空间。"
    forbiddenSynonyms:
      - "string id"
      - "global name"
    sourceRefs:
      - "BR-P1-005"
      - "BR-P1-006"
  -
    id: "TERM-INFORMATION-OWNER"
    name: "System-owned Information"
    definition: "InformationKey 由 SystemKey 与局部名称组成；BusinessScope 只消费限定引用，不拥有 Information。"
    forbiddenSynonyms:
      - "BusinessScope information"
      - "scope-owned information"
    sourceRefs:
      - "BR-P1-006"
      - "BR-P1-016"
  -
    id: "TERM-COMMON-SYSTEM"
    name: "common System"
    definition: "只拥有跨 System expression Information 的特殊 System；不拥有 Data、View、RuleView、ModelAccess 或运行时编排。"
    forbiddenSynonyms:
      - "global system"
      - "shared runtime"
    sourceRefs:
      - "BR-P1-016"
      - "BR-P1-019"
  -
    id: "TERM-MODEL-ACCESS-BINDING"
    name: "ModelAccessBinding"
    definition: "共享模型源路径与当前 System 本地 View 目标选择器之间的显式一对多绑定。"
    forbiddenSynonyms:
      - "name inference"
      - "implicit view mapping"
    sourceRefs:
      - "BR-P1-018"
      - "BR-P1-020"
  -
    id: "TERM-TARGET-MAIN"
    name: "target-main"
    definition: "View 根目标选择器；ref@property 必须先对其做区分大小写的完整匹配。"
    forbiddenSynonyms:
      - "root-property"
      - "fuzzy root alias"
    sourceRefs:
      - "BR-P1-020"
  -
    id: "TERM-DEFERRED-DEFINITION"
    name: "DeferredDefinition"
    definition: "P1 已完成结构和 Key 解析、但明确交由 P2～P8 执行的语义登记。"
    forbiddenSynonyms:
      - "ignored definition"
      - "partially compiled runtime"
    sourceRefs:
      - "BR-P1-007"
      - "BR-P1-008"
  -
    id: "TERM-COMPILED-MODEL-SET"
    name: "CompiledModelSet"
    definition: "无 ERROR 后一次性构造并冻结的全部编译事实集合。"
    forbiddenSynonyms:
      - "mutable config registry"
    sourceRefs:
      - "BR-P1-009"
      - "BR-P1-011"
  -
    id: "TERM-ENGINE-CONTEXT"
    name: "EngineContext"
    definition: "实例级不可变运行时读取入口；不同 Context 不共享可变 Registry，且不存在全局 current。"
    forbiddenSynonyms:
      - "singleton context"
      - "global current context"
    sourceRefs:
      - "BR-P1-011"
  -
    id: "TERM-DIAGNOSTIC"
    name: "Diagnostic"
    definition: "包含稳定 code、severity、SourceRef、definitionKey、relatedRefs、pass 与 recoveryHint 的可排序失败事实。"
    forbiddenSynonyms:
      - "generic exception"
      - "operation failed"
    sourceRefs:
      - "EX-P1-COMPILER-001"
      - "NFR-AUDIT"
  -
    id: "TERM-SOURCE-REF"
    name: "SourceRef"
    definition: "规范化 sourceId、行、列和节点路径组成的不可变来源位置。"
    forbiddenSynonyms:
      - "raw file path only"
    sourceRefs:
      - "BR-P1-008"
  -
    id: "TERM-SEMANTIC-DIGEST"
    name: "semanticDigest"
    definition: "由规范化语义、稳定选项和编译器版本计算的确定性摘要，与原始 sourceDigest 分离。"
    forbiddenSynonyms:
      - "file hash only"
    sourceRefs:
      - "BR-P1-010"
  -
    id: "TERM-CORE-CONFIG-PROJECTION"
    name: "CoreConfigProjection"
    definition: "从同一 CompiledModelSet 派生的 deprecated 只读 Data/View/Rule 投影，不拥有第二 Registry。"
    forbiddenSynonyms:
      - "legacy mutable config"
      - "compatibility runtime"
    sourceRefs:
      - "BR-P1-012"
scenarios:
  -
    id: "SCN-COMPILER-SUCCESS"
    given:
      - "根 DocumentSource 位于允许根路径"
      - "XML/YAML frontend 与 ContextPublisher 已注入"
      - "所有引用最终可解析"
    when: "CompilationSession 执行发现、解析、Raw 构建、符号注册、引用解析、Deferred 分类，并以 expectedCurrent 条件发布"
    then:
      - "产生不可变 CompiledModelSet 与 EngineContext"
      - "ContextPublisher 在同一次 compile 调用内原子替换 expectedCurrent"
      - "sourceDigest 与 semanticDigest 均记录"
      - "Diagnostic 无 ERROR"
    traceIds:
      - "TR-P1-COMPILER-001"
      - "TR-P1-COMPILER-002"
      - "TR-P1-COMPILER-003"
      - "TR-P1-COMPILER-004"
      - "TR-P1-COMPILER-005"
  -
    id: "SCN-COMPILER-INVALID-REFERENCE"
    given:
      - "输入包含未知引用、重复 TypedKey 或归属冲突"
      - "调用方持有旧 EngineContext"
    when: "ReferenceResolutionService 或验证策略产生 ERROR"
    then:
      - "CompilationSession 进入 FAILED"
      - "不构造或发布新 CompiledModelSet"
      - "调用方旧 EngineContext 保持原值"
    traceIds:
      - "TR-P1-COMPILER-003"
      - "TR-P1-COMPILER-005"
  -
    id: "SCN-COMMON-EXPRESSION"
    given:
      - "common.payError expression 引用 payment.error 与 order.payErrorStatus"
      - "两个引用均为已注册 InformationKey"
    when: "InformationOwnershipPolicy 编译 common expression"
    then:
      - "建立 common.payError 到两个 system-qualified InformationKey 的依赖"
      - "登记 P3 expression evaluation Deferred"
      - "common 不获得 Data/View/RuleView/ModelAccess"
    traceIds:
      - "TR-P1-COMPILER-004"
      - "TR-P1-COMPILER-008"
  -
    id: "SCN-MODEL-ACCESS-TARGET-MAIN"
    given:
      - "read@path=user"
      - "ref@view=UserInfo"
      - "ref@property=user"
      - "UserInfo.target-main=user"
    when: "ModelAccessSelectorPolicy 解析目标"
    then:
      - "源路径保持 SharedModelPath(user)"
      - "selector 精确命中 target-main"
      - "绑定到 UserInfo 根目标且不查找其它 View"
    traceIds:
      - "TR-P1-COMPILER-008"
      - "TR-P1-COMPILER-009"
  -
    id: "SCN-MODEL-ACCESS-PROPERTY-FALLBACK"
    given:
      - "selector 未命中 target-main"
      - "目标 View 属性树存在唯一精确 property path"
    when: "ModelAccessSelectorPolicy 逐段解析 property path"
    then:
      - "建立唯一属性级绑定"
      - "路径段区分大小写"
      - "任一非复合中间段或多候选均产生 ERROR"
    traceIds:
      - "TR-P1-COMPILER-009"
  -
    id: "SCN-MULTI-CONTEXT-ISOLATION"
    given:
      - "两个 CompilationSession 使用不同输入"
      - "两个结果同时存在于同一 JVM"
    when: "调用方分别读取两个 EngineContext"
    then:
      - "Registry、Diagnostic 与 digest 互不污染"
      - "任一 Context 不提供写入口或全局 current"
    traceIds:
      - "TR-P1-COMPILER-005"
      - "TR-P1-COMPILER-006"
  -
    id: "SCN-RETIRE-DECLARATION"
    given:
      - "dec-expand-declaration 曾是临时模块"
    when: "执行仓库、Reactor、依赖、服务、反射字符串和 artifact 残留扫描"
    then:
      - "不存在模块或 Adapter 残留"
      - "必要场景只基于 mix fixture 重写"
      - "恢复仅使用 Git revert"
    traceIds:
      - "TR-P1-COMPILER-007"
  -
    id: "SCN-SECURE-FRONTEND"
    given:
      - "输入包含 XML 外部实体、网络 URI、路径逃逸或 YAML 任意类型标签"
    when: "SourceDiscoveryPolicy 或 CanonicalizationService 读取输入"
    then:
      - "在 I/O 或 frontend 边界产生稳定 ERROR"
      - "不访问网络或允许根目录外资源"
      - "不进入 RawDefinitionSet"
    traceIds:
      - "TR-P1-COMPILER-001"
      - "TR-P1-COMPILER-002"
entities:
  -
    id: "ENT-COMPILATION-SESSION"
    name: "CompilationSession"
    identity: "sessionId"
    attributes:
      -
        name: "sessionId"
        type: "CompilationSessionId"
        required: true
      -
        name: "rootSource"
        type: "DocumentSource"
        required: true
      -
        name: "options"
        type: "CompilationOptions"
        required: true
      -
        name: "state"
        type: "CompilationState"
        required: true
      -
        name: "diagnostics"
        type: "List<Diagnostic>"
        required: true
    behaviors:
      - "discoverSources"
      - "parseCanonicalDocuments"
      - "buildRawDefinitions"
      - "registerSymbols"
      - "resolveReferences"
      - "classifyDeferredDefinitions"
      - "publishOrFail"
    traceIds:
      - "TR-P1-COMPILER-001"
      - "TR-P1-COMPILER-002"
      - "TR-P1-COMPILER-003"
      - "TR-P1-COMPILER-004"
      - "TR-P1-COMPILER-005"
      - "TR-P1-COMPILER-006"
      - "TR-P1-COMPILER-007"
      - "TR-P1-COMPILER-008"
      - "TR-P1-COMPILER-009"
    lifecycle: "CREATED 到 PUBLISHED 或 FAILED；终态后不得继续写入"
    owner: "dec-core-compiler"
  -
    id: "ENT-MIX-SOURCE-GRAPH"
    name: "MixSourceGraph"
    identity: "rootSourceId"
    attributes:
      -
        name: "rootSourceId"
        type: "SourceId"
        required: true
      -
        name: "sources"
        type: "SortedMap<SourceId,DocumentSource>"
        required: true
      -
        name: "edges"
        type: "List<TypedSourceEdge>"
        required: true
    behaviors:
      - "addUniqueSource"
      - "addTypedEdge"
      - "iterateInCanonicalOrder"
    traceIds:
      - "TR-P1-COMPILER-001"
    owner: "dec-core-compiler"
  -
    id: "ENT-RAW-DEFINITION-SET"
    name: "RawDefinitionSet"
    identity: "compilationSessionId"
    attributes:
      -
        name: "definitions"
        type: "Map<TypedKey,RawDefinition>"
        required: true
      -
        name: "sourceRefs"
        type: "Map<TypedKey,SourceRef>"
        required: true
    behaviors:
      - "addWithoutOverwrite"
      - "readByTypedKey"
      - "freezeForPasses"
    traceIds:
      - "TR-P1-COMPILER-002"
      - "TR-P1-COMPILER-003"
      - "TR-P1-COMPILER-008"
    definitionKinds:
      - "DataSource"
      - "Connection"
      - "Data"
      - "View"
      - "System"
      - "RuleView"
      - "BusinessScope"
      - "Information"
      - "Directory"
      - "Action"
      - "Produce"
  -
    id: "ENT-SYMBOL-TABLE"
    name: "SymbolTable"
    identity: "compilationSessionId"
    attributes:
      -
        name: "symbols"
        type: "Map<TypedKey,Symbol>"
        required: true
      -
        name: "registrationComplete"
        type: "boolean"
        required: true
    behaviors:
      - "registerUnique"
      - "sealRegistration"
      - "resolveForwardReference"
    traceIds:
      - "TR-P1-COMPILER-003"
      - "TR-P1-COMPILER-008"
      - "TR-P1-COMPILER-009"
  -
    id: "ENT-DEFERRED-REGISTRY"
    name: "DeferredDefinitionRegistry"
    identity: "compilationSessionId"
    attributes:
      -
        name: "entries"
        type: "Map<TypedKey,List<DeferredDefinition>>"
        required: true
      -
        name: "sealed"
        type: "boolean"
        required: true
    behaviors:
      - "registerCompleteDeferred"
      - "rejectMissingBoundary"
      - "freeze"
    traceIds:
      - "TR-P1-COMPILER-004"
      - "TR-P1-COMPILER-008"
      - "TR-P1-COMPILER-009"
  -
    id: "ENT-COMPILED-MODEL-SET"
    name: "CompiledModelSet"
    identity: "semanticDigest"
    attributes:
      -
        name: "registries"
        type: "ImmutableTypedRegistries"
        required: true
      -
        name: "deferredRegistry"
        type: "ImmutableDeferredRegistry"
        required: true
      -
        name: "diagnostics"
        type: "ImmutableList<Diagnostic>"
        required: true
      -
        name: "semanticDigest"
        type: "Digest"
        required: true
    behaviors:
      - "readTypedRegistry"
      - "readDeferredDefinitions"
      - "readDiagnostics"
    traceIds:
      - "TR-P1-COMPILER-002"
      - "TR-P1-COMPILER-003"
      - "TR-P1-COMPILER-004"
      - "TR-P1-COMPILER-005"
      - "TR-P1-COMPILER-008"
      - "TR-P1-COMPILER-009"
    lifecycle: "无 ERROR 时一次构造并永久不可变"
  -
    id: "ENT-ENGINE-CONTEXT"
    name: "EngineContext"
    identity: "contextId"
    attributes:
      -
        name: "contextId"
        type: "EngineContextId"
        required: true
      -
        name: "compiledModelSet"
        type: "CompiledModelSet"
        required: true
      -
        name: "compilerVersion"
        type: "String"
        required: true
    behaviors:
      - "readCompiledModels"
      - "createCoreConfigProjection"
    traceIds:
      - "TR-P1-COMPILER-005"
      - "TR-P1-COMPILER-006"
    lifecycle: "由成功 CompilationResult 创建；无全局 current；不提供写入 API"
  -
    id: "ENT-CORE-CONFIG-PROJECTION"
    name: "CoreConfigProjection"
    identity: "contextId"
    attributes:
      -
        name: "contextId"
        type: "EngineContextId"
        required: true
      -
        name: "dataView"
        type: "ReadOnlyMap"
        required: true
      -
        name: "viewView"
        type: "ReadOnlyMap"
        required: true
      -
        name: "ruleView"
        type: "ReadOnlyMap"
        required: true
    behaviors:
      - "readData"
      - "readView"
      - "readRule"
      - "rejectMutation"
    traceIds:
      - "TR-P1-COMPILER-006"
    lifecycle: "与来源 EngineContext 同生命周期，不单独注册事实"
valueObjects:
  -
    id: "VO-DOCUMENT-SOURCE"
    name: "DocumentSource"
    identity: "sourceId"
    attributes:
      -
        name: "sourceId"
        type: "String"
        required: true
      -
        name: "uri"
        type: "URI"
        required: true
      -
        name: "format"
        type: "DocumentFormat"
        required: true
      -
        name: "allowedRoot"
        type: "URI"
        required: true
    behaviors:
      - "normalizeId"
      - "openOnce"
    traceIds:
      - "TR-P1-COMPILER-001"
      - "TR-P1-COMPILER-002"
  -
    id: "VO-CANONICAL-DOCUMENT-NODE"
    name: "CanonicalDocumentNode"
    identity: "structuralValue"
    attributes:
      -
        name: "nodeType"
        type: "NodeType"
        required: true
      -
        name: "name"
        type: "String"
        required: true
      -
        name: "attributes"
        type: "SortedMap<String,String>"
        required: true
      -
        name: "children"
        type: "List<CanonicalDocumentNode>"
        required: true
      -
        name: "sourceRef"
        type: "SourceRef"
        required: true
    behaviors:
      - "iterateDeterministically"
    traceIds:
      - "TR-P1-COMPILER-002"
  -
    id: "VO-SOURCE-REF"
    name: "SourceRef"
    identity: "sourceId+line+column+nodePath"
    attributes:
      -
        name: "sourceId"
        type: "String"
        required: true
      -
        name: "line"
        type: "int"
        required: true
      -
        name: "column"
        type: "int"
        required: true
      -
        name: "nodePath"
        type: "String"
        required: true
    behaviors:
      - "compareForStableOrder"
    traceIds:
      - "TR-P1-COMPILER-001"
      - "TR-P1-COMPILER-002"
      - "TR-P1-COMPILER-004"
  -
    id: "VO-TYPED-KEY"
    name: "TypedKey"
    identity: "keyType+namespace+localName"
    attributes:
      -
        name: "keyType"
        type: "DefinitionType"
        required: true
      -
        name: "namespace"
        type: "String"
        required: true
      -
        name: "localName"
        type: "String"
        required: true
    behaviors:
      - "compare"
      - "renderQualifiedName"
    traceIds:
      - "TR-P1-COMPILER-003"
  -
    id: "VO-INFORMATION-KEY"
    name: "InformationKey"
    identity: "systemKey+localInformationName"
    attributes:
      -
        name: "systemKey"
        type: "SystemKey"
        required: true
      -
        name: "localName"
        type: "String"
        required: true
    behaviors:
      - "renderSystemQualified"
      - "rejectBusinessScopeNamespace"
    traceIds:
      - "TR-P1-COMPILER-003"
      - "TR-P1-COMPILER-008"
  -
    id: "VO-MODEL-ACCESS-BINDING"
    name: "ModelAccessBinding"
    identity: "systemKey+sourcePath+operation+targetView+selector"
    attributes:
      -
        name: "systemKey"
        type: "SystemKey"
        required: true
      -
        name: "operation"
        type: "READ|WRITE"
        required: true
      -
        name: "sourcePath"
        type: "SharedModelPath"
        required: true
      -
        name: "targetView"
        type: "ViewKey"
        required: true
      -
        name: "selector"
        type: "TargetSelector"
        required: true
      -
        name: "resolvedTarget"
        type: "ViewRoot|PropertyPath"
        required: true
    behaviors:
      - "resolveTargetMainFirst"
      - "resolveExactPropertyPathFallback"
      - "rejectDuplicateOrAmbiguous"
    traceIds:
      - "TR-P1-COMPILER-008"
      - "TR-P1-COMPILER-009"
  -
    id: "VO-DEFERRED-DEFINITION"
    name: "DeferredDefinition"
    identity: "definitionKey+requiredStage+reason"
    attributes:
      -
        name: "definitionKey"
        type: "TypedKey"
        required: true
      -
        name: "requiredStage"
        type: "P2|P3|P4|P5|P6|P7|P8"
        required: true
      -
        name: "reason"
        type: "String"
        required: true
      -
        name: "sourceRef"
        type: "SourceRef"
        required: true
      -
        name: "resolvedKeys"
        type: "Set<TypedKey>"
        required: true
    behaviors:
      - "validateCompleteness"
    traceIds:
      - "TR-P1-COMPILER-004"
      - "TR-P1-COMPILER-008"
      - "TR-P1-COMPILER-009"
  -
    id: "VO-DIAGNOSTIC"
    name: "Diagnostic"
    identity: "sourceRef+code+definitionKey+pass"
    attributes:
      -
        name: "code"
        type: "DiagnosticCode"
        required: true
      -
        name: "severity"
        type: "INFO|WARNING|ERROR"
        required: true
      -
        name: "sourceRef"
        type: "SourceRef"
        required: true
      -
        name: "definitionKey"
        type: "TypedKey"
        required: false
      -
        name: "relatedRefs"
        type: "List<SourceRef>"
        required: false
      -
        name: "pass"
        type: "CompilerPass"
        required: true
      -
        name: "recoveryHint"
        type: "String"
        required: true
    behaviors:
      - "sortDeterministically"
    traceIds:
      - "TR-P1-COMPILER-001"
      - "TR-P1-COMPILER-002"
      - "TR-P1-COMPILER-003"
      - "TR-P1-COMPILER-008"
      - "TR-P1-COMPILER-009"
  -
    id: "VO-DIGEST-PAIR"
    name: "DigestPair"
    identity: "sourceDigest+semanticDigest"
    attributes:
      -
        name: "sourceDigest"
        type: "SHA-256"
        required: true
      -
        name: "semanticDigest"
        type: "SHA-256"
        required: true
    behaviors:
      - "compareSemanticEquality"
    traceIds:
      - "TR-P1-COMPILER-005"
  -
    id: "VO-COMPILATION-RESULT"
    name: "CompilationResult"
    identity: "sessionId+terminalState"
    attributes:
      -
        name: "state"
        type: "PUBLISHED|FAILED"
        required: true
      -
        name: "compiledModelSet"
        type: "CompiledModelSet"
        required: false
      -
        name: "engineContext"
        type: "EngineContext"
        required: false
      -
        name: "diagnostics"
        type: "List<Diagnostic>"
        required: true
      -
        name: "digests"
        type: "DigestPair"
        required: false
    behaviors:
      - "isSuccess"
      - "requireNoPartialPublication"
    traceIds:
      - "TR-P1-COMPILER-005"
aggregates:
  -
    id: "AGG-COMPILATION-SESSION"
    name: "Compilation Session Aggregate"
    root: "ENT-COMPILATION-SESSION"
    members:
      - "ENT-MIX-SOURCE-GRAPH"
      - "ENT-RAW-DEFINITION-SET"
      - "ENT-SYMBOL-TABLE"
      - "ENT-DEFERRED-REGISTRY"
      - "VO-DOCUMENT-SOURCE"
