invariants:
  -
    id: "INV-COMPILER-001"
    statement: "编译器不得硬编码 dec-demo 或 mix fixture 路径；根 SourceProvider 必须由调用方注入。"
    trigger: "开始源发现"
    failure: "ERR-MIX-SOURCE-POLICY"
    traceIds:
      - "TR-P1-COMPILER-001"
  -
    id: "INV-COMPILER-002"
    statement: "目录发现按规范化 sourceId 稳定排序，文件系统枚举顺序不得改变源图或 semanticDigest。"
    trigger: "构建 MixSourceGraph"
    failure: "ERR-MIX-SOURCE-DUPLICATE-ID 或确定性验证失败"
    traceIds:
      - "TR-P1-COMPILER-001"
      - "TR-P1-COMPILER-005"
  -
    id: "INV-COMPILER-003"
    statement: "每个 TypedKey 在同一 CompilationSession 中唯一；注册完成后才解析跨文件前向引用，重复定义不得覆盖。"
    trigger: "符号注册与引用解析"
    failure: "ERR-MIX-SYMBOL-DUPLICATE 或 ERR-MIX-REF-UNKNOWN"
    traceIds:
      - "TR-P1-COMPILER-003"
  -
    id: "INV-COMPILER-004"
    statement: "InformationKey 必须由所属 SystemKey 与局部名称组成；BusinessScope 不得拥有 Information。"
    trigger: "构建 RawInformationDefinition"
    failure: "ERR-MIX-INFORMATION-OWNER"
    traceIds:
      - "TR-P1-COMPILER-003"
      - "TR-P1-COMPILER-008"
  -
    id: "INV-COMPILER-005"
    statement: "普通 System expression 只能引用本 System InformationKey；跨 System expression 只能由 common 拥有，且 common 只能声明 expression Information。"
    trigger: "解析 Information expression"
    failure: "ERR-MIX-INFORMATION-CROSS-SYSTEM 或 ERR-MIX-COMMON-MEMBER"
    traceIds:
      - "TR-P1-COMPILER-004"
      - "TR-P1-COMPILER-008"
  -
    id: "INV-COMPILER-006"
    statement: "Information view-ref、rule-ref 与 ModelAccess ref@view 只能指向当前 System 已声明的 View 或 RuleView。"
    trigger: "解析 System 内引用"
    failure: "ERR-MIX-REF-VIEW-NOT-DECLARED 或 ERR-MIX-REF-RULE-SYSTEM-MISMATCH"
    traceIds:
      - "TR-P1-COMPILER-003"
      - "TR-P1-COMPILER-008"
  -
    id: "INV-COMPILER-007"
    statement: "ModelAccess sourcePath 与 target selector 是不同字段；selector 先精确匹配 target-main，未匹配才逐段精确解析同一 View property path；禁止模糊、跨 View 或静默降级。"
    trigger: "解析 ModelAccessBinding"
    failure: "ERR-MIX-MODEL-ACCESS-NOT-FOUND、AMBIGUOUS 或 NON-COMPOSITE"
    traceIds:
      - "TR-P1-COMPILER-008"
      - "TR-P1-COMPILER-009"
  -
    id: "INV-COMPILER-008"
    statement: "每个后续语义必须登记包含 requiredStage、reason、SourceRef 和已解析 TypedKey 的 DeferredDefinition；P1 不执行 P2～P8 运行语义。"
    trigger: "Deferred 分类"
    failure: "ERR-MIX-DEFERRED-INCOMPLETE"
    traceIds:
      - "TR-P1-COMPILER-004"
      - "TR-P1-COMPILER-008"
      - "TR-P1-COMPILER-009"
  -
    id: "INV-COMPILER-009"
    statement: "任一 ERROR、ContextPublisher 拒绝 expectedCurrent 条件或发布异常都使 CompilationSession 进入 FAILED；compiler 不得返回未发布的成功结果，CompiledModelSet 与 EngineContext 不得部分暴露，调用方旧 Context 不变。"
    trigger: "任一 Compiler Pass 结束或 compiler 原子发布时"
    failure: "ERR-MIX-PUBLICATION-BLOCKED"
    traceIds:
      - "TR-P1-COMPILER-003"
      - "TR-P1-COMPILER-005"
      - "TR-P1-COMPILER-008"
      - "TR-P1-COMPILER-009"
  -
    id: "INV-COMPILER-010"
    statement: "同义输入、稳定选项和同一编译器版本必须产生相同 semanticDigest；sourceDigest 单独反映原文。"
    trigger: "摘要计算"
    failure: "ERR-MIX-DIGEST-NONDETERMINISTIC"
    traceIds:
      - "TR-P1-COMPILER-005"
  -
    id: "INV-COMPILER-011"
    statement: "已发布 Registry、CompiledModelSet 与 EngineContext 永久不可变，不存在全局 current Context，不同 Context 不共享可变状态。"
    trigger: "发布和读取"
    failure: "ERR-MIX-CONTEXT-MUTATION"
    traceIds:
      - "TR-P1-COMPILER-005"
      - "TR-P1-COMPILER-006"
  -
    id: "INV-COMPILER-012"
    statement: "XML 禁止外部实体和网络解析，YAML 禁止任意 Java 类型，Source 不得逃逸允许根路径或使用未授权 scheme。"
    trigger: "Source 读取和 frontend 解析"
    failure: "ERR-MIX-SOURCE-PATH-ESCAPE、ERR-MIX-XML-UNSAFE 或 ERR-MIX-YAML-UNSAFE"
    traceIds:
      - "TR-P1-COMPILER-001"
      - "TR-P1-COMPILER-002"
  -
    id: "INV-COMPILER-013"
    statement: "dec-expand-declaration、LegacyDeclarationAdapter、复制实现或第二运行时不得存在于仓库、Reactor、依赖、服务、反射字符串或发布 artifact。"
    trigger: "退役扫描和构建"
    failure: "ERR-MIX-RETIREMENT-RESIDUE"
    traceIds:
      - "TR-P1-COMPILER-007"
  -
    id: "INV-COMPILER-014"
    statement: "CoreConfigProjection 只能从当前 CompiledModelSet 派生 Data/View/Rule 只读视图，写入必须拒绝，不能拥有第二 Registry。"
    trigger: "旧核心读取或写入尝试"
    failure: "ERR-MIX-PROJECTION-WRITE"
    traceIds:
      - "TR-P1-COMPILER-006"
  -
    id: "INV-COMPILER-015"
    statement: "RuleViewKey 预留 SystemKey 命名空间，RuleView.system、来源 System 与 view-ref 所属 System 必须一致。"
    trigger: "注册和解析 RuleView"
    failure: "ERR-MIX-REF-RULE-SYSTEM-MISMATCH"
    traceIds:
      - "TR-P1-COMPILER-003"
      - "TR-P1-COMPILER-008"
stateMachines:
  -
    id: "SM-COMPILATION-SESSION"
    name: "CompilationSession 生命周期"
    initialState: "CREATED"
    states:
      - "CREATED"
      - "SOURCES_DISCOVERED"
      - "PARSED"
      - "RAW_BUILT"
      - "STRUCTURALLY_VALIDATED"
      - "SYMBOLS_REGISTERED"
      - "REFERENCES_RESOLVED"
      - "GRAPH_PREPARED"
      - "SEMANTICALLY_VALIDATED"
      - "PUBLISHED"
      - "FAILED"
    terminalStates:
      - "PUBLISHED"
      - "FAILED"
    transitions:
      -
        id: "TRANS-COMP-001"
        from: "CREATED"
        command: "discoverSources"
        to: "SOURCES_DISCOVERED"
        preconditions:
          - "root DocumentSource 与允许根存在"
          - "SourceProvider 已注入"
        sideEffects:
          - "构建有类型 MixSourceGraph"
        failure: "任何 Source ERROR 转 FAILED"
      -
        id: "TRANS-COMP-002"
        from: "SOURCES_DISCOVERED"
        command: "parseCanonicalDocuments"
        to: "PARSED"
        preconditions:
          - "所有 Source format 有已注册 frontend"
        sideEffects:
          - "构建 CanonicalDocumentNode"
        failure: "格式或安全 ERROR 转 FAILED"
      -
        id: "TRANS-COMP-003"
        from: "PARSED"
        command: "buildRawDefinitions"
        to: "RAW_BUILT"
        preconditions:
          - "Canonical 节点有效"
        sideEffects:
          - "构建 RawDefinitionSet 并保留 SourceRef"
        failure: "结构 ERROR 转 FAILED"
      -
        id: "TRANS-COMP-004"
        from: "RAW_BUILT"
        command: "validateStructure"
        to: "STRUCTURALLY_VALIDATED"
        preconditions:
          - "所有必需字段可判定"
        sideEffects:
          - "产生稳定 Diagnostic"
        failure: "ERROR 转 FAILED"
      -
        id: "TRANS-COMP-005"
        from: "STRUCTURALLY_VALIDATED"
        command: "registerSymbols"
        to: "SYMBOLS_REGISTERED"
        preconditions:
          - "TypedKey 可构造"
        sideEffects:
          - "注册全部符号后封存"
        failure: "重复 Key 转 FAILED"
      -
        id: "TRANS-COMP-006"
        from: "SYMBOLS_REGISTERED"
        command: "resolveReferences"
        to: "REFERENCES_RESOLVED"
        preconditions:
          - "注册阶段已封存"
        sideEffects:
          - "解析前向引用、Information owner、ModelAccess selector"
        failure: "未知、归属或歧义 ERROR 转 FAILED"
      -
        id: "TRANS-COMP-007"
        from: "REFERENCES_RESOLVED"
        command: "classifyDeferred"
        to: "GRAPH_PREPARED"
        preconditions:
          - "P1 可解析 Key 完整"
        sideEffects:
          - "登记 P2～P8 DeferredDefinition"
        failure: "Deferred 不完整转 FAILED"
      -
        id: "TRANS-COMP-008"
        from: "GRAPH_PREPARED"
        command: "validateSemantics"
        to: "SEMANTICALLY_VALIDATED"
        preconditions:
          - "无先前 ERROR"
        sideEffects:
          - "计算稳定 Diagnostic 顺序与 digest 输入"
        failure: "ERROR 转 FAILED"
      -
        id: "TRANS-COMP-009"
        from: "SEMANTICALLY_VALIDATED"
        command: "publishAtomically"
        to: "PUBLISHED"
        preconditions:
          - "Diagnostic 中不存在 ERROR"
          - "所有 Registry 可防御性冻结"
          - "ContextPublisher 与 expectedCurrent 已注入"
        sideEffects:
          - "compiler 一次性创建 CompiledModelSet 和 EngineContext，并在本次 compile 调用内按 expectedCurrent 条件原子发布"
        failure: "条件冲突、空返回或异常均转 FAILED且不替换旧 Context"
    traceIds:
      - "TR-P1-COMPILER-001"
      - "TR-P1-COMPILER-002"
      - "TR-P1-COMPILER-003"
      - "TR-P1-COMPILER-004"
      - "TR-P1-COMPILER-005"
      - "TR-P1-COMPILER-008"
      - "TR-P1-COMPILER-009"
services:
  -
    id: "SVC-SOURCE-DISCOVERY"
    name: "SourceDiscoveryService"
    reason: "源图跨多个文档类型和间接 Rule 文件，不自然属于单一定义对象。"
    inputs:
      - "DocumentSource"
      - "SourceProvider"
      - "SourcePolicy"
    outputs:
      - "MixSourceGraph"
      - "Diagnostic"
    traceIds:
      - "TR-P1-COMPILER-001"
  -
    id: "SVC-CANONICALIZATION"
    name: "CanonicalizationService"
    reason: "XML/YAML frontend 必须共享格式中立契约且隔离具体解析库节点。"
    inputs:
      - "DocumentSource"
      - "DocumentFrontend"
    outputs:
      - "CanonicalDocumentNode"
      - "Diagnostic"
    traceIds:
      - "TR-P1-COMPILER-002"
  -
    id: "SVC-RAW-BUILDER"
    name: "RawDefinitionBuilder"
    reason: "跨定义类型构建 RawDefinitionSet，需要统一 SourceRef 和未知节点策略。"
    inputs:
      - "CanonicalDocumentNode"
    outputs:
      - "RawDefinitionSet"
      - "Diagnostic"
    traceIds:
      - "TR-P1-COMPILER-002"
      - "TR-P1-COMPILER-003"
  -
    id: "SVC-SYMBOL-REGISTRATION"
    name: "SymbolRegistrationService"
    reason: "跨文件前向引用要求先完成所有 TypedKey 注册再解析。"
    inputs:
      - "RawDefinitionSet"
    outputs:
      - "SymbolTable"
      - "Diagnostic"
    traceIds:
      - "TR-P1-COMPILER-003"
  -
    id: "SVC-REFERENCE-RESOLUTION"
    name: "ReferenceResolutionService"
    reason: "Information 所有权、RuleView 归属、ModelAccess selector 和跨文件引用需要统一确定性策略。"
    inputs:
      - "RawDefinitionSet"
      - "SymbolTable"
      - "InformationOwnershipPolicy"
      - "ModelAccessSelectorPolicy"
    outputs:
      - "ResolvedDefinitions"
      - "ModelAccessBinding"
      - "Diagnostic"
    traceIds:
      - "TR-P1-COMPILER-003"
      - "TR-P1-COMPILER-008"
      - "TR-P1-COMPILER-009"
  -
    id: "SVC-DEFERRED-CLASSIFICATION"
    name: "DeferredClassificationService"
    reason: "P1 必须显式区分已解析结构与后续阶段运行语义。"
    inputs:
      - "ResolvedDefinitions"
    outputs:
      - "DeferredDefinitionRegistry"
      - "Diagnostic"
    traceIds:
      - "TR-P1-COMPILER-004"
      - "TR-P1-COMPILER-008"
  -
    id: "SVC-MODEL-PUBLICATION"
    name: "ModelPublicationService"
    reason: "只有 compiler 内的单一服务能保护 ERROR 不发布、防御性冻结、expectedCurrent 条件和旧 Context 不替换不变量。"
    inputs:
      - "ValidatedCompilationSession"
      - "PublicationRequest"
      - "ContextPublisher"
    outputs:
      - "CompilationResult"
      - "CompiledModelSet"
      - "EngineContext"
    traceIds:
      - "TR-P1-COMPILER-005"
      - "TR-P1-COMPILER-006"
policies:
  -
    id: "POL-INFORMATION-OWNERSHIP"
    name: "InformationOwnershipPolicy"
    reason: "Information owner 和 common 跨 System 规则横跨 System、Information 与 BusinessScope 定义。"
    inputs:
      - "RawSystemDefinition"
      - "RawInformationDefinition"
      - "SymbolTable"
    outputs:
      - "InformationKey"
      - "ResolvedInformationDependencies"
      - "Diagnostic"
    traceIds:
      - "TR-P1-COMPILER-003"
      - "TR-P1-COMPILER-004"
      - "TR-P1-COMPILER-008"
  -
    id: "POL-MODEL-ACCESS-SELECTOR"
    name: "ModelAccessSelectorPolicy"
    reason: "target-main 优先和 property path 回退是可变但必须确定性的业务规则。"
    inputs:
      - "SharedModelPath"
      - "ViewKey"
      - "TargetSelector"
      - "CompiledViewStructure"
    outputs:
      - "ModelAccessBinding"
      - "Diagnostic"
    traceIds:
      - "TR-P1-COMPILER-008"
      - "TR-P1-COMPILER-009"
  -
    id: "POL-DEFERRED-BOUNDARY"
    name: "DeferredBoundaryPolicy"
    reason: "防止 P1 提前执行 P2～P8 语义或静默忽略未完成定义。"
    inputs:
      - "ResolvedDefinition"
      - "StageOwnershipMatrix"
    outputs:
      - "DeferredDefinition"
    traceIds:
      - "TR-P1-COMPILER-004"
  -
    id: "POL-PUBLICATION"
    name: "AtomicPublicationPolicy"
    reason: "保护无 ERROR、全量冻结、expectedCurrent 条件发布和旧 Context 保留的一致性边界。"
    inputs:
      - "CompilationSession"
      - "DiagnosticSet"
      - "PublicationRequest"
      - "ContextPublisher"
    outputs:
      - "CompilationResult"
    traceIds:
      - "TR-P1-COMPILER-005"
  -
    id: "POL-SOURCE-SECURITY"
    name: "SourceSecurityPolicy"
    reason: "路径、URI、XML 和 YAML 安全需要统一前置拒绝。"
    inputs:
      - "DocumentSource"
      - "FrontendSecurityOptions"
    outputs:
      - "AllowedSource|Diagnostic"
    traceIds:
      - "TR-P1-COMPILER-001"
      - "TR-P1-COMPILER-002"
  -
    id: "POL-RETIREMENT"
    name: "DeclarationRetirementPolicy"
    reason: "不可逆替代必须保证临时模块及 Adapter 无残留。"
    inputs:
      - "RepositoryTree"
      - "Reactor"
      - "DependencyTree"
      - "ArtifactList"
    outputs:
      - "RetirementGateResult"
    traceIds:
      - "TR-P1-COMPILER-007"
events:
  -
    id: "EVT-SOURCES-DISCOVERED"
    name: "SourcesDiscovered"
    reason: "记录源图事实供后续 Pass 使用，不表示业务运行事件。"
    inputs:
      - "MixSourceGraph"
    outputs:
      - "source count"
      - "typed edge count"
    traceIds:
      - "TR-P1-COMPILER-001"
  -
    id: "EVT-COMPILATION-FAILED"
    name: "CompilationFailed"
    reason: "对外表达未发布且旧 Context 不变的已发生编译事实。"
    inputs:
      - "CompilationSessionId"
      - "DiagnosticSet"
    outputs:
      - "FAILED CompilationResult"
    traceIds:
      - "TR-P1-COMPILER-003"
      - "TR-P1-COMPILER-005"
      - "TR-P1-COMPILER-008"
      - "TR-P1-COMPILER-009"
  -
    id: "EVT-MODEL-PUBLISHED"
    name: "ModelPublished"
    reason: "对外表达 compiler 已在同一次 compile 调用内使新的不可变 Context 原子可见。"
    inputs:
      - "CompiledModelSet"
      - "DigestPair"
      - "expectedCurrent"
    outputs:
      - "EngineContextId"
    traceIds:
      - "TR-P1-COMPILER-005"
      - "TR-P1-COMPILER-006"
businessErrors:
  -
    id: "ERR-MIX-SOURCE-POLICY"
    condition: "编译器依赖硬编码 demo/fixture 路径或未注入根 SourceProvider"
    meaning: "源发现策略无效"
    retryable: false
    stateChanged: false
    traceIds:
      - "TR-P1-COMPILER-001"
    diagnosticCode: "MIX-SOURCE-POLICY"
  -
    id: "ERR-MIX-SOURCE-NOT-FOUND"
    condition: "显式引用的配置 Source 不存在"
    meaning: "配置源缺失"
    retryable: true
    stateChanged: false
    traceIds:
      - "TR-P1-COMPILER-001"
    diagnosticCode: "MIX-SOURCE-NOT-FOUND"
  -
    id: "ERR-MIX-SOURCE-PATH-ESCAPE"
    condition: "Source 逃逸允许根路径或使用未授权 URI scheme"
    meaning: "配置源访问被安全策略拒绝"
    retryable: false
    stateChanged: false
    traceIds:
      - "TR-P1-COMPILER-001"
    diagnosticCode: "MIX-SOURCE-PATH-ESCAPE"
  -
    id: "ERR-MIX-SOURCE-DUPLICATE-ID"
    condition: "两个来源规范化后得到相同 sourceId"
    meaning: "源身份冲突"
    retryable: false
    stateChanged: false
    traceIds:
      - "TR-P1-COMPILER-001"
    diagnosticCode: "MIX-SOURCE-DUPLICATE-ID"
  -
    id: "ERR-MIX-XML-UNSAFE"
    condition: "XML 包含外部实体、DOCTYPE 网络解析或不安全特性"
    meaning: "XML 输入被安全策略拒绝"
    retryable: false
    stateChanged: false
    traceIds:
      - "TR-P1-COMPILER-002"
    diagnosticCode: "MIX-FRONTEND-XML-UNSAFE"
  -
    id: "ERR-MIX-YAML-UNSAFE"
    condition: "YAML 请求任意 Java 类型构造或不安全 tag"
    meaning: "YAML 输入被安全策略拒绝"
    retryable: false
    stateChanged: false
    traceIds:
      - "TR-P1-COMPILER-002"
    diagnosticCode: "MIX-FRONTEND-YAML-UNSAFE"
  -
    id: "ERR-MIX-SYMBOL-DUPLICATE"
    condition: "同一 TypedKey 被重复注册"
    meaning: "定义身份重复且不得覆盖"
    retryable: false
    stateChanged: false
    traceIds:
      - "TR-P1-COMPILER-003"
    diagnosticCode: "MIX-SYMBOL-DUPLICATE"
  -
    id: "ERR-MIX-REF-UNKNOWN"
    condition: "注册完成后引用仍无法解析到目标 TypedKey"
    meaning: "引用目标不存在"
    retryable: true
    stateChanged: false
    traceIds:
      - "TR-P1-COMPILER-003"
    diagnosticCode: "MIX-REF-UNKNOWN"
  -
    id: "ERR-MIX-REF-RULE-SYSTEM-MISMATCH"
    condition: "RuleView 来源 System、system 属性或 view-ref 所属 System 不一致"
    meaning: "RuleView 归属冲突"
