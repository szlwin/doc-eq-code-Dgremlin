          - "STEP-01 success"
        postconditions:
          - "sealed session + same-scope effect port or no composition"
        idempotency: "duplicate registration/binding never widens authority"
        failureHandling: "stable session/effect code; capability/Guard/effect=0"
        compensation: "close partial session"
        traceIds:
          - "TR-P2-006"
          - "TR-P2-009"
      -
        id: "CMSTEP-P2-ACCESS-R29-03"
        order: 4
        from: "CMPART-P2-ACCESS-R29-2"
        to: "CMPART-P2-ACCESS-R29-1"
        interactionType: "QUERY"
        action: "resolve exact plan to exactly one object registered in that sealed session"
        preconditions:
          - "composition/effect binding complete"
        postconditions:
          - "one target or 0/N denial"
        idempotency: "deterministic"
        failureHandling: "NOT_FOUND/AMBIGUOUS/PROVENANCE_MISMATCH"
        compensation: "none"
        traceIds:
