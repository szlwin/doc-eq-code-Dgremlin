        interactionType: "COMMAND"
        action: "freeze READ access or WRITE intent+stamp and one-shot capability for exact target/path/version"
        preconditions:
          - "one target"
        postconditions:
          - "immutable access/capability"
        idempotency: "one capability identity"
        failureHandling: "intent 0/N fails closed"
        compensation: "none"
        traceIds:
          - "TR-P2-007"
      -
        id: "CMSTEP-P2-ACCESS-R29-05"
