        id: "CMPART-P2-ACCESS-R29-2"
        module: "dec-core-starter"
        responsibility: "consume trusted scope, register/seal, bind effect provider, resolve/capability/Guard and invoke bound effect only after ALLOW"
      -
        id: "CMPART-P2-ACCESS-R29-3"
        module: "dec-core-context"
        responsibility: "provide immutable binding/policy/materialization/result contracts"
    steps:
      -
        id: "CMSTEP-P2-ACCESS-R29-00"
        order: 1
        from: "CMPART-P2-ACCESS-R29-1"
        to: "CMPART-P2-ACCESS-R29-1"
        interactionType: "COMMAND"
        action: "MODEL production lifecycle constructs RuntimeModelLoadRequest from exact selected plan + real origin + explicit routing; root validates captured Context, selects exact materialization, creates ModelData, uses existing 3-arg ModelLoader and MODEL-owned production Container, then freezes the same ModelData into trusted handle"
        preconditions:
          - "active root"
          - "captured Context"
          - "MODEL production lifecycle"
        postconditions:
          - "trusted frame precondition available or stable load failure"
        idempotency: "deterministic validation per request; no permission is granted by request possession"
        failureHandling: "load failure; handle/scope/STARTER/Guard/effect=0"
        compensation: "discard unexposed association"
        traceIds:
          - "TR-P2-006"
          - "TR-P2-009"
