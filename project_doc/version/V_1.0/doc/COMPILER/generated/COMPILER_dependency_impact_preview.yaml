        id: "CMSTEP-P2-ACCESS-R29-01"
        order: 2
        from: "CMPART-P2-ACCESS-R29-1"
        to: "CMPART-P2-ACCESS-R29-2"
        interactionType: "SYNC_API"
        action: "provide active MODEL-minted scope/frame; STARTER validates every handle plan/provenance against captured Context"
