    name: "Direct MODEL load request plus bound same-target effect under FLOW-R11"
    trigger: "FLOW-PROTECTED-ACCESS-EXECUTE"
    participants:
      -
        id: "CMPART-P2-ACCESS-R29-1"
        module: "dec-core-model"
        responsibility: "trusted production lifecycle forms request, validates captured Context, creates production Container/ModelData/Handle/Scope/Session/EffectProvider and owns actual effect"
