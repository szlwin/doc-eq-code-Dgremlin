schemaVersion: 1
artifact: business_model
module:
  code: COMPILER
  name: dec-core-compiler
revision: BM-R17
baseRevision: BM-R16
status: NEEDS_EXACT_REVIEW_MACHINE_BLOCKED
canonicalPair:
  machineAuthority: COMPILER_business_model.yaml
  normativeHumanMirror: COMPILER_business_model.md
  rule: semantic mismatch invalidates the whole BM-R17 candidate
authoritativeInputs:
  - REQAN-P2-R01@d08612768131
  - REQAN-P2-R01+DEC-OVERLAY-20260809-R04
  - DEC-P2-DIRECT-BRIDGE-AUTHORITY-001:ACTIVE
  - DEC-P2-AC007-STAGE-BOUNDARY-001:ACTIVE_OPTION_B
  - DEC-P2-ACCESS-OPERATIONS-001:ACTIVE_READ_WRITE_ONLY
revisionDirection:
  chain: REQAN_R04 -> BM_R17 -> FLOW_R07 -> DESIGN_R19 -> TESTDESIGN_R20
  downstreamArtifactsAreInputs: false
terms:
  - id: TERM-TARGET-KEY
    definition: exact immutable identity (owner SystemKey, canonical sourceModel name) resolved before ModelPath compilation
  - id: TERM-MODEL-PATH
    definition: exact canonical path independent from TargetKey; source wildcard is compile-time only
  - id: TERM-ACCESS-OPERATION
    definition: exactly READ or WRITE; current P2 has no EXECUTE
  - id: TERM-PROTECTED-ACCESS-PORT
    definition: neutral dec-core-context consumer contract; starter Bridge implements it; it is not authorization authority
entities:
  - id: ENT-COMPILED-SYSTEM
    identity: SystemKey
    requiredAttributes: [systemKey, sourceRef, versionIdentity, ownedDataKeys, ownedViewKeys, ownedRuleViewKeys, ownedRuleKeys, ownedInformationKeys, ownedModelAccessRuleKeys]
  - id: ENT-COMPILED-RULEVIEW
    identity: RuleViewKey
    requiredAttributes: [key, resolvedViewKey, resolvedRuleKeys, sourceRef]
  - id: ENT-PROTECTED-ACCESS-COMPOSITION
    ownerModule: dec-core-starter
    requiredFacts: [engineContext, bridge, ruleEntry, changeEntry, customActionEntry]
valueObjects:
  - id: VO-RULE-KEY
    identity: [ownerRuleViewKey, localRuleName]
    authoritativeStore: owning CompiledRuleView immutable compiled rule closure
  - id: VO-TARGET-KEY
    identity: [ownerSystemKey, canonicalSourceModelName]
    mapping:
      source: P1/model-access sourceModel
      resolution: exact owner-System target namespace
      forbidden: [caseFold, fuzzy, parentFallback, pathDerivedTarget]
  - id: VO-MODEL-PATH
    identity: canonicalSegments
    source: P1/model-access sourcePath through shared ModelPathCompiler
    runtimeWildcardAllowed: false
  - id: VO-ACCESS-OPERATION
    enumValues: [READ, WRITE]
    executePresent: false
modelAccessIdentity:
  key: [SystemKey, TargetKey, ModelPath, AccessOperation]
  authority: ModelAccessPolicyIndex
  consumerKindInAuthorizationKey: false
p1ToP2Mapping:
  sourceModel: exact resolve -> TargetKey
  sourcePath: SharedModelPath -> shared ModelPathCompiler -> exact ModelPath
  accessMode:
    READ: AccessOperation.READ
    WRITE: AccessOperation.WRITE
  postCondition: P1 source facts are not runtime authorization authority
policyClassification:
  policyStatusValues: [STATIC_ALLOW, RUNTIME_GUARD_REQUIRED]
  runtimeRequirementValues: [NONE, EXACT_RUNTIME_BINDING]
  truthTable:
    - {status: STATIC_ALLOW, requirement: NONE, runtimePlan: ABSENT, valid: true}
    - {status: STATIC_ALLOW, requirement: EXACT_RUNTIME_BINDING, runtimePlan: ANY, valid: false}
    - {status: RUNTIME_GUARD_REQUIRED, requirement: EXACT_RUNTIME_BINDING, runtimePlan: PRESENT, valid: true}
    - {status: RUNTIME_GUARD_REQUIRED, requirement: NONE, runtimePlan: ANY, valid: false}
  invalidNullOrUnknown: COMPILE_OR_PUBLICATION_ERROR
runtimeBindingPlan:
  exactFacts: [resolvedTargetKey, canonicalModelPath, targetViewKey, selectorPlanIdentity, sourceRef]
  mayReselectRuleTargetPathOrOperation: false
protectedOperationSemantics:
  READ:
    mutationAllowed: false
    successResult: immutable capability-bound runtime value snapshot
  WRITE:
    writeIntentSource: current frame/owner runtime execution state resolved internally
    callerCallbackInjectionAllowed: false
    maxSuccessfulMutationPerCapability: 1
    successResult: immutable write receipt
  denyBeforeOperation: true
neutralRuntimeSeam:
  neutralModule: dec-core-context
  contracts: [ProtectedAccessPort, ProtectedAccessInvocation, ProtectedAccessResult, keysAndOpaqueRuntimeIds]
  implementationModule: dec-core-starter
  implementation: ProtectedExecutionBridge
  starterOnly: [targetResolver, oneShotCapability, ProtectedAccessGateway, ModelAccessGuard, protectedOperationExecutionAdapter, productionAssembly]
  downstreamModules: [P3, P4, P6]
  downstreamDependency: neutral ProtectedAccessPort only
  forbiddenDependency: core modules -> dec-core-starter
ac007:
  decision: OPTION_B_USER_ACTIVE
  productionAcquisition: ProtectedAccessRuntimeFactory -> ProtectedAccessComposition
  representativeEntries: [RuleProtectedAccessEntry, ChangeProtectedAccessEntry, CustomActionProtectedAccessEntry]
  sameBridgeAndContextRequired: true
oneShotCapability:
  concurrency: ATOMIC_CONSUME
  transition: ISSUED -> CONSUMED
  maxSuccessfulConsume: 1
  loser: CAPABILITY_ALREADY_CONSUMED
invariants:
  - id: INV-COMPILER-024
    statement: BM has no authoritative dependency on downstream Flow Design or TestDesign revisions
  - id: INV-COMPILER-025
    statement: sourceModel and sourcePath map independently and uniquely to TargetKey and ModelPath
  - id: INV-COMPILER-026
    statement: only legal policy classification truth-table rows can enter PolicyIndex
  - id: INV-COMPILER-027
    statement: protected READ returns a real value snapshot without mutation and protected WRITE applies at most one capability-bound mutation only after Guard ALLOW
  - id: INV-COMPILER-028
    statement: future core executors depend on neutral ProtectedAccessPort and never on dec-core-starter
gate:
  openP1: 19
  requirementReview: REQUIRED
  businessModelReview: REQUIRED
  riskDetection: NOT_SCANNED
  implementationPlan: BLOCKED
  tdd: BLOCKED
  development: BLOCKED
