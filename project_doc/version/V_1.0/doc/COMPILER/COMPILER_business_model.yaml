terms:
  - id: TERM-SYSTEM-COMPILED-IDENTITY
    definition: explicit SystemKey plus version/source identity and derived immutable ownership snapshot
  - id: TERM-SYSTEM-VERSION-IDENTITY
    definition: optional declared version plus source semantic digest plus exact schemaVersion and compilerVersion; options identity remains enclosing compiled-set fact
  - id: TERM-SYSTEM-OWNERSHIP-SNAPSHOT
    definition: derived immutable read index over authoritative typed registries, CompiledRuleView rule closure and ModelAccessPolicyIndex; never a second authority
  - id: TERM-MODEL-PATH
    definition: exact P2 canonical/runtime path; P1 SharedModelPath is source/compat input only
  - id: TERM-ACCESS-OPERATION
    definition: P2 runtime authorization operation READ WRITE EXECUTE; P1 AccessMode is source/compat input only
entities:
  - id: ENT-COMPILED-SYSTEM
    identity: systemKey
    requiredAttributes: [systemKey, sourceRef, versionIdentity, ownedDataKeys, ownedViewKeys, ownedRuleViewKeys, ownedRuleKeys, ownedInformationKeys, ownedModelAccessRuleKeys]
  - id: ENT-COMPILED-RULEVIEW
    identity: RuleViewKey
    requiredAttributes: [key, resolvedViewKey, resolvedRuleKeys, sourceRef]
valueObjects:
  - id: VO-RULEVIEW-KEY
    fields: [systemKey, localName]
    compatibility:
      existingConstructor: RuleViewKey(SystemKey owner, String name)
      existingAccessors: [owner(), name()]
      additiveAliases: [of(SystemKey,String), systemKey(), localName()]
  - id: VO-MODEL-PATH
    fields: [canonicalSegments]
  - id: VO-MODEL-ACCESS-RULE
    fields: [systemKey, targetKey, modelPath, operation, sourceRef, status, runtimeRequirement, runtimePlan]
authoritativeOwnershipSources:
  ownedDataKeys: final owner-qualified typed Data registry
  ownedViewKeys: final owner-qualified typed View registry
  ownedRuleViewKeys: final owner-qualified typed RuleView registry
  ownedInformationKeys: final owner-qualified typed Information registry
  ownedRuleKeys: final CompiledRuleView compiled/nested rule closure; do not create duplicate global Rule registry for snapshot
  ownedModelAccessRuleKeys: final ModelAccessPolicyIndex keys / compiled policy rules filtered by System
invariants:
  - id: INV-COMPILER-016A
    statement: every owner-qualified compiled fact belongs to exactly one System
  - id: INV-COMPILER-016B
    statement: ownership snapshot exactly coheres with the declared authoritative sources
  - id: INV-COMPILER-016C
    statement: SystemVersionIdentity and ownership snapshot participate in semantic digest
  - id: INV-COMPILER-016D
    statement: ownership snapshot is immutable and EngineContext-local
  - id: INV-COMPILER-016E
    statement: ownership snapshot never reconstructs or overwrites typed registries RuleView rule closure or PolicyIndex and is not recomputed at runtime
  - id: INV-COMPILER-017A
    statement: CompiledRuleView resolvedViewKey exact-resolves and is owner-compatible
  - id: INV-COMPILER-018
    statement: rule change query-contract model-access produce value-equal P2 ModelPath for equal System target path
  - id: INV-COMPILER-018A
    statement: READ WRITE EXECUTE are independent and one permission never implies another
  - id: INV-COMPILER-019
    statement: authoritative facts derived ownership PolicyIndex version identity and digest are one immutable publication closure
  - id: INV-COMPILER-020
    statement: all P2 supported protected operations use FLOW-PROTECTED-ACCESS-EXECUTE; final AC007 scope remains pending user decision
  - id: INV-COMPILER-021
    statement: compile ERROR and runtime DENY are deterministic source-aware and non-sensitive
  - id: INV-COMPILER-022
    statement: declaration compatibility remains read-only until P7
  - id: INV-COMPILER-023
    statement: P1 SharedModelPath and AccessMode are one-way source compatibility inputs converted before P2 policy publication and never remain runtime authority
systemVersionIdentity:
  fields: [declaredVersion, sourceSemanticDigest, schemaVersion, compilerVersion]
  invariants:
    - declaredVersion is empty when source declares none
    - schemaVersion equals enclosing CompiledModelSet schemaVersion
    - compilerVersion equals enclosing CompiledModelSet compilerVersion
    - optionsDigest/optionsVersion remains enclosing compile identity and is not fabricated as System declared version
p1ToP2Migration:
  sharedModelPath:
    exact: SharedModelPath exact -> shared ModelPathCompiler -> exact ModelPath
    wildcard: SharedModelPath '*' -> deterministic compile-time finite expansion -> exact ModelPath facts
    runtimeWildcardAllowed: false
  accessMode:
    READ: AccessOperation.READ
    WRITE: AccessOperation.WRITE
    EXECUTE: explicit P2 source fact only; never inferred from P1
  runtimeAuthority: [ModelPath, AccessOperation, ModelAccessPolicyIndex]
ac007:
  decisionId: DEC-P2-AC007-STAGE-BOUNDARY-001
  status: PENDING_USER_DECISION
  originalRequirementSuperseded: false
  options:
    A: P2 seam/no-bypass acceptance; concrete integrations downstream P3/P4/P6
    B: P2 representative concrete production consumers execute original AC007
policies:
  - id: POL-MODEL-ACCESS-AUTHORIZATION
    statement: exact compiler-published rule/operation required; direct caller authority follows the ACTIVE user decision
  - id: POL-DEFERRED-BOUNDARY
    statement: P2 does not silently assume AC007 option A or B before user authorization
