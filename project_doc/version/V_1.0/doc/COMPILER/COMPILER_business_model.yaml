schemaVersion: 1
artifact: business_model
module:
  code: COMPILER
  name: dec-core-compiler
revision: BM-R20
baseRevision: BM-R19
terms:
  - {id: TERM-SOURCE-VIEW-IDENTITY, name: Shared source View identity, definition: "P1 shared ViewKey resolved from sourceModel; authorization owner System is separate.", sourceRefs: [REQAN-P2-R01@d08612768131, FND-P2-REV-020]}
  - {id: TERM-TARGET-KEY, name: TargetKey, definition: "Immutable shared source ViewKey wrapper; never embeds owner System or sourcePath.", sourceRefs: [BM-R20]}
  - {id: TERM-MODEL-PATH, name: ModelPath, definition: "Exact canonical path independent from TargetKey; wildcard is compile-time only.", sourceRefs: [DEC-P2-ACCESS-OPERATIONS-001]}
  - {id: TERM-ACCESS-AUTHORITY, name: Model access authority, definition: "ModelAccessRuleKey = owner System + TargetKey + ModelPath + READ/WRITE and is the sole permission/WRITE authority.", sourceRefs: [FND-P2-REV-004, FND-P2-REV-019]}
  - {id: TERM-RESOLVED-RUNTIME-TARGET, name: Resolved runtime target, definition: "Unique RuntimeTargetResolver result from RuntimeBindingPlan plus composition frame/owner/cursor and sealed session.", sourceRefs: [FND-P2-REV-014, FND-P2-REV-017, FND-P2-REV-019]}
  - {id: TERM-RUNTIME-MODEL-SESSION, name: Runtime model session, definition: "P2 internal sealed locator scope with explicit RuntimeModelSessionId; not P7 business session lifecycle.", sourceRefs: [FND-P2-REV-014, FND-P2-REV-017]}
  - {id: TERM-RUNTIME-MUTATION-STAMP, name: Runtime mutation stamp, definition: "Atomic tuple RuntimeModelSessionId + RuntimeObjectId + ModelPath + RuntimeMutationVersion frozen into WRITE intent.", sourceRefs: [FND-P2-REV-019]}
  - {id: TERM-RUNTIME-FACT-VALUE, name: RuntimeFactValue, definition: "Closed deep-immutable NULL/BOOLEAN/INTEGER/DECIMAL/STRING/LIST/OBJECT snapshot domain.", sourceRefs: [FND-P2-REV-011]}
scenarios:
  - id: SCN-P2-COMPILE-SYSTEM-RULEVIEW
    given: ["System/RuleView declarations are current", "RuleView requires System ownership"]
    when: Compiler resolves symbols and ownership.
    then: ["duplicates/missing owners fail deterministically", "RuleKey closure is immutable"]
    traceIds: [TR-P2-001, TR-P2-002, TR-P2-003]
  - id: SCN-P2-COMPILE-ACCESS
    given: ["shared source View exists", "sourcePath is compilable", "operation is READ or WRITE"]
    when: Compiler materializes model-access policy.
    then: ["owner System stays separate from TargetKey", "sourcePath becomes exact ModelPath", "only legal policy rows enter PolicyIndex"]
    traceIds: [TR-P2-004, TR-P2-005, TR-P2-006]
  - id: SCN-P2-ATOMIC-PUBLICATION
    given: ["candidate facts are fully validated", "CONTEXT can build immutable representation"]
    when: COMPILER coordinates publication.
    then: ["whole new Context publishes atomically", "failure retains old Context", "no global/default current Context"]
    traceIds: [TR-P2-008]
  - id: SCN-P2-PROTECTED-READ
    given: ["explicit EngineContext/frame composition", "one runtime target resolved", "Guard ALLOW"]
    when: READ executes through production model port.
    then: ["actual ModelData/path is read", "deep immutable RuntimeFactValue returned", "mutation/version change = 0"]
    traceIds: [TR-P2-004, TR-P2-006, TR-P2-007]
  - id: SCN-P2-PROTECTED-WRITE
    given: ["WRITE ModelAccessRuleKey", "one target and intent frozen", "Guard ALLOW"]
    when: Production WRITE executes.
    then: ["stamp binds session/object/path/version", "one commit or rollback", "receipt only after success"]
    traceIds: [TR-P2-004, TR-P2-006, TR-P2-007, TR-P2-009]
  - id: SCN-P2-RUNTIME-TARGET-SELECTION
    given: ["invocation frame/owner equal composition", "RuntimeBindingPlan exists", "session is sealed"]
    when: RuntimeTargetResolver evaluates plan plus typed context/session.
    then: ["0 -> RUNTIME_TARGET_NOT_FOUND", "1 -> immutable ResolvedRuntimeTarget", "N -> RUNTIME_TARGET_AMBIGUOUS", "failure reaches no Guard/effect"]
    traceIds: [TR-P2-006, TR-P2-009]
  - id: SCN-P2-RUNTIME-OBJECT-OWNERSHIP
    given: ["actual ModelData exists", "one active session may own registration lease"]
    when: Duplicate or cross-session registration is attempted.
    then: ["same session -> RUNTIME_OBJECT_ALREADY_REGISTERED", "cross-session -> RUNTIME_OBJECT_OWNERSHIP_CONFLICT", "coordination/version stays actual-model scoped"]
    traceIds: [TR-P2-007, TR-P2-009]
  - id: SCN-P2-CONCURRENT-WRITE
    given: ["two capabilities target same actual ModelData/path", "same frozen version"]
    when: They race using a barrier.
    then: ["one coordination cell serializes", "at most one commit/version increment", "stale loser mutation=0"]
    traceIds: [TR-P2-007, TR-P2-009]
entities:
  - id: ENT-COMPILED-SYSTEM
    name: CompiledSystem
    identity: SystemKey
    attributes:
      - {name: systemKey, type: SystemKey, required: true}
      - {name: ownedModelAccessRuleKeys, type: "Set<ModelAccessRuleKey>", required: true}
    behaviors: ["immutable ownership projection; PolicyIndex remains permission authority"]
    traceIds: [TR-P2-001]
  - id: ENT-COMPILED-RULEVIEW
    name: CompiledRuleView
    identity: RuleViewKey
    attributes:
      - {name: key, type: RuleViewKey, required: true}
      - {name: resolvedViewKey, type: ViewKey, required: true}
      - {name: resolvedRuleKeys, type: "List<RuleKey>", required: true}
    behaviors: ["owns canonical immutable RuleKey closure"]
    traceIds: [TR-P2-002, TR-P2-003]
  - id: ENT-PROTECTED-ACCESS-COMPOSITION
    name: ProtectedAccessComposition
    identity: exact EngineContext + RuntimeExecutionFrameSnapshot + RuntimeModelSession
    attributes:
      - {name: engineContext, type: EngineContext, required: true}
      - {name: frameId, type: RuntimeExecutionFrameId, required: true}
      - {name: ownerResolutionId, type: RuntimeResolutionOwnerId, required: true}
      - {name: runtimeModelSessionId, type: RuntimeModelSessionId, required: true}
    behaviors: ["Rule/Change/CustomAction share one Bridge/Context/frame/owner/session", "callers cannot inject Guard/model port/global Context"]
    traceIds: [TR-P2-007]
valueObjects:
  - id: VO-RULE-KEY
    name: RuleKey
    identity: ownerRuleViewKey + localRuleName
    attributes: [{name: ownerRuleViewKey, type: RuleViewKey, required: true}, {name: localRuleName, type: String, required: true}]
    behaviors: ["exact case-sensitive equality; optional runtime provenance only"]
    traceIds: [TR-P2-002, TR-P2-003]
  - id: VO-TARGET-KEY
    name: TargetKey
    identity: sourceViewKey
    attributes: [{name: sourceViewKey, type: ViewKey, required: true}]
    behaviors: ["shared ViewKey identity; owner System/path excluded"]
    traceIds: [TR-P2-005]
  - id: VO-MODEL-PATH
    name: ModelPath
    identity: canonicalSegments
    attributes: [{name: canonicalSegments, type: "List<String>", required: true}]
    behaviors: ["exact canonical path; runtime wildcard forbidden"]
    traceIds: [TR-P2-005]
  - id: VO-MODEL-ACCESS-RULE-KEY
    name: ModelAccessRuleKey
    identity: owner System + TargetKey + ModelPath + operation
    attributes: [{name: authorizationOwnerSystemKey, type: SystemKey, required: true}, {name: targetKey, type: TargetKey, required: true}, {name: modelPath, type: ModelPath, required: true}, {name: operation, type: READ|WRITE, required: true}]
    behaviors: ["sole policy/Direct-Bridge/WRITE authority"]
    traceIds: [TR-P2-004, TR-P2-005]
  - id: VO-RUNTIME-OPAQUE-ID
    name: Opaque runtime IDs
    identity: exact nonblank case-sensitive string
    attributes: [{name: value, type: String, required: true}]
    behaviors: ["includes RuntimeObjectId and explicit RuntimeModelSessionId", "RuntimeObjectId text never encodes authority/scope"]
    traceIds: [TR-P2-006, TR-P2-009]
  - id: VO-RESOLVED-RUNTIME-TARGET
    name: ResolvedRuntimeTarget
    identity: sessionId + runtimeObjectId + targetKey + bindingProof
    attributes: [{name: sessionId, type: RuntimeModelSessionId, required: true}, {name: runtimeObjectId, type: RuntimeObjectId, required: true}, {name: targetKey, type: TargetKey, required: true}, {name: bindingProof, type: RuntimeBindingProof, required: true}]
    behaviors: ["created only by unique RuntimeTargetResolver after composition-context equality", "Guard/operation consume same immutable target"]
    traceIds: [TR-P2-006, TR-P2-007, TR-P2-009]
  - id: VO-RUNTIME-MUTATION-STAMP
    name: RuntimeMutationStamp
    identity: sessionId + runtimeObjectId + modelPath + version
    attributes: [{name: sessionId, type: RuntimeModelSessionId, required: true}, {name: runtimeObjectId, type: RuntimeObjectId, required: true}, {name: modelPath, type: ModelPath, required: true}, {name: version, type: RuntimeMutationVersion, required: true}]
    behaviors: ["frozen from same target and authority path", "no post-Guard tuple recomposition"]
    traceIds: [TR-P2-007, TR-P2-009]
  - id: VO-RESOLVED-WRITE-INTENT
    name: ResolvedWriteIntent
    identity: RuntimeWriteIntentId
    attributes: [{name: modelAccessRuleKey, type: ModelAccessRuleKey, required: true}, {name: ruleKeyProvenance, type: "Optional<RuleKey>", required: false}, {name: resolvedRuntimeTarget, type: ResolvedRuntimeTarget, required: true}, {name: mutationStamp, type: RuntimeMutationStamp, required: true}]
    behaviors: ["0/N candidates deny before Guard", "stamp session/object equals target and stamp path equals key.modelPath"]
    traceIds: [TR-P2-004, TR-P2-006, TR-P2-009]
  - id: VO-RUNTIME-FACT-VALUE
    name: RuntimeFactValue
    identity: kind + canonical immutable payload
    attributes: [{name: kind, type: NULL|BOOLEAN|INTEGER|DECIMAL|STRING|LIST|OBJECT, required: true}, {name: payload, type: canonical immutable payload, required: false}]
    behaviors: ["deep immutable deterministic snapshot; no live mutable reference"]
    traceIds: [TR-P2-004, TR-P2-009]
aggregates:
  - id: AGG-P2-POLICY-PUBLICATION
    name: P2 policy publication
    root: CompiledModelSet
    members: [CompiledSystem, CompiledRuleView, ModelAccessPolicyIndex, TargetKey, ModelPath, RuntimeBindingPlan]
    invariantIds: [INV-COMPILER-025, INV-COMPILER-026, INV-COMPILER-029, INV-COMPILER-036]
    transactionBoundary: "CONTEXT constructs immutable candidate; COMPILER coordinates atomic publication"
    consistency: ATOMIC
    traceIds: [TR-P2-001, TR-P2-005, TR-P2-006, TR-P2-008]
  - id: AGG-P2-PROTECTED-OPERATION
    name: Protected runtime operation
    root: ProtectedAccessComposition
    members: [ResolvedRuntimeTarget, ResolvedProtectedReadAccess, ResolvedProtectedWriteAccess, one-shot capability, ModelAccessGuard, RuntimeModelSession, RuntimeModelCoordinationCell]
    invariantIds: [INV-COMPILER-027, INV-COMPILER-028, INV-COMPILER-030, INV-COMPILER-031, INV-COMPILER-032, INV-COMPILER-033, INV-COMPILER-034, INV-COMPILER-035, INV-COMPILER-037, INV-COMPILER-038]
    transactionBoundary: "one capability-bound operation; WRITE uses actual-model coordination/transaction"
    consistency: "fail closed; rollback-safe WRITE"
    traceIds: [TR-P2-004, TR-P2-006, TR-P2-007, TR-P2-009]
invariants:
  - {id: INV-COMPILER-024, statement: "Current BM is a complete snapshot; baseRevision never implies omitted inheritance; revision direction is Requirement/Decision -> BM -> Flow -> Design -> TestDesign.", trigger: "candidate materialized", failure: "candidate cannot pass Review", traceIds: [TR-P2-REV-DAG]}
  - {id: INV-COMPILER-025, statement: "Owner System, shared TargetKey, ModelPath and local target binding are distinct axes.", trigger: "model-access compile", failure: "stable error; publication=0", traceIds: [TR-P2-005]}
  - {id: INV-COMPILER-026, statement: "Only STATIC_ALLOW+NONE+no-plan and RUNTIME_GUARD_REQUIRED+EXACT_RUNTIME_BINDING+plan enter PolicyIndex.", trigger: "policy construct/publish", failure: "stable error; old Context remains", traceIds: [TR-P2-006]}
  - {id: INV-COMPILER-027, statement: "READ returns deep immutable snapshot with no mutation; WRITE effect only after Guard ALLOW.", trigger: "protected operation", failure: "DENY/failure leaks no unauthorized effect", traceIds: [TR-P2-004, TR-P2-006]}
  - {id: INV-COMPILER-028, statement: "P3/P4/P6 core depends only on context neutral port, never starter internals.", trigger: "dependency changes", failure: "CrossModule Review fails", traceIds: [TR-P2-007]}
  - {id: INV-COMPILER-029, statement: "ModelAccessRuleKey keeps owner System separate from TargetKey/ModelPath/READ-WRITE.", trigger: "authority lookup", failure: "no fallback", traceIds: [TR-P2-004, TR-P2-005]}
  - {id: INV-COMPILER-030, statement: "WRITE intent uses exact ModelAccessRuleKey + one ResolvedRuntimeTarget; RuleKey is provenance; 0/N deny before Guard.", trigger: "WRITE intent resolution", failure: "WRITE_INTENT_NOT_FOUND/AMBIGUOUS", traceIds: [TR-P2-004, TR-P2-006]}
  - {id: INV-COMPILER-031, statement: "Production effects use dec-core-model runtime access wired by starter; fake callback is not production authority.", trigger: "ALLOW path assembly", failure: "production reachability fails", traceIds: [TR-P2-007, TR-P2-008]}
  - {id: INV-COMPILER-032, statement: "WRITE has one ModelPath and one atomic RuntimeMutationStamp; no duplicate object/path/version tuple.", trigger: "WRITE dispatch", failure: "fail closed before mutation", traceIds: [TR-P2-004, TR-P2-009]}
  - {id: INV-COMPILER-033, statement: "RuntimeTargetResolver is sole selector over plan + exact composition context + sealed session and yields 1 or deterministic context/0/N denial.", trigger: "target resolution", failure: "RUNTIME_CONTEXT_MISMATCH/RUNTIME_TARGET_NOT_FOUND/RUNTIME_TARGET_AMBIGUOUS", traceIds: [TR-P2-006, TR-P2-009]}
  - {id: INV-COMPILER-034, statement: "WRITE commits once or restores model state; stale/failure leaves capability CONSUMED.", trigger: "production WRITE", failure: "modelStateChanged=false; capabilityStateChanged=true", traceIds: [TR-P2-004, TR-P2-007, TR-P2-009]}
  - {id: INV-COMPILER-035, statement: "Lock/version lives in one coordination cell per actual ModelData and path, not per session.", trigger: "concurrent registration/WRITE", failure: "ownership conflict or stale loser; no lost update", traceIds: [TR-P2-007, TR-P2-009]}
  - {id: INV-COMPILER-036, statement: "CONTEXT constructs immutable candidate representation; COMPILER coordinates atomic publication.", trigger: "publication", failure: "old Context remains", traceIds: [TR-P2-008]}
  - {id: INV-COMPILER-037, statement: "One actual ModelData has one coordination cell and at most one active session registration lease.", trigger: "registration", failure: "ALREADY_REGISTERED/OWNERSHIP_CONFLICT", traceIds: [TR-P2-007, TR-P2-009]}
  - {id: INV-COMPILER-038, statement: "Explicit RuntimeModelSessionId makes scope mismatch, active-session absence and stale binding deterministic without parsing RuntimeObjectId.", trigger: "target locate/validate", failure: "SCOPE_MISMATCH/NOT_FOUND/STALE", traceIds: [TR-P2-006, TR-P2-009]}
stateMachines:
  - id: SM-P2-CAPABILITY
    name: One-shot protected access capability
    initialState: ISSUED
    states: [ISSUED, CONSUMED]
    terminalStates: [CONSUMED]
    transitions:
      - {id: TRANS-P2-CAPABILITY-CONSUME, from: ISSUED, command: atomicConsume, to: CONSUMED, preconditions: ["resolved access immutable"], sideEffects: ["at most one Guard/operation attempt"], failure: CAPABILITY_ALREADY_CONSUMED}
    traceIds: [TR-P2-007]
  - id: SM-P2-WRITE-TRANSACTION
    name: Protected WRITE transaction
    initialState: PREPARED
    states: [PREPARED, COMMITTED, ROLLED_BACK, STALE_REJECTED]
    terminalStates: [COMMITTED, ROLLED_BACK, STALE_REJECTED]
    transitions:
      - {id: TRANS-P2-WRITE-COMMIT, from: PREPARED, command: commitExactMutation, to: COMMITTED, preconditions: ["Guard ALLOW", "current version equals stamp.version"], sideEffects: ["one mutation", "version +1", "receipt after commit"], failure: RUNTIME_WRITE_FAILED}
      - {id: TRANS-P2-WRITE-ROLLBACK, from: PREPARED, command: operationFailure, to: ROLLED_BACK, preconditions: ["transaction started"], sideEffects: ["restore model state", "receipt absent", "capability CONSUMED"], failure: RUNTIME_WRITE_FAILED}
      - {id: TRANS-P2-WRITE-STALE, from: PREPARED, command: versionMismatch, to: STALE_REJECTED, preconditions: ["current version differs"], sideEffects: ["mutation=0", "receipt absent", "capability CONSUMED"], failure: WRITE_INTENT_STALE}
    traceIds: [TR-P2-007, TR-P2-009]
services:
  - {id: SVC-P2-SOURCE-MODEL-RESOLUTION, name: Shared source model resolution, reason: "preserve P1 source identity", inputs: [sourceModel, shared ViewKey SymbolTable], outputs: ["TargetKey or stable error"], traceIds: [TR-P2-005]}
  - {id: SVC-P2-RUNTIME-TARGET-RESOLUTION, name: Runtime target resolution, reason: "implementation-unique plan-to-object binding", inputs: [RuntimeBindingPlan, typed invocation, composition frame/owner, sealed RuntimeModelSession], outputs: ["one ResolvedRuntimeTarget or context/0/N denial"], traceIds: [TR-P2-006, TR-P2-009]}
  - {id: SVC-P2-WRITE-INTENT-RESOLUTION, name: Write intent resolution, reason: "freeze authority/target/stamp before Guard", inputs: [ModelAccessRuleKey, ResolvedRuntimeTarget, RuntimeMutationStamp], outputs: ["one intent or 0/N denial"], traceIds: [TR-P2-004, TR-P2-006, TR-P2-009]}
  - {id: SVC-P2-TRANSACTIONAL-WRITE, name: Transactional protected WRITE, reason: "rollback-safe actual-model mutation", inputs: [ResolvedProtectedWriteAccess, RuntimeModelCoordinationCell], outputs: ["receipt or stale/failure denial"], traceIds: [TR-P2-004, TR-P2-007, TR-P2-009]}
policies:
  - {id: POL-P2-CLASSIFICATION, name: Policy classification truth table, reason: "prevent runtime repair", inputs: [PolicyStatus, RuntimeAccessRequirement, RuntimeBindingPlan presence], outputs: ["legal rule or publication error"], traceIds: [TR-P2-006]}
  - {id: POL-P2-RUNTIME-TARGET-SELECTION, name: Exact runtime target selection, reason: "prevent arbitrary selector fallback", inputs: [RuntimeBindingPlan, composition frame/owner/cursor, sealed RuntimeModelSession], outputs: ["exact target or denial"], traceIds: [TR-P2-006, TR-P2-009]}
  - {id: POL-P2-CONCURRENT-WRITE, name: Actual-model/path concurrent WRITE, reason: "prevent alias split version domains", inputs: [RuntimeModelCoordinationCell, RuntimeMutationStamp], outputs: ["one same-version commit max"], traceIds: [TR-P2-007, TR-P2-009]}
businessErrors:
  - {id: ERR-P2-SOURCE-MODEL-NOT-FOUND, condition: "shared source ViewKey missing", meaning: "P1 source model does not exist", retryable: false, stateChanged: false, traceIds: [TR-P2-005]}
  - {id: ERR-P2-POLICY-CLASSIFICATION-INVALID, condition: "policy tuple illegal", meaning: "malformed permission facts cannot publish", retryable: false, stateChanged: false, traceIds: [TR-P2-006]}
  - {id: ERR-P2-RUNTIME-CONTEXT-MISMATCH, condition: "invocation frame/owner differs from composition", meaning: "invocation outside composition runtime scope", retryable: false, stateChanged: false, traceIds: [TR-P2-006, TR-P2-009]}
  - {id: ERR-P2-RUNTIME-TARGET-NOT-FOUND, condition: "resolver candidate count zero", meaning: "current plan/facts identify no target", retryable: false, stateChanged: false, traceIds: [TR-P2-006, TR-P2-009]}
  - {id: ERR-P2-RUNTIME-TARGET-AMBIGUOUS, condition: "resolver candidate count >1", meaning: "current facts identify no unique target", retryable: false, stateChanged: false, traceIds: [TR-P2-006, TR-P2-009]}
  - {id: ERR-P2-WRITE-INTENT-NOT-FOUND, condition: "WRITE intent count zero", meaning: "no unique current mutation", retryable: false, stateChanged: false, traceIds: [TR-P2-006, TR-P2-009]}
  - {id: ERR-P2-WRITE-INTENT-AMBIGUOUS, condition: "WRITE intent count >1", meaning: "current state identifies no unique mutation", retryable: false, stateChanged: false, traceIds: [TR-P2-006, TR-P2-009]}
  - {id: ERR-P2-RUNTIME-SESSION-SCOPE-MISMATCH, condition: "target.sessionId differs from current sessionId", meaning: "explicit scope proof mismatch; RuntimeObjectId text is not interpreted", retryable: false, stateChanged: false, traceIds: [TR-P2-006, TR-P2-009]}
  - {id: ERR-P2-RUNTIME-OBJECT-NOT-FOUND, condition: "matching active session has no object binding", meaning: "selected runtime object is absent", retryable: false, stateChanged: false, traceIds: [TR-P2-006, TR-P2-009]}
  - {id: ERR-P2-RUNTIME-OBJECT-STALE, condition: "matching previously valid session/binding closed or expired", meaning: "frozen runtime binding is no longer current", retryable: false, stateChanged: false, traceIds: [TR-P2-006, TR-P2-009]}
  - {id: ERR-P2-RUNTIME-OBJECT-ALREADY-REGISTERED, condition: "same actual ModelData registered twice in same active session", meaning: "duplicate object authority forbidden", retryable: false, stateChanged: false, traceIds: [TR-P2-007, TR-P2-009]}
  - {id: ERR-P2-RUNTIME-OBJECT-OWNERSHIP-CONFLICT, condition: "same actual ModelData already leased to another active session", meaning: "cross-session alias authority forbidden", retryable: false, stateChanged: false, traceIds: [TR-P2-007, TR-P2-009]}
  - {id: ERR-P2-WRITE-INTENT-STALE, condition: "actual-model/path version differs from stamp", meaning: "modelStateChanged=false; capabilityStateChanged=true because capability remains CONSUMED", retryable: false, stateChanged: true, traceIds: [TR-P2-007, TR-P2-009]}
  - {id: ERR-P2-RUNTIME-WRITE-FAILED, condition: "mutation/transaction/commit fails after Guard ALLOW", meaning: "rollback gives modelStateChanged=false; capabilityStateChanged=true because capability remains CONSUMED", retryable: false, stateChanged: true, traceIds: [TR-P2-004, TR-P2-007, TR-P2-009]}
  - {id: ERR-P2-CAPABILITY-CONSUMED, condition: "already-consumed capability invoked", meaning: "replay/concurrent loser cannot reach Guard/effect", retryable: false, stateChanged: false, traceIds: [TR-P2-007]}
traceability:
  - {traceId: TR-P2-001, modelRefs: [BM-R20, FLOW-R10, DESIGN-P2-R22, TESTDESIGN-P2-R23]}
