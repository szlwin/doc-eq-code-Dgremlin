schemaVersion: 1
artifact: business_model
module:
  code: COMPILER
  name: dec-core-compiler
revision: BM-R12
baseRevision: BM-R07@7d7bf504ca9d
status: MATERIALIZED_CANONICAL_CANDIDATE
machineStatus: MACHINE_BLOCKED
lineage:
  inheritedP1Revision: BM-R07@7d7bf504ca9d
  remediationSources:
    - changes/p2-business-model-review-remediation-r09.yaml
    - changes/p2-business-model-runtime-binding-proof-remediation-r10.yaml
    - changes/p2-business-model-operation-bound-capability-remediation-r11.yaml
    - changes/p2-business-model-unified-protected-access-remediation-r12.yaml
  note: P1 Source/Canonical/Raw/TypedKey/Reference/Deferred/Diagnostic/digest/atomic-publication semantics are inherited unchanged.
terms:
  - id: TERM-SYSTEM-COMPILED-IDENTITY
    name: System compiled identity
    definition: System uses an explicit SystemKey as first-class compiled identity; filename, directory, load order and RuleView name are never identity sources.
  - id: TERM-RULEVIEW-COMPOSITE-IDENTITY
    name: RuleView composite identity
    definition: RuleView identity is exactly (SystemKey,name); same name across Systems is legal, same name within one System is duplicate, and new paths do not use bare-name lookup.
  - id: TERM-MODEL-PATH
    name: ModelPath
    definition: Canonical exact path shared by rule/change/query/access-control consumers; runtime wildcard/fuzzy/parent fallback is forbidden.
  - id: TERM-MODEL-ACCESS-RULE
    name: ModelAccessRule
    definition: Compiler authorization fact over System, target, exact ModelPath, AccessOperation and SourceRef; undeclared access has no implicit allow.
  - id: TERM-MODEL-ACCESS-POLICY-INDEX
    name: ModelAccessPolicyIndex
    definition: Single immutable runtime policy authority built by compiler from final exact compiled access rules and published with CompiledModelSet.
  - id: TERM-PROTECTED-ACCESS
    name: Protected access
    definition: Any P2-controlled READ/WRITE/EXECUTE; STATIC_ALLOW also passes Gateway and Guard.
scenarios:
  - id: SCN-P2-SYSTEM-MULTISOURCE
    given:
      - multiple system-file-info inputs
      - input order may vary
    when: compiler registers Systems and resolves references
    then:
      - equivalent semantics yield the same SystemKey set and semantic digest
      - duplicate exact SystemKey is MIX-SYSTEM-DUPLICATE
      - forward references resolve after symbol registration
      - any ERROR prevents candidate publication
    traceIds: [TR-P2-SYSTEM-RULEVIEW-001, TR-P2-SYSTEM-RULEVIEW-008, TR-P2-SYSTEM-RULEVIEW-009]
  - id: SCN-P2-RULEVIEW-COMPOSITE
    given:
      - RuleViews are System-owned
    when: compiler registers or runtime resolves a RuleView
    then:
      - key is exactly (SystemKey,name)
      - missing System is MIX-RULEVIEW-SYSTEM-REQUIRED
      - same-System duplicate is ERROR
      - cross-System same name is isolated
      - system-ref plus rule-ref resolves exactly
      - new bare-name fallback is rejected
    traceIds: [TR-P2-SYSTEM-RULEVIEW-002, TR-P2-SYSTEM-RULEVIEW-003, TR-P2-SYSTEM-RULEVIEW-009, TR-P2-SYSTEM-RULEVIEW-010]
  - id: SCN-P2-MODEL-ACCESS-STATIC
    given:
      - System, target, path and operation are compile-time exact
    when: model access compilation completes
    then:
      - valid direct exact access becomes STATIC_ALLOW
      - STATIC_ALLOW has no runtime requirement or plan
      - undeclared access, unknown path or unauthorized shared WRITE is compile ERROR
      - read wildcard is finite-expanded at compile time only
    traceIds: [TR-P2-SYSTEM-RULEVIEW-004, TR-P2-SYSTEM-RULEVIEW-005]
  - id: SCN-P2-MODEL-ACCESS-RUNTIME
    given:
      - access rule is legal but actual collection element is known only at runtime
    when: compiler classifies dynamic binding
    then:
      - EVERY_COLLECTION_ELEMENT becomes RUNTIME_OBJECT_BOUND/RUNTIME_GUARD_REQUIRED
      - exact RuntimeAccessRequirement and RuntimeBindingPlan are required
      - unsupported dynamic selector is compile ERROR
      - runtime proof can narrow but never create new compiler authorization
    traceIds: [TR-P2-SYSTEM-RULEVIEW-006, TR-P2-SYSTEM-RULEVIEW-007]
aggregates:
  - id: AGG-COMPILATION-SESSION
    root: CompilationSession
    members:
      - ENT-COMPILED-SYSTEM
      - VO-RULEVIEW-KEY
      - ENT-COMPILED-RULEVIEW
      - VO-MODEL-PATH
      - VO-MODEL-ACCESS-RULE
      - ENT-MODEL-ACCESS-POLICY-INDEX
    consistency: ATOMIC
    publicationRule: Any ERROR leaves the previously held EngineContext unchanged.
  - id: AGG-SYSTEM-COMPILED-CONFIG
    root: ENT-COMPILED-SYSTEM
    consistency: STRONG
    invariantRefs: [INV-COMPILER-016, INV-COMPILER-017, INV-COMPILER-018, INV-COMPILER-019]
entities:
  - id: ENT-COMPILED-SYSTEM
    identity: SystemKey
    required: [systemKey, sourceRef]
    rules:
      - explicit identity only
      - deterministic ordering
      - duplicate exact key rejected before publication
  - id: ENT-COMPILED-RULEVIEW
    identity: VO-RULEVIEW-KEY
    required: [ruleViewKey, sourceRef, resolvedRuleRefs]
  - id: ENT-MODEL-ACCESS-POLICY-INDEX
    identity: CompiledModelSet publication closure
    rules:
      - immutable
      - exact keys only
      - single runtime authorization authority
      - compiler-published before semantic digest binding
valueObjects:
  - id: VO-RULEVIEW-KEY
    fields: [SystemKey systemKey, String localName]
    rules:
      - both fields required
      - equality and hashCode include both fields
      - no canonical new-code bare-name key
  - id: VO-MODEL-PATH
    rules:
      - exact
      - case-sensitive
      - canonical
      - no runtime wildcard or fuzzy fallback
  - id: VO-MODEL-ACCESS-RULE
    identityFields: [SystemKey, targetIdentity, ModelPath, AccessOperation]
    states: [STATIC_ALLOW, RUNTIME_GUARD_REQUIRED]
    rules:
      - STATIC_ALLOW has no runtime plan or requirement
      - RUNTIME_GUARD_REQUIRED has exact runtime requirement and plan
services:
  - id: SVC-SYSTEM-COMPILATION
    responsibilities:
      - explicit System registration
      - duplicate detection
      - forward reference resolution after symbol registration
      - deterministic diagnostics and digest input
  - id: SVC-RULEVIEW-RESOLUTION
    responsibilities:
      - register exact (SystemKey,name)
      - resolve system-ref plus rule-ref
      - reject missing System, same-System duplicate, unknown System/Rule and new bare-name fallback
  - id: SVC-MODEL-PATH-COMPILATION
    responsibilities:
      - canonical exact path
      - finite compile-time read wildcard expansion
      - reject unknown/invalid/unsupported dynamic path
  - id: SVC-MODEL-ACCESS-AUTHORIZATION
    responsibilities:
      - compile exact access rules
      - publish one immutable ModelAccessPolicyIndex
      - include authorization semantics in semantic digest
      - route STATIC_ALLOW and runtime-required access through Gateway/Guard
      - deny before protected operation or external effect
policies:
  - id: POL-RULEVIEW-COMPOSITE-IDENTITY
    rule: RuleView registration and new lookup require exact SystemKey plus local name.
  - id: POL-MODEL-ACCESS-AUTHORIZATION
    rule: Only exact compiler-published policy rules may allow protected READ/WRITE/EXECUTE; Guard is mandatory for STATIC_ALLOW and runtime-required branches.
  - id: POL-DEFERRED-BOUNDARY
    rule: P2 does not restore retired dec-expand-declaration and does not implement P3-P7 complete business execution semantics.
invariants:
  - id: INV-COMPILER-016
    rule: System is explicit first-class SystemKey; duplicate exact key is ERROR and input order cannot change semantic result.
  - id: INV-COMPILER-017
    rule: RuleView key is (SystemKey,name); new RuleView System is required; bare-name new registration/lookup is forbidden.
  - id: INV-COMPILER-018
    rule: ModelAccessRule is exact over System/target/path/operation; undeclared access and shared WRITE are denied by default.
  - id: INV-COMPILER-019
    rule: Any P2 semantic ERROR prevents partial CompiledModelSet/EngineContext publication and preserves old Context.
  - id: INV-COMPILER-020
    rule: All protected READ/WRITE/EXECUTE pass the unified Gateway/Guard; STATIC_ALLOW is Guard-internal fast path only.
  - id: INV-COMPILER-021
    rule: Runtime proof only narrows compiler-published authorization and cannot create a new allowance.
  - id: INV-COMPILER-022
    rule: P2 keeps only explicit read-only declaration compatibility boundary; final retirement remains P7.
  - id: INV-COMPILER-023
    rule: ModelAccessPolicyIndex is the only runtime permission authority; Guard exact lookup occurs once and no definitions/typedRegistries/starter secondary policy map may substitute.
  - id: INV-COMPILER-024
    rule: Guard-verified actual target and operation remain bound to one one-shot capability; capability A cannot authorize target B.
diagnostics:
  compile:
    - MIX-SYSTEM-DUPLICATE
    - MIX-SYSTEM-UNKNOWN
    - MIX-RULEVIEW-SYSTEM-REQUIRED
    - MIX-RULEVIEW-DUPLICATE
    - MIX-RULEVIEW-UNKNOWN-SYSTEM
    - MIX-RULEVIEW-UNKNOWN-RULE
    - MIX-MODEL-PATH-INVALID
    - MIX-MODEL-ACCESS-DENIED
    - MIX-MODEL-ACCESS-DYNAMIC-BINDING-UNSUPPORTED
  runtime:
    - POLICY_NOT_FOUND
    - CONTEXT_IDENTITY_MISMATCH
    - MODEL_ACCESS_GUARD_BYPASS
    - PROTECTED_ACCESS_ADAPTER_UNAVAILABLE
    - RUNTIME_BINDING_REQUIRED
    - RUNTIME_BINDING_PROOF_INVALID
    - RUNTIME_BINDING_STALE
    - RUNTIME_BINDING_PLAN_MISMATCH
    - RUNTIME_BINDING_OPERATION_TARGET_MISMATCH
    - RUNTIME_BINDING_CAPABILITY_CONSUMED
    - GUARD_UNAVAILABLE
    - STATIC_ALLOW
    - RUNTIME_ALLOW
    - RUNTIME_DENY
publication:
  policyAuthorityChain:
    - compiled exact access rules
    - ModelAccessPolicyIndex.of
    - SemanticDigestInput same immutable policy index
    - DigestBoundCompiledInput same index plus digest
    - CompiledModelSet.published same index
    - EngineContext.modelAccessPolicyIndex
    - DefaultModelAccessGuard exact lookup once
  rules:
    - System, RuleView, PolicyIndex and digest come from the same immutable publication closure
    - equivalent ordering yields the same semantic digest
    - System/RuleView/authorization semantic change changes semantic digest
    - failed publication preserves old Context
requirementDecisionDelta:
  id: DEC-P2-DIRECT-BRIDGE-AUTHORITY-001
  status: USER_CONFIRMED
  decision: Current P2 production caller may submit exact ModelAccessRuleKey and AccessOperation per bridge invocation.
  semantics:
    - AccessConsumerIrKey is provenance/diagnostic, not an authorization-key dimension in current P2
    - current P2 does not require consumer-to-rule/op binding
    - caller cannot obtain allow for a rule/op absent from current compiler-published PolicyIndex
    - any future per-consumer authority hardening requires a new Requirement/Decision review
traceability:
  AC-P2-SYSTEM-RULEVIEW-001: [ENT-COMPILED-SYSTEM, INV-COMPILER-016, SVC-SYSTEM-COMPILATION]
  AC-P2-SYSTEM-RULEVIEW-002: [VO-RULEVIEW-KEY, INV-COMPILER-017, SVC-RULEVIEW-RESOLUTION]
  AC-P2-SYSTEM-RULEVIEW-003: [VO-RULEVIEW-KEY, SVC-RULEVIEW-RESOLUTION]
  AC-P2-SYSTEM-RULEVIEW-004: [VO-MODEL-ACCESS-RULE, POL-MODEL-ACCESS-AUTHORIZATION]
  AC-P2-SYSTEM-RULEVIEW-005: [VO-MODEL-PATH, SVC-MODEL-PATH-COMPILATION]
  AC-P2-SYSTEM-RULEVIEW-006: [INV-COMPILER-021, SVC-MODEL-ACCESS-AUTHORIZATION]
  AC-P2-SYSTEM-RULEVIEW-007: [INV-COMPILER-020, INV-COMPILER-024]
  AC-P2-SYSTEM-RULEVIEW-008: [AGG-COMPILATION-SESSION, INV-COMPILER-019]
  AC-P2-SYSTEM-RULEVIEW-009: [SVC-SYSTEM-COMPILATION, SVC-RULEVIEW-RESOLUTION]
  AC-P2-SYSTEM-RULEVIEW-010: [INV-COMPILER-022, POL-DEFERRED-BOUNDARY]
gate:
  contentMaterialized: true
  exactIndependentReview: false
  machinePublished: false
  implementationPlanAllowed: false
  tddAllowed: false
  developmentAllowed: false
