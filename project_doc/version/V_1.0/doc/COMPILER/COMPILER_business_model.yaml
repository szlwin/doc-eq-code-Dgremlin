schemaVersion: 1
artifact: business_model
module:
  code: COMPILER
  name: dec-core-compiler
revision: BM-R16
baseRevision: BM-R15
status: NEEDS_EXACT_REVIEW_MACHINE_BLOCKED
canonicalPair:
  machineAuthority: COMPILER_business_model.yaml
  normativeHumanMirror: COMPILER_business_model.md
  rule: semantic mismatch invalidates the whole BM-R16 candidate
inputs:
  - REQAN-P2-R01@d08612768131
  - REQAN-P2-R01+DEC-OVERLAY-20260809-R04
  - DEC-P2-DIRECT-BRIDGE-AUTHORITY-001:ACTIVE
  - DEC-P2-AC007-STAGE-BOUNDARY-001:ACTIVE_OPTION_B
  - DEC-P2-ACCESS-OPERATIONS-001:ACTIVE_READ_WRITE_ONLY
businessFlowRevision: FLOW-R06@p2-system-ruleview-protected-access
terms:
  - id: TERM-SYSTEM-COMPILED-IDENTITY
    definition: SystemKey plus SourceRef plus SystemVersionIdentity plus derived immutable ownership snapshot
  - id: TERM-SYSTEM-OWNERSHIP-SNAPSHOT
    definition: derived read index over explicit authoritative compiled facts; never a registry or authorization authority
  - id: TERM-RULE-KEY
    definition: exact immutable identity (ownerRuleViewKey, localRuleName); authoritative store is the owning CompiledRuleView compiled rule closure
  - id: TERM-MODEL-PATH
    definition: exact P2 canonical path; P1 SharedModelPath is source/compatibility input only
  - id: TERM-ACCESS-OPERATION
    definition: exactly READ or WRITE; there is no current P2 EXECUTE operation
entities:
  - id: ENT-COMPILED-SYSTEM
    identity: SystemKey
    requiredAttributes: [systemKey, sourceRef, versionIdentity, ownedDataKeys, ownedViewKeys, ownedRuleViewKeys, ownedRuleKeys, ownedInformationKeys, ownedModelAccessRuleKeys]
  - id: ENT-COMPILED-RULEVIEW
    identity: RuleViewKey
    requiredAttributes: [key, resolvedViewKey, resolvedRuleKeys, sourceRef]
  - id: ENT-PROTECTED-ACCESS-COMPOSITION
    ownerModule: dec-core-starter
    requiredFacts: [engineContext, bridge, ruleEntry, changeEntry, customActionEntry]
    invariant: all entries share the same bridge and same current immutable EngineContext authority snapshot
valueObjects:
  - id: VO-RULEVIEW-KEY
    fields: [systemKey, localName]
    compatibility:
      existingConstructor: RuleViewKey(SystemKey owner, String name)
      existingAccessors: [owner(), name()]
      additiveAliases: [of(SystemKey,String), systemKey(), localName()]
  - id: VO-RULE-KEY
    fields: [ownerRuleViewKey, localRuleName]
    invariants:
      - ownerRuleViewKey non-null
      - localRuleName nonblank exact canonical source name; no fuzzy/case fallback
      - equality/hash/order identity include ownerRuleViewKey and localRuleName
      - every key in CompiledRuleView.resolvedRuleKeys has ownerRuleViewKey equal to that CompiledRuleView.key
      - no duplicate global Rule registry is created only for ownership
  - id: VO-MODEL-PATH
    fields: [canonicalSegments]
    wildcardRuntimeAllowed: false
  - id: VO-ACCESS-OPERATION
    enumValues: [READ, WRITE]
    executePresent: false
  - id: VO-MODEL-ACCESS-RULE
    fields: [systemKey, targetKey, modelPath, operation, sourceRef, status, runtimeRequirement, runtimePlan]
authoritativeOwnershipSources:
  ownedDataKeys: final owner-qualified typed Data registry
  ownedViewKeys: final owner-qualified typed View registry
  ownedRuleViewKeys: final owner-qualified typed RuleView registry
  ownedInformationKeys: final owner-qualified typed Information registry
  ownedRuleKeys: final CompiledRuleView compiled/nested RuleKey closure
  ownedModelAccessRuleKeys: final ModelAccessPolicyIndex keys / compiled policy rules filtered by System
systemVersionIdentity:
  fields: [declaredVersion, sourceSemanticDigest, schemaVersion, compilerVersion]
  invariants:
    - declaredVersion empty when source declares none
    - schemaVersion equals enclosing CompiledModelSet schemaVersion
    - compilerVersion equals enclosing CompiledModelSet compilerVersion
    - no time/random/load-order identity
p1ToP2Migration:
  sharedModelPath:
    exact: SharedModelPath exact -> shared ModelPathCompiler -> exact ModelPath
    wildcard: SharedModelPath '*' -> deterministic finite exact expansion before policy publication
    runtimeWildcardAllowed: false
  accessMode:
    READ: AccessOperation.READ
    WRITE: AccessOperation.WRITE
    EXECUTE: NOT_SUPPORTED_BY_CURRENT_P2
  runtimeAuthority: [ModelPath, AccessOperation, ModelAccessPolicyIndex]
accessOperations:
  values: [READ, WRITE]
  independent: true
  rules:
    - READ never implies WRITE
    - WRITE never implies READ
    - undeclared operation DENY
    - no EXECUTE source raw IR enum policy bridge guard or test contract
modelAccessIdentity:
  key: [SystemKey, TargetKey, ModelPath, AccessOperation]
  consumerKindInAuthorizationKey: false
  authority: ModelAccessPolicyIndex
ac007:
  decisionId: DEC-P2-AC007-STAGE-BOUNDARY-001
  status: ACTIVE_OPTION_B_USER_DECIDED
  representativeConsumers:
    - RuleProtectedAccessEntry
    - ChangeProtectedAccessEntry
    - CustomActionProtectedAccessEntry
  productionAcquisition:
    ownerModule: dec-core-starter
    root: ProtectedAccessRuntimeFactory
    output: ProtectedAccessComposition
    compositionReads: [bridge, ruleEntry, changeEntry, customActionEntry]
    invariant: all reads are bound to same EngineContext and same bridge
  forbiddenConsumerAuthorities: [ProtectedAccessGateway, ModelAccessGuard, targetResolver, rawOperationPort, mutableOrSecondaryPolicyIndex, issuedPairMint, capabilityMint]
  downstreamFullSemantics:
    P3: full Rule/Information engine
    P4: full change/custom-action/Action/Produce state machine
    P6: full QueryPlan compile/execute
oneShotCapability:
  visibility: starter-internal
  binding: [invocationIdentity, actualTarget, AccessOperation]
  concurrency: ATOMIC_CONSUME
  stateTransition: ISSUED -> CONSUMED
  maxSuccessfulConsume: 1
  loserDenial: CAPABILITY_ALREADY_CONSUMED
bareNameCompatibility:
  newP2Adapter: ABSENT
  historicalReadBoundaryMayRemain: true
  constraints: [readOnly, noNewRegistryWrite, noPolicyMutation, noProtectedWrite, ambiguousNameReject, noCanonicalFallback]
invariants:
  - id: INV-COMPILER-016B
    statement: CompiledSystem ownership snapshot exactly coheres with authoritative sources and never becomes authority
  - id: INV-COMPILER-017A
    statement: CompiledRuleView view/rule references exact-resolve; RuleKey closure is owner-qualified and unique
  - id: INV-COMPILER-018
    statement: rule change query-contract model-access equal path inputs produce value-equal exact ModelPath
  - id: INV-COMPILER-018A
    statement: READ and WRITE are independent; no EXECUTE exists in current P2
  - id: INV-COMPILER-019
    statement: registries RuleView closure policy ownership version and digest publish atomically
  - id: INV-COMPILER-020
    statement: all representative P2 protected consumers are acquired from production composition and traverse one Bridge Gateway Guard authority seam
  - id: INV-COMPILER-020A
    statement: one-shot capability uses atomic ISSUED-to-CONSUMED transition; at most one concurrent consume can execute effect
  - id: INV-COMPILER-021
    statement: compile ERROR and runtime DENY are deterministic source-aware and non-sensitive
  - id: INV-COMPILER-023
    statement: P1 SharedModelPath and AccessMode are one-way source inputs and never runtime authority after conversion
gate:
  openP1: 19
  requirementReview: REQUIRED
  businessFlowReview: REQUIRED
  riskDetection: NOT_SCANNED
  implementationPlan: BLOCKED
  tdd: BLOCKED
  development: BLOCKED
