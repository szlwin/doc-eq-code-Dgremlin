schemaVersion: 1
changeSet:
  id: CHG-V_1.0-COMPILER-P2-BM-R06
  version: V_1.0
  module: COMPILER
  featureCode: P2-SYSTEM-RULEVIEW
  reason: P2 makes System first-class, RuleView system-scoped, and model-access fail-closed across static/runtime
    boundaries.
  baseRevisions:
    business_model: BM-R05@4ecb1f8c09f4
  resultRevisions:
    business_model: BM-R06@6a0bce4fa0ae
  affectedTraceIds:
  - TR-P2-SYSTEM-RULEVIEW-001
  - TR-P2-SYSTEM-RULEVIEW-002
  - TR-P2-SYSTEM-RULEVIEW-003
  - TR-P2-SYSTEM-RULEVIEW-004
  - TR-P2-SYSTEM-RULEVIEW-005
  - TR-P2-SYSTEM-RULEVIEW-006
  - TR-P2-SYSTEM-RULEVIEW-007
  - TR-P2-SYSTEM-RULEVIEW-008
  - TR-P2-SYSTEM-RULEVIEW-009
  - TR-P2-SYSTEM-RULEVIEW-010
operations:
- artifact: business_model
  collection: terms
  operation: update
  targetId: TERM-DEFERRED-DEFINITION
  beforeRef: COMPILER_business_model.yaml#TERM-DEFERRED-DEFINITION
  after:
    id: TERM-DEFERRED-DEFINITION
    name: DeferredDefinition
    definition: 当前阶段尚未拥有的后续语义登记。P2 已消费 System、RuleView 与 model-access 所有权/授权语义；P3～P8 仍必须以 requiredStage、reason、SourceRef
      与已解析 Key 显式 Deferred。
    forbiddenSynonyms:
    - ignored definition
    - partially compiled runtime
    sourceRefs:
    - BR-P1-007
    - BR-P1-008
    - BR-P2-SYSTEM-RULEVIEW-020
  reason: Align the P1 baseline/deferred model with P2-owned System, RuleView and model-access semantics.
- artifact: business_model
  collection: terms
  operation: add
  targetId: TERM-SYSTEM-COMPILED-IDENTITY
  after:
    id: TERM-SYSTEM-COMPILED-IDENTITY
    name: System compiled identity
    definition: System 以显式 SystemKey 作为一等编译身份；身份不得由文件名、路径、RuleView 名称或加载顺序推断。
    forbiddenSynonyms:
    - implicit system
    - file-derived system
    sourceRefs:
    - BR-P2-SYSTEM-RULEVIEW-001
    - BR-P2-SYSTEM-RULEVIEW-002
  reason: P2 System/RuleView/model-access business model increment.
- artifact: business_model
  collection: terms
  operation: add
  targetId: TERM-RULEVIEW-COMPOSITE-IDENTITY
  after:
    id: TERM-RULEVIEW-COMPOSITE-IDENTITY
    name: RuleView composite identity
    definition: RuleView 的唯一身份是 (SystemKey,name)；跨 System 同名合法，同一 System 重复定义非法，调用不得回退为裸 name。
    forbiddenSynonyms:
    - global RuleView name
    - bare RuleView lookup
    sourceRefs:
    - BR-P2-SYSTEM-RULEVIEW-003
    - BR-P2-SYSTEM-RULEVIEW-004
    - BR-P2-SYSTEM-RULEVIEW-005
  reason: P2 System/RuleView/model-access business model increment.
- artifact: business_model
  collection: terms
  operation: add
  targetId: TERM-MODEL-ACCESS-RULE
  after:
    id: TERM-MODEL-ACCESS-RULE
    name: ModelAccessRule
    definition: 由 System、目标模型或 View、规范化 ModelPath、READ/WRITE/EXECUTE 操作与 SourceRef 共同限定的访问授权事实；未声明权限不产生隐式允许。
    forbiddenSynonyms:
    - default allow
    - shared write by default
    sourceRefs:
    - BR-P2-SYSTEM-RULEVIEW-007
    - BR-P2-SYSTEM-RULEVIEW-008
    - BR-P2-SYSTEM-RULEVIEW-009
  reason: P2 System/RuleView/model-access business model increment.
- artifact: business_model
  collection: terms
  operation: add
  targetId: TERM-MODEL-PATH
  after:
    id: TERM-MODEL-PATH
    name: ModelPath
    definition: 对模型属性路径做精确、确定性、可复用编译后的路径身份；expression、change、query 与权限校验共享同一语义，不允许模糊或跨模型猜测。
    forbiddenSynonyms:
    - fuzzy model path
    - root-property fallback
    sourceRefs:
    - BR-P2-SYSTEM-RULEVIEW-010
    - BR-P2-SYSTEM-RULEVIEW-011
  reason: P2 System/RuleView/model-access business model increment.
- artifact: business_model
  collection: scenarios
  operation: add
  targetId: SCN-P2-SYSTEM-MULTISOURCE
  after:
    id: SCN-P2-SYSTEM-MULTISOURCE
    given:
    - 多个 system-file-info 来源声明不同 System
    - 加载顺序可能变化
    when: 编译器注册 System 定义
    then:
    - 相同语义输入得到相同 SystemKey 集合与 semanticDigest
    - 同一 SystemKey 重复定义产生稳定 ERROR 且不发布候选 Context
    traceIds:
    - TR-P2-SYSTEM-RULEVIEW-001
    - TR-P2-SYSTEM-RULEVIEW-008
    - TR-P2-SYSTEM-RULEVIEW-009
  reason: P2 System/RuleView/model-access business model increment.
- artifact: business_model
  collection: scenarios
  operation: add
  targetId: SCN-P2-RULEVIEW-ISOLATION
  after:
    id: SCN-P2-RULEVIEW-ISOLATION
    given:
    - 两个不同 System 均声明同名 RuleView
    when: 调用方以 system-ref + rule-ref 解析 RuleView
    then:
    - 分别命中各自 (SystemKey,name) 定义
    - 裸 name 查找与同 System 重复定义被拒绝
    traceIds:
    - TR-P2-SYSTEM-RULEVIEW-002
    - TR-P2-SYSTEM-RULEVIEW-003
  reason: P2 System/RuleView/model-access business model increment.
- artifact: business_model
  collection: scenarios
  operation: add
  targetId: SCN-P2-MODEL-ACCESS-STATIC
  after:
    id: SCN-P2-MODEL-ACCESS-STATIC
    given:
    - ModelAccessRule 的 System、目标、ModelPath 与 operation 在编译期可确定
    when: 编译器执行访问规则验证
    then:
    - 明确声明的合法操作编译为 Allow 事实
    - 未声明共享 WRITE、非法路径或越界引用产生 ERROR 并阻断发布
    traceIds:
    - TR-P2-SYSTEM-RULEVIEW-004
    - TR-P2-SYSTEM-RULEVIEW-005
    - TR-P2-SYSTEM-RULEVIEW-008
  reason: P2 System/RuleView/model-access business model increment.
- artifact: business_model
  collection: scenarios
  operation: add
  targetId: SCN-P2-MODEL-ACCESS-RUNTIME
  after:
    id: SCN-P2-MODEL-ACCESS-RUNTIME
    given:
    - 访问在编译期合法但最终资源/路径取值只能在运行时确定
    when: Rule、change 或 custom action 尝试 mutation
    then:
    - 统一 Guard 在 mutation 与外部副作用之前判定
    - DENY 时不改变业务状态且无旁路入口
    traceIds:
    - TR-P2-SYSTEM-RULEVIEW-006
    - TR-P2-SYSTEM-RULEVIEW-007
  reason: P2 System/RuleView/model-access business model increment.
- artifact: business_model
  collection: entities
  operation: add
  targetId: ENT-COMPILED-SYSTEM
  after:
    id: ENT-COMPILED-SYSTEM
    name: CompiledSystem
    identity: systemKey
    attributes:
    - name: systemKey
      type: SystemKey
      required: true
    - name: sourceRefs
      type: List<SourceRef>
      required: true
    - name: dataRefs
      type: Set<DataKey>
      required: true
    - name: viewRefs
      type: Set<ViewKey>
      required: true
    - name: ruleViewKeys
      type: Set<RuleViewKey>
      required: true
    - name: modelAccessRules
      type: Set<ModelAccessRule>
      required: true
    behaviors:
    - publishImmutable
    - rejectDuplicateSystemKey
    - exposeOwnerQualifiedMembers
    traceIds:
    - TR-P2-SYSTEM-RULEVIEW-001
    - TR-P2-SYSTEM-RULEVIEW-002
    - TR-P2-SYSTEM-RULEVIEW-004
    - TR-P2-SYSTEM-RULEVIEW-008
  reason: P2 System/RuleView/model-access business model increment.
- artifact: business_model
  collection: valueObjects
  operation: update
  targetId: VO-MODEL-ACCESS-BINDING
  beforeRef: COMPILER_business_model.yaml#VO-MODEL-ACCESS-BINDING
  after:
    id: VO-MODEL-ACCESS-BINDING
    name: ModelAccessBinding
    identity: systemKey+sourcePath+operation+targetView+selector
    attributes:
    - name: systemKey
      type: SystemKey
      required: true
    - name: operation
      type: READ|WRITE|EXECUTE
      required: true
    - name: sourcePath
      type: SharedModelPath
      required: true
    - name: targetView
      type: ViewKey
      required: true
    - name: selector
      type: TargetSelector
      required: true
    - name: resolvedTarget
      type: ViewRoot|PropertyPath
      required: true
    behaviors:
    - resolveTargetMainFirst
    - resolveExactPropertyPathFallback
    - rejectDuplicateOrAmbiguous
    traceIds:
    - TR-P1-COMPILER-008
    - TR-P1-COMPILER-009
    - TR-P2-SYSTEM-RULEVIEW-004
    - TR-P2-SYSTEM-RULEVIEW-005
  reason: Align the P1 baseline/deferred model with P2-owned System, RuleView and model-access semantics.
- artifact: business_model
  collection: valueObjects
  operation: update
  targetId: VO-DEFERRED-DEFINITION
  beforeRef: COMPILER_business_model.yaml#VO-DEFERRED-DEFINITION
  after:
    id: VO-DEFERRED-DEFINITION
    name: DeferredDefinition
    identity: definitionKey+requiredStage+reason
    attributes:
    - name: definitionKey
      type: TypedKey
      required: true
    - name: requiredStage
      type: P3|P4|P5|P6|P7|P8
      required: true
    - name: reason
      type: String
      required: true
    - name: sourceRef
      type: SourceRef
      required: true
    - name: resolvedKeys
      type: Set<TypedKey>
      required: true
    behaviors:
    - validateCompleteness
    traceIds:
    - TR-P1-COMPILER-004
    - TR-P1-COMPILER-008
    - TR-P1-COMPILER-009
    - TR-P2-SYSTEM-RULEVIEW-010
  reason: Align the P1 baseline/deferred model with P2-owned System, RuleView and model-access semantics.
- artifact: business_model
  collection: valueObjects
  operation: add
  targetId: VO-RULEVIEW-KEY
  after:
    id: VO-RULEVIEW-KEY
    name: RuleViewKey
    identity: systemKey+name
    attributes:
    - name: systemKey
      type: SystemKey
      required: true
    - name: name
      type: String
      required: true
    behaviors:
    - canonical
    - rejectBareNameFallback
    traceIds:
    - TR-P2-SYSTEM-RULEVIEW-002
    - TR-P2-SYSTEM-RULEVIEW-003
  reason: P2 System/RuleView/model-access business model increment.
- artifact: business_model
  collection: valueObjects
  operation: add
  targetId: VO-MODEL-PATH
  after:
    id: VO-MODEL-PATH
    name: ModelPath
    identity: modelKey+segments
    attributes:
    - name: modelKey
      type: TypedKey
      required: true
    - name: segments
      type: List<String>
      required: true
    behaviors:
    - compileExact
    - rejectUnknownSegment
    - rejectNonCompositeIntermediate
    - canonical
    traceIds:
    - TR-P2-SYSTEM-RULEVIEW-005
  reason: P2 System/RuleView/model-access business model increment.
- artifact: business_model
  collection: valueObjects
  operation: add
  targetId: VO-MODEL-ACCESS-RULE
  after:
    id: VO-MODEL-ACCESS-RULE
    name: ModelAccessRule
    identity: systemKey+targetKey+modelPath+operation
    attributes:
    - name: systemKey
      type: SystemKey
      required: true
    - name: targetKey
      type: DataKey|ViewKey|RuleViewKey
      required: true
    - name: modelPath
      type: ModelPath
      required: true
    - name: operation
      type: READ|WRITE|EXECUTE
      required: true
    - name: sourceRef
      type: SourceRef
      required: true
    behaviors:
    - compileStaticDecision
    - requireRuntimeGuardWhenDeferred
    - denyWhenUndeclared
    traceIds:
    - TR-P2-SYSTEM-RULEVIEW-004
    - TR-P2-SYSTEM-RULEVIEW-005
    - TR-P2-SYSTEM-RULEVIEW-006
    - TR-P2-SYSTEM-RULEVIEW-007
  reason: P2 System/RuleView/model-access business model increment.
- artifact: business_model
  collection: aggregates
  operation: update
  targetId: AGG-COMPILATION-SESSION
  beforeRef: COMPILER_business_model.yaml#AGG-COMPILATION-SESSION
  after:
    id: AGG-COMPILATION-SESSION
    name: Compilation Session Aggregate
    root: ENT-COMPILATION-SESSION
    members:
    - ENT-MIX-SOURCE-GRAPH
    - ENT-RAW-DEFINITION-SET
    - ENT-SYMBOL-TABLE
    - ENT-DEFERRED-REGISTRY
    - VO-DOCUMENT-SOURCE
    - VO-CANONICAL-DOCUMENT-NODE
    - VO-SOURCE-REF
    - VO-TYPED-KEY
    - VO-INFORMATION-KEY
    - VO-MODEL-ACCESS-BINDING
    - VO-DEFERRED-DEFINITION
    - VO-DIAGNOSTIC
    - VO-DIGEST-PAIR
    - VO-COMPILATION-RESULT
    - ENT-COMPILED-SYSTEM
    - VO-RULEVIEW-KEY
    - VO-MODEL-PATH
    - VO-MODEL-ACCESS-RULE
    invariantIds:
    - INV-COMPILER-001
    - INV-COMPILER-002
    - INV-COMPILER-003
    - INV-COMPILER-004
    - INV-COMPILER-005
    - INV-COMPILER-006
    - INV-COMPILER-007
    - INV-COMPILER-008
    - INV-COMPILER-009
    - INV-COMPILER-010
    - INV-COMPILER-011
    - INV-COMPILER-012
    - INV-COMPILER-013
    - INV-COMPILER-016
    - INV-COMPILER-017
    - INV-COMPILER-018
    - INV-COMPILER-019
    - INV-COMPILER-020
