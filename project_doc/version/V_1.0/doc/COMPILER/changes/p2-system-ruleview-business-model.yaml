- artifact: business_model
  collection: invariants
  operation: update
  targetId: INV-COMPILER-008
  beforeRef: COMPILER_business_model.yaml#INV-COMPILER-008
  after:
    id: INV-COMPILER-008
    statement: P2 已消费 System、RuleView 与 model-access 所有权/授权语义；其余 P3～P8 语义仍必须登记包含 requiredStage、reason、SourceRef 和已解析
      TypedKey 的 DeferredDefinition，P2 不提前执行后续运行语义。
    trigger: Deferred 分类
    failure: ERR-MIX-DEFERRED-INCOMPLETE
    traceIds:
    - TR-P1-COMPILER-004
    - TR-P1-COMPILER-008
    - TR-P1-COMPILER-009
    - TR-P2-SYSTEM-RULEVIEW-010
  reason: Align the P1 baseline/deferred model with P2-owned System, RuleView and model-access semantics.
- artifact: business_model
  collection: invariants
  operation: add
  targetId: INV-COMPILER-016
  after:
    id: INV-COMPILER-016
    statement: SystemKey 必须来自显式 System 声明且与来源顺序无关；同一 SystemKey 的重复定义必须产生 ERROR，禁止路径或文件名推断身份。
    trigger: 注册 System
    failure: ERR-MIX-SYSTEM-DUPLICATE
    traceIds:
    - TR-P2-SYSTEM-RULEVIEW-001
    - TR-P2-SYSTEM-RULEVIEW-009
  reason: P2 System/RuleView/model-access business model increment.
- artifact: business_model
  collection: invariants
  operation: add
  targetId: INV-COMPILER-017
  after:
    id: INV-COMPILER-017
    statement: RuleView 的身份和所有查找必须使用 (SystemKey,name)；跨 System 同名合法，同 System 重复定义与裸 name 回退均非法。
    trigger: 注册或解析 RuleView
    failure: ERR-MIX-RULEVIEW-DUPLICATE 或 ERR-MIX-RULEVIEW-UNKNOWN
    traceIds:
    - TR-P2-SYSTEM-RULEVIEW-002
    - TR-P2-SYSTEM-RULEVIEW-003
  reason: P2 System/RuleView/model-access business model increment.
- artifact: business_model
  collection: invariants
  operation: add
  targetId: INV-COMPILER-018
  after:
    id: INV-COMPILER-018
    statement: READ、WRITE、EXECUTE 三种权限独立判定；未声明权限不产生允许，尤其共享模型 WRITE 默认拒绝。
    trigger: 编译 ModelAccessRule
    failure: ERR-MIX-MODEL-ACCESS-DENIED
    traceIds:
    - TR-P2-SYSTEM-RULEVIEW-004
  reason: P2 System/RuleView/model-access business model increment.
- artifact: business_model
  collection: invariants
  operation: add
  targetId: INV-COMPILER-019
  after:
    id: INV-COMPILER-019
    statement: 能由 System、目标、ModelPath 和 operation 在编译期确定的非法访问必须阻断发布；只有静态合法但资源事实真正依赖运行时的访问才可登记 RuntimeGuardRequired。
    trigger: 访问规则编译
    failure: ERR-MIX-MODEL-ACCESS-DENIED
    traceIds:
    - TR-P2-SYSTEM-RULEVIEW-004
    - TR-P2-SYSTEM-RULEVIEW-006
    - TR-P2-SYSTEM-RULEVIEW-008
  reason: P2 System/RuleView/model-access business model increment.
- artifact: business_model
  collection: invariants
  operation: add
  targetId: INV-COMPILER-020
  after:
    id: INV-COMPILER-020
    statement: 所有 Rule、change 与 custom action 的 mutation 路径在需要动态判定时必须先经过同一访问 Guard；DENY 必须发生在状态变更或外部副作用之前。
    trigger: 运行时 mutation 授权
    failure: ERR-MIX-MODEL-ACCESS-RUNTIME-DENIED
    traceIds:
    - TR-P2-SYSTEM-RULEVIEW-006
    - TR-P2-SYSTEM-RULEVIEW-007
  reason: P2 System/RuleView/model-access business model increment.
- artifact: business_model
  collection: invariants
  operation: add
  targetId: INV-COMPILER-021
  after:
    id: INV-COMPILER-021
    statement: ModelPath 使用同一精确编译语义供 expression、change、query 和 access 校验复用；未知段、非复合中间段、模糊匹配或跨目标搜索均非法。
    trigger: 编译模型路径
    failure: ERR-MIX-MODEL-PATH-INVALID
    traceIds:
    - TR-P2-SYSTEM-RULEVIEW-005
  reason: P2 System/RuleView/model-access business model increment.
- artifact: business_model
  collection: invariants
  operation: add
  targetId: INV-COMPILER-022
  after:
    id: INV-COMPILER-022
    statement: P2 只收敛 System、RuleView 与 model-access 所有权/授权语义；declaration 兼容事实在 P2 保留且不得形成第二运行时权威，最终退役边界仍属于 P7。
    trigger: 处理 declaration 兼容边界
    failure: ERR-MIX-P2-DECLARATION-BOUNDARY
    traceIds:
    - TR-P2-SYSTEM-RULEVIEW-010
  reason: P2 System/RuleView/model-access business model increment.
- artifact: business_model
  collection: services
  operation: update
  targetId: SVC-REFERENCE-RESOLUTION
  beforeRef: COMPILER_business_model.yaml#SVC-REFERENCE-RESOLUTION
  after:
    id: SVC-REFERENCE-RESOLUTION
    name: ReferenceResolutionService
    reason: Information 所有权、RuleView 归属、ModelAccess selector 和跨文件引用需要统一确定性策略。
    inputs:
    - RawDefinitionSet
    - SymbolTable
    - InformationOwnershipPolicy
    - ModelAccessSelectorPolicy
    outputs:
    - ResolvedDefinitions
    - ModelAccessBinding
    - Diagnostic
    traceIds:
    - TR-P1-COMPILER-003
    - TR-P1-COMPILER-008
    - TR-P1-COMPILER-009
    - TR-P2-SYSTEM-RULEVIEW-002
    - TR-P2-SYSTEM-RULEVIEW-003
    - TR-P2-SYSTEM-RULEVIEW-005
  reason: Align the P1 baseline/deferred model with P2-owned System, RuleView and model-access semantics.
- artifact: business_model
  collection: services
  operation: add
  targetId: SVC-SYSTEM-COMPILATION
  after:
    id: SVC-SYSTEM-COMPILATION
    name: SystemCompilationService
    reason: System 多源加载、显式身份和成员所有权需要确定性编译边界。
    inputs:
    - RawSystemDefinition
    - SystemKey
    - SymbolTable
    outputs:
    - CompiledSystem
    - Diagnostic
    traceIds:
    - TR-P2-SYSTEM-RULEVIEW-001
    - TR-P2-SYSTEM-RULEVIEW-008
    - TR-P2-SYSTEM-RULEVIEW-009
  reason: P2 System/RuleView/model-access business model increment.
- artifact: business_model
  collection: services
  operation: add
  targetId: SVC-RULEVIEW-RESOLUTION
  after:
    id: SVC-RULEVIEW-RESOLUTION
