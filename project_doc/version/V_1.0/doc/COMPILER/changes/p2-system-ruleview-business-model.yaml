    - TR-P2-SYSTEM-RULEVIEW-007
    - TR-P2-SYSTEM-RULEVIEW-008
    - TR-P2-SYSTEM-RULEVIEW-009
    - TR-P2-SYSTEM-RULEVIEW-010
  reason: Align the P1 baseline/deferred model with P2-owned System, RuleView and model-access semantics.
- artifact: business_model
  collection: aggregates
  operation: add
  targetId: AGG-SYSTEM-COMPILED-CONFIG
  after:
    id: AGG-SYSTEM-COMPILED-CONFIG
    name: System Compiled Configuration Aggregate
    root: ENT-COMPILED-SYSTEM
    members:
    - VO-RULEVIEW-KEY
    - VO-MODEL-PATH
    - VO-MODEL-ACCESS-RULE
    - VO-MODEL-ACCESS-BINDING
    invariantIds:
    - INV-COMPILER-016
    - INV-COMPILER-017
    - INV-COMPILER-018
    - INV-COMPILER-019
    - INV-COMPILER-020
    - INV-COMPILER-021
    - INV-COMPILER-022
    transactionBoundary: 单个 CompilationSession 内完成 System 成员注册、引用解析、路径与访问规则校验；只有整个编译候选无 ERROR 时才随完整 Context 原子发布。
    consistency: 强一致；同一 System 内身份和权限不变量不得以部分成功形式暴露。
    traceIds:
