schemaVersion: 1
artifact: business_model
module:
  code: DEC_COMPILER
  name: 统一配置编译器
revision: BM-R01@52a58f20cb32
baseRevision: ''
terms:
- id: TERM-DOCUMENT-SOURCE
  name: DocumentSource
  definition: 具有稳定 sourceId、受控格式、内容和源摘要的不可变输入值；不得隐式读取默认目录。
  forbiddenSynonyms:
  - 默认配置文件
  - 全局当前文件
  sourceRefs:
  - P1-COMPILER-F01#BR-P1-COMPILER-001
- id: TERM-CANONICAL-NODE
  name: CanonicalDocumentNode
  definition: XML/YAML 共享的格式中立有序节点，保留节点类型、属性、标量、子节点、格式、schemaVersion 和 SourceLocation。
  sourceRefs:
  - P1-COMPILER-F01#BR-P1-COMPILER-002
- id: TERM-RAW-AST
  name: RawDocumentSet
  definition: 保留声明顺序、SourceRef 与未解析强类型引用的格式中立声明集合；P2+ 声明在 P1 只被承载。
  sourceRefs:
  - P1-COMPILER-F01#BR-P1-COMPILER-003
- id: TERM-COMPILATION-SESSION
  name: CompilationSession
  definition: 一次编译的唯一构建一致性边界，拥有独立的选项、Builder、SymbolTable 与 DiagnosticCollector。
  forbiddenSynonyms:
  - 全局编译上下文
  - 当前 Context
  sourceRefs:
  - P1-COMPILER-F01#CR-P1-COMPILER-002
- id: TERM-DIAGNOSTIC
  name: Diagnostic
  definition: 包含 severity、code、message、source、location、entityKey 与 pass 的结构化问题事实，并按稳定键排序。
  sourceRefs:
  - P1-COMPILER-F01#BR-P1-COMPILER-005
- id: TERM-COMPILED-BUSINESS
  name: CompiledBusiness
  definition: 已解析引用、无 parser 节点、不可变且可计算稳定语义摘要的发布前编译产物。
  sourceRefs:
  - P1-COMPILER-F01#BR-P1-COMPILER-009
- id: TERM-ENGINE-CONTEXT
  name: EngineContext
  definition: 仅在无 ERROR 时发布的实例级不可变运行时上下文；不同实例不共享可变状态。
  forbiddenSynonyms:
  - 全局 Context
  - 单例 Context
  sourceRefs:
  - P1-COMPILER-F01#BR-P1-COMPILER-011
- id: TERM-LEGACY-VIEW
  name: LegacyConfigView
  definition: 由 EngineContext 投影的 deprecated 只读兼容视图，不拥有、注册或修改事实。
  sourceRefs:
  - P1-COMPILER-F01#BR-P1-COMPILER-012
scenarios:
- id: SCN-COMPILE-SUCCESS
  given:
  - 稳定排序的 DocumentSource 集合
  - 已注册受控 DocumentFrontend
  - 固定 schema/compiler/options/plugin 版本
  when: 执行完整七步 Compiler Pipeline
  then:
  - 生成不可变 CompiledRegistry 与 EngineContext
  - 输出稳定 Diagnostics、sourceDigest 与 semanticDigest
  - 不写入旧全局 Config
  traceIds: &id001
  - TR-P1-COMPILER-001
  - TR-P1-COMPILER-002
  - TR-P1-COMPILER-003
  - TR-P1-COMPILER-004
  - TR-P1-COMPILER-005
  - TR-P1-COMPILER-006
- id: SCN-COMPILE-FAILURE
  given:
  - 输入包含格式、结构、重复、未知引用或语义错误
  - 已有 EngineContext 正在被调用方使用
  when: 执行编译并出现 ERROR
  then:
  - 聚合并稳定排序 Diagnostics
  - 本次 CompilationResult 不包含 EngineContext
  - 既有 EngineContext 保持不变
  traceIds:
  - TR-P1-COMPILER-002
  - TR-P1-COMPILER-004
- id: SCN-CONTEXT-ISOLATION
  given:
  - 两组不同输入或相同输入重复编译
  when: 并发创建并读取多个 CompilationSession 与 EngineContext
  then:
  - 构建状态、诊断和注册表互不污染
  - 相同输入语义 digest 一致
  - 不同输入 digest 不同
  traceIds:
  - TR-P1-COMPILER-004
- id: SCN-LEGACY-READONLY
  given:
  - 已发布 EngineContext
  - 旧代码通过兼容入口读取配置
  when: 读取并尝试写入、注册、删除或清空
  then:
  - 读取结果与 EngineContext 一致
  - 所有写操作明确拒绝
  - 不建立第二份可变事实源
  traceIds:
  - TR-P1-COMPILER-005
- id: SCN-DEFERRED-SEMANTICS
  given:
  - Raw AST 含 System、Information、Directory、Action 或 Produce 声明
  when: P1 编译骨架处理输入
  then:
  - 结构与 SourceRef 被保留
  - 产生明确 deferred/unsupported 诊断
  - 不执行 P2+ 业务语义
  traceIds:
  - TR-P1-COMPILER-006
entities:
- id: ENT-DOCUMENT-SOURCE
  name: DocumentSource
  identity: sourceId
  attributes:
  - name: sourceId
    type: String
    required: true
    constraints:
    - 同一 session 唯一
    - 稳定
  - name: format
    type: DocumentFormat
    required: true
    constraints:
    - XML 或 YAML
  - name: content
    type: ByteSource
    required: true
  - name: sourceDigest
    type: Digest
    required: true
  behaviors:
  - 校验 sourceId 唯一
  - 提供受控只读内容
  traceIds:
  - TR-P1-COMPILER-001
- id: ENT-RAW-DECLARATION
  name: RawDeclaration
  identity: SourceRef + declarationKind + declaredKey
  attributes:
  - name: kind
    type: DeclarationKind
    required: true
  - name: declaredKey
    type: TypedKey?
    required: false
  - name: unresolvedRefs
    type: List<RawReference>
    required: true
  - name: sourceRef
    type: SourceRef
    required: true
  behaviors:
  - 保留声明顺序
  - 承载未解析引用
  - 标记 deferred 语义
  traceIds:
  - TR-P1-COMPILER-001
  - TR-P1-COMPILER-003
  - TR-P1-COMPILER-006
- id: ENT-COMPILATION-SESSION
  name: CompilationSession
  identity: sessionId
  attributes:
  - name: sessionId
    type: SessionId
    required: true
  - name: options
    type: CompilationOptions
    required: true
  - name: state
    type: CompilationState
    required: true
  - name: sourceSet
    type: List<DocumentSource>
    required: true
  - name: diagnostics
    type: DiagnosticCollection
    required: true
  behaviors:
  - 按固定 pass 顺序推进
  - 在 ERROR 时失败
  - 无 ERROR 时原子发布
  - 拒绝终态后继续推进
  traceIds: *id001
- id: ENT-DIAGNOSTIC
  name: Diagnostic
  identity: severity + code + sourceRef + entityKey + pass + ordinal
  attributes:
  - name: severity
    type: Severity
    required: true
  - name: code
    type: DiagnosticCode
    required: true
  - name: message
    type: String
    required: true
  - name: sourceRef
    type: SourceRef
    required: false
  - name: entityKey
    type: TypedKey?
    required: false
  - name: pass
    type: CompilerPass
    required: true
  behaviors:
  - 生成稳定排序键
  - 脱敏显示消息
  traceIds:
  - TR-P1-COMPILER-002
- id: ENT-COMPILED-BUSINESS
  name: CompiledBusiness
  identity: semanticDigest
  attributes:
  - name: registries
    type: CompiledRegistrySet
    required: true
  - name: semanticDigest
    type: Digest
    required: true
  - name: schemaVersion
    type: String
    required: true
  - name: compilerVersion
    type: String
    required: true
  behaviors:
  - 只读遍历
  - 验证不含 parser 节点和未解析引用
  traceIds:
  - TR-P1-COMPILER-003
  - TR-P1-COMPILER-004
- id: ENT-ENGINE-CONTEXT
  name: EngineContext
  identity: contextId + semanticDigest
  attributes:
  - name: contextId
    type: ContextId
    required: true
  - name: compiledBusiness
    type: CompiledBusiness
    required: true
  - name: sourceDigest
    type: Digest
    required: true
  - name: semanticDigest
    type: Digest
    required: true
  behaviors:
  - 并发只读
  - 创建 LegacyConfigView
  - 拒绝可变注册
  traceIds:
  - TR-P1-COMPILER-004
  - TR-P1-COMPILER-005
valueObjects:
- id: VO-SOURCE-REF
  name: SourceRef
  identity: value semantics
  attributes:
  - name: sourceId
    type: String
    required: true
  - name: location
    type: SourceLocation
    required: false
  - name: format
    type: DocumentFormat
    required: true
  behaviors:
  - 值相等
  - 用于诊断定位
  traceIds:
  - TR-P1-COMPILER-001
  - TR-P1-COMPILER-002
- id: VO-CANONICAL-NODE
  name: CanonicalDocumentNode
  identity: ordered structural value
  attributes:
  - name: nodeType
    type: String
    required: true
  - name: attributes
    type: OrderedMap<String,String>
    required: true
  - name: scalar
    type: String?
    required: false
  - name: children
    type: List<CanonicalDocumentNode>
    required: true
  - name: sourceRef
    type: SourceRef
    required: true
  - name: schemaVersion
    type: String
    required: true
  behaviors:
  - 格式中立比较
  - 保持声明顺序
  traceIds:
  - TR-P1-COMPILER-001
- id: VO-TYPED-KEY
  name: TypedKey
  identity: namespace + components
  attributes:
  - name: namespace
    type: KeyNamespace
    required: true
  - name: components
    type: List<String>
    required: true
    constraints:
    - 不可空
    - 规范化
  behaviors:
  - 值相等
  - 命名空间隔离
  - 稳定排序
  traceIds:
  - TR-P1-COMPILER-003
- id: VO-COMPILATION-RESULT
  name: CompilationResult
  identity: sourceDigest + compilerVersion + optionsDigest
  attributes:
  - name: diagnostics
    type: List<Diagnostic>
    required: true
  - name: engineContext
    type: Optional<EngineContext>
    required: true
  - name: sourceDigest
    type: Digest
    required: true
  - name: semanticDigest
    type: Optional<Digest>
    required: true
  behaviors:
  - ERROR 时 context 必为空
  - 稳定返回诊断
  traceIds:
  - TR-P1-COMPILER-002
  - TR-P1-COMPILER-004
- id: VO-LEGACY-CONFIG-VIEW
  name: LegacyConfigView
  identity: backing EngineContext identity
  attributes:
  - name: backingContext
    type: EngineContext
    required: true
  behaviors:
  - 只读投影
  - 写操作抛 LegacyWriteUnsupported
  traceIds:
  - TR-P1-COMPILER-005
aggregates:
- id: AGG-COMPILATION-SESSION
  name: CompilationSession Aggregate
  root: ENT-COMPILATION-SESSION
  members:
  - ENT-DOCUMENT-SOURCE
  - ENT-RAW-DECLARATION
  - ENT-DIAGNOSTIC
  - VO-SOURCE-REF
  - VO-CANONICAL-NODE
  - VO-TYPED-KEY
  - VO-COMPILATION-RESULT
  invariantIds:
  - INV-COMPILER-001
  - INV-COMPILER-002
  - INV-COMPILER-003
  - INV-COMPILER-004
  - INV-COMPILER-005
  - INV-COMPILER-006
  - INV-COMPILER-007
  transactionBoundary: 一次 compile 调用；构建状态仅在 session 内可变，发布结果一次性生成。
  consistency: 强一致；有 ERROR 不发布，无部分成功。
  traceIds: *id001
- id: AGG-ENGINE-CONTEXT
  name: Published EngineContext Aggregate
  root: ENT-ENGINE-CONTEXT
  members:
  - ENT-COMPILED-BUSINESS
  - VO-LEGACY-CONFIG-VIEW
  invariantIds:
  - INV-COMPILER-002
  - INV-COMPILER-003
  - INV-COMPILER-005
  - INV-COMPILER-006
  transactionBoundary: 构造完成后的不可变快照；不支持原地更新。
  consistency: 并发只读一致；新编译产物与旧 Context 并存。
  traceIds:
  - TR-P1-COMPILER-003
  - TR-P1-COMPILER-004
  - TR-P1-COMPILER-005
invariants:
- id: INV-COMPILER-001
  statement: Compiler pass 顺序固定且不可跳跃或逆序。
  trigger: 每次 session 状态迁移
  failure: ERR-COMPILER-ILLEGAL-STATE
  traceIds:
  - TR-P1-COMPILER-002
- id: INV-COMPILER-002
  statement: 存在任一 ERROR 时不得生成或发布 EngineContext。
  trigger: semantic validation 与 publish
  failure: ERR-COMPILER-PUBLISH-BLOCKED
  traceIds:
  - TR-P1-COMPILER-002
  - TR-P1-COMPILER-004
- id: INV-COMPILER-003
  statement: Compiled AST 与 Registry 不得包含 parser 节点、未解析字符串引用或可变集合。
  trigger: publish 前验证
  failure: ERR-COMPILER-UNRESOLVED-OR-MUTABLE
  traceIds:
  - TR-P1-COMPILER-003
  - TR-P1-COMPILER-004
- id: INV-COMPILER-004
  statement: 同一 session 中 TypedKey 唯一；不同命名空间同名实体互不覆盖，跨文件前向引用在注册完成后解析。
  trigger: symbol registration/reference resolution
  failure: ERR-COMPILER-SYMBOL
  traceIds:
  - TR-P1-COMPILER-003
- id: INV-COMPILER-005
  statement: 相同规范输入、schema、compiler/options/plugin 版本得到相同 semanticDigest 与诊断顺序。
  trigger: digest 与 result 生成
  failure: ERR-COMPILER-NONDETERMINISTIC
  traceIds:
  - TR-P1-COMPILER-001
  - TR-P1-COMPILER-002
  - TR-P1-COMPILER-004
- id: INV-COMPILER-006
  statement: 不同 CompilationSession 不共享可变 Builder、Collector、SymbolTable 或 current Context。
  trigger: session 创建与并发编译
  failure: ERR-COMPILER-SESSION-LEAK
  traceIds:
  - TR-P1-COMPILER-004
- id: INV-COMPILER-007
  statement: LegacyConfigView 只读且不拥有独立事实；P2+ 声明在 P1 只承载不执行。
  trigger: legacy 写操作或 deferred 声明处理
  failure: ERR-COMPILER-SCOPE-VIOLATION
  traceIds:
  - TR-P1-COMPILER-005
  - TR-P1-COMPILER-006
stateMachines:
- id: SM-COMPILATION-SESSION
  name: CompilationSession 生命周期
  initialState: CREATED
  states:
  - CREATED
  - PARSED
  - STRUCTURALLY_VALIDATED
  - SYMBOLS_REGISTERED
  - REFERENCES_RESOLVED
  - GRAPH_PREPARED
  - SEMANTICALLY_VALIDATED
  - PUBLISHED
  - FAILED
  terminalStates:
  - PUBLISHED
  - FAILED
  transitions:
  - id: TRN-PARSE
    from: CREATED
    command: parseDocuments
    to: PARSED
    preconditions:
    - source 集合已冻结
    - frontends 已解析
    sideEffects:
    - 创建 CanonicalDocumentNode/Raw AST
    - 收集格式诊断
    failure: FAILED
  - id: TRN-STRUCTURE
    from: PARSED
    command: validateStructure
    to: STRUCTURALLY_VALIDATED
    preconditions:
    - Raw AST 可遍历
    sideEffects:
    - 收集结构诊断
    failure: FAILED
  - id: TRN-SYMBOLS
    from: STRUCTURALLY_VALIDATED
    command: registerSymbols
    to: SYMBOLS_REGISTERED
    preconditions:
    - 结构允许继续聚合错误
    sideEffects:
    - 建立构建期 SymbolTable
    - 收集重复定义诊断
    failure: FAILED
  - id: TRN-REFERENCES
    from: SYMBOLS_REGISTERED
    command: resolveReferences
    to: REFERENCES_RESOLVED
    preconditions:
    - 全部符号注册结束
    sideEffects:
    - 解析前向引用
    - 收集未知/类型错诊断
    failure: FAILED
  - id: TRN-GRAPH
    from: REFERENCES_RESOLVED
    command: prepareGraphs
    to: GRAPH_PREPARED
    preconditions:
    - 可解析引用已处理
    sideEffects:
    - 准备后续图结构；P2+ 仅保留占位
    failure: FAILED
  - id: TRN-SEMANTIC
    from: GRAPH_PREPARED
    command: validateSemantics
    to: SEMANTICALLY_VALIDATED
    preconditions:
    - 图结构可验证
    sideEffects:
    - 聚合语义与 deferred 诊断
    - 计算候选摘要
    failure: FAILED
  - id: TRN-PUBLISH
    from: SEMANTICALLY_VALIDATED
    command: publish
    to: PUBLISHED
    preconditions:
    - Diagnostics 中无 ERROR
    - 不可变性检查通过
    sideEffects:
    - 一次性生成 Registry/CompiledBusiness/EngineContext
    failure: FAILED
  traceIds:
  - TR-P1-COMPILER-002
  - TR-P1-COMPILER-003
  - TR-P1-COMPILER-004
services:
- id: SVC-DOCUMENT-FRONTEND
  name: DocumentFrontend
  reason: 将受控 XML/YAML 输入转换为共享 Canonical 节点，不承担业务语义校验。
  inputs:
  - DocumentSource
  - FrontendOptions
  outputs:
  - CanonicalDocumentNode
  - Diagnostic[]
  traceIds:
  - TR-P1-COMPILER-001
  - TR-P1-COMPILER-002
- id: SVC-BUSINESS-COMPILER
  name: BusinessCompiler
  reason: 编排固定 pass 并产生唯一 CompilationResult。
  inputs:
  - DocumentSource[]
  - CompilationOptions
  - FrontendRegistry
  outputs:
  - CompilationResult
  traceIds: *id001
- id: SVC-LEGACY-PROJECTION
  name: LegacyConfigProjectionService
  reason: 从 EngineContext 生成只读兼容投影，不双写。
  inputs:
  - EngineContext
  outputs:
  - LegacyConfigView
  traceIds:
  - TR-P1-COMPILER-005
policies:
- id: POL-DIAGNOSTIC-ORDER
  name: DiagnosticStableOrderPolicy
  reason: 错误集合必须可重复比较与测试。
  inputs:
  - Diagnostic[]
  outputs:
  - 按 sourceId/location/code/entityKey/pass/ordinal 排序的 Diagnostic[]
  traceIds:
  - TR-P1-COMPILER-002
- id: POL-DIGEST
  name: SemanticDigestPolicy
  reason: 区分源文档差异与业务语义差异。
  inputs:
  - Canonical Raw/Compiled structure
  - schema/compiler/options/plugin version
  outputs:
  - sourceDigest
  - semanticDigest
  traceIds:
  - TR-P1-COMPILER-001
  - TR-P1-COMPILER-004
- id: POL-DEFERRED
  name: DeferredSemanticPolicy
  reason: P1 保留后续声明但不固化未确认运行语义。
  inputs:
  - P2+ RawDeclaration
  outputs:
  - 保留声明
  - deferred/unsupported Diagnostic
  traceIds:
  - TR-P1-COMPILER-006
events:
- id: EVT-COMPILATION-PUBLISHED
  name: CompilationPublished
  reason: 表明一个不可变 Context 已成功构造，可由调用者显式使用。
  inputs:
  - contextId
  - semanticDigest
  - sourceDigest
  outputs:
  - 只读审计事实
  traceIds:
  - TR-P1-COMPILER-004
- id: EVT-COMPILATION-FAILED
  name: CompilationFailed
  reason: 表明本次编译未发布且旧 Context 未变化。
  inputs:
  - sessionId
  - Diagnostic[]
  outputs:
  - 失败审计事实
  traceIds:
  - TR-P1-COMPILER-002
businessErrors:
- id: ERR-COMPILER-SOURCE
  condition: sourceId 重复、空输入策略不满足或资源不可读
  meaning: 输入源集合无效
  retryable: true
  stateChanged: false
  traceIds:
  - TR-P1-COMPILER-001
  - TR-P1-COMPILER-002
- id: ERR-COMPILER-FORMAT
  condition: XML/YAML 语法错误、XXE/DTD 或任意类型构造尝试
  meaning: 前端拒绝不安全或无效格式
  retryable: true
  stateChanged: false
  traceIds:
  - TR-P1-COMPILER-001
  - TR-P1-COMPILER-002
- id: ERR-COMPILER-STRUCTURE
  condition: 未知元素/属性或缺失必填结构
  meaning: Raw 声明结构无效
  retryable: true
  stateChanged: false
  traceIds:
  - TR-P1-COMPILER-002
- id: ERR-COMPILER-SYMBOL
  condition: TypedKey 重复、命名空间错误或引用目标类型不匹配
  meaning: 符号注册或引用解析失败
  retryable: true
  stateChanged: false
  traceIds:
  - TR-P1-COMPILER-003
- id: ERR-COMPILER-PUBLISH-BLOCKED
  condition: 存在 ERROR 或不可变性/完整性检查失败
  meaning: 本次结果不得发布 EngineContext
  retryable: true
  stateChanged: false
  traceIds:
  - TR-P1-COMPILER-002
  - TR-P1-COMPILER-004
- id: ERR-COMPILER-SESSION-LEAK
  condition: 检测到跨 Session 可变状态、静态 Registry 或全局 current Context
  meaning: 编译隔离契约被破坏
  retryable: false
  stateChanged: false
  traceIds:
  - TR-P1-COMPILER-004
- id: ERR-COMPILER-LEGACY-WRITE
  condition: 通过 LegacyConfigView 注册、修改、删除或清空
  meaning: 只读迁移边界被违反
  retryable: false
  stateChanged: false
  traceIds:
  - TR-P1-COMPILER-005
- id: ERR-COMPILER-SCOPE-VIOLATION
  condition: P1 尝试执行 System 权限、Information、Directory、Action、Produce 或 SQL/事务语义
  meaning: 阶段范围越界
  retryable: false
  stateChanged: false
  traceIds:
  - TR-P1-COMPILER-006
traceability:
- traceId: TR-P1-COMPILER-001
  modelRefs:
  - TERM-CANONICAL-NODE
  - ENT-DOCUMENT-SOURCE
  - VO-CANONICAL-NODE
  - SVC-DOCUMENT-FRONTEND
  - POL-DIGEST
- traceId: TR-P1-COMPILER-002
