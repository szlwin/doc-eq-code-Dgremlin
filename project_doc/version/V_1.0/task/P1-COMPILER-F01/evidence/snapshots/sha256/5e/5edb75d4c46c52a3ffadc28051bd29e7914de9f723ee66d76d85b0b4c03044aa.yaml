schemaVersion: 2
revision: REQAN-R04@7421b050ed44
status: ANALYZED
changeId: P1-COMPILER-CR01/P1-COMPILER-CR02/P1-COMPILER-CR03
sourceRequirement: project_doc/version/V_1.0/doc/P1-COMPILER-F01/requirement.md
sourceFixture: dec-demo/src/main/resources/mix
trigger:
  impactRequired: true
  crossModuleImplementationRequired: true
  reasons:
    - delete dec-expand-declaration and forbid adapter/runtime dual track
    - move Information ownership from BusinessScope to System
    - add common System for cross-System expression Information
    - add explicit shared-model to System-View ModelAccess mapping
impacts:
  dec-core-compiler:
    action: add
    responsibilities:
      - source graph discovery and source policy enforcement
      - canonical frontend contract and RawDefinitionSet
      - typed symbol registration and reference resolution
      - InformationKey and common expression reference parsing
      - ModelAccess selector resolution
      - DeferredDefinition registration
      - stable diagnostics, digest and atomic compilation result
    forbiddenDependencies:
      - SQL/MySQL runtime
      - dec-demo
      - dec-expand-declaration
  dec-core-context:
    action: modify
    responsibilities:
      - typed keys and immutable registries
      - CompiledModelSet and explicit EngineContext
      - CoreConfigProjection read-only view
    forbiddenBehavior:
      - global current Context
      - mutable shared registries
  dec-context-config-parse-xml:
    action: refactor
    rule: frontend only; secure XML to CanonicalDocumentNode; no global Config mutation
  dec-context-config-parse-yaml:
    action: refactor
    rule: same canonical contract; safe node loading; no arbitrary Java types
  dec-core-starter:
    action: modify
    rule: compile then atomically expose explicit Context; failed compilation preserves caller-held old Context
  dec-demo:
    action: retain-fixture
    rule: mix is contract tests/examples only; production modules must not depend on demo
  dec-expand-declaration:
    action: delete
    migration: none
    adapter: forbidden
    recovery: git revert only
relations:
  - from: BusinessScope(order-payment)
    to: InformationKey(common.paySuccess/common.payError)
    type: consumes-qualified-information
    condition: directory classification references composite result
  - from: common.paySuccess
    to: payment.success,order.paySuccessStatus
    type: cross-system-expression-dependency
    condition: all references are system-qualified
  - from: common.payError
    to: payment.error,order.payErrorStatus
    type: cross-system-expression-dependency
    condition: all references are system-qualified
  - from: order-model-access(OrderInfo.user)
    to: user-view(UserInfo.target-main=user)
    type: explicit-source-to-target-binding
    condition: target-main exact match before property path fallback
lifecycle:
  historicalFacts:
    - R01-R03 requirement, analysis, review and evidence remain immutable history
    - old BusinessScope-owned Information and root-property are not accepted by current compiler
  inFlightRuntime:
    - an already held EngineContext is not mutated by a new compilation
    - compilation failure does not publish partial registries or replace the old Context
  migration:
    - current mix fixture is updated in place; no runtime compatibility adapter
    - dec-expand-declaration has no data migration and no retained runtime
  recovery:
    - fix configuration using Diagnostic SourceRef and recompile in a new CompilationSession
    - repository rollback uses Git; runtime dual track is forbidden
crossModuleImplementation:
  - id: CMI-P1-COMPILER-001
    owner: dec-core-compiler
    steps:
      - id: CMI-P1-COMPILER-001-S01
        owner: frontend
        input: DocumentSource
        output: CanonicalDocumentNode
        failure: secure parse Diagnostic; no global mutation
      - id: CMI-P1-COMPILER-001-S02
        owner: dec-core-compiler
        input: CanonicalDocumentNode
        output: RawDefinitionSet/SymbolTable/DeferredDefinitionRegistry
        failure: ERROR prevents publication
      - id: CMI-P1-COMPILER-001-S03
        owner: dec-core-context
        input: validated compiled definitions
        output: immutable CompiledModelSet/EngineContext
        failure: return failure to compiler; no partial visibility
      - id: CMI-P1-COMPILER-001-S04
        owner: dec-core-starter
        input: successful EngineContext
        output: explicitly exposed Context
        failure: caller-held old Context remains
      - id: CMI-P1-COMPILER-001-S05
        owner: dec-demo
        input: mix fixtures
        output: contract evidence only
        failure: test failure; no production dependency
futureStages:
  P2:
    consumes: SystemKey, ViewKey, RuleViewKey, ModelAccessBinding
    owns: system/model access permission and RuleView ownership semantics
  P3:
    consumes: InformationKey, expression AST, resolved dependency keys
    owns: DAG, cycle detection, evaluation, materialization and invalidation
  P4:
    consumes: Action/Produce structures and typed references
    owns: action and produce execution
  P5:
    consumes: Directory structures and information references
    owns: state machine, classification and back
  P6:
    consumes: Data/View structures and model paths
    owns: QueryPlan and SQL
  P7:
    consumes: datasource/connection structures and EngineContext
    owns: session, transaction and resource lifecycle
  P8:
    consumes: canonical/raw contracts and digest rules
    owns: XML/YAML parity, performance, security and release acceptance
testMappings:
  ownership: CASE-P1-SYSTEM-INFORMATION-001,CASE-P1-COMMON-EXPRESSION-001,CASE-P1-COMMON-OWNER-NEGATIVE-001
  modelAccess: CASE-P1-MODEL-ACCESS-TARGET-MAIN-001,CASE-P1-MODEL-ACCESS-PROPERTY-PATH-001,CASE-P1-MODEL-ACCESS-MULTI-REF-001
  atomicity: CASE-P1-CONTEXT-001,CASE-P1-PUBLISH-ATOMIC-001
  retirement: CASE-P1-RETIREMENT-001
