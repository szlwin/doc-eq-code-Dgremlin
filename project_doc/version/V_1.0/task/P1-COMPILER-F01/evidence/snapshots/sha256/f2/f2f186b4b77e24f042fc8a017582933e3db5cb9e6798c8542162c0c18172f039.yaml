crossModuleImplementations:
  - id: CMI-P1-COMPILER-001
    name: 统一配置编译跨模块实现映射
    trigger: 调用方提交 XML/YAML DocumentSource 集合
    participants:
      - id: CMPART-P1-STARTER
        module: dec-core-starter
        responsibility: 发现输入、装配前端与 compiler、返回结果，不保存全局 current Context
        contractRefs:
          - CONTRACT-COMPILER-ENTRY
      - id: CMPART-P1-XML
        module: dec-context-config-parse-xml
        responsibility: 安全解析 XML 并产生 CanonicalDocumentNode
        contractRefs:
          - CONTRACT-DOCUMENT-FRONTEND
      - id: CMPART-P1-YAML
        module: dec-context-config-parse-yaml
        responsibility: 安全解析最小 YAML 并产生 CanonicalDocumentNode
        contractRefs:
          - CONTRACT-DOCUMENT-FRONTEND
      - id: CMPART-P1-COMPILER
        module: dec-core-compiler
        responsibility: 构建 Raw AST、执行 passes、产生诊断和编译结果
        contractRefs:
          - CONTRACT-BUSINESS-COMPILER
      - id: CMPART-P1-CONTEXT
        module: dec-core-context
        responsibility: 提供中立不可变类型、Registry、EngineContext 与 Legacy 只读契约
        contractRefs:
          - CONTRACT-ENGINE-CONTEXT
      - id: CMPART-P1-DEMO
        module: dec-demo
        responsibility: 提供 fixtures 与回归断言
        contractRefs:
          - CONTRACT-P1-TEST-FIXTURE
    steps:
      - id: CMSTEP-P1-COMPILER-01
        order: 1
        from: CMPART-P1-STARTER
        to: CMPART-P1-STARTER
        interactionType: COMMAND
        action: 发现并排序 DocumentSource
        contractRef: CONTRACT-CONFIG-COMPILE
        preconditions:
          - 上一流程步骤成功或可聚合错误已记录。
        postconditions:
          - 形成下一步骤所需显式结果或 Diagnostic。
        idempotency: 显式输入集合；重复调用不修改全局状态
        timeout: 单次本地编译调用预算内
        failureHandling: 输入错误直接返回 Diagnostic。
        compensation: 丢弃本次 Session 的未发布构建状态；无需业务数据补偿。
        traceIds:
          - TR-P1-COMPILER-001
      - id: CMSTEP-P1-COMPILER-02
        order: 2
        from: CMPART-P1-STARTER
        to: CMPART-P1-XML
        interactionType: SYNC_API
        action: 对 XML 源执行安全前端解析
        contractRef: CONTRACT-CONFIG-COMPILE
        preconditions:
          - 上一流程步骤成功或可聚合错误已记录。
        postconditions:
          - 形成下一步骤所需显式结果或 Diagnostic。
        idempotency: sourceId + sourceDigest
        timeout: 单次本地编译调用预算内
        failureHandling: 格式失败产生 Diagnostic 并继续聚合独立错误。
        compensation: 丢弃本次 Session 的未发布构建状态；无需业务数据补偿。
        traceIds:
          - TR-P1-COMPILER-002
      - id: CMSTEP-P1-COMPILER-03
        order: 3
        from: CMPART-P1-STARTER
        to: CMPART-P1-YAML
        interactionType: SYNC_API
        action: 对 YAML 源执行最小前端解析
        contractRef: CONTRACT-CONFIG-COMPILE
        preconditions:
          - 上一流程步骤成功或可聚合错误已记录。
        postconditions:
          - 形成下一步骤所需显式结果或 Diagnostic。
        idempotency: sourceId + sourceDigest
        timeout: 单次本地编译调用预算内
        failureHandling: 格式失败产生 Diagnostic；不构造任意 Java 类型。
        compensation: 丢弃本次 Session 的未发布构建状态；无需业务数据补偿。
        traceIds:
          - TR-P1-COMPILER-003
      - id: CMSTEP-P1-COMPILER-04
        order: 4
        from: CMPART-P1-XML
        to: CMPART-P1-COMPILER
        interactionType: DATA_WRITE
        action: 提交 Canonical 节点到本次 CompilationSession
        contractRef: CONTRACT-CONFIG-COMPILE
        preconditions:
          - 上一流程步骤成功或可聚合错误已记录。
        postconditions:
          - 形成下一步骤所需显式结果或 Diagnostic。
        idempotency: Session 内 sourceId 唯一
        timeout: 单次本地编译调用预算内
        failureHandling: 重复 sourceId 诊断，不覆盖。
        compensation: 丢弃本次 Session 的未发布构建状态；无需业务数据补偿。
        traceIds:
          - TR-P1-COMPILER-004
      - id: CMSTEP-P1-COMPILER-05
        order: 5
        from: CMPART-P1-YAML
        to: CMPART-P1-COMPILER
        interactionType: DATA_WRITE
        action: 提交 Canonical 节点到同一 Raw AST 构建契约
        contractRef: CONTRACT-CONFIG-COMPILE
        preconditions:
          - 上一流程步骤成功或可聚合错误已记录。
        postconditions:
          - 形成下一步骤所需显式结果或 Diagnostic。
        idempotency: Session 内 sourceId 唯一
        timeout: 单次本地编译调用预算内
        failureHandling: 失败仅影响本 Session。
        compensation: 丢弃本次 Session 的未发布构建状态；无需业务数据补偿。
        traceIds:
          - TR-P1-COMPILER-005
      - id: CMSTEP-P1-COMPILER-06
        order: 6
        from: CMPART-P1-COMPILER
        to: CMPART-P1-CONTEXT
        interactionType: COMMAND
        action: 构建不可变 Registry 与 EngineContext
        contractRef: CONTRACT-CONFIG-COMPILE
        preconditions:
          - 上一流程步骤成功或可聚合错误已记录。
        postconditions:
          - 形成下一步骤所需显式结果或 Diagnostic。
        idempotency: semanticDigest 唯一描述语义输入
        timeout: 单次本地编译调用预算内
        failureHandling: 有 ERROR 不调用发布构造。
        compensation: 丢弃本次 Session 的未发布构建状态；无需业务数据补偿。
        traceIds:
          - TR-P1-COMPILER-006
      - id: CMSTEP-P1-COMPILER-07
        order: 7
        from: CMPART-P1-COMPILER
        to: CMPART-P1-STARTER
        interactionType: CALLBACK
        action: 返回 CompilationResult
        contractRef: CONTRACT-CONFIG-COMPILE
        preconditions:
          - 上一流程步骤成功或可聚合错误已记录。
        postconditions:
          - 形成下一步骤所需显式结果或 Diagnostic。
        idempotency: 同一输入重复结果可复用
        timeout: 单次本地编译调用预算内
        failureHandling: 失败结果包含诊断且 current Context 保持不变。
        compensation: 丢弃本次 Session 的未发布构建状态；无需业务数据补偿。
        traceIds:
          - TR-P1-COMPILER-006
    successCriteria:
      - 无 ERROR 时返回不可变 EngineContext。
      - Diagnostics 与 digest 可重复。
