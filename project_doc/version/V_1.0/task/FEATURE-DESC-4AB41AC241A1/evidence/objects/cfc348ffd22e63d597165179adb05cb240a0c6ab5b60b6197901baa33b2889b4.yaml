schemaVersion: 1
artifact: business_model
module:
  code: P3-INFORMATION-ENGINE
  name: Information Engine
revision: BM-P3-R03
baseRevision: REQAN-P3-R04@aa4bd589d74c
terms:
  - id: TERM-INFORMATION
    name: Information
    definition: 可被限定 Key 识别、组合或作为模型表达式原子的业务事实。
  - id: TERM-INFORMATION-KEY
    name: InformationKey
    definition: System 归属与本地名称组成的稳定 Information 身份。
  - id: TERM-MODEL-EXPRESSION
    name: Model Expression
    definition: 只读取模型路径并可声明 change-data 的原子 Information。
  - id: TERM-INFORMATION-EXPRESSION
    name: Information Expression
    definition: 只引用 InformationKey 的复合 Information 表达式。
  - id: TERM-REALTIME-READ
    name: 实时读取
    definition: 每次判断按 Information 配置重新读取当前模型/事务上下文中的值。
scenarios:
  - id: SCN-P3-IDENTIFY
    given: ["已发布的 16 个 Information 定义和可读模型上下文"]
    when: 按限定 InformationKey 请求识别
    then: ["先识别原子再按 DAG 计算复合，返回 TRUE/FALSE/ERROR 和证据"]
    traceIds: ["TR-P3-INFORMATION-ENGINE-001"]
  - id: SCN-P3-MATERIALIZE
    given: ["模型表达式原子声明 change-data 且拥有写权限"]
    when: 执行物化
    then: ["按 grammer → update → commit 写入声明值，返回 MaterializationResult 后结束；不调用 evaluate，不识别或返回目标及下游结果"]
    traceIds: ["TR-P3-INFORMATION-ENGINE-001"]
entities:
  - id: ENT-INFORMATION
    name: Information
    identity: InformationKey
    attributes:
      - {name: key, type: InformationKey, required: true}
      - {name: kind, type: RULE_ATOMIC|MODEL_ATOMIC|COMPOSITE, required: true}
      - {name: ownerSystem, type: SystemKey, required: true}
    behaviors: ["按 kind 执行互斥校验", "只读识别", "受声明约束物化"]
    traceIds: ["TR-P3-INFORMATION-ENGINE-001"]
  - id: ENT-IDENTIFICATION-RESULT
    name: IdentificationResult
    identity: informationKey+modelVersion+configurationRevision
    attributes:
      - {name: state, type: TRUE|FALSE|ERROR, required: true}
      - {name: evidence, type: EvidenceSet, required: true}
      - {name: readPaths, type: List<ModelPath>, required: true}
    behaviors: ["结果绑定本次读取版本", "ERROR 不降级为 FALSE"]
    traceIds: ["TR-P3-INFORMATION-ENGINE-001"]
valueObjects:
  - id: VO-INFORMATION-KEY
    name: InformationKey
    identity: systemKey+localName
    attributes:
      - {name: systemKey, type: SystemKey, required: true}
      - {name: localName, type: String, required: true}
    behaviors: ["限定引用", "大小写和归属稳定"]
    traceIds: ["TR-P3-INFORMATION-ENGINE-001"]
  - id: VO-MODEL-PATH
    name: ModelPath
    identity: canonicalSegments
    attributes:
      - {name: canonicalSegments, type: List<String>, required: true}
      - {name: dataOwner, type: target-main Data|relation Data, required: true}
    behaviors: ["target-main 基础字段优先", "relation Data 独立解析"]
    traceIds: ["TR-P3-INFORMATION-ENGINE-001"]
  - id: VO-DEPENDENCY-EDGE
    name: InformationDependency
    identity: fromKey+toKey
    attributes:
      - {name: fromKey, type: InformationKey, required: true}
      - {name: toKey, type: InformationKey, required: true}
    behaviors: ["发布前拒绝缺失引用和循环"]
    traceIds: ["TR-P3-INFORMATION-ENGINE-001"]
  - id: VO-MATERIALIZATION-RESULT
    name: MaterializationResult
    identity: informationKey+commitResult
    attributes:
      - {name: informationKey, type: InformationKey, required: true}
      - {name: changedPaths, type: List<ModelPath>, required: true}
      - {name: commitResult, type: CommitResult, required: true}
    behaviors: ["提交成功后作为物化终点返回", "不包含目标或下游 IdentificationResult"]
    traceIds: ["TR-P3-INFORMATION-ENGINE-001"]
aggregates:
  - id: AGG-INFORMATION-MODEL
    name: Information model
    root: Information
    members: ["InformationKey", "ModelPath", "InformationDependency"]
    invariantIds: ["INV-P3-KIND-EXCLUSIVE", "INV-P3-DAG", "INV-P3-PATH-RESOLUTION"]
    transactionBoundary: 配置发布时整体校验；运行时只读识别
    traceIds: ["TR-P3-INFORMATION-ENGINE-001"]
  - id: AGG-INFORMATION-EVALUATION
    name: Information evaluation
    root: IdentificationResult
    members: ["InformationKey", "IdentificationResult", "MaterializationResult", "EvidenceSet"]
    invariantIds: ["INV-P3-REALTIME-READ", "INV-P3-NULL-ERROR", "INV-P3-EVALUATE-ERROR", "INV-P3-EVERY-EMPTY", "INV-P3-MATERIALIZE"]
    transactionBoundary: 识别只读；物化沿用现有框架原子化边界
    traceIds: ["TR-P3-INFORMATION-ENGINE-001"]
invariants:
  - id: INV-P3-KIND-EXCLUSIVE
    statement: Information 必须且只能属于 RuleView 原子、模型表达式原子或复合表达式之一；复合表达式只引用 InformationKey。
    trigger: compile
    failure: INFORMATION_DEFINITION_INVALID
    traceIds: ["TR-P3-INFORMATION-ENGINE-001"]
  - id: INV-P3-DAG
    statement: Information 依赖图必须无环，引用必须存在且符合 System 归属规则。
    trigger: publish
    failure: INFORMATION_DEPENDENCY_INVALID
    traceIds: ["TR-P3-INFORMATION-ENGINE-001"]
  - id: INV-P3-PATH-RESOLUTION
    statement: 模型路径不存在为 ERROR；target-main 对应基础字段优先，关系字段按自身 Data 归属解析。
    trigger: identify
    failure: INFORMATION_PATH_INVALID
    traceIds: ["TR-P3-INFORMATION-ENGINE-001"]
  - id: INV-P3-REALTIME-READ
    statement: 每次判断按 Information 配置重新读取当前值，不维护或消费 MutationSet。
    trigger: identify
    failure: INFORMATION_READ_FAILED
    traceIds: ["TR-P3-INFORMATION-ENGINE-001"]
  - id: INV-P3-NULL-ERROR
    statement: 普通求值遇到 null 为 ERROR，只有显式 InformationKey = null 比较例外。
    trigger: identify
    failure: INFORMATION_NULL_ERROR
    traceIds: ["TR-P3-INFORMATION-ENGINE-001"]
  - id: INV-P3-EVALUATE-ERROR
    statement: 非法路径、普通 null、权限、表达式或只读 RuleView 执行错误必须记录 ERROR 诊断并抛出 InformationEvaluationException，不得降级为 FALSE、进入 materialize 或继续下游。
    trigger: identify
    failure: INFORMATION_EVALUATION_FAILED
    traceIds: ["TR-P3-INFORMATION-ENGINE-001"]
  - id: INV-P3-EVERY-EMPTY
    statement: every(emptyCollection, predicate) 为 TRUE；订单相关 Information 还必须满足订单明细非空，明细为空时结果为 FALSE 并可附 ORDER_DETAIL_REQUIRED 诊断。
    trigger: identify
    failure: ORDER_DETAIL_REQUIRED
    traceIds: ["TR-P3-INFORMATION-ENGINE-001"]
  - id: INV-P3-MATERIALIZE
    statement: 仅模型表达式原子可物化；grammer 与 update 按序共享同一 ModelLoader.value，成功 commit 后返回 MaterializationResult 并结束，不调用 evaluate 或识别目标/下游；失败 rollback、抛异常并返回 ERROR，不继续下游。
    trigger: materialize
    failure: INFORMATION_MATERIALIZE_FAILED
    traceIds: ["TR-P3-INFORMATION-ENGINE-001"]
stateMachines:
  - id: SM-P3-IDENTIFICATION
    name: Information identification
    initialState: REQUESTED
    states: ["REQUESTED", "EVALUATING", "TRUE", "FALSE", "ERROR"]
    transitions:
      - {id: TRANS-P3-EVALUATE, from: REQUESTED, command: evaluate, to: EVALUATING, preconditions: ["InformationKey 已发布"]}
      - {id: TRANS-P3-TRUE, from: EVALUATING, command: resultTrue, to: TRUE, preconditions: ["所有必需读取满足"]}
      - {id: TRANS-P3-FALSE, from: EVALUATING, command: resultFalse, to: FALSE, preconditions: ["条件不满足且无错误"]}
      - {id: TRANS-P3-ERROR, from: EVALUATING, command: raiseEvaluationError, to: ERROR, preconditions: ["路径/null/权限/表达式/RuleView 错误"], failure: INFORMATION_EVALUATION_FAILED}
    traceIds: ["TR-P3-INFORMATION-ENGINE-001"]
  - id: SM-P3-MATERIALIZATION
    name: change-data materialization
    initialState: PREPARED
    states: ["PREPARED", "COMMITTED", "ERROR"]
    transitions:
      - {id: TRANS-P3-MATERIALIZE-COMMIT, from: PREPARED, command: executeGrammerThenUpdateAndCommit, to: COMMITTED, preconditions: ["模型表达式原子", "写权限", "共享 ModelLoader.value"]}
      - {id: TRANS-P3-MATERIALIZE-ERROR, from: PREPARED, command: fail, to: ERROR, preconditions: ["写入异常"], failure: INFORMATION_MATERIALIZE_FAILED}
    traceIds: ["TR-P3-INFORMATION-ENGINE-001"]
services:
  - id: SVC-P3-INFORMATION-EVALUATOR
    name: Information evaluator
    why: 识别需要统一处理三类 Information 和 DAG 拓扑。
    input: InformationKey + current model context
    output: IdentificationResult
    traceIds: ["TR-P3-INFORMATION-ENGINE-001"]
  - id: SVC-P3-INFORMATION-MATERIALIZER
    name: Information materializer
    why: 物化必须复用既有事务边界并固定 grammer → update 顺序。
    input: InformationKey + current model context
    output: MaterializationResult
    traceIds: ["TR-P3-INFORMATION-ENGINE-001"]
policies:
  - id: POL-P3-READ-SET
    name: configured read policy
    statement: 只读取当前 Information 及其依赖声明的模型路径，不读取无关字段。
    traceIds: ["TR-P3-INFORMATION-ENGINE-001"]
  - id: POL-P3-MATERIALIZE-TERMINAL
    name: terminal materialization policy
    statement: commit 和 MaterializationResult 构成物化终点；后续 evaluate 只能由调用方另行发起，不属于物化流程或返回结果。
    traceIds: ["TR-P3-INFORMATION-ENGINE-001"]
  - id: POL-P3-EVALUATE-ERROR-BLOCKING
    name: evaluation error blocking policy
    statement: evaluate ERROR 抛异常并终止当前调用，不得触发 materialize 或任何下游步骤。
    traceIds: ["TR-P3-INFORMATION-ENGINE-001"]
events:
  - id: EVT-P3-MATERIALIZED
    name: Information materialized
    meaning: change-data 已提交且 MaterializationResult 已返回；该事件不触发 evaluate 或目标/下游重识别。
    traceIds: ["TR-P3-INFORMATION-ENGINE-001"]
businessErrors:
  - {id: ERR-P3-DEFINITION-INVALID, condition: 类型混用/缺失引用/循环/越权写入, meaning: 配置或编译错误, retryable: false, stateChanged: false, traceIds: ["TR-P3-INFORMATION-ENGINE-001"]}
  - {id: ERR-P3-PATH-INVALID, condition: 模型声明路径不存在, meaning: 记录 ERROR 并抛 InformationEvaluationException，禁止物化和下游, retryable: false, stateChanged: false, traceIds: ["TR-P3-INFORMATION-ENGINE-001"]}
  - {id: ERR-P3-NULL-VALUE, condition: 普通求值读取到 null, meaning: 记录 ERROR 并抛 InformationEvaluationException，禁止物化和下游, retryable: false, stateChanged: false, traceIds: ["TR-P3-INFORMATION-ENGINE-001"]}
  - {id: ERR-P3-EVALUATE-FAILED, condition: 权限、表达式或只读 RuleView 执行失败, meaning: 记录 ERROR 并抛 InformationEvaluationException，禁止物化和下游, retryable: false, stateChanged: false, traceIds: ["TR-P3-INFORMATION-ENGINE-001"]}
  - {id: ERR-P3-MATERIALIZE-FAILED, condition: change-data 写入失败, meaning: 抛异常并由现有回滚机制撤销, retryable: false, stateChanged: false, traceIds: ["TR-P3-INFORMATION-ENGINE-001"]}
traceability:
  - traceId: TR-P3-INFORMATION-ENGINE-001
    requirementRefs: ["REQAN-P3-R04@aa4bd589d74c"]
    modelRefs: ["BM-P3-R03"]
    acceptanceRefs: ["AC-P3-INFORMATION-ENGINE-001"]
    flowRefs: ["FLOW-P3-INFORMATION-EVALUATION"]
