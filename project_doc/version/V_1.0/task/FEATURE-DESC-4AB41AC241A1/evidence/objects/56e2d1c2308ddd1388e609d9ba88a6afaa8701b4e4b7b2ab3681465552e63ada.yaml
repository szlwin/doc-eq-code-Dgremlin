schemaVersion: 1
artifact: business_flow_changeset
changeSet:
  id: FLOW-CHG-P3-INFORMATION-EVALUATION-R08
  version: V_1.0
  module: COMPILER
  flowGroup: COMPILER
  flowGroupName: Configuration compilation, model execution and information evaluation
  reason: Define P3 Information and materialization target facts separately from Directory-owned ChangeInfo/RuleViewInfo mapping, with compile-time rejection of invalid targets and mappings, shared Action/materialization rollback, P5 after-last-action execution and no post-commit reevaluation.
  baseRevision: FLOW-R04@p2-simple-runtime-model
  resultRevision: FLOW-R08@p3-information-evaluation
  affectedTraceIds:
    - TR-P3-INFORMATION-ENGINE-001
operations:
  - operation: add
    targetId: FLOW-P3-INFORMATION-EVALUATION
    reason: Provide canonical end-to-end evidence for P3 ordering, branches, transaction outcome and blocking failures.
    after:
      id: FLOW-P3-INFORMATION-EVALUATION
      name: P3 Information compilation, evaluation and materialization
      level: L1
      type: MAIN
      ownerModule: MODEL
      participantModules:
        - COMPILER
        - CONTEXT
        - MODEL
        - XML
        - DEMO
      goal: Compile and publish immutable Information facts and Directory-consumable materialization target facts; let Directory parsing own ChangeInfo/RuleViewInfo creation, registration, mapping and invariant checks; let P5 execute Directory Actions in order and trigger the compiled mapping only after the last successful Action, evaluate without writes, and complete one declared change-data materialization atomically.
      trigger: A configuration load validates and publishes P3 Information facts and Directory-consumable target facts, or P5 completes the last Action of a Directory.
      requirementRefs:
        - id: P3-INFORMATION-ENGINE
          documentRef: version/V_1.0/doc/FEATURE-DESC-4AB41AC241A1/requirement.md
      featureRefs:
        - id: P3-INFORMATION-ENGINE-F01
          module: MODEL
      ruleRefs:
        - BR-P3-INFORMATION-ENGINE-001
        - BR-P3-INFORMATION-ENGINE-002
        - BR-P3-INFORMATION-ENGINE-003
        - BR-P3-INFORMATION-ENGINE-004
        - BR-P3-INFORMATION-ENGINE-005
        - CR-P3-INFORMATION-ENGINE-001
      acceptanceRefs:
        - AC-P3-INFORMATION-ENGINE-001
      traceIds:
        - TR-P3-INFORMATION-ENGINE-001
      preconditions:
        - P1 and P2 published exact System, View, RuleView and model-access binding facts
        - mix Information definitions have stable source locations
      steps:
        - id: STEP-P3-INFORMATION-EVALUATION-COMPILE
          order: 1
          name: Compile and publish Information facts
          ownerModule: COMPILER
          featureRef: P3-INFORMATION-ENGINE-F01
          preconditions:
            - all P3 Information definitions and P2 exact bindings belong to one Compilation Session
          postconditions:
            - the three exclusive Information kinds and their read or write bindings are frozen in the compiled Information facts
            - P3 publishes each valid change-info target Information, change-data, path, permission and materialization-rule fact for Directory consumption
            - Directory parsing validates the target reference, target Information type/change-data declaration, path/permission, RuleViewInfo rules and ChangeInfo mapping legality; it creates, registers and maps each valid RuleViewInfo once
            - a cycle, missing reference, invalid path, illegal expression, permission error or invalid Directory target/mapping rejects the complete candidate
            - a valid CompiledInformationSet is published atomically with the same EngineContext
          notes: MODEL owns the Information facts and target-fact contract; COMPILER compiles those facts; Directory/P5 owns Directory, ChangeInfo/RuleViewInfo mapping and Action ordering. P4 supplies Action/Produce results. This changeset does not implement those downstream stages.
        - id: STEP-P3-INFORMATION-EVALUATION-IDENTIFY
          order: 2
          name: Evaluate Information without writes
          ownerModule: MODEL
          featureRef: P3-INFORMATION-ENGINE-F01
          preconditions:
            - the requested InformationKey and exact read-only binding are published
          postconditions:
            - a satisfied condition returns TRUE with read evidence
            - a normally unsatisfied condition returns FALSE with read evidence
            - evaluate performs no model write and consumes no MutationSet or runtime path resolver
        - id: STEP-P3-INFORMATION-EVALUATION-MATERIALIZE
          order: 3
          name: Execute Directory Actions and materialize declared change-data
          ownerModule: CONTEXT
          featureRef: P3-INFORMATION-ENGINE-F01
          preconditions:
            - Directory has a legal ChangeInfo to RuleViewInfo mapping, declared change-data and exact write permission
            - Directory execution has opened the shared rollback boundary and P5 executes Actions in Directory order
            - P5 has completed all preceding Actions successfully and is executing the last Action
          postconditions:
            - the already registered and mapped Directory RuleViewInfo executes grammer before update
            - all Directory Actions and change-data materialization participate in one shared rollback boundary
            - success commits once, returns MaterializationResult and ends the flow
            - success does not invoke evaluate or identify target or downstream Information
      variants:
        - id: FVAR-P3-INFORMATION-EVALUATION-TRUE
          name: Satisfied evaluation
          condition: all required read-only conditions are satisfied
          differences:
            - STEP-P3-INFORMATION-EVALUATION-IDENTIFY returns TRUE
            - materialize is not implied by a TRUE result
          ruleRefs:
            - BR-P3-INFORMATION-ENGINE-003
        - id: FVAR-P3-INFORMATION-EVALUATION-FALSE
          name: Normally unsatisfied evaluation
          condition: a business condition is not satisfied and no evaluation error occurs
          differences:
            - STEP-P3-INFORMATION-EVALUATION-IDENTIFY returns FALSE
            - FALSE is never used to represent an invalid path, ordinary null, permission error, expression error or RuleView error
          ruleRefs:
            - BR-P3-INFORMATION-ENGINE-002
        - id: FVAR-P3-INFORMATION-EVALUATION-MATERIALIZE
          name: Explicit optional materialization
          condition: the caller explicitly invokes materialize for an eligible model-expression atomic Information
          differences:
            - STEP-P3-INFORMATION-EVALUATION-MATERIALIZE reuses the Directory-owned registered RuleViewInfo mapped from ChangeInfo and executes grammer then update within the shared Action/materialization rollback boundary
            - the success boundary is commit plus MaterializationResult with no post-commit reevaluation
          ruleRefs:
            - BR-P3-INFORMATION-ENGINE-001
            - BR-P3-INFORMATION-ENGINE-004
            - BR-P3-INFORMATION-ENGINE-005
      failurePaths:
        - id: FAIL-P3-INFORMATION-COMPILE
          atStep: STEP-P3-INFORMATION-EVALUATION-COMPILE
          condition: Information kind, reference, DAG, path, expression, permission, change-info target, target type/change-data, RuleViewInfo rule or Directory mapping validation fails
          result: the candidate reports a located ERROR and is not published
          compensation: discard the candidate and keep previously published Information facts and Directory mappings unchanged
          blocking: true
          acceptanceRefs:
            - AC-P3-INFORMATION-ENGINE-001
        - id: FAIL-P3-INFORMATION-EVALUATE
          atStep: STEP-P3-INFORMATION-EVALUATION-IDENTIFY
          condition: an invalid path, ordinary null, permission failure, expression failure or read-only RuleView failure occurs
          result: record ERROR and throw InformationEvaluationException instead of returning FALSE
          compensation: no write occurred; do not materialize or continue downstream
          blocking: true
          acceptanceRefs:
            - AC-P3-INFORMATION-ENGINE-001
        - id: FAIL-P3-INFORMATION-MATERIALIZE
          atStep: STEP-P3-INFORMATION-EVALUATION-MATERIALIZE
          condition: any Action, grammer, update, persistence or commit fails
          result: the shared Action/materialization transaction rolls back, an ERROR is thrown and no downstream step runs
          compensation: restore the pre-execution model state through the shared rollback boundary; no external compensation is defined in this scope
          blocking: true
          acceptanceRefs:
            - AC-P3-INFORMATION-ENGINE-001
      successCriteria:
        - CompiledInformationSet is published atomically with its exact P2 bindings and EngineContext
        - read-only evaluate distinguishes TRUE and FALSE from ERROR plus exception
        - Directory-owned materialization preserves grammer to update order and the shared Action/materialization rollback boundary
        - successful materialization commits and returns MaterializationResult without post-commit reevaluation
        - failed materialization rolls back, throws and does not continue downstream
      businessModelRefs:
        - AGG-INFORMATION-MODEL
        - AGG-INFORMATION-EVALUATION
        - INV-P3-REALTIME-READ
        - INV-P3-MATERIALIZE
        - SM-P3-IDENTIFICATION
        - SM-P3-MATERIALIZATION
      dependencyImpactRefs: []
      designRefs:
        - DESIGN-P3-R08
      testCaseIds:
        - CASE-P3-MIX-001
        - CASE-P3-ERROR-001
        - CASE-P3-CHANGE-INFO-001
        - CASE-P3-DIRECTORY-001
      status: PROPOSED
      createdVersion: V_1.0
      lastChangedVersion: FLOW-R08
