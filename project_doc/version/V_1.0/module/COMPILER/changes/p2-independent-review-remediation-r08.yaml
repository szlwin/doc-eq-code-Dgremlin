normativeOverrides:
  - id: INV-COMPILER-020
    replaces: "所有 Rule、change 与 custom action 的 mutation 路径在需要动态判定时必须先经过同一访问 Guard"
    text: >-
      所有受保护的运行时模型 READ、WRITE、EXECUTE 入口都必须先调用同一个
      ModelAccessGuard，包括 Rule、change、custom action、query/read 等入口；不存在
      STATIC_ALLOW 绕过 Guard 的特权路径。STATIC_ALLOW 只表示 Guard 在校验 Context、
      owner-qualified key、operation 与静态 policy 后可直接返回 ALLOW，而不调用
      RuntimeFactEvaluator。Guard 不可用、Context identity 不匹配、rule/policy 缺失、
      权限无法确定或任何运行时授权异常时必须 fail-closed 返回 DENY；DENY 必须发生在
      read/mutation/execute、状态推进或外部副作用之前。
    traces:
      - TR-P2-SYSTEM-RULEVIEW-004
      - TR-P2-SYSTEM-RULEVIEW-006
      - TR-P2-SYSTEM-RULEVIEW-007

  - id: CMI-P2-MODEL-ACCESS-STEP-04
    text: >-
      对每一个 protected READ/WRITE/EXECUTE request，无条件调用 ModelAccessGuard.authorize。
      Guard 内部先完成 Context/policy identity 校验和精确 policy lookup；STATIC_ALLOW 在
      Guard 内快速 ALLOW 且 evaluator 调用次数必须为 0；RUNTIME_GUARD_REQUIRED 才调用
      RuntimeFactEvaluator。只有 Guard 返回 ALLOW 后才允许执行目标操作。

