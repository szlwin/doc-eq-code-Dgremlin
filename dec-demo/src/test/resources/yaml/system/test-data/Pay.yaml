datas:
  - name: pay
    properties:
      id: int
      userId: int
      orderId: int
      totalPrice: decimal
      totalAmount: decimal
      payStatus: int
      createDate: date
    tables:
      - name: pay_info
        dataSource: data1
        key: o_id
        keyType: increment
        columns:
          o_id: id
          o_userId: userId
          o_orderId: orderId
          o_totalPrice: totalPrice
          o_totalAmount: totalAmount
          o_status: payStatus
          o_date:
            ref: createDate
            type: timestamp

  - name: payDetail
    properties:
      id: int
      userId: int
      payId: int
      createDate: date
      productId: int
      productName: int
      payPrice: decimal
      payAmount: decimal
    tables:
      - name: pay_detail_info
        dataSource: data1
        key: o_d_id
        keyType: increment
        columns:
          o_d_id: id
          o_payId: payId
          o_userId: userId
          o_productId: productId
          o_productName: productName
          o_payPrice: payPrice
          o_payAmount: payAmount
          o_date:
            ref: createDate
            type: timestamp
