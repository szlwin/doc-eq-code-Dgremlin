name: Dispatch P0 stage closure validation

"on":
  push:
    branches:
      - feature/p1-t15-retire-declaration-20260806-1354
    paths:
      - .stage-closure-dispatch/trigger.json

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch standard P0 workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/p0-build.yml/dispatches" \
            --data '{"ref":"feature/p1-t15-retire-declaration-20260806-1354"}'
