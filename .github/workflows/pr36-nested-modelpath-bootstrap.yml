name: PR36 nested ModelPath closure bootstrap

on:
  push:
    branches:
      - feature/p2-design-testdesign-20260808

permissions:
  contents: write

jobs:
  inspect-common-develop:
    if: contains(github.event.head_commit.message, '[nested-modelpath-inspect4]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect RC9 Evidence and Review subcommands
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/common-develop
          git clone --depth=1 https://gitee.com/szlwin/common-develop.git /tmp/common-develop
          {
            for cmd in \
              'evidence.py snapshot-register' \
              'evidence.py register' \
              'evidence.py validate' \
              'manual_review.py prepare' \
              'manual_review.py draft' \
              'manual_review.py submit' \
              'review_store.py' \
              'acceptance.py' \
              'git_checkpoint.py create'; do
              echo "=== $cmd --help ==="
              python3 /tmp/common-develop/scripts/$cmd --help || true
            done
          } > .common-develop-inspect4.txt 2>&1
          git config user.name 'common-develop-bot'
          git config user.email 'common-develop-bot@users.noreply.github.com'
          git add .common-develop-inspect4.txt
          git commit -m 'chore: capture RC9 review contracts [nested-modelpath-inspect4-output]'
          git push origin HEAD:feature/p2-design-testdesign-20260808
