name: PR36 nested ModelPath TestDesign R32 stage

on:
  push:
    branches:
      - feature/p2-design-testdesign-20260808

permissions:
  contents: write

jobs:
  build-r32:
    if: contains(github.event.head_commit.message, '[nested-modelpath-r32-stage]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build TestDesign R32 with RC9 lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_TRIGGER="$GITHUB_SHA"
          BASE=7cd464a385464166a4a19f07fa4c422f1569346d
          BRANCH=feature/p2-design-testdesign-20260808
          TDIR=project_doc/version/V_1.0/task/FEATURE-DESC-3361AD2E54FC
          TESTFILE=project_doc/version/V_1.0/doc/FEATURE-DESC-3361AD2E54FC/test_case.md
          TRACEFILE="$TDIR/traceability.md"
          rm -rf /tmp/common-develop
          git clone --depth=1 https://gitee.com/szlwin/common-develop.git /tmp/common-develop
          test "$(git -C /tmp/common-develop rev-parse HEAD)" = "7086b2d32b6beae2e6e522efc517d7823ba55376"
          git reset --hard "$BASE"
          git clean -f -- .github/workflows/pr36-nested-modelpath-bootstrap.yml .common-develop-inspect.txt .common-develop-inspect3.txt .common-develop-inspect4.txt || true
          python3 /tmp/common-develop/scripts/long_task.py reopen-phase -g ProjectManagerAgent --task-dir "$TDIR" --from-phase test_design --source-revision DESIGN-P2-R30 --reason "Clarify existing nested ModelPath semantics with explicit TestDesign oracles; P1 implementation, BM-R20 and DESIGN-P2-R30 remain unchanged."
          TASK_ID=$(python3 - <<'PY'
          import json,re
          p='project_doc/version/V_1.0/task/FEATURE-DESC-3361AD2E54FC/task_plan.md'
          s=open(p,encoding='utf-8').read(); m=re.search(r'```json task-plan\n(.*?)\n```',s,re.S)
          tasks=json.loads(m.group(1))
          print(next(t['id'] for t in tasks if t['phase']=='test_design' and t['status'] in ('PENDING','IN_PROGRESS','REWORK','DRAFT')))
          PY
          )
          python3 /tmp/common-develop/scripts/long_task.py start-attempt -g TestDesignAgent --task-dir "$TDIR" --task-id "$TASK_ID" --input-revision DESIGN-P2-R30 --summary "Add six explicit nested ModelPath and exact-authorization oracles without changing P1/BM/Design semantics." --next-action "Publish TESTDESIGN-P2-R32 for independent Review"
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          test=Path('project_doc/version/V_1.0/doc/FEATURE-DESC-3361AD2E54FC/test_case.md')
          s=test.read_text(encoding='utf-8')
          s=s.replace('# P2 TestDesign R31','# P2 TestDesign R32')
          s=s.replace('`TESTDESIGN-P2-R31`; base R30;', '`TESTDESIGN-P2-R32`; base R31;')
          s=s.replace('Status `NEEDS_REVIEW / BLOCKED_BY_DESIGN_REVIEW / MACHINE_BLOCKED`. **95 blocking Cases -> 23 exact TestClasses**.', 'Status `IN_REVIEW`. **101 blocking Cases -> 23 exact TestClasses**.')
          s=s.replace('## 95 blocking oracles','## 101 blocking oracles')
          s=s.replace('CURRENT-R31','CURRENT-R32')
          s=s.replace('DESIGN-R30->TEST-R31','DESIGN-R30->TEST-R32')
          anchor='`CASE-P2-TD-P1-PATH-OPERATION-MIGRATION-001 | TARGET | P1 path maps losslessly to READ/WRITE-only P2 | no EXECUTE synthesis/path loss | CURRENT-R32`'
          cases=[
          '`CASE-P2-TD-NESTED-OBJECT-PATH-001 | TARGET | user.authInfo compiles as canonical exact segments [user,authInfo] when both segments exist and user is composite | no flattening/root guessing/runtime repair | CURRENT-R32`',
          '`CASE-P2-TD-DEEP-NESTED-OBJECT-PATH-001 | TARGET | user.authInfo.role compiles as canonical exact segments [user,authInfo,role] when each intermediate is composite | no truncation/prefix fallback | CURRENT-R32`',
          '`CASE-P2-TD-NON-COMPOSITE-INTERMEDIATE-001 | TARGET | user.id.value fails at compile time when id is a leaf/non-composite segment | no runtime/best-effort repair | CURRENT-R32`',
          '`CASE-P2-TD-NESTED-COLLECTION-PATH-001 | TARGET | payInfo.payDetailList.productId navigates the compiled object/collection path catalog to one canonical exact ModelPath | no wildcard/string-only fallback | CURRENT-R32`',
          '`CASE-P2-TD-TARGET-MAIN-PATH-ISOLATION-001 | TARGET | with target-main=user, selector user.authInfo is not interpreted as target-main(user)+property(authInfo); target-main exact match and property-root traversal remain separate selectors | no target-main prefix consumption | CURRENT-R32`',
          '`CASE-P2-TD-PARENT-PATH-NO-AUTH-FALLBACK-001 | POLICY | READ user does not authorize READ user.authInfo unless the child exact ModelAccessRuleKey exists (or source READ wildcard was compile-time expanded to that exact path) | no parent/prefix/ancestor runtime permission fallback | CURRENT-R32`'
          ]
          if 'CASE-P2-TD-NESTED-OBJECT-PATH-001' not in s:
              if anchor not in s: raise SystemExit('anchor missing')
              s=s.replace(anchor, anchor+'\n'+'\n'.join(cases),1)
          appendix='''\n\n## R32 nested ModelPath clarification\n\nR32 is a TestDesign-only increment over R31. It does not reopen P1, BM-R20, FLOW-R11 or DESIGN-P2-R30. It freezes the already-designed distinction that `target-main` is an exact root selector, not a prefix consumed from a dotted property path; nested object/collection paths are canonical segment sequences; non-composite intermediate segments fail closed; runtime authorization remains exact-only with no parent/prefix fallback. The six R32 oracles reuse existing `TARGET` / `POLICY` TestClasses, so the registry remains 23 exact TestClasses.\n'''
          if '## R32 nested ModelPath clarification' not in s: s += appendix
          test.write_text(s,encoding='utf-8')

          tr=Path('project_doc/version/V_1.0/task/FEATURE-DESC-3361AD2E54FC/traceability.md')
          t=tr.read_text(encoding='utf-8').replace('TESTDESIGN-P2-R31','TESTDESIGN-P2-R32')
          m=re.search(r'```json traceability\n(.*?)\n```',t,re.S)
          data=json.loads(m.group(1))
          by={x['id']:x for x in data}
          nested=['CASE-P2-TD-NESTED-OBJECT-PATH-001','CASE-P2-TD-DEEP-NESTED-OBJECT-PATH-001','CASE-P2-TD-NON-COMPOSITE-INTERMEDIATE-001','CASE-P2-TD-NESTED-COLLECTION-PATH-001','CASE-P2-TD-TARGET-MAIN-PATH-ISOLATION-001','CASE-P2-TD-PARENT-PATH-NO-AUTH-FALLBACK-001']
          for cid in nested:
              if cid not in by['TR-P2-SYSTEM-RULEVIEW-005']['test_case_ids']: by['TR-P2-SYSTEM-RULEVIEW-005']['test_case_ids'].append(cid)
          cid='CASE-P2-TD-PARENT-PATH-NO-AUTH-FALLBACK-001'
          if cid not in by['TR-P2-SYSTEM-RULEVIEW-004']['test_case_ids']: by['TR-P2-SYSTEM-RULEVIEW-004']['test_case_ids'].append(cid)
          block=json.dumps(data,ensure_ascii=False,indent=2)
          t=t[:m.start(1)]+block+t[m.end(1):]
          tr.write_text(t,encoding='utf-8')
          PY
          mkdir -p "$TDIR/evidence/command-results/TESTDESIGN-P2-R32"
          python3 - <<'PY' > "$TDIR/evidence/command-results/TESTDESIGN-P2-R32/nested-modelpath-oracle-validate.json"
          import json,re
          from pathlib import Path
          s=Path('project_doc/version/V_1.0/doc/FEATURE-DESC-3361AD2E54FC/test_case.md').read_text(encoding='utf-8')
          cases=re.findall(r'`(CASE-P2-TD-[^ |]+) \|',s)
          classes=re.findall(r'^`[^|`]+ \| [^|`]+ \| ([A-Za-z0-9_]+Test) \|',s,re.M)
          required=['CASE-P2-TD-NESTED-OBJECT-PATH-001','CASE-P2-TD-DEEP-NESTED-OBJECT-PATH-001','CASE-P2-TD-NON-COMPOSITE-INTERMEDIATE-001','CASE-P2-TD-NESTED-COLLECTION-PATH-001','CASE-P2-TD-TARGET-MAIN-PATH-ISOLATION-001','CASE-P2-TD-PARENT-PATH-NO-AUTH-FALLBACK-001']
          tr=Path('project_doc/version/V_1.0/task/FEATURE-DESC-3361AD2E54FC/traceability.md').read_text(encoding='utf-8')
          tm=re.search(r'```json traceability\n(.*?)\n```',tr,re.S); traces=json.loads(tm.group(1))
          by={x['id']:x for x in traces}
          checks={
            'revision': 'TESTDESIGN-P2-R32' in s,
            'case_count_101': len(cases)==101,
            'unique_cases_101': len(set(cases))==101,
            'testclass_count_23': len(set(classes))==23,
            'six_oracles_present': all(x in cases for x in required),
            'trace005_all_six': all(x in by['TR-P2-SYSTEM-RULEVIEW-005']['test_case_ids'] for x in required),
            'trace004_exact_auth': required[-1] in by['TR-P2-SYSTEM-RULEVIEW-004']['test_case_ids'],
            'stable_trace_count_10': len(traces)==10,
          }
          print(json.dumps({'schema_version':1,'command':'deterministic nested ModelPath TestDesign validator','revision':'TESTDESIGN-P2-R32','checks':checks,'status':'PASSED' if all(checks.values()) else 'FAILED'},ensure_ascii=False,indent=2))
          if not all(checks.values()): raise SystemExit(1)
          PY
          git diff --check
          E1=$(python3 /tmp/common-develop/scripts/evidence.py snapshot-register -g TestDesignAgent --task-dir "$TDIR" --type test_ref --source-ref "$TESTFILE" --revision TESTDESIGN-P2-R32 --phase test_design --scope "101 blocking oracles / 23 exact TestClasses" | python3 -c 'import json,sys; print(json.load(sys.stdin)["evidence_id"])')
          E2=$(python3 /tmp/common-develop/scripts/evidence.py snapshot-register -g TestDesignAgent --task-dir "$TDIR" --type document_ref --source-ref "$TRACEFILE" --revision TESTDESIGN-P2-R32 --phase test_design --scope "TR-004/TR-005 nested ModelPath bindings" | python3 -c 'import json,sys; print(json.load(sys.stdin)["evidence_id"])')
          E3=$(python3 /tmp/common-develop/scripts/evidence.py snapshot-register -g TestDesignAgent --task-dir "$TDIR" --type design_ref --source-ref project_doc/version/V_1.0/doc/COMPILER/COMPILER_design.md --revision DESIGN-P2-R30 --phase test_design --scope "existing nested ModelPath design authority" | python3 -c 'import json,sys; print(json.load(sys.stdin)["evidence_id"])')
          E4=$(python3 /tmp/common-develop/scripts/evidence.py snapshot-register -g TestDesignAgent --task-dir "$TDIR" --type command_ref --source-ref "$TDIR/evidence/command-results/TESTDESIGN-P2-R32/nested-modelpath-oracle-validate.json" --revision TESTDESIGN-P2-R32 --phase test_design --scope "deterministic R32 oracle validator" | python3 -c 'import json,sys; print(json.load(sys.stdin)["evidence_id"])')
          ATTEMPT=$(python3 - <<'PY'
          import json,re
          s=open('project_doc/version/V_1.0/task/FEATURE-DESC-3361AD2E54FC/task_state.md',encoding='utf-8').read(); m=re.search(r'```json task-state\n(.*?)\n```',s,re.S); print(json.loads(m.group(1))['current_attempt_id'])
          PY
          )
          python3 /tmp/common-develop/scripts/long_task.py finish-attempt -g TestDesignAgent --task-dir "$TDIR" --attempt-id "$ATTEMPT" --status PASSED --output-revision TESTDESIGN-P2-R32 --modified-file "$TESTFILE" --modified-file "$TRACEFILE" --command-ref "$TDIR/evidence/command-results/TESTDESIGN-P2-R32/nested-modelpath-oracle-validate.json" --evidence-ref "$E1" --evidence-ref "$E2" --evidence-ref "$E3" --evidence-ref "$E4" --summary "R32 adds six explicit nested ModelPath/exact-authorization oracles; 101 Cases, 23 TestClasses, 10 stable traces; P1/BM/Design unchanged." --next-action "Independent TestDesign reviews" --next-agent ProjectManagerAgent
          python3 /tmp/common-develop/scripts/long_task.py publish-artifact -g ProjectManagerAgent --task-dir "$TDIR" --attempt-id "$ATTEMPT" --evidence-id "$E1" --evidence-id "$E2" --evidence-id "$E3" --evidence-id "$E4"
          python3 /tmp/common-develop/scripts/evidence.py validate -g ProjectManagerAgent --task-dir "$TDIR"
          python3 /tmp/common-develop/scripts/long_task.py validate -g ProjectManagerAgent --task-dir "$TDIR" --json > /tmp/r32-long-task-validate.json
          git diff --check
          git config user.name 'common-develop-bot'
          git config user.email 'common-develop-bot@users.noreply.github.com'
          git add -A
          git commit -m 'testdesign(p2): publish nested ModelPath R32 for review'
          git push --force-with-lease="refs/heads/$BRANCH:$EXPECTED_TRIGGER" origin HEAD:"$BRANCH"
