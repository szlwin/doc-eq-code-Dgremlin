name: Verify and Open PR

run-name: Verify ${{ github.ref_name }} and open PR to ${{ inputs.base_branch || 'dev_all' }}

"on":
  workflow_dispatch:
    inputs:
      base_branch:
        description: Pull request target branch
        required: true
        default: dev_all
        type: string

      pr_title:
        description: Pull request title; leave empty to generate automatically
        required: false
        default: ""
        type: string

  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "refactor/**"
      - "chore/**"

permissions:
  contents: read

concurrency:
  # push：同一分支只保留最新运行。
  # workflow_dispatch：每次手工运行使用独立 run_id，互不取消。
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'push' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  core-verify:
    name: Core build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify Maven Wrapper
        run: ./mvnw --version

      - name: Bootstrap repository-bundled legacy dependencies
        run: scripts/remediation/bootstrap_legacy_dependencies.sh

      - name: Compile and run core tests
        run: |
          ./mvnw \
            --batch-mode \
            --no-transfer-progress \
            clean verify

      - name: Prove failing tests block the build
        run: scripts/remediation/prove_test_failure_gate.sh

      - name: Upload core test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: core-test-reports-${{ github.run_id }}
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/site/jacoco/**
          if-no-files-found: warn
          retention-days: 14

  mysql-it:
    name: MySQL integration tests
    needs: core-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # Java 测试代码通过这些环境变量读取数据库连接信息。
    env:
      DEC_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/demo-test2
      DEC_MYSQL_URL_2: jdbc:mysql://127.0.0.1:3306/demo-test1
      DEC_MYSQL_USER: root
      DEC_MYSQL_PASSWORD: root

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify Maven Wrapper
        run: ./mvnw --version

      - name: Bootstrap repository-bundled legacy dependencies
        run: scripts/remediation/bootstrap_legacy_dependencies.sh

      - name: Start preinstalled MySQL
        shell: bash
        run: |
          set -euo pipefail

          sudo systemctl start mysql.service

          MYSQL_READY=false

          for attempt in $(seq 1 30); do
            if MYSQL_PWD="$DEC_MYSQL_PASSWORD" \
              mysqladmin \
                --protocol=TCP \
                --host=127.0.0.1 \
                --port=3306 \
                --user="$DEC_MYSQL_USER" \
                ping \
                --silent
            then
              MYSQL_READY=true
              break
            fi

            echo "Waiting for MySQL: attempt ${attempt}/30"
            sleep 1
          done

          if [ "$MYSQL_READY" != "true" ]; then
            echo "::error::MySQL did not become ready within 30 seconds."
            sudo systemctl status mysql.service --no-pager || true
            exit 1
          fi

          MYSQL_PWD="$DEC_MYSQL_PASSWORD" \
            mysql \
              --protocol=TCP \
              --host=127.0.0.1 \
              --port=3306 \
              --user="$DEC_MYSQL_USER" \
              --execute="
                SELECT VERSION() AS mysql_version;
                SELECT CURRENT_USER();
              "

      - name: Initialize MySQL schema
        shell: bash
        run: |
          set -euo pipefail

          SCHEMA_FILE="dec-demo/src/test/resources/mysql/schema.sql"

          if [ ! -f "$SCHEMA_FILE" ]; then
            echo "::error::Missing MySQL schema file: $SCHEMA_FILE"
            exit 1
          fi

          MYSQL_PWD="$DEC_MYSQL_PASSWORD" \
            mysql \
              --protocol=TCP \
              --host=127.0.0.1 \
              --port=3306 \
              --user="$DEC_MYSQL_USER" \
              < "$SCHEMA_FILE"

      - name: Initialize MySQL test data
        shell: bash
        run: |
          set -euo pipefail

          DATA_FILE="dec-demo/src/test/resources/mysql/data.sql"

          if [ -f "$DATA_FILE" ]; then
            MYSQL_PWD="$DEC_MYSQL_PASSWORD" \
              mysql \
                --protocol=TCP \
                --host=127.0.0.1 \
                --port=3306 \
                --user="$DEC_MYSQL_USER" \
                --database="demo-test2" \
                < "$DATA_FILE"
          else
            echo "Optional MySQL test data file does not exist: $DATA_FILE"
          fi

      - name: Verify MySQL schemas
        shell: bash
        run: |
          set -euo pipefail

          mysql_value() {
            MYSQL_PWD="$DEC_MYSQL_PASSWORD" \
              mysql \
                --protocol=TCP \
                --host=127.0.0.1 \
                --port=3306 \
                --user="$DEC_MYSQL_USER" \
                --batch \
                --skip-column-names \
                --execute="$1"
          }

          SCHEMA_COUNT="$(
            mysql_value "
              SELECT COUNT(*)
              FROM INFORMATION_SCHEMA.SCHEMATA
              WHERE SCHEMA_NAME IN ('demo-test1', 'demo-test2');
            "
          )"

          if [ "$SCHEMA_COUNT" -ne 2 ]; then
            echo "::error::Expected demo-test1 and demo-test2, found ${SCHEMA_COUNT} schemas."
            exit 1
          fi

          DEMO1_PRODUCT_COUNT="$(
            mysql_value "
              SELECT COUNT(*)
              FROM INFORMATION_SCHEMA.TABLES
              WHERE TABLE_SCHEMA = 'demo-test1'
                AND TABLE_NAME = 'product_info';
            "
          )"

          DEMO2_PRODUCT_COUNT="$(
            mysql_value "
              SELECT COUNT(*)
              FROM INFORMATION_SCHEMA.TABLES
              WHERE TABLE_SCHEMA = 'demo-test2'
                AND TABLE_NAME = 'product_info';
            "
          )"

          DEMO2_ORDER_COUNT="$(
            mysql_value "
              SELECT COUNT(*)
              FROM INFORMATION_SCHEMA.TABLES
              WHERE TABLE_SCHEMA = 'demo-test2'
                AND TABLE_NAME = 'order_info';
            "
          )"

          if [ "$DEMO1_PRODUCT_COUNT" -ne 1 ]; then
            echo "::error::Missing demo-test1.product_info."
            exit 1
          fi

          if [ "$DEMO2_PRODUCT_COUNT" -ne 1 ]; then
            echo "::error::Missing demo-test2.product_info."
            exit 1
          fi

          if [ "$DEMO2_ORDER_COUNT" -ne 1 ]; then
            echo "::error::Missing demo-test2.order_info."
            exit 1
          fi

          MYSQL_PWD="$DEC_MYSQL_PASSWORD" \
            mysql \
              --protocol=TCP \
              --host=127.0.0.1 \
              --port=3306 \
              --user="$DEC_MYSQL_USER" \
              --execute="
                SELECT SCHEMA_NAME
                FROM INFORMATION_SCHEMA.SCHEMATA
                WHERE SCHEMA_NAME IN ('demo-test1', 'demo-test2')
                ORDER BY SCHEMA_NAME;

                SHOW TABLES FROM \`demo-test1\`;
                SHOW TABLES FROM \`demo-test2\`;
              "

      - name: Run MySQL integration tests
        shell: bash
        run: |
          echo "Primary JDBC URL: $DEC_MYSQL_URL"
          echo "Secondary JDBC URL: $DEC_MYSQL_URL_2"
          echo "Database user: $DEC_MYSQL_USER"

          ./mvnw \
            --batch-mode \
            --no-transfer-progress \
            -Pmysql-it \
            verify

      - name: Upload MySQL integration test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mysql-test-reports-${{ github.run_id }}
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/site/jacoco/**
          if-no-files-found: warn
          retention-days: 14

      - name: Show MySQL diagnostics after failure
        if: failure()
        shell: bash
        run: |
          echo "## MySQL service status"
          sudo systemctl status mysql.service --no-pager || true

          echo
          echo "## MySQL process list"

          MYSQL_PWD="$DEC_MYSQL_PASSWORD" \
            mysql \
              --protocol=TCP \
              --host=127.0.0.1 \
              --port=3306 \
              --user="$DEC_MYSQL_USER" \
              --execute="
                SHOW FULL PROCESSLIST;
              " || true

          echo
          echo "## InnoDB status"

          MYSQL_PWD="$DEC_MYSQL_PASSWORD" \
            mysql \
              --protocol=TCP \
              --host=127.0.0.1 \
              --port=3306 \
              --user="$DEC_MYSQL_USER" \
              --execute="
                SHOW ENGINE INNODB STATUS;
              " || true

          echo
          echo "## Active InnoDB transactions"

          MYSQL_PWD="$DEC_MYSQL_PASSWORD" \
            mysql \
              --protocol=TCP \
              --host=127.0.0.1 \
              --port=3306 \
              --user="$DEC_MYSQL_USER" \
              --execute="
                SELECT *
                FROM INFORMATION_SCHEMA.INNODB_TRX;
              " || true

  create-pr:
    name: Create or reuse pull request
    needs: mysql-it
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Verify GitHub CLI
        run: gh --version

      - name: Create or reuse pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          BASE_BRANCH_INPUT: ${{ inputs.base_branch }}
          PR_TITLE_INPUT: ${{ inputs.pr_title }}
        run: |
          set -euo pipefail

          if [ "$REF_TYPE" != "branch" ]; then
            echo "::error::This workflow must run against a branch."
            exit 1
          fi

          BASE_BRANCH="${BASE_BRANCH_INPUT:-dev_all}"

          if [ "$SOURCE_BRANCH" = "$BASE_BRANCH" ]; then
            echo "::error::Source and target branches cannot both be '$BASE_BRANCH'."
            exit 1
          fi

          PR_TITLE="${PR_TITLE_INPUT:-Merge ${SOURCE_BRANCH} into ${BASE_BRANCH}}"

          EXISTING_PR_URL="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --head "$SOURCE_BRANCH" \
              --base "$BASE_BRANCH" \
              --state open \
              --json url \
              --jq '.[0].url // empty'
          )"

          if [ -n "$EXISTING_PR_URL" ]; then
            {
              echo "## Pull request"
              echo
              echo "An open pull request already exists:"
              echo
              echo "$EXISTING_PR_URL"
            } >> "$GITHUB_STEP_SUMMARY"

            echo "Existing pull request: $EXISTING_PR_URL"
            exit 0
          fi

          cat > /tmp/pr-body.md <<EOF
          ## Verification result

          This pull request was created only after all pre-PR checks passed.

          Passed checks:

          - Maven Wrapper verification
          - Repository-bundled legacy dependency bootstrap
          - Maven clean verify
          - Core unit tests
          - Failure-gate proof
          - Preinstalled MySQL startup
          - MySQL schema initialization
          - Separate demo-test1 and demo-test2 validation
          - MySQL integration tests

          Source branch: \`$SOURCE_BRANCH\`

          Target branch: \`$BASE_BRANCH\`

          Workflow run:

          $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF

          PR_URL="$(
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --head "$SOURCE_BRANCH" \
              --base "$BASE_BRANCH" \
              --title "$PR_TITLE" \
              --body-file /tmp/pr-body.md
          )"

          {
            echo "## Pull request created"
            echo
            echo "$PR_URL"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Created pull request: $PR_URL"