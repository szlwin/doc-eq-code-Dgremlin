name: Verify and Open PR

run-name: Scoped DEV-03 skeleton verification ${{ github.ref_name }}

"on":
  push:
    branches:
      - "chore/p2-dev03-skel-r01-scoped-20260812"

permissions:
  contents: read

jobs:
  core-verify:
    name: DEV-03 scoped Maven verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v6
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Verify Maven Wrapper
        run: ./mvnw --version
      - name: Bootstrap repository-bundled legacy dependencies
        run: scripts/remediation/bootstrap_legacy_dependencies.sh
      - name: Build compiler dependencies without downstream tests
        run: |
          ./mvnw --batch-mode --no-transfer-progress \
            -pl dec-core-compiler -am -Dmaven.test.skip=true install
      - name: Run DEV-03 exact tests
        run: |
          ./mvnw --batch-mode --no-transfer-progress \
            -pl dec-core-compiler \
            -Dtest=P2ModelAccessStaticAuthorizationTest,ModelAccessPolicyContractTest,AtomicPublicationContractTest,P2DiagnosticDeterminismTest \
            -Dsurefire.failIfNoSpecifiedTests=true test
