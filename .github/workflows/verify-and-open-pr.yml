name: Verify and Open PR

run-name: Scoped DEV-02 skeleton verification ${{ github.ref_name }}

"on":
  push:
    branches:
      - "chore/p2-dev02-skel-r01-scoped-20260812"

permissions:
  contents: read

jobs:
  core-verify:
    name: DEV-02 scoped Maven verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify Maven Wrapper
        run: ./mvnw --version

      - name: Bootstrap repository-bundled legacy dependencies
        run: scripts/remediation/bootstrap_legacy_dependencies.sh

      - name: Apply isolated DEV-04 test fixture seam
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('dec-core-compiler/src/test/java/dec/core/compiler/pass/CompilerPipelineReworkI002Test.java')
          text = path.read_text()
          needle = '''        CompiledModelSet modelSet = new CompiledModelSet(\n                PublishedSourceManifest.empty(),\n                new ImmutableRegistry<DefinitionKey, CompiledDefinition>('''
          replacement = '''        CompiledModelSet modelSet = new CompiledModelSet(\n                PublishedSourceManifest.empty(),\n                dec.core.context.model.CompiledViewMaterializationIndex.empty(),\n                new ImmutableRegistry<DefinitionKey, CompiledDefinition>('''
          if needle not in text:
              raise SystemExit('Expected DEV-04 constructor seam not found')
          path.write_text(text.replace(needle, replacement, 1))
          PY

      - name: Build compiler dependencies without downstream tests
        run: |
          ./mvnw \
            --batch-mode \
            --no-transfer-progress \
            -pl dec-core-compiler \
            -am \
            -Dmaven.test.skip=true \
            install

      - name: Run DEV-02 exact tests
        run: |
          ./mvnw \
            --batch-mode \
            --no-transfer-progress \
            -pl dec-core-compiler \
            -Dtest=RuleViewCompilationContractTest,TargetKeyModelPathContractTest \
            -Dsurefire.failIfNoSpecifiedTests=true \
            test
