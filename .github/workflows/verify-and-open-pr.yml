name: Verify and Open PR

run-name: Gated DEV-02 concrete commit ${{ github.ref_name }}

"on":
  push:
    branches:
      - "chore/p2-dev02-concrete-r01-gated-20260812"

permissions:
  contents: write

jobs:
  core-verify:
    name: DEV-02 gated concrete verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR36 head
        uses: actions/checkout@v6
        with:
          ref: feature/p2-design-testdesign-20260808
          fetch-depth: 1

      - name: Verify frozen head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b8ae253657671ce49d00be88b20a239e33a2e374"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify Maven Wrapper
        run: ./mvnw --version

      - name: Bootstrap repository-bundled legacy dependencies
        run: scripts/remediation/bootstrap_legacy_dependencies.sh

      - name: Apply reviewed DEV-02 concrete changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          seam = Path('dec-core-compiler/src/test/java/dec/core/compiler/pass/CompilerPipelineReworkI002Test.java')
          text = seam.read_text()
          old = '''        CompiledModelSet modelSet = new CompiledModelSet(\n                PublishedSourceManifest.empty(),\n                new ImmutableRegistry<DefinitionKey, CompiledDefinition>('''
          new = '''        CompiledModelSet modelSet = new CompiledModelSet(\n                PublishedSourceManifest.empty(),\n                dec.core.context.model.CompiledViewMaterializationIndex.empty(),\n                new ImmutableRegistry<DefinitionKey, CompiledDefinition>('''
          if old not in text:
              raise SystemExit('DEV-04 compiler constructor seam not found')
          seam.write_text(text.replace(old, new, 1))

          resolver = Path('dec-core-compiler/src/main/java/dec/core/compiler/symbol/ReferenceResolver.java')
          text = resolver.read_text()
          old = '''        final SystemKey resolvedSystem = systemKey;\n        final String resolvedRuleName = ruleName;\n        RuleViewKey expected = safeTypedKey(\n                sourceKey,\n                ruleReference.sourceRef(),\n                () -> new RuleViewKey(resolvedSystem, resolvedRuleName),\n                state);\n        if (expected == null) {\n            return;\n        }'''
          new = '''        // P2 新引用路径只通过显式 System owner 构造完整 RuleViewKey，禁止 bare-name 成功回退。\n        RuleViewKey expected = ReferenceTargetParser.parseRuleViewKey(\n                systemKey,\n                ruleName);\n        if (expected == null) {\n            addOwnerDiagnostic(sourceKey, ruleReference.sourceRef(), state);\n            return;\n        }'''
          if old not in text:
              raise SystemExit('DEV-02 resolver seam not found')
          resolver.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - name: Build compiler dependencies without downstream tests
        run: |
          ./mvnw \
            --batch-mode \
            --no-transfer-progress \
            -pl dec-core-compiler \
            -am \
            -Dmaven.test.skip=true \
            install

      - name: Run DEV-02 exact tests and reference regressions
        run: |
          ./mvnw \
            --batch-mode \
            --no-transfer-progress \
            -pl dec-core-compiler \
            -Dtest=RuleViewCompilationContractTest,TargetKeyModelPathContractTest,ReferenceResolverContractTest \
            -Dsurefire.failIfNoSpecifiedTests=true \
            test

      - name: Commit verified DEV-02 concrete revision to PR36 branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "szlwin"
          git config user.email "szlwin@163.com"
          git add \
            dec-core-compiler/src/main/java/dec/core/compiler/symbol/ReferenceResolver.java \
            dec-core-compiler/src/test/java/dec/core/compiler/pass/CompilerPipelineReworkI002Test.java
          git commit -m "feat(p2): complete DEV-02 qualified RuleView reference seam" \
            -m "Route Action RuleView identity construction through the reviewed explicit-System parser and migrate the remaining compiler test fixture to DEV-04's mandatory materialization aggregate constructor." \
            -m "WK-Task: TASK-P2-DEV-02-RULEVIEW-REFERENCE" \
            -m "WK-Revision: DEV-P2-DEV02-R01"
          git push origin HEAD:feature/p2-design-testdesign-20260808
