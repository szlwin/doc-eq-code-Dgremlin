name: Verify and Open PR

run-name: Verify DEV-01 Maven on ${{ github.ref_name }}

"on":
  push:
    branches:
      - "feature/**"

permissions:
  contents: read

jobs:
  core-verify:
    name: DEV-01 Maven verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify Maven Wrapper
        run: ./mvnw --version

      - name: Bootstrap repository-bundled legacy dependencies
        run: scripts/remediation/bootstrap_legacy_dependencies.sh

      - name: Compile DEV-01 compiler reactor
        run: ./mvnw -pl dec-core-compiler -am -Dmaven.test.skip=true install

      - name: Run DEV-01 contract tests
        run: ./mvnw -pl dec-core-compiler -Dtest=SystemCompilationContractTest,RuleViewCompilationContractTest -Dsurefire.failIfNoSpecifiedTests=true test

      - name: Run existing symbol regression
        run: ./mvnw -pl dec-core-compiler -Dtest=SymbolOwnerIdentityReworkTest -Dsurefire.failIfNoSpecifiedTests=true test
