name: Repair P1 Project Facts

"on":
  pull_request:
    branches:
      - dev_all
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: p1-fact-integrity-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.head_ref == 'feature/p1-fact-integrity-repair-20260731-1940'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Restore DESIGN-R05 evidence and validate project facts
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import tarfile

          root = pathlib.Path('.')
          task_dir = root / 'project_doc/version/V_1.0/task/P1-COMPILER-F01'
          marker_re = re.compile(r'^(<<<<<<<(?:\s.*)?|=======|>>>>>>>(?:\s.*)?)$', re.M)

          bundle = task_dir / 'evidence/bundles/sha256/c2/c2f1744bbd9e4aa28d1f7d8ff6cedccd36cedc3bc106f300b655b2635ddaf793.tar.xz'
          expected_test_seams_digest = '27ec2b994669948111a08dfe03d295ca39806a7a584076215cee678144843175'
          test_seams_target = root / 'project_doc/version/V_1.0/doc/DEC_COMPILER/DEC_COMPILER_test_seams.md'
          work_record_target = root / 'project_doc/version/V_1.0/work_record.md'

          digest_matches = []
          work_record_candidates = []

          with tarfile.open(bundle, mode='r:xz') as archive:
              for member in archive.getmembers():
                  if not member.isfile():
                      continue
                  extracted = archive.extractfile(member)
                  if extracted is None:
                      continue
                  data = extracted.read()
                  digest = hashlib.sha256(data).hexdigest()
                  if digest == expected_test_seams_digest:
                      digest_matches.append((member.name, data))

                  if b'# V_1.0 ' in data and b'work-record-events-end' in data:
                      try:
                          text = data.decode('utf-8')
                      except UnicodeDecodeError:
                          continue
                      if 'DESIGN-R05@0b37a9b4dd48' in text and not marker_re.search(text):
                          work_record_candidates.append((member.name, data))

          if len(digest_matches) != 1:
              raise SystemExit(
                  'expected exactly one DESIGN-R05 test-seams artifact in bundle; found '
                  + repr([name for name, _ in digest_matches])
              )

          test_seams_name, test_seams_bytes = digest_matches[0]
          test_seams_target.write_bytes(test_seams_bytes)

          work_record_source = 'resolved-current-file'
          if work_record_candidates:
              work_record_candidates.sort(key=lambda item: len(item[1]), reverse=True)
              work_record_source, work_record_bytes = work_record_candidates[0]
              work_record_target.write_bytes(work_record_bytes)
          else:
              original = work_record_target.read_text(encoding='utf-8')
              marker_count = len(marker_re.findall(original))
              if marker_count == 0:
                  raise SystemExit('bundle has no work_record and current file has no repair markers')

              output = []
              state = 'normal'
              for line in original.splitlines(keepends=True):
                  stripped = line.rstrip('\r\n')
                  if stripped.startswith('<<<<<<<'):
                      state = 'ours'
                      continue
                  if stripped == '=======':
                      state = 'theirs'
                      continue
                  if stripped.startswith('>>>>>>>'):
                      state = 'normal'
                      continue
                  if state in {'normal', 'ours'}:
                      output.append(line)
              work_record_target.write_text(''.join(output), encoding='utf-8')

          work_record_text = work_record_target.read_text(encoding='utf-8')
          required_content = [
              'REQAN-R05@7de35e8dc15b',
              'BM-R05@4ecb1f8c09f4',
              'DESIGN-R05@0b37a9b4dd48',
              'WR-20260728-225152-TASK-P1-DESIGN-001-PASSED',
              '<!-- work-record-events-end -->'
          ]
          for value in required_content:
              if value not in work_record_text:
                  raise SystemExit(f'missing required work record content after repair: {value}')
          if marker_re.search(work_record_text):
              raise SystemExit('work_record still contains conflict markers')
          if len(work_record_text.encode('utf-8')) < 50000:
              raise SystemExit('work_record became unexpectedly small during repair')

          task_state_path = task_dir / 'task_state.md'
          task_state_text = task_state_path.read_text(encoding='utf-8')
          old_header = '> BM-R04 已完成并通过六个串行独立 Review；当前等待 business_model StageOutcome 与 Git checkpoint 后推进 design I004。'
          new_header = '> DESIGN-R05 已完成并通过七个串行独立 Review；当前进入 test_design I007，由 TestDesignAgent 基于当前设计 Revision 形成可执行测试设计。'
          if old_header in task_state_text:
              task_state_text = task_state_text.replace(old_header, new_header, 1)
          elif new_header not in task_state_text:
              raise SystemExit('unexpected task_state header state')

          if '"resume_from": "business_model"' in task_state_text:
              task_state_text = task_state_text.replace(
                  '"resume_from": "business_model"',
                  '"resume_from": "design"',
                  1
              )
          elif '"resume_from": "design"' not in task_state_text:
              raise SystemExit('unexpected task_state resume_from state')
          task_state_path.write_text(task_state_text, encoding='utf-8')

          def fenced_json(path: pathlib.Path, fence: str):
              content = path.read_text(encoding='utf-8')
              match = re.search(rf'```json {re.escape(fence)}\s*(.*?)\s*```', content, re.S)
              if not match:
                  raise SystemExit(f'missing {fence} JSON fence in {path}')
              return json.loads(match.group(1))

          task_plan = fenced_json(task_dir / 'task_plan.md', 'task-plan')
          task_state = fenced_json(task_state_path, 'task-state')
          review_issues = fenced_json(task_dir / 'review_issues.md', 'review-issues')

          task_by_id = {item['id']: item for item in task_plan}
          test_design = task_by_id['TASK-P1-R2-005']
          implementation_plan = task_by_id['TASK-P1-R2-006']

          assert test_design['iteration_id'] == 'ITER-P1-COMPILER-F01-TEST-DESIGN-007'
          assert test_design['status'] == 'TODO'
          assert test_design['input_revisions']['design'] == 'DESIGN-R05@0b37a9b4dd48'
          assert implementation_plan['depends_on'] == ['TASK-P1-R2-005']
          assert task_state['current_phase'] == 'test_design'
          assert task_state['current_round'] == 'TEST_DESIGN-I007'
          assert task_state['artifact_revisions']['design']['status'] == 'PASSED'
          assert task_state['artifact_revisions']['design']['revision'] == 'DESIGN-R05@0b37a9b4dd48'
          assert task_state['open_issue_ids'] == []
          assert task_state['next_agent'] == 'TestDesignAgent'
          assert task_state['resume_from'] == 'design'
          assert all(issue['status'] == 'CLOSED' for issue in review_issues)

          restored_digest = hashlib.sha256(test_seams_target.read_bytes()).hexdigest()
          if restored_digest != expected_test_seams_digest:
              raise SystemExit('restored DESIGN-R05 test-seams digest mismatch')

          conflicts = []
          for path in (root / 'project_doc').rglob('*'):
              if not path.is_file() or path.suffix.lower() in {
                  '.xz', '.zip', '.gz', '.png', '.jpg', '.jpeg', '.gif', '.pdf'
              }:
                  continue
              try:
                  candidate = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if marker_re.search(candidate):
                  conflicts.append(str(path))
          if conflicts:
              raise SystemExit('remaining conflict markers: ' + ', '.join(conflicts))

          print(f'test seams restored from bundle member: {test_seams_name}')
          print(f'work record restored from: {work_record_source}')
          print('task plan JSON: PASSED')
          print('task state JSON: PASSED')
          print('review issues JSON: PASSED')
          print('DESIGN-R05 evidence digest: PASSED')
          print('project_doc conflict scan: PASSED')
          PY

      - name: Restore normal verification workflow and commit repair
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          git show e602c4b7a56bb3529a5be64a3743346fbc569124:.github/workflows/verify-and-open-pr.yml \
            > .github/workflows/verify-and-open-pr.yml
          rm -f .github/workflows/p1-fact-integrity-repair.yml

          git config user.name "common-develop ProjectManagerAgent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            project_doc/version/V_1.0/doc/DEC_COMPILER/DEC_COMPILER_test_seams.md \
            project_doc/version/V_1.0/work_record.md \
            project_doc/version/V_1.0/task/P1-COMPILER-F01/task_state.md \
            .github/workflows/verify-and-open-pr.yml \
            .github/workflows/p1-fact-integrity-repair.yml

          git diff --cached --check

          if git diff --cached --quiet; then
            echo "::error::No repair changes were produced."
            exit 1
          fi

          git commit -m "docs: repair P1 project fact integrity"
          git push origin "HEAD:${HEAD_BRANCH}"
