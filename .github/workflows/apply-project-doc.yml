name: Apply project_doc payload

on:
  push:
    branches: [dev_all]
    paths:
      - '.automation/project_doc.xz.b64.part-*'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Extract project_doc
        shell: bash
        run: |
          set -euo pipefail
          cat .automation/project_doc.xz.b64.part-* | base64 --decode > /tmp/project_doc.tar.xz
          tar -xJf /tmp/project_doc.tar.xz
          test -f project_doc/README.md
          rm -rf .automation
      - name: Commit project_doc
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V_1.0 P1 complete requirements analysis and design reviews"
          git push origin HEAD:dev_all
