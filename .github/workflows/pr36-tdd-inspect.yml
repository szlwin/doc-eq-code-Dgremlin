name: PR36 TDD inspect
on:
  push:
    branches: [tmp/pr36-tdd-inspect-20260811]
    paths: [.common-develop-tdd-inspect-trigger]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect exact R05 test ownership
        shell: bash
        run: |
          set -euo pipefail
          BASE=e16ef021941147052c44b0b06d608fa06441c72b
          git reset --hard "$BASE"
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          p=Path('project_doc/version/V_1.0/task/FEATURE-DESC-3361AD2E54FC/development_tasks.yaml')
          d=yaml.safe_load(p.read_text())
          for t in d['tasks']:
              print('===',t['task_id'],t['implementation']['owner_module'],'===')
              for f in t['implementation'].get('affected_files',[]):
                  if '/src/test/' in f or f.endswith('Test.java'):
                      print('TESTFILE',f)
              for c in t.get('validation_commands',[]): print('CMD',c)
              for s in t['implementation'].get('steps',[]):
                  if 'Test' in s or 'CASE-P2-TD-' in s: print('STEP',s)
          PY
