name: PR36 TDD inspect
on:
  push:
    branches: [tmp/pr36-tdd-inspect-20260811]
    paths: [.common-develop-tdd-inspect-trigger]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect planned test classes and stable seams
        shell: bash
        run: |
          set -euo pipefail
          BASE=e16ef021941147052c44b0b06d608fa06441c72b
          git reset --hard "$BASE"
          echo '=== PLANNED TESTCLASS INVENTORY ==='
          classes=(SystemCompilationContractTest RuleViewCompilationContractTest ProtectedAccessContextApiContractTest P2CompilerContextConstructibilityContractTest RuntimeFactValueContractTest OpaqueRuntimeIdContractTest TargetKeyModelPathContractTest ModelAccessPolicyContractTest AtomicPublicationContractTest P2DiagnosticDeterminismTest ProtectedAccessModelApiContractTest RuntimeModelMaterializationIntegrationTest RuntimeObjectLocatorIntegrationTest ProtectedWriteTransactionIntegrationTest ProtectedAccessStarterApiContractTest ProtectedWriteIntentResolutionTest ProtectedRuntimeModelAdapterIntegrationTest ProtectedAccessProductionCompositionTest ProtectedAccessConcurrencyTest ProtectedAccessDependencyDirectionTest P2RealFixtureIntegrationTest P2DeclarationCompatibilityContractTest P2RevisionDependencyDagContractTest)
          found=0; missing=0
          for c in "${classes[@]}"; do
            p=$(find dec-* -type f -name "$c.java" -print -quit 2>/dev/null || true)
            if [ -n "$p" ]; then echo "FOUND $c $p"; found=$((found+1)); else echo "MISSING $c"; missing=$((missing+1)); fi
          done
          echo "TOTAL found=$found missing=$missing"
          echo '=== KEY TYPES ==='
          for n in SystemKey RuleViewKey TargetKey ModelPath ModelAccessRuleKey RuntimeFactValue Context CompiledModelSet CompiledModelSetBuilder; do
            find dec-* -type f -name "$n.java" -print | sort || true
          done
          echo '=== EXISTING COMPILER TESTS ==='
          find dec-core-compiler/src/test -type f -name '*.java' 2>/dev/null | sort | head -120 || true
          echo '=== EXISTING CONTEXT TESTS ==='
          find dec-core-context/src/test -type f -name '*.java' 2>/dev/null | sort | head -120 || true
          echo '=== MODEL PATH API SNIPPETS ==='
          grep -R "class ModelPath\|record ModelPath\|interface ModelPath\|ModelPath(" -n dec-core-context/src/main dec-core-compiler/src/main 2>/dev/null | head -120 || true
          echo '=== TARGET KEY API SNIPPETS ==='
          grep -R "class TargetKey\|record TargetKey\|interface TargetKey\|TargetKey(" -n dec-core-context/src/main dec-core-compiler/src/main 2>/dev/null | head -100 || true
          echo '=== RULEVIEW/SYSTEM API SNIPPETS ==='
          grep -R "class SystemKey\|record SystemKey\|class RuleViewKey\|record RuleViewKey" -n dec-core-context/src/main dec-core-compiler/src/main 2>/dev/null | head -100 || true
