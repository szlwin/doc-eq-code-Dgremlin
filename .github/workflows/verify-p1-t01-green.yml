name: Verify P1 T01 GREEN

on:
  pull_request:
    branches:
      - dev_all
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  verify-green:
    if: github.event.pull_request.head.ref == 'feature/p1-t01-tdd-red-i007-20260801-1122'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v6
        with:
          ref: feature/p1-t01-tdd-red-i007-20260801-1122
          fetch-depth: 0

      - name: Materialize implementation candidate
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/p1-t01-implementation-payload.b64 > /tmp/p1-t01-implementation.tar.xz
          echo '875882aadb22b9859004dd288de0961c2ff524634c13b72d2bfe977256fe030e  /tmp/p1-t01-implementation.tar.xz' | sha256sum --check --strict
          tar -xJf /tmp/p1-t01-implementation.tar.xz -C .
          ! grep -R 'ARCHITECTURE_SKELETON' -n dec-core-context/src/main/java/dec/core/context/model dec-core-context/src/main/java/dec/core/context/EngineContext.java dec-core-context/src/main/java/dec/core/context/CoreConfigProjection.java
          ! grep -R 'dec.core.compiler' -n dec-core-context/src/main/java/dec/core/context/model dec-core-context/src/main/java/dec/core/context/EngineContext.java dec-core-context/src/main/java/dec/core/context/CoreConfigProjection.java

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Bootstrap repository-bundled legacy dependencies
        run: scripts/remediation/bootstrap_legacy_dependencies.sh

      - name: Run T01 contract tests
        run: ./mvnw --batch-mode --no-transfer-progress -pl dec-core-context -am -Dtest=ContextValueContractTest,RegistryImmutabilityTest,EngineContextApiTest test

      - name: Run Context module verification
        run: ./mvnw --batch-mode --no-transfer-progress -pl dec-core-context -am verify

      - name: Verify dependency direction
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw --batch-mode --no-transfer-progress -pl dec-core-context dependency:tree -Dincludes=doc.eq.code:dec-core-compiler | tee /tmp/p1-t01-dependency-tree.log
          if grep -F 'doc.eq.code:dec-core-compiler' /tmp/p1-t01-dependency-tree.log; then
            echo '::error::dec-core-context must not depend on dec-core-compiler'
            exit 1
          fi

      - name: Upload GREEN reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-t01-green-reports
          path: |
            dec-core-context/target/surefire-reports/**
            /tmp/p1-t01-dependency-tree.log
          if-no-files-found: warn
          retention-days: 14
