name: PR36 DEV01 cli
on:
  push:
    branches: [tmp/pr36-dev01-cli-20260811]
    paths: [.common-develop-dev01-cli-trigger]
permissions: {contents: read}
jobs:
  cli:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/common-develop
          git clone --depth=1 https://gitee.com/szlwin/common-develop.git /tmp/common-develop
          python3 - <<'PY'
          import sys,inspect
          sys.path.insert(0,'/tmp/common-develop/scripts')
          import manual_review
          for name in ['command_draft','load_review_context','build_review_context','resolve_review_context','prepare_review_context']:
              obj=getattr(manual_review,name,None)
              if obj:
                  print('\n===',name,'===\n'+inspect.getsource(obj))
          print('\n=== context-like functions ===')
          for name in dir(manual_review):
              if 'context' in name.lower() and callable(getattr(manual_review,name)):
                  try: print(name, inspect.signature(getattr(manual_review,name)))
                  except Exception: pass
          PY
          sed -n '1015,1065p' /tmp/common-develop/scripts/manual_review.py
