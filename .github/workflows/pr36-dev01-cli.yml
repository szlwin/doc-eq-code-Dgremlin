name: PR36 DEV01 cli
on:
  push:
    branches: [tmp/pr36-dev01-cli-20260811]
    paths: [.common-develop-dev01-cli-trigger]
permissions: {contents: read}
jobs:
  cli:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/common-develop
          git clone --depth=1 https://gitee.com/szlwin/common-develop.git /tmp/common-develop
          echo '--- skeleton review refs anchors ---'
          grep -R -n -B35 -A70 -E 'requires a passed skeleton Review|skeleton_review_result_refs|advance-development-step' /tmp/common-develop/scripts /tmp/common-develop/*.py 2>/dev/null || true
          echo '--- commands mentioning architecture review ---'
          grep -R -n -E 'architecture_review.*review_result|record.*skeleton|skeleton.*review' /tmp/common-develop/scripts 2>/dev/null | head -200 || true
