name: PR36 DEV01 cli
on:
  push:
    branches: [tmp/pr36-dev01-cli-20260811]
    paths: [.common-develop-dev01-cli-trigger]
permissions: {contents: write}
jobs:
  cli:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/common-develop
          git clone --depth=1 https://gitee.com/szlwin/common-develop.git /tmp/common-develop
          grep -R -n -B25 -A60 "outside allowed_files" /tmp/common-develop/scripts > .common-develop-dev01-allowed-inspect.txt || true
          grep -R -n -B15 -A50 -E "allowed_files|fnmatch|glob" /tmp/common-develop/scripts/long_task.py >> .common-develop-dev01-allowed-inspect.txt || true
          git add .common-develop-dev01-allowed-inspect.txt
          git -c user.name=inspect -c user.email=inspect@example.invalid commit -m 'chore: persist allowed_files matcher inspection'
          git push origin HEAD:tmp/pr36-dev01-cli-20260811
