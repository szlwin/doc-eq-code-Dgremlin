name: PR36 DEV01 cli
on:
  push:
    branches: [tmp/pr36-dev01-cli-20260811]
    paths: [.common-develop-dev01-cli-trigger]
permissions: {contents: read}
jobs:
  cli:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/common-develop
          git clone --depth=1 https://gitee.com/szlwin/common-develop.git /tmp/common-develop
          echo '--- checkpoint source ---'
          grep -n -B45 -A130 -E 'def commit_checkpoint|artifact.*PASSED|task_status|phase_tasks|current_phase|checkpoint_id' /tmp/common-develop/scripts/git_checkpoint.py | head -520 || true
          echo '--- finish attempt source ---'
          grep -n -B35 -A170 -E '^def command_finish_attempt|task\[.status.\]|next_agent|next_action' /tmp/common-develop/scripts/long_task.py | head -520 || true
          echo '--- reopen architecture rollback ---'
          grep -n -B45 -A160 -E 'def command_reopen_phase|architecture_review.*step|IMPLEMENTATION_READY_FOR_REVIEW|SKELETON' /tmp/common-develop/scripts/long_task.py | head -700 || true
          echo '--- task review / checkpoint tests ---'
          grep -R -n -B25 -A80 -E 'checkpoint.*IN_PROGRESS|partial.*checkpoint|task.*checkpoint|development.*PASSED.*task|finish-attempt.*next|next ready|sequential' /tmp/common-develop/scripts/test_*.py | head -700 || true
