name: PR36 DEV01 cli
on:
  push:
    branches: [tmp/pr36-dev01-cli-20260811]
    paths: [.common-develop-dev01-cli-trigger]
permissions: {contents: read}
jobs:
  cli:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/common-develop
          git clone --depth=1 https://gitee.com/szlwin/common-develop.git /tmp/common-develop
          python3 - <<'PY'
          import sys,inspect
          sys.path.insert(0,'/tmp/common-develop/scripts')
          import manual_review
          for name in dir(manual_review):
              if any(k in name.lower() for k in ['answer','detail','draft','parse']):
                  obj=getattr(manual_review,name)
                  if callable(obj):
                      try:
                          src=inspect.getsource(obj)
                      except Exception:
                          continue
                      if '--answer' in src or '--detail' in src or 'answer' in name.lower() or 'detail' in name.lower():
                          print('\n===',name,'===\n'+src)
          PY
          echo '--- parser anchors ---'
          grep -n -E "add_argument\(.*--(answer|detail)|detail_ref|UNKNOWN|parse_.*answer|answer_exceptions" /tmp/common-develop/scripts/manual_review.py || true
