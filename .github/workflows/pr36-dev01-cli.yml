name: PR36 DEV01 cli
on:
  push:
    branches: [tmp/pr36-dev01-cli-20260811]
    paths: [.common-develop-dev01-cli-trigger]
permissions: {contents: write}
jobs:
  cli:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/common-develop
          git clone --depth=1 https://gitee.com/szlwin/common-develop.git /tmp/common-develop
          python3 - <<'PY' > .common-develop-dev01-gate-inspect.txt
          import sys,inspect
          sys.path.insert(0,'/tmp/common-develop/scripts')
          import git_checkpoint
          for name in ['current_gate','checkpoint_id_for','allowed_patterns','default_title']:
              fn=getattr(git_checkpoint,name,None)
              print('\n=== %s ===' % name)
              print(inspect.getsource(fn) if fn else 'MISSING')
          PY
          git add .common-develop-dev01-gate-inspect.txt
          git -c user.name=inspect -c user.email=inspect@example.invalid commit -m 'chore: persist DEV01 checkpoint gate inspection'
          git push origin HEAD:tmp/pr36-dev01-cli-20260811
