name: common-develop DEV-01 R02 remediation v11

on:
  push:
    branches: [common-develop/dev01-r02-run-20260812]
    paths: [.github/workflows/common-develop-dev01-r02-run-v11.yml]

permissions:
  contents: write

jobs:
  dev01-r02:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: common-develop/dev01-r02-run-20260812
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Execute v10 with normalized command-result logs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          src=Path('.github/workflows/common-develop-dev01-r02-run-v10.yml').read_text()
          marker='        run: |\n'
          if marker not in src:
              raise SystemExit('v10 run block missing')
          wrapper=textwrap.dedent(src.split(marker,1)[1])
          anchor="Path('/tmp/dev01-r02-v10.sh').write_text('#!/usr/bin/env bash\\n'+block)"
          if anchor not in wrapper:
              raise SystemExit('v10 write anchor missing')
          patch_lines=[
            "needle='    local rc=$?\\n    set -e\\n    python3 - \\\"$RESULT_DIR/$name.json\\\"'",
            "replacement='    local rc=$?\\n    set -e\\n    sed -i \\\'s/[[:blank:]]\\\\+$//\\\' \\\"$RESULT_DIR/$name.out\\\"\\n    python3 - \\\"$RESULT_DIR/$name.json\\\"'",
            "if needle not in block: raise SystemExit('run_and_record normalization anchor missing')",
            "block=block.replace(needle,replacement,1)",
            anchor
          ]
          wrapper=wrapper.replace(anchor,'\n'.join(patch_lines),1)
          Path('/tmp/dev01-r02-v11-wrapper.sh').write_text('#!/usr/bin/env bash\n'+wrapper)
          PY
          chmod +x /tmp/dev01-r02-v11-wrapper.sh
          /tmp/dev01-r02-v11-wrapper.sh
