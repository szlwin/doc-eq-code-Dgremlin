name: T13 GREEN Materialize

on:
  push:
    branches:
      - feature/p1-t13-semantic-digest-20260805-2005
    paths:
      - .github/workflows/t13-green-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/p1-t13-semantic-digest-20260805-2005
          fetch-depth: 0
      - name: Apply T13 production implementation
        shell: bash
        run: |
          echo '[... truncated ...]' | base64 -d | tar -xzf -
          git rm .github/workflows/t13-green-materialize.yml
          git config user.name "szlwin"
          git config user.email "szlwin@163.com"
          git add dec-core-compiler/src/main/java/dec/core/compiler/compiled
          git add dec-core-compiler/src/main/java/dec/core/compiler/pass/CompilationSession.java
          git add dec-core-compiler/src/main/java/dec/core/compiler/pass/PipelineDiagnostics.java
          git add dec-core-compiler/src/main/java/dec/core/compiler/pass/CompilerPipeline.java
          git add dec-core-compiler/src/main/java/dec/core/compiler/pass/PipelineExecutionResult.java
          git add dec-core-compiler/src/test/java/dec/core/compiler/pass/CompilerPipelineOrderTest.java
          git add dec-core-compiler/src/test/java/dec/core/compiler/pass/CompilerPipelineIndependentReviewTest.java
          git commit -m "feat(compiler): implement deterministic semantic digest"
          git push origin HEAD:feature/p1-t13-semantic-digest-20260805-2005
