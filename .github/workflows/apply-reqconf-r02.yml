name: Apply REQCONF-R02 payload

on:
  push:
    branches:
      - agent/reqconf-r02-publish-20260726
  pull_request:
    branches:
      - dev_all

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib

          parts = sorted(Path('.github').glob('reqconf-r02-payload.part-*'))
          if len(parts) != 4:
              raise SystemExit(f'expected 4 payload parts, found {len(parts)}')
          encoded = ''.join(path.read_text(encoding='utf-8').strip() for path in parts)
          payload = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(payload).hexdigest()
          expected = 'f90a8c2c21dcd370f438178785f97126562a4087af95b9623a8c50c776220e32'
          if digest != expected:
              raise SystemExit(f'payload sha256 mismatch: {digest}')
          Path('/tmp/reqconf-r02-changes.tar.gz').write_bytes(payload)
          print(f'payload verified: {digest}, bytes={len(payload)}')
          PY

      - name: Commit content branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev_all
          git checkout -B agent/reqconf-r02-content-20260726 origin/dev_all
          tar -xzf /tmp/reqconf-r02-changes.tar.gz -C .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: confirm REQCONF-R02"
          fi
          git push --force-with-lease origin HEAD:agent/reqconf-r02-content-20260726
