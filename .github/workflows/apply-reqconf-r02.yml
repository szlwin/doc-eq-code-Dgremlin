name: Apply REQCONF-R02 payload

on:
  push:
    branches:
      - agent/reqconf-r02-publish-20260726
  pull_request:
    branches:
      - dev_all

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib

          parts = sorted(Path('.github').glob('reqconf-r02-v3.part-*'))
          if len(parts) != 44:
              raise SystemExit(f'expected 44 payload parts, found {len(parts)}')
          encoded = ''.join(path.read_text(encoding='utf-8').strip() for path in parts)
          payload = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(payload).hexdigest()
          expected = '005ddbe1d89a4f8fa038dc031583322daba013240829b94d6e649885880c58dc'
          if digest != expected:
              raise SystemExit(f'payload sha256 mismatch: {digest}')
          Path('/tmp/reqconf-r02-changes.tar.xz').write_bytes(payload)
          print(f'payload verified: {digest}, bytes={len(payload)}')
          PY

      - name: Commit content branch
        id: commit_content
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            set -eux
            git fetch origin dev_all
            git checkout -B agent/reqconf-r02-content-20260726 origin/dev_all
            tar -xJf /tmp/reqconf-r02-changes.tar.xz -C .
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git status --short
            if git diff --cached --quiet; then
              echo "No changes to commit"
            else
              git commit -m "docs: confirm REQCONF-R02"
            fi
            git push origin HEAD:agent/reqconf-r02-content-20260726
          } 2>&1 | tee /tmp/reqconf-r02-git.log

      - name: Upload Git diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reqconf-r02-git-diagnostics
          path: /tmp/reqconf-r02-git.log
          if-no-files-found: error

      - name: Enforce publish success
        if: steps.commit_content.outcome != 'success'
        run: exit 1
