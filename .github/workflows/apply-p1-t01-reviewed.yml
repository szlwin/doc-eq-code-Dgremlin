name: Apply P1 T01 Reviewed Implementation

on:
  pull_request:
    branches: [dev_all]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/p1-t01-tdd-red-i007-20260801-1122'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/p1-t01-tdd-red-i007-20260801-1122
          fetch-depth: 0

      - name: Verify and apply exact machine facts
        shell: bash
        run: |
          set -euo pipefail
          cat .github/p1-t01-final-facts/chunk-* | tr -cd 'A-Za-z0-9+/=' > /tmp/p1-t01-facts.b64
          test "$(wc -c < /tmp/p1-t01-facts.b64)" -eq 91292
          base64 --decode /tmp/p1-t01-facts.b64 > /tmp/p1-t01-facts.tar.xz
          echo '36dd1c3ac971508a016af595486d9b74bd0324da4caf0e102b4da728273963e5  /tmp/p1-t01-facts.tar.xz' | sha256sum --check --strict
          tar -xJf /tmp/p1-t01-facts.tar.xz -C .
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('project_doc/version/V_1.0/task/P1-COMPILER-F01/task_state.md')
          text = path.read_text(encoding='utf-8')
          marker = '```json task-state\n'
          start = text.index(marker) + len(marker)
          end = text.index('\n```', start)
          state = json.loads(text[start:end])
          revisions = state['artifact_revisions']
          assert revisions['testing']['revision'] == 'TESTING-P1-T01-R01@2c618f7c32a6'
          assert revisions['testing']['status'] == 'PASSED'
          assert revisions['completion_verification']['status'] == 'IN_PROGRESS'
          assert state['current_phase'] == 'completion_verification'
          assert state['current_attempt_id'] == 'ATTEMPT-TASK-P1-T01-COMPLETION-I007-A001'
          PY
          git diff --check -- project_doc

      - name: Commit exact machine facts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project_doc
          git diff --cached --quiet && exit 0
          git commit -m 'test(testing): record P1 T01 verified facts'
          git push origin HEAD:feature/p1-t01-tdd-red-i007-20260801-1122
