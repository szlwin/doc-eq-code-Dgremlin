name: Apply P1 T01 Reviewed Implementation

on:
  pull_request:
    branches: [dev_all]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/p1-t01-tdd-red-i007-20260801-1122'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/p1-t01-tdd-red-i007-20260801-1122
          fetch-depth: 0

      - name: Apply verified source and lifecycle facts
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/p1-t01-r02-overlay.b64 > /tmp/p1-t01-r02-overlay.tar.xz
          echo '1144bf9bbae771839185e999a2be7d0c4c01ad8eaaa98313ea8dda10ff253e94  /tmp/p1-t01-r02-overlay.tar.xz' | sha256sum --check --strict
          tar -xJf /tmp/p1-t01-r02-overlay.tar.xz -C .

          cat .github/p1-t01-lifecycle-patch/chunk-* | base64 --decode > /tmp/p1-t01-lifecycle.patch.xz
          echo '810517647d02d400ce20b5fcbd81d4349559779e3671e23129ccd30ead65160c  /tmp/p1-t01-lifecycle.patch.xz' | sha256sum --check --strict
          xz -dc /tmp/p1-t01-lifecycle.patch.xz > /tmp/p1-t01-lifecycle.patch
          git apply --3way /tmp/p1-t01-lifecycle.patch

          ! grep -R 'ARCHITECTURE_SKELETON' -n \
            dec-core-context/src/main/java/dec/core/context/model \
            dec-core-context/src/main/java/dec/core/context/EngineContext.java \
            dec-core-context/src/main/java/dec/core/context/CoreConfigProjection.java
          ! grep -R 'dec\.core\.compiler' -n \
            dec-core-context/src/main/java/dec/core/context/model \
            dec-core-context/src/main/java/dec/core/context/EngineContext.java \
            dec-core-context/src/main/java/dec/core/context/CoreConfigProjection.java

      - name: Commit reviewed implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dec-core-context/src/main/java \
            dec-core-context/src/test/java/dec/core/context/tdd/ContextContractBehaviorTest.java \
            project_doc
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Reviewed implementation already applied.'
            exit 0
          fi
          git commit -m 'feat(context): implement P1 T01 immutable contracts' \
            -m 'WK-Checkpoint: CP-V_1.0-P1-COMPILER-F01-CODE-REVIEW-007' \
            -m 'WK-Revision: CODEREVIEW-P1-T01-R01@488bc81150f7'
          git push origin HEAD:feature/p1-t01-tdd-red-i007-20260801-1122
