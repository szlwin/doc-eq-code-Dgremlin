name: PR36 R32 workflow hotfix

on:
  push:
    branches:
      - feature/p2-design-testdesign-20260808

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[nested-modelpath-r32-fix]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch RC9 command Evidence registration and rerun
        shell: bash
        run: |
          set -euo pipefail
          F=.github/workflows/pr36-nested-modelpath-bootstrap.yml
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/pr36-nested-modelpath-bootstrap.yml')
          s=p.read_text()
          s=s.replace('[nested-modelpath-r32-stage-v3]', '[nested-modelpath-r32-stage-v4]')
          old='--type command_ref --source-ref "$TDIR/evidence/command-results/TESTDESIGN-P2-R32/nested-modelpath-oracle-validate.json" --revision TESTDESIGN-P2-R32'
          new='--type command_ref --source-ref "$TDIR/evidence/command-results/TESTDESIGN-P2-R32/nested-modelpath-oracle-validate.json" --command-result-ref "$TDIR/evidence/command-results/TESTDESIGN-P2-R32/nested-modelpath-oracle-validate.json" --revision TESTDESIGN-P2-R32'
          if old not in s:
              raise SystemExit('expected E4 registration pattern not found')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          git config user.name 'common-develop-bot'
          git config user.email 'common-develop-bot@users.noreply.github.com'
          git add "$F"
          git commit -m 'chore: fix RC9 command evidence registration [nested-modelpath-r32-stage-v4]'
          git push origin HEAD:feature/p2-design-testdesign-20260808
