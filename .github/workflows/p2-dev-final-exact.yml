name: P2 development final exact validation commands

on:
  pull_request:
    branches:
      - agent/p2-dev-final-exact-base-20260818

permissions:
  contents: read

jobs:
  exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Bootstrap repository-bundled legacy dependencies
        run: scripts/remediation/bootstrap_legacy_dependencies.sh
      - name: Exact validation command 2
        shell: bash
        run: |
          set -o pipefail
          ./mvnw -pl dec-core-model,dec-core-context,dec-core-starter -am -DskipTests install 2>&1 | tee /tmp/dev-exact-02.log
      - name: Exact validation command 3
        shell: bash
        run: |
          set -o pipefail
          ./mvnw -pl dec-core-starter -Dtest=P2SecurityAuthorityRemediationTest -Dsurefire.failIfNoSpecifiedTests=true test 2>&1 | tee /tmp/dev-exact-03.log
      - name: Exact validation command 4
        shell: bash
        run: |
          set -o pipefail
          ./mvnw -pl dec-core-context,dec-core-model,dec-core-starter -am -Dmaven.test.skip=true install 2>&1 | tee /tmp/dev-exact-04.log
      - name: Exact validation command 5
        shell: bash
        run: |
          set -o pipefail
          ./mvnw -pl dec-core-context,dec-core-model,dec-core-starter test 2>&1 | tee /tmp/dev-exact-05.log
      - name: Exact validation command 6
        shell: bash
        run: |
          set -o pipefail
          ./mvnw -pl dec-core-starter -Dtest=ProtectedAccessProductionCompositionTest,ProtectedRuntimeModelAdapterIntegrationTest -Dsurefire.failIfNoSpecifiedTests=true test 2>&1 | tee /tmp/dev-exact-06.log
      - name: Upload exact command evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: p2-development-final-exact-command-evidence
          path: /tmp/dev-exact-*.log
          if-no-files-found: error
