name: Export P1 T01 Development Context

on:
  pull_request:
    branches: [dev_all]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  export:
    if: github.event.pull_request.head.ref == 'feature/p1-t01-tdd-red-i007-20260801-1122'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/p1-t01-tdd-red-i007-20260801-1122
          fetch-depth: 0

      - name: Verify and apply final T01 machine facts
        shell: bash
        run: |
          set -euo pipefail
          cat .github/p1-t01-final-sync/small-* | tr -cd 'A-Za-z0-9+/=' > /tmp/p1-t01-final-facts.b64
          test "$(wc -c < /tmp/p1-t01-final-facts.b64)" -eq 80136
          base64 --decode /tmp/p1-t01-final-facts.b64 > /tmp/p1-t01-final-facts.tar.xz
          echo '888490efba23cc24a7f1b6afb2194ddb2df3ebe8fa8301910c7d600a8e7dc05c  /tmp/p1-t01-final-facts.tar.xz' | sha256sum --check --strict
          test "$(tar -tJf /tmp/p1-t01-final-facts.tar.xz | wc -l)" -eq 19
          ! tar -tJf /tmp/p1-t01-final-facts.tar.xz | grep -Ev '^project_doc/'
          tar -xJf /tmp/p1-t01-final-facts.tar.xz -C .
          python3 - <<'PY'
          import json
          from pathlib import Path

          task_dir = Path('project_doc/version/V_1.0/task/P1-COMPILER-F01')
          text = (task_dir / 'task_state.md').read_text(encoding='utf-8')
          marker = '```json task-state\n'
          start = text.index(marker) + len(marker)
          end = text.index('\n```', start)
          state = json.loads(text[start:end])
          assert state['task_status'] == 'COMPLETED'
          assert state['active_task_ids'] == []
          assert state['current_attempt_id'] == ''
          completion = state['artifact_revisions']['completion_verification']
          assert completion['revision'] == 'COMPLETION-P1-T01-R01@7be02cd9af4c'
          assert completion['status'] == 'PASSED'

          assertions = json.loads((task_dir / 'acceptance_assertions.json').read_text(encoding='utf-8'))
          items = assertions.get('assertions', assertions if isinstance(assertions, list) else [])
          assert len(items) == 86
          assert all(item.get('status') == 'VERIFIED' for item in items)

          checkpoints = (task_dir / 'git_checkpoints.yaml').read_text(encoding='utf-8')
          for checkpoint_id in (
              'CP-V_1.0-P1-COMPILER-F01-DEVELOPMENT-008',
              'CP-V_1.0-P1-COMPILER-F01-TESTING-007',
              'CP-V_1.0-P1-COMPILER-F01-COMPLETION-VERIFICATION-007',
          ):
              assert checkpoint_id in checkpoints
          PY
          git diff --check -- project_doc

      - name: Commit final T01 machine facts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project_doc
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Final T01 machine facts already applied.'
            exit 0
          fi
          git commit -m 'chore(verification): complete P1 T01 immutable contracts' \
            -m 'WK-Checkpoint: CP-V_1.0-P1-COMPILER-F01-COMPLETION-VERIFICATION-007' \
            -m 'WK-Revision: COMPLETION-P1-T01-R01@7be02cd9af4c' \
            -m 'WK-Checkpoint: CP-V_1.0-P1-COMPILER-F01-DEVELOPMENT-008' \
            -m 'WK-Checkpoint: CP-V_1.0-P1-COMPILER-F01-TESTING-007'
          git push origin HEAD:feature/p1-t01-tdd-red-i007-20260801-1122
