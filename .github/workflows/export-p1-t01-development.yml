name: Export P1 T01 Development Context

on:
  pull_request:
    branches:
      - dev_all
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.ref == 'feature/p1-t01-tdd-red-i007-20260801-1122'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v6
        with:
          ref: feature/p1-t01-tdd-red-i007-20260801-1122
          fetch-depth: 0

      - name: Package exact development context and Git history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p1-t01-development-context
          cp pom.xml /tmp/p1-t01-development-context/root-pom.xml
          cp -a .mvn /tmp/p1-t01-development-context/ 2>/dev/null || true
          cp mvnw /tmp/p1-t01-development-context/ 2>/dev/null || true
          cp -a dec-core-context /tmp/p1-t01-development-context/
          cp -a project_doc/version/V_1.0 /tmp/p1-t01-development-context/version
          cp -a scripts /tmp/p1-t01-development-context/repo-scripts 2>/dev/null || true
          find /tmp/p1-t01-development-context -type d -name target -prune -exec rm -rf {} +
          find /tmp/p1-t01-development-context -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/p1-t01-development-context/SHA256SUMS
          tar -C /tmp -cJf /tmp/p1-t01-development-context.tar.xz p1-t01-development-context
          tar -cJf /tmp/p1-t01-git-history.tar.xz .git
          sha256sum /tmp/p1-t01-development-context.tar.xz /tmp/p1-t01-git-history.tar.xz

      - name: Upload context
        uses: actions/upload-artifact@v4
        with:
          name: p1-t01-development-context
          path: /tmp/p1-t01-development-context.tar.xz
          if-no-files-found: error
          retention-days: 1

      - name: Upload Git history
        uses: actions/upload-artifact@v4
        with:
          name: p1-t01-git-history
          path: /tmp/p1-t01-git-history.tar.xz
          if-no-files-found: error
          retention-days: 1
