name: T10 I002 Source Snapshot

on:
  push:
    branches:
      - feature/p1-t10-rule-dag-20260804-1428
  pull_request:
    branches:
      - dev_all
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed-red:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact head branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: feature/p1-t10-rule-dag-20260804-1428
      - name: Restore I002 blocking oracle
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/t10-i002-red-tests.tar.gz
          echo '75a1a4094660dedd32f071f3fb16d325e74a636faf37b4aed8747ae52dc9f24a  /tmp/t10-i002-red-tests.tar.gz' | sha256sum -c -
          tar -xzf /tmp/t10-i002-red-tests.tar.gz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dec-core-compiler/src/test/java/dec/core/compiler/modelaccess/ModelAccessReworkBoundaryTest.java \
                  dec-core-compiler/src/test/java/dec/core/compiler/modelaccess/ModelAccessReworkResourceTest.java
          if git diff --cached --quiet; then
            echo 'I002 RED tests already present'
            exit 0
          fi
          git commit -m 'test(modelaccess): add I002 blocking review oracle'
          git pull --rebase origin feature/p1-t10-rule-dag-20260804-1428
          git push origin HEAD:feature/p1-t10-rule-dag-20260804-1428

  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head with history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: feature/p1-t10-rule-dag-20260804-1428
      - name: Package repository source and git history
        shell: bash
        run: |
          tar -czf /tmp/t10-i002-source-snapshot.tar.gz \
            --exclude='./.git/objects/pack/*.keep' \
            .
      - name: Upload repository source
        uses: actions/upload-artifact@v4
        with:
          name: t10-i002-source-snapshot
          path: /tmp/t10-i002-source-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 1
