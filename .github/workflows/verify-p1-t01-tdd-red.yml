name: Verify P1 T01 TDD RED

on:
  pull_request:
    branches:
      - dev_all
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  verify-red:
    if: github.event.pull_request.head.ref == 'feature/p1-t01-tdd-red-i007-20260801-1122'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v6
        with:
          ref: feature/p1-t01-tdd-red-i007-20260801-1122
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Bootstrap repository-bundled legacy dependencies
        run: scripts/remediation/bootstrap_legacy_dependencies.sh

      - name: Prove TDD test sources compile
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw --batch-mode --no-transfer-progress \
            -pl dec-core-context -am \
            -DskipTests \
            test-compile | tee /tmp/p1-t01-test-compile.log

      - name: Prove existing Context baseline stays GREEN
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw --batch-mode --no-transfer-progress \
            -pl dec-core-context -am \
            -Dtest=BaseDataContractTest \
            test | tee /tmp/p1-t01-baseline.log

      - name: Prove context does not depend on compiler
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw --batch-mode --no-transfer-progress \
            -pl dec-core-context \
            dependency:tree \
            -Dincludes=doc.eq.code:dec-core-compiler \
            | tee /tmp/p1-t01-dependency-tree.log
          if grep -F 'doc.eq.code:dec-core-compiler' /tmp/p1-t01-dependency-tree.log; then
            echo '::error::dec-core-context must not depend on dec-core-compiler.'
            exit 1
          fi

      - name: Execute and validate expected RED
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dec-core-context/target/surefire-reports
          set +e
          ./mvnw --batch-mode --no-transfer-progress \
            -pl dec-core-context -am \
            -Dtest=ContextValueContractTest,RegistryImmutabilityTest,EngineContextApiTest \
            test > /tmp/p1-t01-red.log 2>&1
          red_exit=$?
          set -e
          cat /tmp/p1-t01-red.log

          if [ "$red_exit" -eq 0 ]; then
            echo '::error::Expected RED command to fail, but it passed.'
            exit 1
          fi

          if grep -E 'COMPILATION ERROR|Could not resolve dependencies|Non-resolvable parent POM|No tests matching pattern|No tests were executed|UnsupportedClassVersionError' /tmp/p1-t01-red.log; then
            echo '::error::RED was caused by compilation, dependency, selection, or environment failure.'
            exit 1
          fi

          python3 - <<'PY'
          import json
          import pathlib
          import xml.etree.ElementTree as ET

          report_dir = pathlib.Path('dec-core-context/target/surefire-reports')
          reports = sorted(report_dir.glob('TEST-dec.core.context.tdd.*Test.xml'))
          if len(reports) != 3:
              raise SystemExit('expected exactly 3 TDD RED reports, found %d' % len(reports))

          totals = {'tests': 0, 'failures': 0, 'errors': 0, 'skipped': 0}
          messages = []
          for report in reports:
              root = ET.parse(str(report)).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, '0'))
              for failure in root.findall('.//failure'):
                  messages.append((failure.attrib.get('message') or '') + '\n' + (failure.text or ''))

          if totals != {'tests': 3, 'failures': 3, 'errors': 0, 'skipped': 0}:
              raise SystemExit('invalid RED totals: %r' % totals)

          joined = '\n'.join(messages)
          expected = [
              'CASE-P1-T01-CONTEXT-VALUE-RED-001',
              'CASE-P1-T01-REGISTRY-RED-001',
              'CASE-P1-T01-ENGINE-CONTEXT-RED-001',
              'missing production contract type'
          ]
          missing = [item for item in expected if item not in joined]
          if missing:
              raise SystemExit('RED reports missing expected contract messages: %r' % missing)

          evidence = {
              'schema_version': 2,
              'result': 'PASSED',
              'phase': 'tdd',
              'task_id': 'TASK-P1-T01',
              'revision': 'TDD-P1-T01-R01',
              'command': './mvnw -pl dec-core-context -am -Dtest=ContextValueContractTest,RegistryImmutabilityTest,EngineContextApiTest test',
              'command_exit_code': 1,
              'red_valid': True,
              'test_compile': 'PASSED',
              'baseline_test': 'PASSED',
              'dependency_direction': 'PASSED',
              'totals': totals,
              'case_ids': expected[:3],
              'failure_kind': 'PUBLIC_CONTRACT_BEHAVIOR_MISSING',
              'forbidden_failure_kinds_absent': [
                  'COMPILATION_ERROR', 'DEPENDENCY_ERROR', 'TEST_SELECTION_ERROR', 'ENVIRONMENT_ERROR'
              ]
          }
          pathlib.Path('/tmp/p1-t01-red-evidence.json').write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(evidence, ensure_ascii=False, indent=2))
          PY

      - name: Upload RED evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-t01-tdd-red-evidence
          path: |
            /tmp/p1-t01-red-evidence.json
            /tmp/p1-t01-red.log
            /tmp/p1-t01-test-compile.log
            /tmp/p1-t01-baseline.log
            /tmp/p1-t01-dependency-tree.log
            dec-core-context/target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 14
