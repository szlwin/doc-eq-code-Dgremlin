name: P2 task7 lifecycle verification

on:
  pull_request:
    branches:
      - agent/p2-task7-base-20260818

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Bootstrap repository-bundled legacy dependencies
        run: scripts/remediation/bootstrap_legacy_dependencies.sh
      - name: Verify task7 scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only e5f12c9cc202f3e2a4257a1a7d6b79ee7882348e...HEAD | tee /tmp/task7-changed-paths.txt
          unexpected=$(git diff --name-only e5f12c9cc202f3e2a4257a1a7d6b79ee7882348e...HEAD | grep -Ev '^(dec-core-starter/src/test/java/dec/core/starter/access/SingleEngineContextRuntimeLifecycleTest.java|\.github/workflows/p2-task7-lifecycle.yml)$' || true)
          test -z "$unexpected"
          sha256sum dec-core-starter/src/test/java/dec/core/starter/access/SingleEngineContextRuntimeLifecycleTest.java | tee /tmp/task7-source.sha256
      - name: Exact starter compile prerequisite
        shell: bash
        run: |
          set -o pipefail
          ./mvnw -pl dec-core-starter -am -DskipTests install 2>&1 | tee /tmp/task7-compile.log
      - name: Exact single-context lifecycle test
        shell: bash
        run: |
          set -o pipefail
          ./mvnw -pl dec-core-starter -Dtest=SingleEngineContextRuntimeLifecycleTest -Dsurefire.failIfNoSpecifiedTests=true test 2>&1 | tee /tmp/task7-lifecycle.log
      - name: Exact dec-demo real fixture regression
        shell: bash
        run: |
          set -o pipefail
          ./mvnw -pl dec-demo -Dtest=P2RealFixtureIntegrationTest -Dsurefire.failIfNoSpecifiedTests=true test 2>&1 | tee /tmp/task7-real-fixture.log
      - name: Upload task7 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: p2-task7-lifecycle-evidence
          path: |
            /tmp/task7-changed-paths.txt
            /tmp/task7-source.sha256
            /tmp/task7-compile.log
            /tmp/task7-lifecycle.log
            /tmp/task7-real-fixture.log
            dec-core-starter/target/surefire-reports/TEST-dec.core.starter.access.SingleEngineContextRuntimeLifecycleTest.xml
            dec-demo/target/surefire-reports/TEST-dec.demo.p2.P2RealFixtureIntegrationTest.xml
          if-no-files-found: warn
