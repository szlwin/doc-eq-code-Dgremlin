name: common-develop exact checkpoint publish

on:
  push:
    branches:
      - dev_all
    paths:
      - .common-develop-publish/trigger.json
  pull_request:
    branches:
      - dev_all
    paths:
      - .common-develop-publish/pr-trigger.txt

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify and publish exact checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euxo pipefail
          EXPECTED_PARENT="c026509005d806b0e60ad8d9c76f5333a25aba5c"
          TARGET_SHA="582ba62642cacc8e4622ea9b0560884575ff5d04"
          EXPECTED_BUNDLE_SHA256="12b164a6fffd63f78955526989552c47170d2cded62610048aec5d04ab176f07"
          git init repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin "+refs/heads/dev_all:refs/remotes/origin/dev_all" "+refs/heads/${HEAD_REF}:refs/remotes/origin/publish"
          git checkout --detach refs/remotes/origin/publish
          CURRENT_SHA="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$EXPECTED_PARENT" "$CURRENT_SHA"
          cat .common-develop-publish/chunk-*.b64 | tr -cd 'A-Za-z0-9+/=' > /tmp/reqan-r04.b64
          test "$(wc -c < /tmp/reqan-r04.b64)" -eq 95836
          base64 -d /tmp/reqan-r04.b64 > /tmp/reqan-r04.bundle
          test "$(wc -c < /tmp/reqan-r04.bundle)" -eq 71875
          test "$(sha256sum /tmp/reqan-r04.bundle | awk '{print $1}')" = "$EXPECTED_BUNDLE_SHA256"
          git bundle verify /tmp/reqan-r04.bundle
          git fetch /tmp/reqan-r04.bundle refs/heads/common-develop-transfer-target
          test "$(git rev-parse FETCH_HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse "$TARGET_SHA^")" = "$EXPECTED_PARENT"
          git push origin "$TARGET_SHA:refs/heads/dev_all" --force
