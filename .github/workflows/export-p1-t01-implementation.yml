name: Export P1 T01 Implementation

on:
  pull_request:
    branches: [dev_all]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.ref == 'feature/p1-t01-tdd-red-i007-20260801-1122'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/p1-t01-tdd-red-i007-20260801-1122
          fetch-depth: 0
      - name: Decode verified implementation
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/p1-t01-implementation-payload.b64 > /tmp/p1-t01-implementation.tar.xz
          echo '875882aadb22b9859004dd288de0961c2ff524634c13b72d2bfe977256fe030e  /tmp/p1-t01-implementation.tar.xz' | sha256sum --check --strict
          mkdir -p /tmp/export
          tar -xJf /tmp/p1-t01-implementation.tar.xz -C /tmp/export
          find /tmp/export -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/export/SHA256SUMS
          tar -C /tmp -cJf /tmp/p1-t01-implementation-source.tar.xz export
      - uses: actions/upload-artifact@v4
        with:
          name: p1-t01-implementation-source
          path: /tmp/p1-t01-implementation-source.tar.xz
          if-no-files-found: error
          retention-days: 1
