name: Finalize P1 Test Design

"on":
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [dev_all]

permissions:
  contents: write

concurrency:
  group: p1-test-design-i007-finalize
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'feature/p1-test-design-i007-20260731-2357'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Materialize and validate TESTDESIGN-R01
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p project_doc/version/V_1.0/doc/P1-COMPILER-F01

          cat .github/test-design-payload/test-*.txt \
            | base64 --decode \
            | gzip --decompress \
            > project_doc/version/V_1.0/doc/P1-COMPILER-F01/test_case.md

          cat .github/test-design-payload/matrix.md.gz.b64 \
            | base64 --decode \
            | gzip --decompress \
            > project_doc/version/V_1.0/doc/P1-COMPILER-F01/P1_COMPILER_analysis_test_matrix.md

          cat .github/test-design-payload/script-*.txt \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/finalize_test_design.py

          python3 /tmp/finalize_test_design.py

      - name: Remove helper payload and commit final result
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          rm -rf .github/test-design-payload
          rm -f .github/workflows/p1-test-design-finalize.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "::error::No final test-design changes were produced."
            exit 1
          fi

          git commit \
            -m "docs(test-design): complete P1 TEST_DESIGN I007" \
            -m "WK-Checkpoint: CP-V_1.0-P1-COMPILER-F01-TEST-DESIGN-007" \
            -m "WK-Revision: TESTDESIGN-R01@ba7779cf089b"

          git push origin "HEAD:${SOURCE_BRANCH}"
