name: export exact git bundle

on:
  pull_request:
    branches:
      - dev_all
    paths:
      - .common-develop-export/trigger.txt

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact repository bundle
        shell: bash
        run: |
          set -euxo pipefail
          git fetch --no-tags origin dev_all
          test "$(git rev-parse origin/dev_all)" = "aa0e171ab42759d5ba1c115d839396987efb5e0a"
          git bundle create doc-eq-code-Dgremlin-aa0e171.bundle --all
          git bundle verify doc-eq-code-Dgremlin-aa0e171.bundle
          sha256sum doc-eq-code-Dgremlin-aa0e171.bundle > doc-eq-code-Dgremlin-aa0e171.bundle.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: doc-eq-code-Dgremlin-aa0e171-git-bundle
          path: |
            doc-eq-code-Dgremlin-aa0e171.bundle
            doc-eq-code-Dgremlin-aa0e171.bundle.sha256
          if-no-files-found: error
          retention-days: 1
