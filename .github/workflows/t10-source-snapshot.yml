name: T10 Source Snapshot

on:
  push:
    branches:
      - feature/p1-t10-rule-dag-20260804-1428
  pull_request:
    branches:
      - dev_all
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed-red-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact head branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Restore T10 RED oracle
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/t10-red-tests.tar.gz
          echo '58f5cf27d3158fbafc5564336c8b381c1e2bc76342f94bad85c2eb6093923667  /tmp/t10-red-tests.tar.gz' | sha256sum -c -
          tar -xzf /tmp/t10-red-tests.tar.gz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dec-core-compiler/src/test/java/dec/core/compiler/modelaccess
          if git diff --cached --quiet; then
            echo 'T10 RED oracle already present'
            exit 0
          fi
          git commit -m 'test(modelaccess): add T10 RED oracle'
          git push origin HEAD:${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}

  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head with history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Package repository source and git history
        run: |
          tar -czf /tmp/t10-source-snapshot.tar.gz .

      - name: Upload repository source
        uses: actions/upload-artifact@v6
        with:
          name: t10-source-snapshot
          path: /tmp/t10-source-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 1
