name: T10 Source Snapshot

on:
  push:
    branches:
      - feature/p1-t10-rule-dag-20260804-1428
  pull_request:
    branches:
      - dev_all
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed-implementation:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact head branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Restore T10 concrete implementation
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/t10-concrete.tar.gz
          echo '976e60a8de232561753c04adb60e6eeef131d5a2e12ce66f9dd593f3e8ed3ab1  /tmp/t10-concrete.tar.gz' | sha256sum -c -
          tar -xzf /tmp/t10-concrete.tar.gz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dec-core-compiler/src/main/java/dec/core/compiler/modelaccess \
                  dec-demo/src/main/resources/mix/system/systems.xml \
                  dec-demo/src/test/resources/mix/system/systems.xml
          if git diff --cached --quiet; then
            echo 'T10 concrete implementation already present'
            exit 0
          fi
          git commit -m 'feat(modelaccess): implement exact selector binding'
          git push origin HEAD:${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}

  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head with history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Package repository source and git history
        run: |
          tar -czf /tmp/t10-source-snapshot.tar.gz .

      - name: Upload repository source
        uses: actions/upload-artifact@v6
        with:
          name: t10-source-snapshot
          path: /tmp/t10-source-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 1
