name: PR36 R03 checkout export
on:
  push:
    branches:
      - feature/p2-design-testdesign-20260808
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify head and auth cleanliness
        run: |
          set -euo pipefail
          git rev-parse HEAD
          if git config --local --get-regexp 'http\..*\.extraheader|credential' ; then
            echo 'unexpected git credential config' >&2
            exit 1
          fi
      - name: Pack checkout
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/pr36-r03-checkout.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: pr36-r03-checkout
          path: ${{ runner.temp }}/pr36-r03-checkout.tar.gz
          if-no-files-found: error
          retention-days: 1
