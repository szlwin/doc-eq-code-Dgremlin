name: common-develop DEV-01 R02 truthful closure v5

on:
  push:
    branches: [common-develop/dev01-r02-run-20260812]
    paths: [.github/workflows/common-develop-dev01-r02-run-v5.yml]

permissions:
  contents: write

jobs:
  dev01-r02:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: common-develop/dev01-r02-run-20260812
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Decode injected Python string literals then execute
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import ast,textwrap
          src=Path('.github/workflows/common-develop-dev01-r02-run.yml').read_text()
          marker='        run: |\n'
          if marker not in src:
              raise SystemExit('v1 run block missing')
          block=textwrap.dedent(src.split(marker,1)[1])

          def normalize_region(text, var, next_marker):
              start=var+'="""'
              i=text.find(start)
              if i < 0:
                  raise SystemExit(f'{var} opening assignment missing')
              j=text.find('\n'+next_marker, i)
              if j < 0:
                  raise SystemExit(f'{var} boundary missing: {next_marker}')
              raw=text[i+len(start):j].rstrip()
              while raw.endswith('"'):
                  raw=raw[:-1]
              decoded=ast.literal_eval('"""'+raw+'"""')
              replacement=var+'='+repr(decoded)
              return text[:i]+replacement+text[j:]

          block=normalize_region(block,'isolate','if anchor not in s:')
          block=normalize_region(block,'ownership','if marker not in s:')
          block=normalize_region(block,'new','if old not in tail:')
          block=normalize_region(block,'guard',"tail=tail.replace('git diff --check")
          Path('/tmp/dev01-r02-v5.sh').write_text('#!/usr/bin/env bash\n'+block)
          PY
          chmod +x /tmp/dev01-r02-v5.sh
          /tmp/dev01-r02-v5.sh
