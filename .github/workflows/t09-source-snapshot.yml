name: T09 Source Snapshot

on:
  push:
    branches:
      - feature/p1-t09-engine-context-20260804-1040
  pull_request:
    branches:
      - dev_all

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Package repository source
        run: |
          tar --exclude=.git -czf /tmp/t09-source-snapshot.tar.gz .

      - name: Upload repository source
        uses: actions/upload-artifact@v6
        with:
          name: t09-source-snapshot
          path: /tmp/t09-source-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 1
