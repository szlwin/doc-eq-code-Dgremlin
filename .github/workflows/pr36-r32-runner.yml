name: PR36 R32 clean runner

on:
  push:
    branches:
      - feature/p2-design-testdesign-20260808

permissions:
  contents: write

jobs:
  run:
    if: contains(github.event.head_commit.message, '[r32-runner-v1]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build clean TestDesign R32 semantic commit
        shell: bash
        run: bash .common-develop-r32-stage.sh
