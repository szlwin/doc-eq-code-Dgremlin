name: I006 Materialize Comparison Implementation

on:
  push:
    branches:
      - feature/p1-t12-compiler-pipeline-20260804-2331
    paths:
      - .github/workflows/i006-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/p1-t12-compiler-pipeline-20260804-2331
          fetch-depth: 0
      - name: Materialize Java sources
        env:
          OP_GZ: ''
          SUPPORT_GZ: ''
        run: |
          mkdir -p dec-core-compiler/src/main/java/dec/core/compiler/pass
          printf '%s' "$OP_GZ" | base64 --decode | gzip --decompress > dec-core-compiler/src/main/java/dec/core/compiler/pass/ArtifactComparisonOperation.java
          printf '%s' "$SUPPORT_GZ" | base64 --decode | gzip --decompress > dec-core-compiler/src/main/java/dec/core/compiler/pass/ArtifactComparisonSupport.java
          git config user.name 'common-develop automation'
          git config user.email 'actions@users.noreply.github.com'
          git add dec-core-compiler/src/main/java/dec/core/compiler/pass/ArtifactComparisonOperation.java dec-core-compiler/src/main/java/dec/core/compiler/pass/ArtifactComparisonSupport.java
          git commit -m 'fix(t12): bound comparison operation traversal'
          git push origin HEAD:feature/p1-t12-compiler-pipeline-20260804-2331
