name: Finalize P1 T01 TDD V2

"on":
  pull_request:
    branches:
      - dev_all
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'feature/p1-t01-tdd-red-i007-20260801-1122'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source branch with history
        uses: actions/checkout@v6
        with:
          ref: feature/p1-t01-tdd-red-i007-20260801-1122
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run verified finalizer
        shell: bash
        run: |
          set -euo pipefail
          cat .github/p1-t01-finalizer-runner/chunk-* | base64 --decode > /tmp/finalize-p1-t01-tdd.sh
          echo 'b844b67f6eaaf078dfd5c8201a548adbac227a9d8e0db3d27f5b1b358e82a932  /tmp/finalize-p1-t01-tdd.sh' | sha256sum --check --strict
          chmod +x /tmp/finalize-p1-t01-tdd.sh
          /tmp/finalize-p1-t01-tdd.sh
