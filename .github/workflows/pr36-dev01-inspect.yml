name: PR36 DEV01 inspect
on:
  push:
    branches: [tmp/pr36-dev01-inspect-20260811]
    paths: [.common-develop-dev01-inspect-trigger]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect exact RC9 development internals
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/common-develop
          git clone --depth=1 https://gitee.com/szlwin/common-develop.git /tmp/common-develop
          python3 - <<'PY'
          import sys,inspect
          sys.path.insert(0,'/tmp/common-develop/scripts')
          import long_task
          for name in ['cmd_advance_development_step','cmd_finalize_phase','cmd_publish_artifact']:
              fn=getattr(long_task,name,None)
              print('\n===',name,'===')
              print(inspect.getsource(fn) if fn else 'MISSING')
          PY
          echo '--- ARCH REVIEW CONTRACT ---'
          python3 /tmp/common-develop/scripts/review_contract.py show -g ProjectManagerAgent --phase development --reviewer ArchitectureReviewAgent --json
          echo '--- SPEC REVIEW CONTRACT ---'
          python3 /tmp/common-develop/scripts/review_contract.py show -g ProjectManagerAgent --phase development --reviewer SpecComplianceReviewAgent --json
          echo '--- TDD REVIEW CONTRACT ---'
          python3 /tmp/common-develop/scripts/review_contract.py show -g ProjectManagerAgent --phase development --reviewer TDDReviewAgent --json
