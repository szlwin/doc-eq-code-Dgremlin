name: Finalize P1 T01 TDD

"on":
  pull_request:
    branches:
      - dev_all
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'feature/p1-t01-tdd-red-i007-20260801-1122'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source branch with history
        uses: actions/checkout@v6
        with:
          ref: feature/p1-t01-tdd-red-i007-20260801-1122
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Materialize verified lifecycle records
        shell: bash
        run: |
          set -euo pipefail
          cat .github/p1-t01-finalizer-payload/chunk-* | base64 --decode > /tmp/p1-t01-overlay.tar.xz
          echo 'c606a45084718e815a18560774d99dc3789df4b36aaf66b407598ad2567f2845  /tmp/p1-t01-overlay.tar.xz' | sha256sum --check --strict
          rm -rf /tmp/p1-t01-overlay
          mkdir -p /tmp/p1-t01-overlay
          tar -xJf /tmp/p1-t01-overlay.tar.xz -C /tmp/p1-t01-overlay
          rsync -a /tmp/p1-t01-overlay/overlay/ ./

      - name: Validate lifecycle, Review, Evidence and Git references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import subprocess

          root = pathlib.Path('project_doc/version/V_1.0')
          task = root / 'task/P1-COMPILER-F01'

          def fenced_json(path, marker):
              text = path.read_text(encoding='utf-8')
              match = re.search(r'```json\s+' + re.escape(marker) + r'\s*\n(.*?)\n```', text, re.S)
              if not match:
                  raise SystemExit('missing fenced JSON %s in %s' % (marker, path))
              return json.loads(match.group(1))

          state = fenced_json(task / 'task_state.md', 'task-state')
          plan = fenced_json(task / 'task_plan.md', 'task-plan')
          attempts = fenced_json(task / 'task_attempts.md', 'task-attempts')
          outcomes = fenced_json(task / 'stage_outcomes.md', 'stage-outcomes')
          completion = json.loads((root / 'tdd_p1_t01_r01_completion.json').read_text(encoding='utf-8'))
          evidence = json.loads((task / 'evidence/evidence_index.json').read_text(encoding='utf-8'))

          revision = 'TDD-P1-T01-R01@4ebeed4dad6a'
          if state.get('current_phase') != 'development' or state.get('current_round') != 'DEVELOPMENT-I007':
              raise SystemExit('task state did not advance to DEVELOPMENT-I007')
          tdd = state.get('artifact_revisions', {}).get('tdd', {})
          if tdd.get('revision') != revision or tdd.get('status') != 'PASSED':
              raise SystemExit('TDD revision/status mismatch')
          if completion.get('revision') != revision or completion.get('review_id') != 'REV-000061':
              raise SystemExit('completion summary mismatch')
          if [completion.get(k) for k in ('tests','failures','errors','skipped')] != [3,3,0,0]:
              raise SystemExit('completion RED totals mismatch')

          task_rows = plan if isinstance(plan, list) else plan.get('tasks', [])
          t01 = next((x for x in task_rows if x.get('task_id') == 'TASK-P1-T01'), None)
          if not t01 or t01.get('status') != 'PASSED' or t01.get('output_revision') != revision:
              raise SystemExit('TASK-P1-T01 plan state mismatch')
          attempt_rows = attempts if isinstance(attempts, list) else attempts.get('attempts', [])
          attempt = next((x for x in attempt_rows if x.get('attempt_id') == 'ATTEMPT-TASK-P1-T01-I007-A001'), None)
          if not attempt or attempt.get('status') != 'PASSED':
              raise SystemExit('TDD attempt missing or not PASSED')
          outcome_rows = outcomes if isinstance(outcomes, list) else outcomes.get('outcomes', [])
          outcome = next((x for x in outcome_rows if x.get('id') == 'SO-P1-COMPILER-F01-TDD-I007'), None)
          if not outcome or outcome.get('status') != 'PASSED' or outcome.get('output_revision') != revision:
              raise SystemExit('TDD stage outcome mismatch')

          evidences = {x.get('evidence_id'): x for x in evidence.get('evidences', [])}
          for eid in ('EVD-000290', 'EVD-000291'):
              item = evidences.get(eid)
              if not item or item.get('revision') != revision:
                  raise SystemExit('missing current TDD evidence ' + eid)
              snap = task / item['ref']
              digest = hashlib.sha256(snap.read_bytes()).hexdigest()
              if digest != item.get('digest'):
                  raise SystemExit('snapshot digest mismatch for ' + eid)

          reviews = [json.loads(line) for line in (task / 'evidence/reviews.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          review = next((x for x in reviews if x.get('review_id') == 'REV-000061'), None)
          if not review or review.get('result') != 'PASSED' or review.get('review_revision') != revision:
              raise SystemExit('TDD Review mismatch')
          if review.get('reviewer') != 'TDDReviewAgent' or set(review.get('evidence_ids', [])) != {'EVD-000290','EVD-000291'}:
              raise SystemExit('TDD Review reviewer/evidence mismatch')

          all_text = '\n'.join(p.read_text(encoding='utf-8', errors='replace') for p in root.rglob('*') if p.is_file())
          if re.search(r'(?m)^(<<<<<<<|=======|>>>>>>>)', all_text):
              raise SystemExit('unresolved conflict marker under project_doc')
          git_refs = sorted(set(re.findall(r'(?i)"git_ref"\s*:\s*"([0-9a-f]{40})"', all_text)))
          if not git_refs:
              raise SystemExit('no git_ref values found for validation')
          for ref in git_refs:
              result = subprocess.run(['git','cat-file','-e',ref + '^{commit}'], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if result.returncode != 0:
                  raise SystemExit('unresolvable GIT_REF: ' + ref)

          work = (root / 'work.md').read_text(encoding='utf-8')
          if 'architecture_review=false' not in work or '| 无 | AIW |' not in work:
              raise SystemExit('RC8 work-mode marker/table mismatch')
          print(json.dumps({'result':'PASSED','revision':revision,'review':'REV-000061',
                            'evidence':['EVD-000290','EVD-000291'],
                            'git_ref_count':len(git_refs)}, ensure_ascii=False, indent=2))
          PY

      - name: Bootstrap repository-bundled legacy dependencies
        run: scripts/remediation/bootstrap_legacy_dependencies.sh

      - name: Re-prove executable RED and stable baseline
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw --batch-mode --no-transfer-progress \
            -pl dec-core-context -am -DskipTests test-compile \
            | tee /tmp/p1-t01-final-test-compile.log

          ./mvnw --batch-mode --no-transfer-progress \
            -pl dec-core-context -am -Dtest=BaseDataContractTest test \
            | tee /tmp/p1-t01-final-baseline.log

          ./mvnw --batch-mode --no-transfer-progress \
            -pl dec-core-context dependency:tree \
            -Dincludes=doc.eq.code:dec-core-compiler \
            | tee /tmp/p1-t01-final-dependency-tree.log
          if grep -F 'doc.eq.code:dec-core-compiler' /tmp/p1-t01-final-dependency-tree.log; then
            echo '::error::dec-core-context must not depend on dec-core-compiler.'
            exit 1
          fi

          rm -rf dec-core-context/target/surefire-reports
          set +e
          ./mvnw --batch-mode --no-transfer-progress \
            -pl dec-core-context -am \
            -Dtest=ContextValueContractTest,RegistryImmutabilityTest,EngineContextApiTest \
            test > /tmp/p1-t01-final-red.log 2>&1
          red_exit=$?
          set -e
          cat /tmp/p1-t01-final-red.log

          if [ "$red_exit" -eq 0 ]; then
            echo '::error::Expected TDD RED command to fail, but it passed.'
            exit 1
          fi
          if grep -E 'COMPILATION ERROR|Could not resolve dependencies|Non-resolvable parent POM|No tests matching pattern|No tests were executed|UnsupportedClassVersionError' /tmp/p1-t01-final-red.log; then
            echo '::error::RED was caused by compilation, dependency, selection, or environment failure.'
            exit 1
          fi

          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import xml.etree.ElementTree as ET

          expected_sources = {
              'dec-core-context/src/test/java/dec/core/context/tdd/ContractReflectionAssertions.java': '3f84ed813979c221d18ff97bf824a504208cac948952e34224f6b6c1452bacbc',
              'dec-core-context/src/test/java/dec/core/context/tdd/ContextValueContractTest.java': 'c4fda7a817eb041b0461b554bd6e4ee83034392ce1b150722c145acc9e3eb531',
              'dec-core-context/src/test/java/dec/core/context/tdd/RegistryImmutabilityTest.java': '030e29c899b86bd5b9c38db0826ad68de8345012f0ce3c936b4533ec1f92eee7',
              'dec-core-context/src/test/java/dec/core/context/tdd/EngineContextApiTest.java': 'e4d6f7c5f241fd9fe793431c27ae548e0f2cd3e144321f07e758dc5ae71f2f48',
          }
          for name, expected in expected_sources.items():
              actual = hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit('test source digest mismatch: %s %s != %s' % (name, actual, expected))

          reports = sorted(pathlib.Path('dec-core-context/target/surefire-reports').glob(
              'TEST-dec.core.context.tdd.*Test.xml'))
          if len(reports) != 3:
              raise SystemExit('expected exactly 3 TDD RED reports, found %d' % len(reports))
          totals = {'tests': 0, 'failures': 0, 'errors': 0, 'skipped': 0}
          messages = []
          for report in reports:
              root = ET.parse(str(report)).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, '0'))
              for failure in root.findall('.//failure'):
                  messages.append((failure.attrib.get('message') or '') + '\n' + (failure.text or ''))
          expected_totals = {'tests': 3, 'failures': 3, 'errors': 0, 'skipped': 0}
          if totals != expected_totals:
              raise SystemExit('invalid RED totals: %r' % totals)
          joined = '\n'.join(messages)
          for value in (
              'CASE-P1-T01-CONTEXT-VALUE-RED-001',
              'CASE-P1-T01-REGISTRY-RED-001',
              'CASE-P1-T01-ENGINE-CONTEXT-RED-001',
              'missing production contract type',
          ):
              if value not in joined:
                  raise SystemExit('RED reports missing expected marker: ' + value)

          completion = json.loads(pathlib.Path(
              'project_doc/version/V_1.0/tdd_p1_t01_r01_completion.json').read_text(encoding='utf-8'))
          expected_completion = {
              'revision': 'TDD-P1-T01-R01@4ebeed4dad6a',
              'task_id': 'TASK-P1-T01',
              'phase': 'tdd',
              'status': 'PASSED',
              'tests': 3,
              'failures': 3,
              'errors': 0,
              'skipped': 0,
              'review_id': 'REV-000061',
              'next_phase': 'development',
              'next_agent': 'DevelopAgent',
          }
          for key, value in expected_completion.items():
              if completion.get(key) != value:
                  raise SystemExit('completion mismatch %s: %r != %r' % (key, completion.get(key), value))
          print(json.dumps({'result': 'PASSED', 'red_totals': totals,
                            'revision': completion['revision'],
                            'review_id': completion['review_id']}, indent=2))
          PY

      - name: Commit final TDD checkpoint and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .github/p1-t01-finalizer-payload
          git rm .github/workflows/export-p1-t01-context.yml
          git rm .github/workflows/verify-p1-t01-tdd-red.yml
          git rm .github/workflows/finalize-p1-t01-tdd.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dec-core-context/src/test project_doc
          git diff --cached --check
          git commit \
            -m 'test(tdd): complete P1 T01 executable RED' \
            -m 'WK-Checkpoint: CP-V_1.0-P1-COMPILER-F01-TDD-007' \
            -m 'WK-Revision: TDD-P1-T01-R01@4ebeed4dad6a'
          git push origin HEAD:feature/p1-t01-tdd-red-i007-20260801-1122
