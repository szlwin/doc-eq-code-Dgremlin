name: P2 Task2 Tree Build

on:
  push:
    branches:
      - agent/p2-task2-checkpoint-build-20260818

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Rebuild exact task2 checkpoint tree
        shell: bash
        run: |
          set -euo pipefail
          cat .common-develop/task2.patch.xz.b64.part.* > /tmp/task2.patch.xz.b64
          test "$(sha256sum /tmp/task2.patch.xz.b64 | awk '{print $1}')" = "111ab46ecd4fc2c54805d3c2790e6a1cbe3ae68f99b15e29375660f3e41b7913"
          base64 -d /tmp/task2.patch.xz.b64 > /tmp/task2.patch.xz
          test "$(sha256sum /tmp/task2.patch.xz | awk '{print $1}')" = "06c546273e446e16594ab9561a4ca7c13d5fa97aa19f246aa28dc6382e8d72b9"
          xz -dc /tmp/task2.patch.xz > /tmp/task2.patch
          test "$(sha256sum /tmp/task2.patch | awk '{print $1}')" = "6713b6468597d8939102bebfad155d696e02ae04d558eac5d57ed7527cdded87"
          git apply --index /tmp/task2.patch
          rm -rf .common-develop
          rm -f .github/workflows/p2-task2-tree-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          echo "TARGET_TREE=$(git write-tree)"
          test "$(git write-tree)" = "1de2212f36468d7b0b5d58523cfd7f5075c10715"
          git commit -m "chore(p2): build exact task2 checkpoint tree"
          git push origin HEAD:"${GITHUB_REF_NAME}"
