name: Print P1 T01 tree

on:
  push:
    branches:
      - feature/p1-t01-tdd-red-i007-20260801-1122

permissions:
  contents: read

jobs:
  print-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Print commit and tree
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse 'HEAD^{tree}')"
