name: Temporary P1 Stage Machine Export

on:
  push:
    branches:
      - rework/p1-stage-closure-20260807
  pull_request:
    branches:
      - dev_all
    types:
      - synchronize
      - opened
      - reopened

permissions:
  contents: read

jobs:
  export-project-doc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR source
        uses: actions/checkout@v4
      - name: Upload project_doc snapshot
        uses: actions/upload-artifact@v4
        with:
          name: p1-stage-machine-source
          path: project_doc
          if-no-files-found: error
          retention-days: 1
