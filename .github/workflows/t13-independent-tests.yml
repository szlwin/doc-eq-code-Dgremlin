name: T13 Independent Review Tests

on:
  push:
    branches:
      - feature/p1-t13-semantic-digest-20260805-2005
    paths:
      - .github/workflows/t13-independent-tests.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/p1-t13-semantic-digest-20260805-2005
          fetch-depth: 0
      - name: Apply independent review tests
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/t13-independent-tests.tar.gz
          echo "1ae6558d4f5f77a3d7869a12102705430a493e6360ce20f3684c1e998a90b80b  /tmp/t13-independent-tests.tar.gz" | sha256sum -c -
          tar -xzf /tmp/t13-independent-tests.tar.gz
          git rm .github/workflows/t13-independent-tests.yml
          git config user.name "szlwin"
          git config user.email "szlwin@163.com"
          git add dec-core-compiler/src/test/java/dec/core/compiler/compiled/SemanticDigestIndependentReviewTest.java
          git add dec-core-compiler/src/test/java/dec/core/compiler/pass/CompilationObserverIndependentReviewTest.java
          git commit -m "test(compiler): add T13 independent review oracles"
          git push origin HEAD:feature/p1-t13-semantic-digest-20260805-2005
