name: Verify P1 T01 TDD R02 RED

on:
  pull_request:
    branches: [dev_all]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  verify-red:
    if: github.event.pull_request.head.ref == 'feature/p1-t01-tdd-red-i007-20260801-1122'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/p1-t01-tdd-red-i007-20260801-1122
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Bootstrap repository-bundled legacy dependencies
        run: scripts/remediation/bootstrap_legacy_dependencies.sh
      - name: Prove test compile and baseline
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw --batch-mode --no-transfer-progress -pl dec-core-context -am -DskipTests test-compile | tee /tmp/r02-test-compile.log
          ./mvnw --batch-mode --no-transfer-progress -pl dec-core-context -am -Dtest=BaseDataContractTest test | tee /tmp/r02-baseline.log
          ./mvnw --batch-mode --no-transfer-progress -pl dec-core-context dependency:tree -Dincludes=doc.eq.code:dec-core-compiler | tee /tmp/r02-dependency.log
          if grep -F 'doc.eq.code:dec-core-compiler' /tmp/r02-dependency.log; then exit 1; fi
      - name: Execute expected RED
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dec-core-context/target/surefire-reports
          set +e
          ./mvnw --batch-mode --no-transfer-progress -pl dec-core-context -am -Dtest=ContextValueContractTest,RegistryImmutabilityTest,EngineContextApiTest test > /tmp/r02-red.log 2>&1
          rc=$?
          set -e
          cat /tmp/r02-red.log
          test "$rc" -ne 0
          ! grep -E 'COMPILATION ERROR|Could not resolve dependencies|No tests matching pattern|No tests were executed|UnsupportedClassVersionError' /tmp/r02-red.log
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET, json
          reports=sorted(pathlib.Path('dec-core-context/target/surefire-reports').glob('TEST-dec.core.context.tdd.*Test.xml'))
          totals={'tests':0,'failures':0,'errors':0,'skipped':0}; messages=[]
          for report in reports:
              root=ET.parse(str(report)).getroot()
              for k in totals: totals[k]+=int(root.attrib.get(k,'0'))
              for f in root.findall('.//failure'): messages.append((f.attrib.get('message') or '')+'\n'+(f.text or ''))
          assert totals=={'tests':3,'failures':3,'errors':0,'skipped':0}, totals
          joined='\n'.join(messages)
          for marker in ['CASE-P1-T01-CONTEXT-VALUE-RED-001','CASE-P1-T01-REGISTRY-RED-001','CASE-P1-T01-ENGINE-CONTEXT-RED-001','missing production contract type']:
              assert marker in joined, marker
          assert '$jacocoData' not in joined
          pathlib.Path('/tmp/r02-summary.json').write_text(json.dumps({'result':'PASSED','totals':totals,'revision':'TDD-P1-T01-R02'},indent=2)+'\n')
          PY
      - name: Upload RED evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-t01-tdd-r02-red
          path: |
            /tmp/r02-*.log
            /tmp/r02-summary.json
            dec-core-context/target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 14
