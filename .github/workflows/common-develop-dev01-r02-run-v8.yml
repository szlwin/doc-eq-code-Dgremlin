name: common-develop DEV-01 R02 remediation v8

on:
  push:
    branches: [common-develop/dev01-r02-run-20260812]
    paths: [.github/workflows/common-develop-dev01-r02-run-v8.yml]

permissions:
  contents: write

jobs:
  dev01-r02:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: common-develop/dev01-r02-run-20260812
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Execute exact RC9 remediation task
        shell: bash
        run: |
          set -euo pipefail
          BASE='1b9399d958472fe486e9548015090267f624fa30'
          TARGET_BRANCH='feature/p2-design-testdesign-20260808'
          SEMANTIC_BRANCH='common-develop/dev01-r02-semantic-20260812'
          TDIR='project_doc/version/V_1.0/task/FEATURE-DESC-3361AD2E54FC'
          SKILLREV='7086b2d32b6beae2e6e522efc517d7823ba55376'
          TDDREV='TDD-P2-R01@3f282bb4e1f6'
          R01='DEV-P2-DEV01-R01@1f85b2e6b265'
          TASKID='TASK-P2-DEV-01-R02-ORACLE-CLOSURE-CORRECTION'
          RV_TEST='dec-core-compiler/src/test/java/dec/core/compiler/ruleview/RuleViewCompilationContractTest.java'
          SYS_TEST='dec-core-compiler/src/test/java/dec/core/compiler/system/SystemCompilationContractTest.java'
          BUILDER='dec-core-compiler/src/main/java/dec/core/compiler/symbol/SymbolTableBuilder.java'

          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$BASE"
          git reset --hard "$BASE"
          git config user.name common-develop-bot
          git config user.email common-develop-bot@users.noreply.github.com

          rm -rf /tmp/common-develop
          git clone --depth=1 https://gitee.com/szlwin/common-develop.git /tmp/common-develop
          test "$(git -C /tmp/common-develop rev-parse HEAD)" = "$SKILLREV"
          sudo mkdir -p /home/oai/skills
          sudo rm -f /home/oai/skills/common-develop
          sudo ln -s /tmp/common-develop /home/oai/skills/common-develop
          scripts/remediation/bootstrap_legacy_dependencies.sh >/tmp/dev01-r02-bootstrap.out 2>&1

          python3 /home/oai/skills/common-develop/scripts/long_task.py validate -g ProjectManagerAgent --task-dir "$TDIR"
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,'/home/oai/skills/common-develop/scripts')
          import long_task
          TD=Path('project_doc/version/V_1.0/task/FEATURE-DESC-3361AD2E54FC')
          state_doc,state=long_task.read_block(TD/'task_state.md','task-state')
          plan_doc,tasks=long_task.read_block(TD/'task_plan.md','task-plan')
          assert state['current_phase']=='development', state['current_phase']
          assert state['current_round']=='DEVELOPMENT-I009', state['current_round']
          ar=state.get('architecture_review') or {}
          assert ar.get('step')=='IMPLEMENTATION', ar
          assert ar.get('skeleton_revision')=='DEV-P2-DEV01-SKEL-R01@6250d4a5ee9f', ar
          assert ar.get('skeleton_review_result_refs')==['REV-000075','REV-000076'], ar
          original=next(t for t in tasks if isinstance(t,dict) and t.get('id')=='TASK-P2-DEV-01-SYSTEM-RULEVIEW-COMPILATION')
          assert original.get('status')=='PASSED' and original.get('output_revision')=='DEV-P2-DEV01-R01@1f85b2e6b265', original
          if any(isinstance(t,dict) and t.get('id')=='TASK-P2-DEV-01-R02-ORACLE-CLOSURE-CORRECTION' for t in tasks):
              raise SystemExit('R02 remediation task already exists on frozen BASE')
          art=state['artifact_revisions']['development']
          task={
            'id':'TASK-P2-DEV-01-R02-ORACLE-CLOSURE-CORRECTION',
            'logical_task_id':'LOGICAL-P2-DEV01-R02-ORACLE-CLOSURE-CORRECTION',
            'feature_id':'FEATURE-DESC-3361AD2E54FC',
            'iteration_id':art['iteration_id'],'iteration_no':art['iteration_no'],'supersedes_iteration_id':'',
            'revision_reason':'Independent DEV-01 R01 Review found one P1: 14 green methods were incorrectly treated as exact closure of all TESTDESIGN-P2-R32 oracles. Correct test ownership and closure truthfulness only; production behavior is frozen.',
            'title':'DEV-01 R02 TestDesign oracle closure correction',
            'objective':'Preserve the passed -ar skeleton and R01 production implementation while correcting surrogate R32 case labels, recording exact/partial/characterization/deferred ownership, and producing truthful same-revision Review evidence.',
            'phase':'development','status':'READY','depends_on':['TASK-P2-DEV-01-SYSTEM-RULEVIEW-COMPILATION'],
            'owner_agent':'DevelopAgent','reviewer_agents':['SpecComplianceReviewAgent','EngineeringStandardsReviewAgent','ArchitectureReviewAgent'],
            'input_revisions':long_task.phase_input_revisions(state,'development',minimal=False),
            'allowed_files':['dec-core-compiler/src/test/java/dec/core/compiler/ruleview/RuleViewCompilationContractTest.java'],
            'acceptance_trace_ids':['TR-P2-SYSTEM-RULEVIEW-001','TR-P2-SYSTEM-RULEVIEW-002'],
            'flow_refs':['FLOW-CONFIG-COMPILE'],'flow_step_refs':['STEP-P2-COMPILE-01','STEP-P2-COMPILE-02','STEP-P2-COMPILE-03','STEP-P2-COMPILE-04'],
            'validation_commands':[
              './mvnw -pl dec-core-compiler -am -Dmaven.test.skip=true install',
              './mvnw -pl dec-core-compiler -Dtest=SystemCompilationContractTest,RuleViewCompilationContractTest -Dsurefire.failIfNoSpecifiedTests=true test',
              './mvnw -pl dec-core-compiler -Dtest=SymbolOwnerIdentityReworkTest -Dsurefire.failIfNoSpecifiedTests=true test',
