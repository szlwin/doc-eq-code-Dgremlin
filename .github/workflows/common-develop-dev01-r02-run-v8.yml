            'CASE-P2-TD-RULEKEY-CONTRACT-001':'DEV01-CHAR-RULEVIEWKEY-CASE-SENSITIVE-001',
            'CASE-P2-TD-RULEVIEW-COMPOSITE-LOOKUP-001':'DEV01-CHAR-RULEVIEWKEY-NO-BARE-CONSTRUCTOR-001',
            'CASE-P2-TD-KEY-SOURCE-COMPAT-001':'DEV01-CHAR-LEXICAL-OWNER-NORMALIZATION-001',
            'CASE-P2-TD-BARE-NAME-COMPATIBILITY-BOUNDARY-001':'DEV01-CHAR-CROSS-SYSTEM-NEGATIVE-LOOKUP-001'}
          for old,new in mapping.items():
              if s.count(old)!=1: raise SystemExit('expected exactly one '+old)
              s=s.replace(old,new)
          p.write_text(s)
          PY

          mkdir -p "$TDIR/evidence/commands"
          python3 - <<'PY'
          from pathlib import Path
          import json
          TD=Path('project_doc/version/V_1.0/task/FEATURE-DESC-3361AD2E54FC')
          rows=[
            {'test':'SystemCompilationContractTest.systemIdentitySetIsSourceOrderIndependent','r32_case':'CASE-P2-TD-SYSTEM-DETERMINISM-001','role':'PARTIAL_ORACLE','semantic_owner_task':'TASK-P2-DEV-01-SYSTEM-RULEVIEW-COMPILATION','verified':'SystemKey set source-order determinism','deferred':'semantic digest determinism'},
            {'test':'SystemCompilationContractTest.duplicateSystemDiagnosticIsSourceOrderIndependent','r32_case':'CASE-P2-TD-SYSTEM-DUPLICATE-001','role':'EXACT_ORACLE','semantic_owner_task':'TASK-P2-DEV-01-SYSTEM-RULEVIEW-COMPILATION','closure':'CLOSED_BY_DEV01'},
            {'test':'SystemCompilationContractTest.ruleViewMayPrecedeSystemButMissingOwnerFails','r32_case':'CASE-P2-TD-SYSTEM-FORWARD-REF-001','role':'EXACT_ORACLE','semantic_owner_task':'TASK-P2-DEV-01-SYSTEM-RULEVIEW-COMPILATION','closure':'CLOSED_BY_DEV01'},
            {'test':'SystemCompilationContractTest.systemDefinitionIsFrozenFromMutableInputAttributes','r32_case':'CASE-P2-TD-SYSTEM-OWNERSHIP-SNAPSHOT-001','role':'EXACT_ORACLE','semantic_owner_task':'TASK-P2-DEV-01-SYSTEM-RULEVIEW-COMPILATION','closure':'CLOSED_BY_DEV01'},
            {'test':'SystemCompilationContractTest.schemaVersionChangesDefinitionValueButNotSystemIdentity','r32_case':'CASE-P2-TD-SYSTEM-VERSION-IDENTITY-001','role':'PARTIAL_ORACLE','semantic_owner_task':'TASK-P2-DEV-01-SYSTEM-RULEVIEW-COMPILATION','verified':'SystemKey version-independent identity and schemaVersion value change','deferred':'compiled aggregate semantic digest'},
            {'test':'SystemCompilationContractTest.systemKeyUsesCanonicalSharedIdentity','r32_case':'CASE-P2-TD-BM-CANONICAL-PAIR-001','role':'EXACT_ORACLE','semantic_owner_task':'TASK-P2-DEV-01-SYSTEM-RULEVIEW-COMPILATION','closure':'CLOSED_BY_DEV01'},
            {'test':'RuleViewCompilationContractTest.missingSystemOwnerFailsWithoutPartialPublication','r32_case':'CASE-P2-TD-RULEVIEW-SYSTEM-REQUIRED-001','role':'EXACT_ORACLE','semantic_owner_task':'TASK-P2-DEV-01-SYSTEM-RULEVIEW-COMPILATION','closure':'CLOSED_BY_DEV01'},
            {'test':'RuleViewCompilationContractTest.duplicateRuleViewDiagnosticIsSourceOrderIndependent','r32_case':'CASE-P2-TD-RULEVIEW-SAME-SYSTEM-DUPLICATE-001','role':'EXACT_ORACLE','semantic_owner_task':'TASK-P2-DEV-01-SYSTEM-RULEVIEW-COMPILATION','closure':'CLOSED_BY_DEV01'},
            {'test':'RuleViewCompilationContractTest.sameLocalNameIsIsolatedByOwningSystem','r32_case':'CASE-P2-TD-RULEVIEW-CROSS-SYSTEM-ISOLATION-001','role':'EXACT_ORACLE','semantic_owner_task':'TASK-P2-DEV-01-SYSTEM-RULEVIEW-COMPILATION','closure':'CLOSED_BY_DEV01'},
            {'test':'RuleViewCompilationContractTest.explicitOwnerNeverFallsBackToMostRecentSystem','characterization_id':'DEV01-CHAR-EXPLICIT-SYSTEM-OWNER-NO-RECENCY-FALLBACK-001','target_r32_case':'CASE-P2-TD-RULEVIEW-VIEW-RESOLUTION-001','role':'CHARACTERIZATION','semantic_owner_task':'TASK-P2-DEV-02-RULEVIEW-REFERENCE','closure':'DEFERRED'},
            {'test':'RuleViewCompilationContractTest.compositeRuleViewIdentityRemainsCaseSensitive','characterization_id':'DEV01-CHAR-RULEVIEWKEY-CASE-SENSITIVE-001','target_r32_case':'CASE-P2-TD-RULEKEY-CONTRACT-001','role':'CHARACTERIZATION','semantic_owner_task':'TASK-P2-DEV-02-RULEVIEW-REFERENCE','closure':'DEFERRED'},
            {'test':'RuleViewCompilationContractTest.noBareStringRuleViewKeyConstructorExists','characterization_id':'DEV01-CHAR-RULEVIEWKEY-NO-BARE-CONSTRUCTOR-001','target_r32_case':'CASE-P2-TD-RULEVIEW-COMPOSITE-LOOKUP-001','role':'CHARACTERIZATION','semantic_owner_task':'TASK-P2-DEV-02-RULEVIEW-REFERENCE','closure':'DEFERRED'},
            {'test':'RuleViewCompilationContractTest.explicitLexicalOwnerAndNameMapToSharedCompositeKey','characterization_id':'DEV01-CHAR-LEXICAL-OWNER-NORMALIZATION-001','target_r32_case':'CASE-P2-TD-KEY-SOURCE-COMPAT-001','role':'CHARACTERIZATION','semantic_owner_task':'TASK-P2-DEV-09-REAL-FIXTURE-COMPATIBILITY','closure':'DEFERRED'},
            {'test':'RuleViewCompilationContractTest.localNameNeverAuthorizesCrossSystemLookup','characterization_id':'DEV01-CHAR-CROSS-SYSTEM-NEGATIVE-LOOKUP-001','target_r32_case':'CASE-P2-TD-BARE-NAME-COMPATIBILITY-BOUNDARY-001','role':'CHARACTERIZATION','semantic_owner_task':'TASK-P2-DEV-09-REAL-FIXTURE-COMPATIBILITY','closure':'DEFERRED'}]
          payload={'schema_version':1,'task':'TASK-P2-DEV-01-SYSTEM-RULEVIEW-COMPILATION','remediation_task':'TASK-P2-DEV-01-R02-ORACLE-CLOSURE-CORRECTION','authority':'TESTDESIGN-P2-R32','executed_test_methods':14,'exact_oracles_closed_by_dev01':7,'partial_oracles':2,'characterization_only':5,'all_r32_oracles_closed':False,'rule':'JUnit GREEN does not imply exact R32 oracle closure','rows':rows}
          (TD/'evidence/commands/dev01-r02-oracle-ownership.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n')
          PY

          DEVREV=$(python3 - <<'PY'
          from pathlib import Path
          import hashlib
          h=hashlib.sha256(); h.update(b'DEV-P2-DEV01-R02\0'); h.update(b'1b9399d958472fe486e9548015090267f624fa30\0')
          for p in [Path('dec-core-compiler/src/test/java/dec/core/compiler/ruleview/RuleViewCompilationContractTest.java'),Path('project_doc/version/V_1.0/task/FEATURE-DESC-3361AD2E54FC/evidence/commands/dev01-r02-oracle-ownership.json')]:
              h.update(p.read_bytes()); h.update(b'\0')
          print('DEV-P2-DEV01-R02@'+h.hexdigest()[:12])
          PY
          )
          export DEVREV
          RESULT_DIR="$TDIR/evidence/command-results/$DEVREV"
          mkdir -p "$RESULT_DIR"

          run_and_record() {
            local name="$1"; shift
            local command="$*"
            set +e
            bash -lc "$command" >"$RESULT_DIR/$name.out" 2>&1
            local rc=$?
            set -e
            python3 - "$RESULT_DIR/$name.json" "$RESULT_DIR/$name.out" "$command" "$rc" "$DEVREV" <<'PY'
          import sys,json,hashlib,datetime,os
          js,out,cmd,rc,rev=sys.argv[1:]
          data=open(out,'rb').read()
          payload={'schema_version':2,'kind':'command_result','command':cmd,'exit_code':int(rc),'executed_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'revision':rev,'output_ref':os.path.relpath(out,'project_doc/version/V_1.0/task/FEATURE-DESC-3361AD2E54FC'),'output_digest':hashlib.sha256(data).hexdigest()}
          open(js,'w').write(json.dumps(payload,ensure_ascii=False,indent=2)+'\n')
          PY
            test "$rc" -eq 0
          }

          run_and_record boot './mvnw -pl dec-core-compiler -am -Dmaven.test.skip=true install'
          run_and_record dev01-tests './mvnw -pl dec-core-compiler -Dtest=SystemCompilationContractTest,RuleViewCompilationContractTest -Dsurefire.failIfNoSpecifiedTests=true test'
          run_and_record symbol-regression './mvnw -pl dec-core-compiler -Dtest=SymbolOwnerIdentityReworkTest -Dsurefire.failIfNoSpecifiedTests=true test'
          run_and_record diff-check 'git diff --check'

          git diff --exit-code "$BASE" -- "$BUILDER"
          if git diff --name-only "$BASE" -- | grep -E '^dec-core-(context|compiler|model|starter|demo)/src/main/'; then
            echo 'Unexpected production source diff in R02' >&2
            exit 1
          fi
          git diff -- "$RV_TEST" > "$TDIR/evidence/commands/dev01-r02-test.patch"
          sed -i 's/[[:blank:]]\+$//' "$TDIR/evidence/commands/dev01-r02-test.patch"

          python3 - <<'PY'
          from pathlib import Path
          import sys,json,os
          sys.path.insert(0,'/home/oai/skills/common-develop/scripts')
          import evidence
          TD=Path('project_doc/version/V_1.0/task/FEATURE-DESC-3361AD2E54FC'); rev=os.environ['DEVREV']
          refs=[]
          refs.append(evidence.register_evidence(TD,agent='DevelopAgent',evidence_type='test_ref',ref=str(Path.cwd()/'dec-core-compiler/src/test/java/dec/core/compiler/ruleview/RuleViewCompilationContractTest.java'),revision=rev,phase='development',scope_refs=['TASK-P2-DEV-01-R02-ORACLE-CLOSURE-CORRECTION','test_oracle_ownership','TESTDESIGN-P2-R32']))
          refs.append(evidence.register_evidence(TD,agent='DevelopAgent',evidence_type='test_ref',ref='evidence/commands/dev01-r02-oracle-ownership.json',revision=rev,phase='development',scope_refs=['TASK-P2-DEV-01-R02-ORACLE-CLOSURE-CORRECTION','test_oracle_ownership','TESTDESIGN-P2-R32']))
          refs.append(evidence.register_evidence(TD,agent='DevelopAgent',evidence_type='diff_ref',ref='evidence/commands/dev01-r02-test.patch',revision=rev,phase='development',scope_refs=['TASK-P2-DEV-01-R02-ORACLE-CLOSURE-CORRECTION','test_diff']))
          refs.append(evidence.register_evidence(TD,agent='DevelopAgent',evidence_type='code_ref',ref=str(Path.cwd()/'dec-core-compiler/src/main/java/dec/core/compiler/symbol/SymbolTableBuilder.java'),revision=rev,phase='development',scope_refs=['TASK-P2-DEV-01-R02-ORACLE-CLOSURE-CORRECTION','production_unchanged_from_R01']))
          refs.append(evidence.register_evidence(TD,agent='DevelopAgent',evidence_type='plan_ref',ref='development_tasks.yaml',revision=rev,phase='development',scope_refs=['TASK-P2-DEV-01-R02-ORACLE-CLOSURE-CORRECTION','TP-FEATURE-DESC-3361AD2E54FC-R05@b71685a8d84a']))
          cmd={}
          for name in ['boot','dev01-tests','symbol-regression','diff-check']:
              cr=f'evidence/command-results/{rev}/{name}.json'
              item=evidence.register_evidence(TD,agent='DevelopAgent',evidence_type='command_ref',ref=cr,revision=rev,phase='development',scope_refs=['TASK-P2-DEV-01-R02-ORACLE-CLOSURE-CORRECTION','validation'],command_result_ref=cr)
              cmd[name]=item['evidence_id']
          payload={'evidence_ids':[x['evidence_id'] for x in refs],'command_ids':cmd}
          Path('/tmp/dev01-r02-evidence.json').write_text(json.dumps(payload))
          print(json.dumps(payload,indent=2))
          PY
          python3 /home/oai/skills/common-develop/scripts/evidence.py validate -g DevelopAgent --task-dir "$TDIR"

          python3 - <<'PY'
          import json,subprocess,os
          x=json.load(open('/tmp/dev01-r02-evidence.json'))
          args=['python3','/home/oai/skills/common-develop/scripts/long_task.py','finish-attempt','-g','DevelopAgent','--task-dir','project_doc/version/V_1.0/task/FEATURE-DESC-3361AD2E54FC','--attempt-id',os.environ['ATTEMPT'],'--status','PASSED','--output-revision',os.environ['DEVREV'],'--summary','DEV-01 R02 preserves R01 production behavior and passed -ar skeleton; fixes only test-oracle ownership and closure truthfulness. 14/14 methods GREEN, but deferred R32 oracles are explicitly not claimed closed.','--next-agent','ProjectManagerAgent','--modified-file','dec-core-compiler/src/test/java/dec/core/compiler/ruleview/RuleViewCompilationContractTest.java']
          for eid in x['command_ids'].values(): args += ['--command-ref',eid]
          for eid in x['evidence_ids']+list(x['command_ids'].values()): args += ['--evidence-ref',eid]
          subprocess.run(args,check=True)
          PY

          python3 - <<'PY'
          from pathlib import Path
          import sys,json,subprocess,os,re
          sys.path.insert(0,'/home/oai/skills/common-develop/scripts')
          import manual_review
          TD=Path('project_doc/version/V_1.0/task/FEATURE-DESC-3361AD2E54FC'); rev=os.environ['DEVREV']; x=json.load(open('/tmp/dev01-r02-evidence.json'))
          evid=x['evidence_ids']+list(x['command_ids'].values())
          reviewers=['SpecComplianceReviewAgent','EngineeringStandardsReviewAgent','ArchitectureReviewAgent']
          for i,reviewer in enumerate(reviewers,1):
              aid='ASRT-P2-DEV01-R02-'+re.sub(r'[^A-Z0-9]+','-',reviewer.upper()).strip('-')
              statement=('Independent '+reviewer+' review of exact '+rev+' confirms: R01 production behavior and the passed -ar skeleton are unchanged; 14 test methods remain GREEN; the ownership matrix no longer treats characterization/partial cases as exact R32 closure; DEV-04/DEV-02 are not started.')
              subprocess.run(['python3','/home/oai/skills/common-develop/scripts/acceptance.py','add','-g','ProjectManagerAgent','--task-dir',str(TD),'--assertion-id',aid,'--acceptance-id','AC-P2-SYSTEM-RULEVIEW-001','--statement',statement,'--type','MANUAL_REVIEW','--phase','development','--revision',rev,'--blocking','--parameters',json.dumps({'reviewer_agent':reviewer,'review_phase':'development'}),'--source-ref','TASK-P2-DEV-01-R02-ORACLE-CLOSURE-CORRECTION#expected_results/0'],check=True)
              ctx=manual_review.build_context(TD,aid)
              out=f'/tmp/dev01-r02-review-{i}.md'
              args=['python3','/home/oai/skills/common-develop/scripts/manual_review.py','draft','-g','ProjectManagerAgent','--task-dir',str(TD),'--assertion-id',aid,'--summary','PASSED: exact R02 corrects closure truthfulness without production changes or scope expansion.','--output',out]
              for q in ctx.questions:
                  args += ['--answer',q['question_id']+'=YES']
              for eid in evid:
                  args += ['--evidence-id',eid]
              subprocess.run(args,check=True)
              subprocess.run(['python3','/home/oai/skills/common-develop/scripts/manual_review.py','submit','-g',reviewer,'--task-dir',str(TD),'--review-file',out],check=True)
          PY

          python3 /home/oai/skills/common-develop/scripts/acceptance.py validate -g ProjectManagerAgent --task-dir "$TDIR"
          python3 /home/oai/skills/common-develop/scripts/evidence.py validate -g ProjectManagerAgent --task-dir "$TDIR"
          python3 /home/oai/skills/common-develop/scripts/long_task.py validate -g ProjectManagerAgent --task-dir "$TDIR"

          python3 - <<'PY'
          from pathlib import Path
          import json,os
          TD=Path('project_doc/version/V_1.0/task/FEATURE-DESC-3361AD2E54FC'); rev=os.environ['DEVREV']
          reviews=[]
          for line in (TD/'evidence/reviews.jsonl').read_text().splitlines():
              if not line.strip(): continue
              item=json.loads(line)
              if item.get('review_revision')==rev and item.get('reviewer') in {'SpecComplianceReviewAgent','EngineeringStandardsReviewAgent','ArchitectureReviewAgent'} and item.get('result')=='PASSED':
                  reviews.append(item['review_id'])
          assert len(set(reviews))==3, reviews
          summary={'schema_version':2,'developmentTaskStatus':'PARTIAL','dev01':'PASSED','dev01Revision':rev,'supersedesDev01Revision':'DEV-P2-DEV01-R01@1f85b2e6b265','remediationTask':'TASK-P2-DEV-01-R02-ORACLE-CLOSURE-CORRECTION','architectureSkeletonReused':'DEV-P2-DEV01-SKEL-R01@6250d4a5ee9f','architectureSkeletonReviewRefs':['REV-000075','REV-000076'],'productionFunctionalDiffFromR01':False,'executedTestMethods':14,'greenTestMethods':14,'exactOraclesClosedByDev01':7,'partialOracles':2,'characterizationOnly':5,'allR32OraclesClosed':False,'oracleOwnershipRef':'evidence/commands/dev01-r02-oracle-ownership.json','sameRevisionImplementationReviewRefs':sorted(set(reviews)),'remainingPassedDevelopmentTasks':[],'nextTask':'TASK-P2-DEV-04-CONTEXT-MATERIALIZATION','nextTaskStarted':False,'dev02Started':False,'formalDevelopmentCheckpoint':'DEFERRED_UNTIL_STAGE_OUTCOME_PASSED','phaseLevelFinalReview':'DEFERRED_UNTIL_ALL_DEVELOPMENT_SLICES_COMPLETE'}
          (TD/'evidence/commands/dev01-task-closure.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

          git diff --exit-code "$BASE" -- "$BUILDER"
          if git diff --name-only "$BASE" -- | grep -E '^dec-core-(context|compiler|model|starter|demo)/src/main/'; then
            echo 'Unexpected production source diff in final R02' >&2
            exit 1
          fi
          git diff --check
