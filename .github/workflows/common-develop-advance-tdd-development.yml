name: common-develop advance TDD to Development

on:
  push:
    branches:
      - common-develop/advance-tdd-development-20260811-2320

permissions:
  contents: write

jobs:
  advance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR36 head
        uses: actions/checkout@v4
        with:
          ref: feature/p2-design-testdesign-20260808
          fetch-depth: 0

      - name: Guard target head and branch
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_HEAD="2a79456c4fa93f07a34e225c3fe99ae97ae8860a"
          git fetch --no-tags origin refs/heads/feature/p2-design-testdesign-20260808
          git checkout -B feature/p2-design-testdesign-20260808 origin/feature/p2-design-testdesign-20260808
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git symbolic-ref --quiet --short HEAD)" = "feature/p2-design-testdesign-20260808"

      - name: Load exact common-develop RC9 runtime
        shell: bash
        run: |
          set -euo pipefail
          git clone https://gitee.com/szlwin/common-develop.git /tmp/common-develop
          git -C /tmp/common-develop checkout --detach 7086b2d32b6beae2e6e522efc517d7823ba55376
          test "$(git -C /tmp/common-develop rev-parse HEAD)" = "7086b2d32b6beae2e6e522efc517d7823ba55376"
          echo '1f380e745df43685205efe74e3bc202a5319923ec4b40fea58b3b47d2e01aa06  /tmp/common-develop/scripts/long_task.py' | sha256sum -c -
          echo 'e3877c570f910af66a0240baa5337a94afae2aca2695e9cd12ce9a4a86e9a4fd  /tmp/common-develop/scripts/git_checkpoint.py' | sha256sum -c -
          echo '17224132b9159c982d17d299d67ad7041e2c670626e771db7d86dacc866f18ca  /tmp/common-develop/scripts/work_mode.py' | sha256sum -c -
          echo '120d32a545509c5cb51c076789d5896b15ff15c3a034b944a5d2f8d982d04adb  /tmp/common-develop/assets/runtime-contract.json' | sha256sum -c -
          echo '6cbaba210c3b1b9d226f6dc09342900dfcc44fe51bbbfcb4a76b2185d1771558  /tmp/common-develop/assets/review-contract.json' | sha256sum -c -
          echo 'd446168daa613154804275720883bb8acbfb310acfcecbadf61a0d640891ce5a  /tmp/common-develop/assets/long-task/record-contract.json' | sha256sum -c -

      - name: Validate and formally advance lifecycle
        shell: bash
        run: |
          set -euo pipefail
          TASK_DIR="project_doc/version/V_1.0/task/FEATURE-DESC-3361AD2E54FC"
          python3 /tmp/common-develop/scripts/long_task.py validate -g ProjectManagerAgent --task-dir "$TASK_DIR" --json | tee /tmp/pre-validate.json
          python3 /tmp/common-develop/scripts/long_task.py advance-phase -g ProjectManagerAgent --task-dir "$TASK_DIR" | tee /tmp/advance.json
          python3 /tmp/common-develop/scripts/long_task.py validate -g ProjectManagerAgent --task-dir "$TASK_DIR" --json | tee /tmp/post-validate.json
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          p = Path('project_doc/version/V_1.0/task/FEATURE-DESC-3361AD2E54FC/task_state.md')
          text = p.read_text(encoding='utf-8')
          m = re.search(r'```json\s+task-state\s*\n(.*?)\n```', text, re.S)
          assert m, 'task-state block missing'
          state = json.loads(m.group(1))
          assert state['current_phase'] == 'development', state['current_phase']
          assert state['current_round'] == 'DEVELOPMENT-I008', state['current_round']
          assert state['last_gate'] == 'tdd', state.get('last_gate')
          assert state['artifact_revisions']['tdd']['revision'] == 'TDD-P2-R01@3f282bb4e1f6'
          assert state['artifact_revisions']['tdd']['status'] == 'PASSED'
          assert state['artifact_revisions']['development']['status'] == 'STALE'
          assert state['architecture_review']['step'] == 'SKELETON'
          assert state['next_agent'] == 'DevelopAgent'
          assert state['next_action'] == '开始 development 阶段'
          print(json.dumps({
              'current_phase': state['current_phase'],
              'current_round': state['current_round'],
              'last_gate': state['last_gate'],
              'next_agent': state['next_agent'],
              'next_action': state['next_action'],
              'development_iteration': state['artifact_revisions']['development']['iteration_id'],
              'architecture_review_step': state['architecture_review']['step'],
          }, ensure_ascii=False, indent=2))
          PY
          CHANGED="$(git diff --name-only)"
          printf '%s\n' "$CHANGED"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              project_doc/version/V_1.0/task/FEATURE-DESC-3361AD2E54FC/task_state.md|project_doc/version/V_1.0/task/FEATURE-DESC-3361AD2E54FC/task_plan.md) ;;
              *) echo "Unexpected changed path: $path" >&2; exit 1 ;;
            esac
          done <<< "$CHANGED"

      - name: Commit transition and fast-forward PR36 branch
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_HEAD="2a79456c4fa93f07a34e225c3fe99ae97ae8860a"
          TARGET_BRANCH="feature/p2-design-testdesign-20260808"
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$REMOTE_HEAD" = "$EXPECTED_HEAD"
          git config user.name "common-develop ProjectManagerAgent"
          git config user.email "common-develop@users.noreply.github.com"
          git add -- \
            project_doc/version/V_1.0/task/FEATURE-DESC-3361AD2E54FC/task_state.md \
            project_doc/version/V_1.0/task/FEATURE-DESC-3361AD2E54FC/task_plan.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No transition changes to commit" >&2
            exit 1
          fi
          git commit -m "chore(p2): advance TDD to Development" \
            -m "Run common-develop RC9 advance-phase from TDD-I008 to DEVELOPMENT-I008." \
            -m "TDD gate: TDD-P2-R01@3f282bb4e1f6" \
            -m "WK-Transition: tdd->development"
          NEW_SHA="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "NEW_SHA=$NEW_SHA" >> "$GITHUB_ENV"
          echo "Published $NEW_SHA"
