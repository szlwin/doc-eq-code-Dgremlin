name: P0 Build Gate

"on":
  workflow_dispatch:
  push:
    branches: [dev_all]
  pull_request:
    branches: [dev_all]

permissions:
  contents: read

jobs:
  core-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify Maven Wrapper
        run: ./mvnw --version
      - name: Bootstrap repository-bundled legacy dependencies
        run: scripts/remediation/bootstrap_legacy_dependencies.sh
      - name: Core build and tests
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Prove failing tests block the build
        run: scripts/remediation/prove_test_failure_gate.sh
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: surefire-and-jacoco-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/site/jacoco/**
          if-no-files-found: warn

  mysql-it:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: demo_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: scripts/remediation/bootstrap_legacy_dependencies.sh
      - run: ./mvnw --batch-mode --no-transfer-progress -Pmysql-it verify
        env:
          DEC_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/demo_test
          DEC_MYSQL_USER: root
          DEC_MYSQL_PASSWORD: root
