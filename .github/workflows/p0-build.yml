name: P0 Build Gate

"on":
  workflow_dispatch:
  push:
    branches: [dev_all]
  pull_request:
    branches: [dev_all]

permissions:
  contents: read

jobs:
  core-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Export source snapshot for stage closure development
        run: tar --exclude=.git --exclude='*/target' -czf /tmp/source-snapshot.tar.gz .

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify Maven Wrapper
        run: ./mvnw --version

      - name: Bootstrap repository-bundled legacy dependencies
        run: scripts/remediation/bootstrap_legacy_dependencies.sh
      - name: Core build and tests
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Prove T14 provenance mutation gate
        run: sh scripts/remediation/prove_t14_provenance_mutation_gate.sh
      - name: Prove failing tests block the build
        run: scripts/remediation/prove_test_failure_gate.sh
      - name: Prove T15 declaration runtime retirement
        run: sh scripts/remediation/prove_p1_t15_retirement_gate.sh
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: surefire-and-jacoco-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/site/jacoco/**
            **/target/t14-mutation-proof/**
            target/p1-t15-retirement/**
            /tmp/source-snapshot.tar.gz
          if-no-files-found: warn

  mysql-it:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: mysqldb
          MYSQL_DATABASE: demo-test2
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pmysqldb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Bootstrap repository-bundled legacy dependencies
        run: scripts/remediation/bootstrap_legacy_dependencies.sh

      - name: Initialize MySQL schema
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
          MYSQL_TEST_PASSWORD: mysqldb
        run: |
          test -f dec-demo/src/test/resources/mysql/schema.sql

          docker exec \
            -e MYSQL_PWD="$MYSQL_TEST_PASSWORD" \
            -i "$MYSQL_CONTAINER_ID" \
            mysql \
            -uroot \
            --database='demo-test2' \
            < dec-demo/src/test/resources/mysql/schema.sql

      - name: Initialize MySQL test data
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
          MYSQL_TEST_PASSWORD: mysqldb
        run: |
          if [ -f dec-demo/src/test/resources/mysql/data.sql ]; then
            docker exec \
              -e MYSQL_PWD="$MYSQL_TEST_PASSWORD" \
              -i "$MYSQL_CONTAINER_ID" \
              mysql \
              -uroot \
              --database='demo-test2' \
              < dec-demo/src/test/resources/mysql/data.sql
          fi

      - name: Verify MySQL schema
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
          MYSQL_TEST_PASSWORD: mysqldb
        run: |
          docker exec \
            -e MYSQL_PWD="$MYSQL_TEST_PASSWORD" \
            "$MYSQL_CONTAINER_ID" \
            mysql \
            -uroot \
            --database='demo-test2' \
            -e "
              SELECT DATABASE();
              SHOW TABLES;
              SHOW TABLES LIKE 'order_info';
            "

      - name: Run MySQL integration tests
        run: ./mvnw --batch-mode --no-transfer-progress -Pmysql-it verify
        env:
          DEC_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/demo-test2
          DEC_MYSQL_USER: root
          DEC_MYSQL_PASSWORD: mysqldb
