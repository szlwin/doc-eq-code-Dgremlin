name: P2 temporary exact checkpoint transport

on:
  pull_request:
    branches:
      - agent/p2-gp-base-20260818-1638
    paths:
      - '.common-develop-publish/**'

permissions:
  contents: write
  pull-requests: read

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Verify manifest, bundle and fast-forward PR36 branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          ALLOWED_TARGET_BRANCH: feature/p2-design-testdesign-20260808
        run: |
          set -euo pipefail
          git init /tmp/p2-gp-transport
          cd /tmp/p2-gp-transport
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin "+refs/heads/${HEAD_REF}:refs/remotes/origin/payload"
          git checkout --detach refs/remotes/origin/payload
          MANIFEST=.common-develop-publish/manifest.json
          test -f "$MANIFEST"
          TARGET_BRANCH="$(jq -r '.targetBranch' "$MANIFEST")"
          EXPECTED_PARENT="$(jq -r '.expectedParent' "$MANIFEST")"
          TARGET_SHA="$(jq -r '.targetSha' "$MANIFEST")"
          TARGET_TREE="$(jq -r '.targetTree' "$MANIFEST")"
          BUNDLE_SHA256="$(jq -r '.bundleSha256' "$MANIFEST")"
          BUNDLE_XZ_SHA256="$(jq -r '.bundleXzSha256' "$MANIFEST")"
          CHECKPOINT="$(jq -r '.checkpoint' "$MANIFEST")"
          REVISION="$(jq -r '.revision' "$MANIFEST")"
          test "$TARGET_BRANCH" = "$ALLOWED_TARGET_BRANCH"
          test -n "$EXPECTED_PARENT" && test -n "$TARGET_SHA" && test -n "$TARGET_TREE"
          test -n "$CHECKPOINT" && test -n "$REVISION"
          git fetch --no-tags origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/target"
          CURRENT_SHA="$(git rev-parse refs/remotes/origin/target)"
          test "$CURRENT_SHA" = "$EXPECTED_PARENT"
          if test -f .common-develop-publish/checkpoint.bundle.xz; then
            cp .common-develop-publish/checkpoint.bundle.xz /tmp/checkpoint.bundle.xz
          else
            cat .common-develop-publish/checkpoint.bundle.xz.b64.part.* | tr -cd 'A-Za-z0-9+/=' > /tmp/checkpoint.bundle.xz.b64
            base64 -d /tmp/checkpoint.bundle.xz.b64 > /tmp/checkpoint.bundle.xz
          fi
          test "$(sha256sum /tmp/checkpoint.bundle.xz | awk '{print $1}')" = "$BUNDLE_XZ_SHA256"
          xz -dc /tmp/checkpoint.bundle.xz > /tmp/checkpoint.bundle
          test "$(sha256sum /tmp/checkpoint.bundle | awk '{print $1}')" = "$BUNDLE_SHA256"
          git bundle verify /tmp/checkpoint.bundle
          git fetch /tmp/checkpoint.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse "${TARGET_SHA}^")" = "$EXPECTED_PARENT"
          test "$(git rev-parse "${TARGET_SHA}^{tree}")" = "$TARGET_TREE"
          git show -s --format=%B "$TARGET_SHA" | grep -F "WK-Checkpoint: $CHECKPOINT"
          git show -s --format=%B "$TARGET_SHA" | grep -F "WK-Revision: $REVISION"
          git merge-base --is-ancestor "$CURRENT_SHA" "$TARGET_SHA"
          git push origin "$TARGET_SHA:refs/heads/$TARGET_BRANCH"
          REMOTE_SHA="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$REMOTE_SHA" = "$TARGET_SHA"
