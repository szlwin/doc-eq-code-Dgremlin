name: T13 RED Materialize

on:
  push:
    branches:
      - feature/p1-t13-semantic-digest-20260805-2005
    paths:
      - .github/workflows/t13-red-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/p1-t13-semantic-digest-20260805-2005
          fetch-depth: 0
      - name: Materialize valid RED tests
        shell: bash
        run: |
          echo '' | base64 -d | tar -xzf -
          git rm .github/workflows/t13-export.yml
          git rm .github/workflows/t13-red-materialize.yml
          git config user.name "szlwin"
          git config user.email "szlwin@163.com"
          git add dec-core-compiler/src/test/java/dec/core/compiler/compiled/SemanticDigestDeterminismTest.java
          git add dec-core-compiler/src/test/java/dec/core/compiler/pass/CompilationObserverTest.java
          git add dec-core-compiler/src/test/java/dec/core/compiler/pass/CompilationDeadlineTest.java
          git commit -m "test(compiler): add T13 deterministic digest RED"
          git push origin HEAD:feature/p1-t13-semantic-digest-20260805-2005
