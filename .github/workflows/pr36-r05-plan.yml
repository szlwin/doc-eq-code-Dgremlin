name: PR36 R05 plan rebind
on:
  push:
    branches:
      - feature/p2-design-testdesign-20260808
permissions:
  contents: write
jobs:
  plan:
    if: contains(github.event.head_commit.message, '[r05-plan-run]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build, review and finalize R05
        shell: bash
        run: bash .common-develop-r05-plan.sh
