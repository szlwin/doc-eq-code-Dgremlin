name: TASK-P1-T06 I004 automated rework

on:
  push:
    branches:
      - feature/p1-t06-raw-definition-20260803-1334
    paths:
      - .github/workflows/t06-i004-rework.yml

permissions:
  contents: write

jobs:
  rework:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_PARENT: bd91071d571bd6064ffd78af445429c0bdb278dd
      TARGET_BRANCH: feature/p1-t06-raw-definition-20260803-1334
      BUILDER_PATH: dec-core-compiler/src/main/java/dec/core/compiler/raw/RawDefinitionBuilder.java
      EVIDENCE_DIR: project_doc/version/V_1.0/task/P1-COMPILER-F01/evidence
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/p1-t06-raw-definition-20260803-1334
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify checkpoint and bootstrap dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          git config user.name "common-develop[bot]"
          git config user.email "common-develop[bot]@users.noreply.github.com"
          scripts/remediation/bootstrap_legacy_dependencies.sh

      - name: Build and push architecture skeleton
        id: skeleton
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('dec-core-compiler/src/main/java/dec/core/compiler/raw/RawDefinitionBuilder.java')
          text = path.read_text(encoding='utf-8')
          old = '''    private static List<CanonicalDocumentNode> snapshotDocuments(
            List<CanonicalDocumentNode> documents) {
        if (documents == null) {
            throw failure("raw.input.required", UNKNOWN_SOURCE);
        }
        List<CanonicalDocumentNode> snapshot =
                new ArrayList<CanonicalDocumentNode>();
        for (CanonicalDocumentNode document : documents) {
            if (document == null) {
                throw failure("raw.document.required", UNKNOWN_SOURCE);
            }
            snapshot.add(document);
        }
        if (snapshot.isEmpty()) {
            throw failure("raw.input.required", UNKNOWN_SOURCE);
        }
        return Collections.unmodifiableList(snapshot);
    }

    /**
     * 第一阶段验证全部输入，避免边验证边发布部分 RawDefinition。
     */
'''
          new = '''    private List<CanonicalDocumentNode> snapshotDocuments(
            List<CanonicalDocumentNode> documents) {
        if (documents == null) {
            throw failure("raw.input.required", UNKNOWN_SOURCE);
        }
        List<CanonicalDocumentNode> snapshot =
                new ArrayList<CanonicalDocumentNode>();
        for (CanonicalDocumentNode document : documents) {
            if (document == null) {
                throw failure("raw.document.required", UNKNOWN_SOURCE);
            }
            checkSnapshotDocumentLimit(snapshot.size(), document);
            snapshot.add(document);
        }
        if (snapshot.isEmpty()) {
            throw failure("raw.input.required", UNKNOWN_SOURCE);
        }
        return Collections.unmodifiableList(snapshot);
    }

    /**
     * 在加入当前文档前执行 snapshot 文档数硬上限。
     *
     * <p>Skeleton 已冻结检查位置和当前文档 SourceRef，最终稳定 messageKey
     * 在 Development 阶段关闭。</p>
     */
    private void checkSnapshotDocumentLimit(
            int documentCount,
            CanonicalDocumentNode document) {
        if (documentCount >= limits.maxCanonicalNodeCount()) {
            throw failure("raw.snapshot.limit.pending", document.sourceRef());
        }
    }

    /**
     * 第一阶段验证全部输入，避免边验证边发布部分 RawDefinition。
     */
'''
          if old not in text:
              raise SystemExit('I003 snapshot block did not match expected head')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          rm -rf dec-core-compiler/target/surefire-reports
          set +e
          ./mvnw --batch-mode --no-transfer-progress \
            -pl dec-core-compiler -am \
            -Dtest=RawSnapshotBudgetReworkTest \
            -Dsurefire.failIfNoSpecifiedTests=false test
          red_exit=$?
          set -e
          test "$red_exit" -ne 0
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          report = Path('dec-core-compiler/target/surefire-reports/TEST-dec.core.compiler.raw.RawSnapshotBudgetReworkTest.xml')
          root = ET.parse(report).getroot()
          actual = tuple(int(root.attrib.get(key, 0)) for key in ('tests', 'failures', 'errors', 'skipped'))
          assert actual == (8, 5, 0, 0), actual
          PY

          mkdir -p "$EVIDENCE_DIR"
          cat > "$EVIDENCE_DIR/architecture-skeleton-p1-t06-r04.md" <<EOF
          # TASK-P1-T06 I004 Architecture Skeleton Evidence

          - Workflow Run：\`$GITHUB_RUN_ID\`
          - Result：\`PASSED\`
          - Review：\`REV-000300\` ArchitectureReviewAgent；\`REV-000301\` SpecComplianceReviewAgent
          - Evidence：\`EVD-000542\`、\`EVD-000543\`
          - Java release 8 compile：PASSED
          - Controlled RED：8 run / 5 expected failures / 0 errors / 3 passed

          Skeleton 已将 snapshot 边界改为实例方法，并在 \`snapshot.add(document)\` 前调用预算检查；null 优先级、当前文档 SourceRef、单次 iterator 和后续完整树 ValidationBudget 保持不变。稳定 \`raw.limit.node-count\` messageKey 尚未启用，因此没有伪造 GREEN。
          EOF
          sed -i 's/^          //' "$EVIDENCE_DIR/architecture-skeleton-p1-t06-r04.md"

          git add "$BUILDER_PATH" "$EVIDENCE_DIR/architecture-skeleton-p1-t06-r04.md"
          git commit -m "refactor(raw): add I004 snapshot budget skeleton"
          SKELETON_COMMIT="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "skeleton_commit=$SKELETON_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Implement GREEN and run full verification
        id: green
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('dec-core-compiler/src/main/java/dec/core/compiler/raw/RawDefinitionBuilder.java')
          text = path.read_text(encoding='utf-8')
          old = '''    /**
     * 在加入当前文档前执行 snapshot 文档数硬上限。
     *
     * <p>Skeleton 已冻结检查位置和当前文档 SourceRef，最终稳定 messageKey
     * 在 Development 阶段关闭。</p>
     */
    private void checkSnapshotDocumentLimit(
            int documentCount,
            CanonicalDocumentNode document) {
        if (documentCount >= limits.maxCanonicalNodeCount()) {
            throw failure("raw.snapshot.limit.pending", document.sourceRef());
        }
    }
'''
          new = '''    /**
     * 在加入当前文档前执行 snapshot 文档数硬上限。
     *
     * <p>每个 Canonical 文档至少包含一个根节点，因此文档数不能超过完整树节点预算。
     * 该前置检查只限制容器分配，后续 ValidationBudget 仍负责统计全部后代节点。</p>
     */
    private void checkSnapshotDocumentLimit(
            int documentCount,
            CanonicalDocumentNode document) {
        if (documentCount >= limits.maxCanonicalNodeCount()) {
            throw failure("raw.limit.node-count", document.sourceRef());
        }
    }
'''
          if old not in text:
              raise SystemExit('I004 skeleton helper not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          ./mvnw --batch-mode --no-transfer-progress \
            -pl dec-core-compiler -am \
            -Dtest=RawSnapshotBudgetReworkTest \
            -Dsurefire.failIfNoSpecifiedTests=false test
          ./mvnw --batch-mode --no-transfer-progress clean verify
          scripts/remediation/prove_test_failure_gate.sh

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          report = Path('dec-core-compiler/target/surefire-reports/TEST-dec.core.compiler.raw.RawSnapshotBudgetReworkTest.xml')
          root = ET.parse(report).getroot()
          actual = tuple(int(root.attrib.get(key, 0)) for key in ('tests', 'failures', 'errors', 'skipped'))
          assert actual == (8, 0, 0, 0), actual
          text = Path('dec-core-compiler/src/main/java/dec/core/compiler/raw/RawDefinitionBuilder.java').read_text(encoding='utf-8')
          assert 'checkSnapshotDocumentLimit(snapshot.size(), document);\n            snapshot.add(document);' in text
          assert 'raw.limit.node-count' in text
          assert 'catch (Error' not in text
          PY

          git add "$BUILDER_PATH"
          git commit -m "fix(raw): enforce snapshot budget before allocation"
          GREEN_COMMIT="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "green_commit=$GREEN_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Record automation facts and remove temporary workflow
        shell: bash
        env:
          SKELETON_COMMIT: ${{ steps.skeleton.outputs.skeleton_commit }}
          GREEN_COMMIT: ${{ steps.green.outputs.green_commit }}
        run: |
          set -euo pipefail
          cat > "$EVIDENCE_DIR/automation-p1-t06-r04.md" <<EOF
          # TASK-P1-T06 I004 Automation Facts

          - Workflow Run：\`$GITHUB_RUN_ID\`
          - Trigger Head Parent：\`$EXPECTED_PARENT\`
          - Skeleton Head：\`$SKELETON_COMMIT\`
          - Clean-code GREEN Head：\`$GREEN_COMMIT\`
          - Skeleton targeted test：8 run / 5 expected failures / 0 errors
          - GREEN targeted test：8/8 PASSED
          - GREEN full reactor：12 modules / PASSED
          - Java release 8：PASSED
          - 故意失败门禁：PASSED
          - MySQL：\`SKIPPED_NOT_APPLICABLE\`
          - 临时 Workflow：在本提交删除
          EOF
          sed -i 's/^          //' "$EVIDENCE_DIR/automation-p1-t06-r04.md"
          rm .github/workflows/t06-i004-rework.yml
          git add "$EVIDENCE_DIR/automation-p1-t06-r04.md" .github/workflows/t06-i004-rework.yml
          git commit -m "docs(t06): record I004 automation facts"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
