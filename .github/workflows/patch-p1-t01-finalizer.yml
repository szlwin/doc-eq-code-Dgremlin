name: Patch P1 T01 Finalizer

"on":
  pull_request:
    branches:
      - dev_all
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feature/p1-t01-tdd-red-i007-20260801-1122'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v6
        with:
          ref: feature/p1-t01-tdd-red-i007-20260801-1122
          fetch-depth: 0

      - name: Accept RC8 id and task_id fields
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/finalize-p1-t01-tdd.yml')
          text = path.read_text(encoding='utf-8')
          old = "t01 = next((x for x in task_rows if x.get('task_id') == 'TASK-P1-T01'), None)"
          new = "t01 = next((x for x in task_rows if (x.get('id') or x.get('task_id')) == 'TASK-P1-T01'), None)"
          if old not in text:
              if new not in text:
                  raise SystemExit('expected finalizer task lookup was not found')
          else:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/patch-p1-t01-finalizer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/finalize-p1-t01-tdd.yml
          git diff --cached --check
          git commit -m 'fix: accept RC8 task id field in TDD finalizer'
          git push origin HEAD:feature/p1-t01-tdd-red-i007-20260801-1122
