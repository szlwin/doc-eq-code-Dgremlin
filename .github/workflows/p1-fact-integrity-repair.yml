name: P1 Fact Integrity Repair

on:
  push:
    branches:
      - agent/p1-fact-integrity-repair-20260731-1940
    paths:
      - .github/workflows/p1-fact-integrity-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Repair work record and validate project facts
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import pathlib
          import re

          root = pathlib.Path('.')
          work_record = root / 'project_doc/version/V_1.0/work_record.md'
          text = work_record.read_text(encoding='utf-8')

          corrupted = '''| 测试与验证 | 登记 Evidence 1 项；命令 Evidence 1 项 |
          =======
          | 测试与验证 | 共享 digest、38 个稳定锚点、23 个 BM-R04 错误映射、Information 合同 5/5、20 份 XML、Evidence、Acceptance、Long Task 全部 PASSED；开放 P0/P1 为 0。 |
          >>>>>>> 67fd301d3dd5a59c229337e3d05bd4b05d9984cf'''
          repaired = '| 测试与验证 | 登记 Evidence 1 项；命令 Evidence 1 项 |'

          if text.count(corrupted) != 1:
              raise SystemExit('expected exactly one known work_record conflict block')

          work_record.write_text(text.replace(corrupted, repaired), encoding='utf-8')

          def fenced_json(path: pathlib.Path, fence: str):
              content = path.read_text(encoding='utf-8')
              match = re.search(rf'```json {re.escape(fence)}\s*(.*?)\s*```', content, re.S)
              if not match:
                  raise SystemExit(f'missing {fence} JSON fence in {path}')
              return json.loads(match.group(1))

          task_dir = root / 'project_doc/version/V_1.0/task/P1-COMPILER-F01'
          task_plan = fenced_json(task_dir / 'task_plan.md', 'task-plan')
          task_state = fenced_json(task_dir / 'task_state.md', 'task-state')
          review_issues = fenced_json(task_dir / 'review_issues.md', 'review-issues')

          task_by_id = {item['id']: item for item in task_plan}
          test_design = task_by_id['TASK-P1-R2-005']
          implementation_plan = task_by_id['TASK-P1-R2-006']

          assert test_design['iteration_id'] == 'ITER-P1-COMPILER-F01-TEST-DESIGN-007'
          assert test_design['status'] == 'TODO'
          assert test_design['input_revisions']['design'] == 'DESIGN-R05@0b37a9b4dd48'
          assert implementation_plan['depends_on'] == ['TASK-P1-R2-005']
          assert task_state['current_phase'] == 'test_design'
          assert task_state['artifact_revisions']['design']['status'] == 'PASSED'
          assert task_state['artifact_revisions']['design']['revision'] == 'DESIGN-R05@0b37a9b4dd48'
          assert task_state['open_issue_ids'] == []
          assert all(issue['status'] == 'CLOSED' for issue in review_issues)

          conflict_pattern = re.compile(r'^(<<<<<<<|=======|>>>>>>>)(?:\s|$)', re.M)
          conflicts = []
          for path in (root / 'project_doc').rglob('*'):
              if not path.is_file() or path.suffix.lower() in {'.xz', '.zip', '.gz', '.png', '.jpg', '.jpeg'}:
                  continue
              try:
                  candidate = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if conflict_pattern.search(candidate):
                  conflicts.append(str(path))

          if conflicts:
              raise SystemExit('remaining conflict markers: ' + ', '.join(conflicts))
          PY

      - name: Remove one-time workflow and commit repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/p1-fact-integrity-repair.yml

          git config user.name "common-develop ProjectManagerAgent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project_doc/version/V_1.0/work_record.md .github/workflows/p1-fact-integrity-repair.yml

          if git diff --cached --quiet; then
            echo "No repair changes were produced."
            exit 1
          fi

          git commit -m "docs: repair P1 work record integrity"
          git push origin HEAD:agent/p1-fact-integrity-repair-20260731-1940
