name: Temporary P2 Business Model Rework

on:
  push:
    branches:
      - tmp/p2-business-model-rework-run-20260808
    paths:
      - .github/workflows/_temp-p2-business-model-rework.yml

permissions:
  contents: write

jobs:
  rework:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v6
        with:
          ref: tmp/p2-business-model-rework-run-20260808
          fetch-depth: 1

      - name: Preserve runners and verified RC9 delta
        shell: bash
        run: |
          set -euo pipefail
          cp tools/_temp_p2_bm_rework.py /tmp/p2_bm_rework.py
          cp tools/_temp_p2_evidence_gitref_repair.py /tmp/p2_evidence_gitref_repair.py
          cp .common-develop-rc9/rc8-to-rc9.patch.xz.b64 /tmp/rc8-to-rc9.patch.xz.b64

      - name: Checkout formal rework branch
        uses: actions/checkout@v6
        with:
          ref: rework/p2-business-model-readability-20260808
          fetch-depth: 0
          clean: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check jsonschema PyYAML ruamel.yaml

      - name: Install common-develop 2.44 RC9 from verified RC8 delta
        shell: bash
        run: |
          set -euo pipefail
          RC8=4787876e135d347e9f37580910e2d28b09ea2ba4
          RC9=48d7804b394ca2fb4a533af4b842889419b14c38
          RC9_TREE=d001cd84a86c28f027eaed4e3b328a98b2688aef
          PATCH_SHA=ba5c20ffbc759373b0cf6a7c5621f71748c420c8fabf90e9c0c04289865c7891

          git clone https://gitee.com/szlwin/common-develop.git /tmp/common-develop
          git -C /tmp/common-develop cat-file -e "$RC8^{commit}"
          git -C /tmp/common-develop checkout --detach "$RC8"
          test "$(git -C /tmp/common-develop rev-parse HEAD)" = "$RC8"

          base64 -d /tmp/rc8-to-rc9.patch.xz.b64 > /tmp/rc8-to-rc9.patch.xz
          echo "$PATCH_SHA  /tmp/rc8-to-rc9.patch.xz" | sha256sum -c -
          xz -dc /tmp/rc8-to-rc9.patch.xz > /tmp/rc8-to-rc9.patch
          git -C /tmp/common-develop apply --binary /tmp/rc8-to-rc9.patch
          git -C /tmp/common-develop add -A
          test "$(git -C /tmp/common-develop write-tree)" = "$RC9_TREE"

          export GIT_AUTHOR_NAME='Common Develop Maintainer'
          export GIT_AUTHOR_EMAIL='common-develop@local.invalid'
          export GIT_AUTHOR_DATE='2026-08-07T08:48:48Z'
          export GIT_COMMITTER_NAME='Common Develop Maintainer'
          export GIT_COMMITTER_EMAIL='common-develop@local.invalid'
          export GIT_COMMITTER_DATE='2026-08-07T08:48:48Z'
          COMMIT=$(printf '%s\n' 'fix(long-task): close reopen lifecycle gaps' | git -C /tmp/common-develop commit-tree "$RC9_TREE" -p "$RC8")
          test "$COMMIT" = "$RC9"
          git -C /tmp/common-develop reset --hard "$RC9"
          git -C /tmp/common-develop tag -f common-develop-v2.44-rc9 "$RC9"

          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/common-develop/assets/release-contract.json')
          d=json.loads(p.read_text())
          assert d['packageVersion']=='2.44'
          assert d['releaseStage']=='RC9'
          assert d['baselineTag']=='common-develop-v2.44-rc9'
          PY

          sudo mkdir -p /home/oai/skills /home/oai/.codex/skills
          sudo ln -sfn /tmp/common-develop /home/oai/skills/common-develop
          sudo ln -sfn /tmp/common-develop /home/oai/.codex/skills/common-develop
          python3 /home/oai/skills/common-develop/scripts/baseline_guard.py -g ProjectManagerAgent status --require-clean --json

      - name: Repair PR34 flattened checkpoint GIT_REF evidence
        run: python3 /tmp/p2_evidence_gitref_repair.py

      - name: Execute controlled BM rework
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/Y.width = 120/Y.width = 1000000/' /tmp/p2_bm_rework.py
          export EXPECTED_BASE="$(git rev-parse HEAD)"
          python3 /tmp/p2_bm_rework.py
