name: Temporary P2 Business Model Rework

on:
  push:
    branches:
      - tmp/p2-business-model-rework-run-20260808
    paths:
      - .github/workflows/_temp-p2-business-model-rework.yml

permissions:
  contents: write

jobs:
  rework:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v6
        with:
          ref: tmp/p2-business-model-rework-run-20260808
          fetch-depth: 1

      - name: Preserve runners and verified RC9 delta
        shell: bash
        run: |
          set -euo pipefail
          cp tools/_temp_p2_bm_rework.py /tmp/p2_bm_rework.py
          cp tools/_temp_p2_evidence_gitref_repair.py /tmp/p2_evidence_gitref_repair.py
          cp .common-develop-rc9/rc8-to-rc9.patch.xz.b64 /tmp/rc8-to-rc9.patch.xz.b64

      - name: Checkout formal rework branch
        uses: actions/checkout@v6
        with:
          ref: rework/p2-business-model-readability-20260808
          fetch-depth: 0
          clean: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check jsonschema PyYAML ruamel.yaml

      - name: Install common-develop 2.44 RC9 from verified RC8 delta
        shell: bash
        run: |
          set -euo pipefail
          RC8=4787876e135d347e9f37580910e2d28b09ea2ba4
          RC9=48d7804b394ca2fb4a533af4b842889419b14c38
          RC9_TREE=d001cd84a86c28f027eaed4e3b328a98b2688aef
          PATCH_SHA=ba5c20ffbc759373b0cf6a7c5621f71748c420c8fabf90e9c0c04289865c7891

          git clone https://gitee.com/szlwin/common-develop.git /tmp/common-develop
          git -C /tmp/common-develop cat-file -e "$RC8^{commit}"
          git -C /tmp/common-develop checkout --detach "$RC8"
          test "$(git -C /tmp/common-develop rev-parse HEAD)" = "$RC8"

          base64 -d /tmp/rc8-to-rc9.patch.xz.b64 > /tmp/rc8-to-rc9.patch.xz
          echo "$PATCH_SHA  /tmp/rc8-to-rc9.patch.xz" | sha256sum -c -
          xz -dc /tmp/rc8-to-rc9.patch.xz > /tmp/rc8-to-rc9.patch
          git -C /tmp/common-develop apply --binary /tmp/rc8-to-rc9.patch
          git -C /tmp/common-develop add -A
          test "$(git -C /tmp/common-develop write-tree)" = "$RC9_TREE"

          export GIT_AUTHOR_NAME='Common Develop Maintainer'
          export GIT_AUTHOR_EMAIL='common-develop@local.invalid'
          export GIT_AUTHOR_DATE='2026-08-07T08:48:48Z'
          export GIT_COMMITTER_NAME='Common Develop Maintainer'
          export GIT_COMMITTER_EMAIL='common-develop@local.invalid'
          export GIT_COMMITTER_DATE='2026-08-07T08:48:48Z'
          COMMIT=$(printf '%s\n' 'fix(long-task): close reopen lifecycle gaps' | git -C /tmp/common-develop commit-tree "$RC9_TREE" -p "$RC8")
          test "$COMMIT" = "$RC9"
          git -C /tmp/common-develop reset --hard "$RC9"
          git -C /tmp/common-develop tag -f common-develop-v2.44-rc9 "$RC9"

          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/common-develop/assets/release-contract.json')
          d=json.loads(p.read_text())
          assert d['packageVersion']=='2.44'
          assert d['releaseStage']=='RC9'
          assert d['baselineTag']=='common-develop-v2.44-rc9'
          PY

          sudo mkdir -p /home/oai/skills /home/oai/.codex/skills
          sudo ln -sfn /tmp/common-develop /home/oai/skills/common-develop
          sudo ln -sfn /tmp/common-develop /home/oai/.codex/skills/common-develop
          python3 /home/oai/skills/common-develop/scripts/baseline_guard.py -g ProjectManagerAgent status --require-clean --json

      - name: Repair PR34 flattened checkpoint GIT_REF evidence
        run: python3 /tmp/p2_evidence_gitref_repair.py

      - name: Execute controlled BM rework
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/p2_bm_rework.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Y.width = 120', 'Y.width = 1000000')
          replacements = {
              "f'python3 -m jsonschema -i {BM.as_posix()} /home/oai/skills/common-develop/assets/structured-docs/business-model.schema.json'": "f'''python3 -c \"import json,pathlib,yaml,jsonschema; data=yaml.safe_load(pathlib.Path('{BM.as_posix()}').read_text(encoding='utf-8')); schema=json.loads(pathlib.Path('/home/oai/skills/common-develop/assets/structured-docs/business-model.schema.json').read_text(encoding='utf-8')); jsonschema.validate(data,schema)\"'''",
              "f'python3 -m jsonschema -i {R07_CHANGE.as_posix()} /home/oai/skills/common-develop/assets/structured-docs/changeset.schema.json'": "f'''python3 -c \"import json,pathlib,yaml,jsonschema; data=yaml.safe_load(pathlib.Path('{R07_CHANGE.as_posix()}').read_text(encoding='utf-8')); schema=json.loads(pathlib.Path('/home/oai/skills/common-develop/assets/structured-docs/changeset.schema.json').read_text(encoding='utf-8')); jsonschema.validate(data,schema)\"'''",
              "f'python3 -m jsonschema -i {IMPACT.as_posix()} /home/oai/skills/common-develop/assets/structured-docs/dependency-impact.schema.json'": "f'''python3 -c \"import json,pathlib,yaml,jsonschema; data=yaml.safe_load(pathlib.Path('{IMPACT.as_posix()}').read_text(encoding='utf-8')); schema=json.loads(pathlib.Path('/home/oai/skills/common-develop/assets/structured-docs/dependency-impact.schema.json').read_text(encoding='utf-8')); jsonschema.validate(data,schema)\"'''",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing validation command to patch: {old}')
              s = s.replace(old, new)

          reopen_marker = "    run(['python3', str(COMMON/'scripts/long_task.py'), 'reopen-phase'"
          reopen_pos = s.find(reopen_marker)
          if reopen_pos < 0:
              raise SystemExit('missing reopen marker for pre-reopen assertion snapshot')
          pre_reopen = '''    sys.path.insert(0, str(COMMON/'scripts'))\n    import acceptance\n    pre_reopen_assertion_doc = acceptance.load_document(TASK)\n    prior_bm_assertions = [\n        a for a in pre_reopen_assertion_doc.get('assertions', [])\n        if isinstance(a, dict)\n        and a.get('type') == 'MANUAL_REVIEW'\n        and a.get('phase') == 'business_model'\n        and a.get('revision') == BASE_REV\n    ]\n    expected_reviewers = {\n        'BusinessModelReviewAgent','RequirementReviewAgent','DesignReviewAgent',\n        'TestDesignAgent','ImpactAnalysisReviewAgent','CrossModuleIntegrationReviewAgent'\n    }\n    prior_reviewers = {str((a.get('parameters') or {}).get('reviewer_agent') or '') for a in prior_bm_assertions}\n    if len(prior_bm_assertions) != 6 or prior_reviewers != expected_reviewers:\n        raise RuntimeError(f'BM-R06 review obligation snapshot mismatch: count={len(prior_bm_assertions)} reviewers={sorted(prior_reviewers)}')\n\n'''
          s = s[:reopen_pos] + pre_reopen + s[reopen_pos:]

          needle = "    write_yaml(BM, current)\n"
          if needle not in s:
              raise SystemExit('missing BM write point for assertion clone')
          inject = '''    write_yaml(BM, current)\n\n    current_source_refs = [f'TASK-P2-BMODEL-001#expected_results/{i}' for i in range(4)]\n    for source_assertion in prior_bm_assertions:\n        old_id = str(source_assertion['assertion_id'])\n        if 'BM-R06' not in old_id:\n            raise RuntimeError(f'unexpected BM-R06 assertion id: {old_id}')\n        acceptance.add_assertion(\n            TASK,\n            assertion_id=old_id.replace('BM-R06','BM-R07'),\n            acceptance_id=str(source_assertion['acceptance_id']),\n            statement=str(source_assertion['statement']).replace('BM-R06','BM-R07'),\n            assertion_type='MANUAL_REVIEW',\n            phase='business_model',\n            revision=new_rev,\n            blocking=True,\n            parameters=dict(source_assertion.get('parameters') or {}),\n            source_refs=current_source_refs,\n        )\n'''
          s = s.replace(needle, inject, 1)
          s = s.replace("a.get('verification_mode') == 'MANUAL_REVIEW'", "a.get('type') == 'MANUAL_REVIEW'")
          s = s.replace("'finalize-phase', '-g', 'BusinessModelAgent'", "'finalize-phase', '-g', 'ProjectManagerAgent'")

          old_tail = '''    run(['git','config','user.name','Common Develop ProjectManagerAgent'])\n    run(['git','config','user.email','common-develop@local.invalid'])\n    run(['git','add','project_doc'])\n    run(['git','diff','--cached','--check'])\n    run(['git','commit','-m','docs(p2): rework business model lineage and readable view'])\n    run(['git','push','origin','HEAD:rework/p2-business-model-readability-20260808'])\n'''
          new_tail = '''    run(['git','config','user.name','Common Develop ProjectManagerAgent'])\n    run(['git','config','user.email','common-develop@local.invalid'])\n    checkpoint = run(['python3', str(COMMON/'scripts/git_checkpoint.py'), 'commit', '-g', 'ProjectManagerAgent', '--task-dir', str(TASK), '--phase', 'business_model', '--title', 'docs(p2): rework business model lineage and readable view', '--change', 'restore complete BM-R05-style human-readable business model projection', '--change', 'make DEC_COMPILER to COMPILER document lineage explicit without a second runtime', '--change', 'preserve BM-R05 stable IDs and re-run all BM-R07 independent reviews'], capture=True)\n    checkpoint_payload = json.loads(checkpoint.stdout)\n    if checkpoint_payload.get('status') not in {'COMMITTED','ALREADY_COMMITTED'}:\n        raise RuntimeError(f'unexpected git checkpoint result: {checkpoint_payload}')\n    run(['python3', str(COMMON/'scripts/git_checkpoint.py'), 'validate', '-g', 'ProjectManagerAgent', '--task-dir', str(TASK), '--json'])\n    clean = run(['git','status','--porcelain'], capture=True).stdout.strip()\n    if clean:\n        raise RuntimeError(f'working tree not clean after Git checkpoint: {clean}')\n    run(['git','push','origin','HEAD:rework/p2-business-model-readability-20260808'])\n'''
          if old_tail not in s:
              raise SystemExit('missing manual commit tail for checkpoint replacement')
          s = s.replace(old_tail, new_tail, 1)
          p.write_text(s, encoding='utf-8')
          PY
          export EXPECTED_BASE="$(git rev-parse HEAD)"
          python3 /tmp/p2_bm_rework.py
