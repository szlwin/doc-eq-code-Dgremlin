name: P2 temporary task4 authority closure validation

on:
  pull_request:
    branches:
      - agent/p2-task4-validation-base-20260818

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Reconstruct and apply exact task4 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .common-develop-validation/task4.patch.xz.b64.part.* | tr -cd 'A-Za-z0-9+/=' > /tmp/task4.patch.xz.b64
          base64 -d /tmp/task4.patch.xz.b64 > /tmp/task4.patch.xz
          test "$(sha256sum /tmp/task4.patch.xz | awk '{print $1}')" = "34048c4689273e7e381569195e068bd74c9a812c8f041dcb104bebd1b334e83c"
          xz -dc /tmp/task4.patch.xz > /tmp/task4.patch
          test "$(sha256sum /tmp/task4.patch | awk '{print $1}')" = "544155ef6a5bb0ff2de59531ca5832f26a79d03e835e20070d2d91ee09beb802"
          git checkout --detach ee4c77a5e3aeb1b5f081d79eef21627c2c092481
          git apply --check /tmp/task4.patch
          git apply /tmp/task4.patch
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u | tee /tmp/task4-changed-paths.txt
          bad="$(grep -Ev '^dec-core-(model|starter)/src/main/java/' /tmp/task4-changed-paths.txt || true)"
          if [ -n "$bad" ]; then
            echo "unexpected task4 paths:" >&2
            echo "$bad" >&2
            exit 1
          fi
          test "$(wc -l < /tmp/task4-changed-paths.txt | tr -d ' ')" -eq 10
          git diff --check
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Bootstrap repository-bundled legacy dependencies
        run: scripts/remediation/bootstrap_legacy_dependencies.sh
      - name: Exact production compile gate
        shell: bash
        run: |
          set -o pipefail
          ./mvnw -pl dec-core-context,dec-core-model,dec-core-starter -am -Dmaven.test.skip=true install 2>&1 | tee /tmp/task4-compile.log
      - name: MODEL legacy/internal regression
        shell: bash
        run: |
          set -o pipefail
          ./mvnw -pl dec-core-model -Dtest=RuntimeModelSessionEffectBehaviorTest,ProtectedWriteTransactionIntegrationTest -Dsurefire.failIfNoSpecifiedTests=true test 2>&1 | tee /tmp/task4-model-tests.log
      - name: STARTER guarded production composition regression
        shell: bash
        run: |
          set -o pipefail
          ./mvnw -pl dec-core-starter -Dtest=ProtectedAccessProductionCompositionTest,ProtectedRuntimeModelAdapterIntegrationTest,ProtectedAccessStarterApiContractTest,ProtectedWriteIntentResolutionTest -Dsurefire.failIfNoSpecifiedTests=true test 2>&1 | tee /tmp/task4-starter-tests.log
      - name: Upload task4 validation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: p2-task4-authority-closure-validation
          path: |
            /tmp/task4.patch
            /tmp/task4-changed-paths.txt
            /tmp/task4-compile.log
            /tmp/task4-model-tests.log
            /tmp/task4-starter-tests.log
            dec-core-model/target/surefire-reports/
            dec-core-starter/target/surefire-reports/
          if-no-files-found: warn
