name: P1 stage closure exact publish

on:
  push:
    branches:
      - feature/p1-t15-retire-declaration-20260806-1354
    paths:
      - .stage-closure-publish/trigger.json

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply verified stage closure payload
        shell: bash
        env:
          EXPECTED_SHA256: 42f86b37563a2261c4f2cfbd3a19ef2f51e28b280613239c75bcab9081bfe9eb
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "feature/p1-t15-retire-declaration-20260806-1354"
          cat .stage-closure-publish/chunk-* | tr -cd 'A-Za-z0-9+/=' > /tmp/stage-closure.b64
          base64 -d /tmp/stage-closure.b64 > /tmp/stage-closure.tar.xz
          test "$(sha256sum /tmp/stage-closure.tar.xz | awk '{print $1}')" = "$EXPECTED_SHA256"
          mkdir /tmp/stage-closure
          tar -xJf /tmp/stage-closure.tar.xz -C /tmp/stage-closure
          while IFS= read -r path; do
            test -n "$path" && rm -f -- "$path"
          done < /tmp/stage-closure/delete.txt
          cp -a /tmp/stage-closure/files/. .
          rm -rf .stage-closure-publish .github/workflows/stage-closure-publish.yml
          git config user.name 'OpenAI Common Develop'
          git config user.email 'common-develop@openai.invalid'
          git add -A
          git diff --cached --check
          git commit -m 'feat(starter): add production stage closure bootstrap'
          git push origin "HEAD:${GITHUB_REF_NAME}"
