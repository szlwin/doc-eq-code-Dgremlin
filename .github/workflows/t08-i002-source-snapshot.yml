name: T08 I002 Source Snapshot

on:
  push:
    branches:
      - feature/p1-t08-reference-resolution-20260803-2254
  pull_request:
    branches:
      - dev_all

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Bind SymbolTable to complete Raw snapshot
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('dec-core-compiler/src/main/java/dec/core/compiler/symbol/SymbolTableBuilder.java')
          content = path.read_text()
          before = 'new SymbolTable(state.entries)'
          after = 'new SymbolTable(state.entries, definitions)'
          if before in content:
              path.write_text(content.replace(before, after, 1))
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dec-core-compiler/src/main/java/dec/core/compiler/symbol/SymbolTableBuilder.java
          git commit -m "fix(symbol): pass complete raw snapshot to table"
          git push origin HEAD:feature/p1-t08-reference-resolution-20260803-2254

      - name: Package repository source
        run: |
          tar --exclude=.git -czf /tmp/t08-i002-source-snapshot.tar.gz .

      - name: Upload repository source
        uses: actions/upload-artifact@v6
        with:
          name: t08-i002-source-snapshot
          path: /tmp/t08-i002-source-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 1
