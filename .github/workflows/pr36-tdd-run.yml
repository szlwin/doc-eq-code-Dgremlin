name: PR36 TDD I008 run
on:
  push:
    branches: [tmp/pr36-tdd-run-20260811]
    paths: [.common-develop-tdd-run-trigger]
permissions:
  contents: write
jobs:
  tdd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute exact TDD-I008 lifecycle
        shell: bash
        run: |
          set -euo pipefail
          cp .common-develop-tdd-run.sh /tmp/common-develop-tdd-run.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/common-develop-tdd-run.sh')
          s=p.read_text()
          start=s.index("errs=[]\nphases=list(long_task.PHASE_INDEX)")
          end=s.index("long_task.transactional_text_write", start)
          s=s[:start]+s[end:]
          s=s.replace('--input-revision "$PLANREV + $TDREV"','--input-revision "$PLANREV"',1)
          p.write_text(s)
          PY
          set -a
          source /tmp/common-develop-tdd-run.sh
