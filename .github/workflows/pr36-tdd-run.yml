name: PR36 TDD I008 run
on:
  push:
    branches: [tmp/pr36-tdd-run-20260811]
    paths: [.common-develop-tdd-run-trigger]
permissions:
  contents: write
jobs:
  tdd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Execute exact TDD-I008 lifecycle
        shell: bash
        run: |
          set -euo pipefail
          cp .common-develop-tdd-run.sh /tmp/common-develop-tdd-run.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/common-develop-tdd-run.sh')
          s=p.read_text()
          start=s.index("errs=[]\nphases=list(long_task.PHASE_INDEX)")
          end=s.index("long_task.transactional_text_write", start)
          s=s[:start]+s[end:]
          s=s.replace('--input-revision "$PLANREV + $TDREV"','--input-revision "$PLANREV"',1)
          old='./mvnw -pl "$module" -am -Dmaven.test.skip=true install >"$OUT/boot-${module}.log" 2>&1'
          new='if ! ./mvnw -pl "$module" -am -Dmaven.test.skip=true install >"$OUT/boot-${module}.log" 2>&1; then echo "INVALID_RED BOOT failure for $module"; cat "$OUT/boot-${module}.log"; exit 30; fi'
          if old not in s:
              raise SystemExit('BOOT command anchor missing')
          s=s.replace(old,new,1)
          marker='for module in $(cut -f2 /tmp/tdd-registry.tsv | sort -u); do'
          if marker not in s:
              raise SystemExit('BOOT loop marker missing')
          s=s.replace(marker,'scripts/remediation/bootstrap_legacy_dependencies.sh\n'+marker,1)
          old_review="for eid in [x['test_bundle'],x['test_design'],x['plan'],x['design'],x['diff'],x['summary'],*x['validation_commands']]: args += ['--evidence-id',eid]"
          new_review="for eid in [x['test_bundle'],x['test_design'],x['plan'],x['design'],x['diff'],x['summary'],*x['red_commands'],*x['validation_commands']]: args += ['--evidence-id',eid]"
          if old_review not in s:
              raise SystemExit('TDDReview evidence anchor missing')
          s=s.replace(old_review,new_review,1)
          s=s.replace('.log','.out')
          boot_tail='  if ! ./mvnw -pl "$module" -am -Dmaven.test.skip=true install >"$OUT/boot-${module}.out" 2>&1; then echo "INVALID_RED BOOT failure for $module"; cat "$OUT/boot-${module}.out"; exit 30; fi\n done'
          boot_norm='  if ! ./mvnw -pl "$module" -am -Dmaven.test.skip=true install >"$OUT/boot-${module}.out" 2>&1; then echo "INVALID_RED BOOT failure for $module"; cat "$OUT/boot-${module}.out"; exit 30; fi\n  sed -i "s/[[:blank:]]\\+$//" "$OUT/boot-${module}.out"\n done'
          if boot_tail not in s:
              raise SystemExit('normalized BOOT insertion anchor missing')
          s=s.replace(boot_tail,boot_norm,1)
          test_anchor='  set -e\n  if grep -Eq'
          test_norm='  set -e\n  sed -i "s/[[:blank:]]\\+$//" "$log"\n  if grep -Eq'
          if test_anchor not in s:
              raise SystemExit('test output normalization anchor missing')
          s=s.replace(test_anchor,test_norm,1)
          p.write_text(s)
          PY
          set -a
          source /tmp/common-develop-tdd-run.sh
