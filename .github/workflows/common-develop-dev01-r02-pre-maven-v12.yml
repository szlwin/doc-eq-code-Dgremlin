name: common-develop DEV-01 R02 pre-Maven candidate v12

on:
  push:
    branches: [common-develop/dev01-r02-run-20260812]
    paths: [.github/workflows/common-develop-dev01-r02-pre-maven-v12.yml]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: common-develop/dev01-r02-run-20260812
          fetch-depth: 0
      - name: Prepare RC9 R02 pre-Maven candidate
        shell: bash
        env:
          POSTPATCH_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,textwrap,os
          workflow=Path('.github/workflows/common-develop-dev01-r02-run.yml').read_text()
          marker='        run: |\n'
          if marker not in workflow: raise SystemExit('source run block missing')
          block=textwrap.dedent(workflow.split(marker,1)[1])
          source_line='source /tmp/dev01-r02-run.sh'
          if source_line not in block: raise SystemExit('source runner missing')
          patch=base64.b64decode(os.environ['POSTPATCH_B64']).decode()
          inject="python3 - <<'PYPOST'\n"+patch+"\nPYPOST\n"
          block=block.replace(source_line,inject+'\n'+source_line,1)
          Path('/tmp/dev01-r02-v12.sh').write_text('#!/usr/bin/env bash\n'+block)
          PY
          chmod +x /tmp/dev01-r02-v12.sh
          /tmp/dev01-r02-v12.sh
