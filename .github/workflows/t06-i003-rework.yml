          python3 - <<'PY_SKELETON'
          from pathlib import Path
          path = Path('dec-core-compiler/src/main/java/dec/core/compiler/raw/RawDefinitionBuilder.java')
          text = path.read_text(encoding='utf-8')
          old = '''    public RawBuildResult build(List<CanonicalDocumentNode> documents) {
