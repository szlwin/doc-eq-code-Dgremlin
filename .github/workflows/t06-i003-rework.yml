name: TASK-P1-T06 I003 automated rework

on:
  push:
    branches:
      - feature/p1-t06-raw-definition-20260803-1334
    paths:
      - .github/workflows/t06-i003-rework.yml

permissions:
  contents: write

jobs:
  rework:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_PARENT: 9f7398e213031695a88b975c33c1352d8d4f5583
      TARGET_BRANCH: feature/p1-t06-raw-definition-20260803-1334
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Bootstrap repository dependencies
        run: scripts/remediation/bootstrap_legacy_dependencies.sh

      - name: Execute I003 RED, skeleton, implementation, reviews and tests
        id: rework
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          git config user.name "common-develop[bot]"
          git config user.email "common-develop[bot]@users.noreply.github.com"
          mkdir -p /tmp/t06-i003-evidence

          DESIGN_PATH="project_doc/version/V_1.0/doc/DEC_COMPILER/DEC_COMPILER_design_R25_t06_input_snapshot_rework.md"
          PLAN_PATH="project_doc/version/V_1.0/doc/DEC_COMPILER/DEC_COMPILER_implementation_plan_R21_t06_input_snapshot_rework.md"
          TASK_DIR="project_doc/version/V_1.0/task/P1-COMPILER-F01"
          REWORK_PATH="$TASK_DIR/rework/TASK-P1-T06-I003-rework.md"
          TEST_PATH="dec-core-compiler/src/test/java/dec/core/compiler/raw/RawInputSnapshotReworkTest.java"
          BUILDER_PATH="dec-core-compiler/src/main/java/dec/core/compiler/raw/RawDefinitionBuilder.java"

          cat > "$DESIGN_PATH" <<'EOF_DESIGN'
          # DESIGN-R25 — TASK-P1-T06 I003 输入批次快照返工

          - Revision：`DESIGN-R25@P1-T06-REWORK-I003`
          - Status：`PASSED`
          - Supersedes current validity：`COMPLETION-P1-T06-R02@aec3cd105b15`
          - Historical revisions：R23、R24、R19、R20、R01、R02 全部不可变保留
          - Scope：仅 `RawDefinitionBuilder.build(List)` 的输入边界、确定性 Oracle 与 T06 事实文档

          ## 问题

          public `build(List<CanonicalDocumentNode>)` 对调用方原始 List 执行两次遍历：第一遍验证，第二遍提取。自定义 List 或并发修改可让第二遍返回未验证文档，破坏 Grammar 白名单、fail-closed、确定性以及“第二阶段只消费已验证输入”的 Completion 声明。

          ## 冻结设计

          1. public 入口只读取调用方 `documents` 一次；
          2. `snapshotDocuments` 在同一次迭代中复制顺序并逐项拒绝 null；
          3. 空批次根据复制结果判断，不调用原始 List 的 `isEmpty/get`；
          4. 验证与提取仅消费同一个不可变快照；
          5. 快照返回后不再访问原始 `documents`，包括 RuntimeException 失败路径；
          6. 快照读取期间的 RuntimeException 进入 `raw.build.failed` 稳定受控失败，不暴露部分集合；
          7. 快照中的文档顺序是 `sourceOrdinal` 的唯一批次顺序；
          8. 不复制 Canonical 节点对象本身，节点已是不可变值对象；
          9. 不修改 Grammar、Raw Kind、lexical、reference、资源预算或公开 API；
          10. TypedKey、SymbolTable、引用解析、Pipeline 与 TASK-P1-T07 继续阻断。

          ## 验收

          - 第一次迭代合法、后续迭代 unsupported root 时，只发布第一次快照中的合法定义；
          - 第一次迭代合法、后续迭代含 unknown child 时，非法 body 不得进入结果；
          - 原始 List 在快照结束后变化，不影响结果；
          - 快照顺序精确决定 ordinal；
          - unsupported root 与 unknown child 位于快照中时稳定 FAILED，`rawDefinitionSet` 为空；
          - side-effecting List Oracle 不使用线程调度或时间阈值。
          EOF_DESIGN
          sed -i 's/^          //' "$DESIGN_PATH"
          git add "$DESIGN_PATH"
          git commit -m "docs(t06): freeze I003 input snapshot design"
          DESIGN_COMMIT="$(git rev-parse HEAD)"
          DESIGN_BLOB="$(git rev-parse HEAD:"$DESIGN_PATH")"

          cat > "$PLAN_PATH" <<'EOF_PLAN'
          # TP-P1-COMPILER-F01-R21 — TASK-P1-T06 I003 实施计划

          - Revision：`TP-P1-COMPILER-F01-R21@P1-T06-REWORK-I003`
          - Status：`PASSED`
          - Execution：`SEQUENTIAL / auto / architecture_review / git_checkpoint`
          - Depends on：`DESIGN-R25@P1-T06-REWORK-I003`

          ## 顺序流程

          1. 建立 6 项确定性 `RawInputSnapshotReworkTest`，验证当前 Head 形成有效 RED；
          2. 架构骨架只冻结 `snapshotDocuments`、共享快照和失败边界，具体复制算法保持显式未实现；
          3. ArchitectureReviewAgent 与 SpecComplianceReviewAgent 对同一 Skeleton revision 顺序 Review；
          4. 实现一次迭代复制、复制结果 empty/null 校验、不可变快照和异常受控边界；
          5. 执行 T06 Raw、Compiler、XML、YAML、Context、Demo、Legacy、12 模块 Reactor 与故意失败门禁；
          6. 执行 Specification、Architecture、Security、Engineering、TDD、Test Evidence 与 Completion Review；
          7. 保留 R02 Completion 历史，形成 R03 Completion；PR #21 不自动合并，T07 不启动。

          ## 允许文件

          - `dec-core-compiler/src/main/java/dec/core/compiler/raw/RawDefinitionBuilder.java`
          - `dec-core-compiler/src/test/java/dec/core/compiler/raw/RawInputSnapshotReworkTest.java`
          - `project_doc/version/V_1.0/**` 中 TASK-P1-T06 I003 的 Design、Plan、Review、Evidence、Completion 与恢复事实
          - 临时 `.github/workflows/t06-i003-rework.yml`，最终必须删除

          ## 验证命令

          ```bash
          ./mvnw -pl dec-core-compiler -am -Dtest=RawInputSnapshotReworkTest -Dsurefire.failIfNoSpecifiedTests=false test
          ./mvnw -pl dec-core-compiler -am test
          ./mvnw --batch-mode --no-transfer-progress clean verify
          scripts/remediation/prove_test_failure_gate.sh
          ```

          ## 停止条件

          任一 RED 不真实、Skeleton Review 未通过、最终测试失败、开放 P0/P1、Design/Plan 漂移、范围越界或临时 Workflow 未删除，均阻断 Completion 与合并。
          EOF_PLAN
          sed -i 's/^          //' "$PLAN_PATH"
          cat > "$REWORK_PATH" <<'EOF_REWORK_INITIAL'
          # TASK-P1-T06 / I003 — Input Snapshot Rework

          - 状态：`IN_PROGRESS`
          - PR：`#21`
          - Branch：`feature/p1-t06-raw-definition-20260803-1334`
          - Rework Base：`9f7398e213031695a88b975c33c1352d8d4f5583`
          - Dependency：`COMPLETION-P1-T05-R03@30529276cd8f`
          - Superseded Completion：`COMPLETION-P1-T06-R02@aec3cd105b15`
          - Superseding Review：`REV-000283`
          - Finding：`FND-P1-T06-I003-001`
          - Design：`DESIGN-R25@P1-T06-REWORK-I003`
          - Plan：`TP-P1-COMPILER-F01-R21@P1-T06-REWORK-I003`
          - 执行模式：`SEQUENTIAL / auto / architecture_review / git_checkpoint`

          本 iteration 只关闭 `build(List)` 未冻结输入批次导致 validate/extract 消费不同文档的 P1。R02 及更早 Revision、Review、Evidence 与 Completion 作为不可变历史保留。
          EOF_REWORK_INITIAL
          sed -i 's/^          //' "$REWORK_PATH"
          git add "$PLAN_PATH" "$REWORK_PATH"
          git commit -m "docs(t06): freeze I003 snapshot rework plan"
          PLAN_COMMIT="$(git rev-parse HEAD)"
          PLAN_BLOB="$(git rev-parse HEAD:"$PLAN_PATH")"

          cat > "$TEST_PATH" <<'EOF_TEST'
          package dec.core.compiler.raw;

          import static org.junit.jupiter.api.Assertions.assertEquals;
          import static org.junit.jupiter.api.Assertions.assertFalse;
          import static org.junit.jupiter.api.Assertions.assertTrue;

          import dec.core.compiler.canonical.CanonicalDocumentNode;
          import dec.core.compiler.canonical.DocumentFormat;
          import dec.core.context.model.SourceRef;
          import java.util.AbstractList;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.Collections;
          import java.util.Iterator;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.Optional;
          import org.junit.jupiter.api.Test;

          /**
           * I003 对 public build 输入批次快照、顺序与 fail-closed 的确定性 Oracle。
           */
          class RawInputSnapshotReworkTest {

              /**
               * 后续 iterator 返回 unsupported root 时，提取仍只能消费第一次冻结的合法批次。
               */
              @Test
              void ignoresUnsupportedRootFromSecondIterator() {
                  SwitchingList documents = new SwitchingList(
                          Collections.singletonList(dataDocument("good.xml", "good")),
                          Collections.singletonList(node(
                                  "evil.xml", "/evil-root", "evil-root", attrs())));

                  RawBuildResult result = new RawDefinitionBuilder().build(documents);

                  assertEquals(RawBuildStatus.BUILT, result.status());
                  assertEquals("good", onlyDefinition(result).name().get());
                  assertEquals(1, documents.iteratorCalls());
              }

              /**
               * 后续 iterator 返回 unknown child 时，非法节点不得进入成功 Raw body。
               */
              @Test
              void ignoresUnknownChildFromSecondIterator() {
                  CanonicalDocumentNode unknown = node(
                          "bad.xml", "/orm-data-mapping/data/mystery",
                          "mystery", attrs());
                  SwitchingList documents = new SwitchingList(
                          Collections.singletonList(dataDocument("good.xml", "good")),
                          Collections.singletonList(dataDocument(
                                  "bad.xml", "bad", unknown)));

                  RawBuildResult result = new RawDefinitionBuilder().build(documents);

                  RawDefinition definition = onlyDefinition(result);
                  assertEquals("good", definition.name().get());
                  assertTrue(definition.body().children().isEmpty());
                  assertEquals(1, documents.iteratorCalls());
              }

              /**
               * 第一次迭代结束后修改原始 backing List，不得改变已冻结结果。
               */
              @Test
              void mutationAfterSnapshotDoesNotAffectResult() {
                  SnapshotMutationList documents = new SnapshotMutationList(
                          Collections.singletonList(dataDocument("good.xml", "good")),
                          Collections.singletonList(dataDocument("changed.xml", "changed")));

                  RawBuildResult result = new RawDefinitionBuilder().build(documents);

                  assertEquals("good", onlyDefinition(result).name().get());
                  assertEquals(1, documents.iteratorCalls());
              }

              /**
               * ordinal 只能来自第一次快照中的文档顺序。
               */
              @Test
              void snapshotOrderDeterminesOrdinals() {
                  CanonicalDocumentNode first = dataDocument("b.xml", "b");
                  CanonicalDocumentNode second = dataDocument("a.xml", "a");
                  SwitchingList documents = new SwitchingList(
                          Arrays.asList(first, second),
                          Arrays.asList(second, first));

                  RawBuildResult result = new RawDefinitionBuilder().build(documents);
                  List<RawDefinition> definitions =
                          result.rawDefinitionSet().get().definitions();

                  assertEquals("b", definitions.get(0).name().get());
                  assertEquals(0L, definitions.get(0).sourceOrdinal());
                  assertEquals("a", definitions.get(1).name().get());
                  assertEquals(1L, definitions.get(1).sourceOrdinal());
                  assertEquals(1, documents.iteratorCalls());
              }

              /**
               * unsupported root 位于真实快照时必须 fail closed，不发布成功空集合。
               */
              @Test
              void unsupportedRootInSnapshotFailsWithoutSet() {
                  CanonicalDocumentNode unsupported = node(
                          "evil.xml", "/evil-root", "evil-root", attrs());
                  RawBuildResult result = new RawDefinitionBuilder().build(
                          Collections.singletonList(unsupported));

                  assertEquals(RawBuildStatus.FAILED, result.status());
                  assertFalse(result.rawDefinitionSet().isPresent());
                  assertEquals("raw.document.root.unsupported",
                          result.diagnostics().get(0).messageKey());
              }

              /**
               * unknown child 位于真实快照时必须 fail closed，不发布非法 body。
               */
              @Test
              void unknownChildInSnapshotFailsWithoutSet() {
                  CanonicalDocumentNode unknown = node(
                          "bad.xml", "/orm-data-mapping/data/mystery",
                          "mystery", attrs());
                  RawBuildResult result = new RawDefinitionBuilder().build(
                          Collections.singletonList(dataDocument(
                                  "bad.xml", "bad", unknown)));

                  assertEquals(RawBuildStatus.FAILED, result.status());
                  assertFalse(result.rawDefinitionSet().isPresent());
                  assertEquals("raw.structure.unknown",
                          result.diagnostics().get(0).messageKey());
              }

              private static RawDefinition onlyDefinition(RawBuildResult result) {
                  assertEquals(RawBuildStatus.BUILT, result.status());
                  assertTrue(result.rawDefinitionSet().isPresent());
                  assertEquals(1, result.rawDefinitionSet().get().size());
                  return result.rawDefinitionSet().get().definitions().get(0);
              }

              private static CanonicalDocumentNode dataDocument(
                      String sourceId,
                      String name,
                      CanonicalDocumentNode... dataChildren) {
                  CanonicalDocumentNode data = node(
                          sourceId,
                          "/orm-data-mapping/data",
                          "data",
                          attrs("name", name),
                          dataChildren);
                  return node(
                          sourceId,
                          "/orm-data-mapping",
                          "orm-data-mapping",
                          attrs(),
                          data);
              }

              private static CanonicalDocumentNode node(
                      String sourceId,
                      String path,
                      String name,
                      Map<String, String> attributes,
                      CanonicalDocumentNode... children) {
                  return new CanonicalDocumentNode(
                          name,
                          attributes,
                          Optional.<String>empty(),
                          Arrays.asList(children),
                          new SourceRef(sourceId, 1, 1, path),
                          DocumentFormat.XML,
                          "1.0");
              }

              private static Map<String, String> attrs(String... values) {
                  Map<String, String> result = new LinkedHashMap<String, String>();
                  for (int index = 0; index < values.length; index += 2) {
                      result.put(values[index], values[index + 1]);
                  }
                  return result;
              }

              /**
               * 第一次和后续迭代返回不同批次，且不依赖并发或线程调度。
               */
              private static final class SwitchingList
                      extends AbstractList<CanonicalDocumentNode> {
                  private final List<CanonicalDocumentNode> first;
                  private final List<CanonicalDocumentNode> subsequent;
                  private int iteratorCalls;

                  private SwitchingList(
                          List<CanonicalDocumentNode> first,
                          List<CanonicalDocumentNode> subsequent) {
                      this.first = new ArrayList<CanonicalDocumentNode>(first);
                      this.subsequent =
                              new ArrayList<CanonicalDocumentNode>(subsequent);
                  }

                  @Override
                  public CanonicalDocumentNode get(int index) {
                      return first.get(index);
                  }

                  @Override
                  public int size() {
                      return first.size();
                  }

                  @Override
                  public Iterator<CanonicalDocumentNode> iterator() {
                      iteratorCalls++;
                      return (iteratorCalls == 1 ? first : subsequent).iterator();
                  }

                  private int iteratorCalls() {
                      return iteratorCalls;
                  }
              }

              /**
               * 第一次 iterator 耗尽时确定性修改 backing List，模拟快照结束后的调用方变化。
               */
              private static final class SnapshotMutationList
                      extends AbstractList<CanonicalDocumentNode> {
                  private final List<CanonicalDocumentNode> backing;
                  private final List<CanonicalDocumentNode> replacement;
                  private int iteratorCalls;

                  private SnapshotMutationList(
                          List<CanonicalDocumentNode> initial,
                          List<CanonicalDocumentNode> replacement) {
                      this.backing = new ArrayList<CanonicalDocumentNode>(initial);
                      this.replacement =
                              new ArrayList<CanonicalDocumentNode>(replacement);
                  }

                  @Override
                  public CanonicalDocumentNode get(int index) {
                      return backing.get(index);
                  }

                  @Override
                  public int size() {
                      return backing.size();
                  }

                  @Override
                  public Iterator<CanonicalDocumentNode> iterator() {
                      iteratorCalls++;
                      if (iteratorCalls > 1) {
                          return backing.iterator();
                      }
                      final Iterator<CanonicalDocumentNode> initial =
                              new ArrayList<CanonicalDocumentNode>(backing).iterator();
                      return new Iterator<CanonicalDocumentNode>() {
                          private boolean replaced;

                          @Override
                          public boolean hasNext() {
                              boolean hasNext = initial.hasNext();
                              if (!hasNext && !replaced) {
                                  backing.clear();
                                  backing.addAll(replacement);
                                  replaced = true;
                              }
                              return hasNext;
                          }

                          @Override
                          public CanonicalDocumentNode next() {
                              return initial.next();
                          }

                          @Override
                          public void remove() {
                              throw new UnsupportedOperationException(
                                      "test iterator is read-only");
                          }
                      };
                  }

                  private int iteratorCalls() {
                      return iteratorCalls;
                  }
              }
          }
          EOF_TEST
