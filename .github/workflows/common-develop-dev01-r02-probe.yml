name: common-develop DEV-01 R02 probe
on:
  push:
    branches: [common-develop/dev01-r02-probe-20260812]
    paths: [.github/workflows/common-develop-dev01-r02-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect RC9 task-scoped recovery commands
        shell: bash
        run: |
          set -euo pipefail
          SKILLREV='7086b2d32b6beae2e6e522efc517d7823ba55376'
          git clone --depth=1 https://gitee.com/szlwin/common-develop.git /tmp/common-develop
          test "$(git -C /tmp/common-develop rev-parse HEAD)" = "$SKILLREV"
          echo '=== LONG TASK HELP ==='
          python3 /tmp/common-develop/scripts/long_task.py --help
          echo '=== PARSER COMMANDS ==='
          grep -nE "add_parser\(|set_defaults\(func=command_" /tmp/common-develop/scripts/long_task.py | tail -n 160
          echo '=== REOPEN/REWORK TASK REFERENCES ==='
          grep -RniE "reopen.*task|rework.*task|retry.*task|reset.*task|invalidate.*task|supersede.*task" /tmp/common-develop/scripts | head -n 300 || true
